prerequisites:
  - id: SEED-001
    description: A Schema must exist before any data for that schemaCode can be created; the data endpoints return 404 if the schema is absent.
    service: self
    base_url_arg: --base-url
    check:
      method: GET
      path: /schema/seed-schema
      expect_status: 200
    create:
      method: POST
      path: /schema
      body:
        schemaCode: seed-schema
        definition:
          $schema: "https://json-schema.org/draft/2020-12/schema"
          type: object
          properties:
            name:
              type: string
          required:
            - name
