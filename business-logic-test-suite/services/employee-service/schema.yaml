openapi: 3.0.3

info:
  title: Employee Service API
  version: 3.0.0
  description: |
    REST APIs for managing Employees and their Jurisdiction assignments
    within the DIGIT platform.

    The module is organized into two resource groups:

    **Employees**
    Lifecycle management of staff members — create, read, update, patch,
    deactivate, reactivate, and hard-delete. An employee record links a
    platform user (`userId`) and an individual profile (`individualId`) to a
    department, designation, and employment type within a tenant.

    **Jurisdictions**
    Geographical area assignments that scope an employee's operational authority.
    Each jurisdiction record binds one employee to one or more boundaries,
    each identified by a `code`, `boundaryType` and `hierarchyType` (e.g., ward, block,
    district). An employee may hold multiple active jurisdiction records concurrently.

    **Key structural concepts:**

    | Concept | Description |
    |---|---|
    | `code` | Human-readable employee identifier. Auto-generated if omitted. Immutable after creation. |
    | `userId` | Reference to the platform User record (authentication identity). |
    | `individualId` | Reference to the Individual profile record (demographic data). |
    | `employeeType` | Classification of the employment arrangement (e.g., PERMANENT, CONTRACT, DEPUTATION). |
    | `boundaryRelation` | Array of `{ code, boundaryType, hierarchyType }` objects defining the geographic scope of a jurisdiction. |

    The `tenantId` is always resolved from the Bearer token and must not be
    sent in request bodies.

servers:
  - url: https://api.example.com/employee/v3
    description: Production
  - url: https://staging-api.example.com/employee/v3
    description: Staging
  - url: http://localhost:8080/employee/v3
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Employee
    description: |
      Lifecycle management of staff members within a tenant.
      Covers create, read, search, update, patch, deactivate, reactivate, and hard-delete.
  - name: Jurisdiction
    description: |
      Managing employee assignments to geographical boundary areas.
      Covers create, read, search, and replace.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — COLLECTION
  # ══════════════════════════════════════════════════════════════════════════════

  /employees:

    post:
      summary: Create employees
      operationId: createEmployees
      tags: [Employee]
      description: |
        Registers one or more new employees for the calling tenant.
        If `code` is omitted it is auto-generated by the server.

        **Batch semantics:** The request accepts 1–100 employee records.
        All records are validated before any are persisted — if any employee
        fails validation the entire operation is rolled back and no records
        are created.

        **Idempotency:** Supply the same `Idempotency-Key` on retries within
        24 hours to receive the original response without duplication.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/EmployeeCreateRequest'
            examples:
              singlePermanentEmployee:
                summary: Single permanent employee with full fields
                value:
                  - code: EMP-NBO-0042
                    userId: usr-uuid-001
                    individualId: ind-uuid-001
                    employeeType: PERMANENT
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    dateOfAppointment: "2022-06-01T00:00:00.000Z"
                    isActive: true
              contractEmployeeCodeOmitted:
                summary: Contract employee — code auto-generated
                value:
                  - userId: usr-uuid-002
                    individualId: ind-uuid-002
                    employeeType: CONTRACT
                    department: PUBLIC_HEALTH
                    designation: FIELD_INSPECTOR
                    dateOfAppointment: "2024-01-15T00:00:00.000Z"
                    isActive: true
      responses:
        '201':
          description: All employees created successfully.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: |
            Validation error — one or more employee records failed field-level
            or business-rule validation. Error array contains record index and
            field-level details. No records are persisted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: An employee with the supplied `code` already exists for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Search / list employees
      operationId: searchEmployees
      tags: [Employee]
      description: |
        Returns a paginated list of employees for the calling tenant.
        Results are filtered to the `tenantId` resolved from the Bearer token.
        Results are ordered by creation time, newest first.

        Supports optional filtering by `code` and `name`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: query
          required: false
          description: Filter by employee code (exact match).
          schema:
            type: string
            maxLength: 64
        - name: name
          in: query
          required: false
          description: Filter by employee name (partial, case-insensitive match against the linked Individual profile).
          schema:
            type: string
            maxLength: 300
        - name: employeeType
          in: query
          required: false
          description: Filter by employment type.
          schema:
            type: string
            maxLength: 128
        - name: department
          in: query
          required: false
          description: Filter by department.
          schema:
            type: string
            maxLength: 128
        - name: isActive
          in: query
          required: false
          description: Filter by active status.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Page number (1-indexed).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Number of records per page. Maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Employee list returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '400':
          description: Bad request — invalid query parameter values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — SINGLE RESOURCE
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}:

    get:
      summary: Get employee by ID
      operationId: getEmployee
      tags: [Employee]
      description: |
        Returns the full employee record for the given system-generated UUID.
        The record includes any associated jurisdiction assignments.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
      responses:
        '200':
          description: Employee returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update employee
      operationId: updateEmployee
      tags: [Employee]
      description: |
        Fully replaces the mutable fields of an existing employee record.
        `id`, `code`, `tenantId`, and `auditDetail` are immutable and ignored
        if supplied in the request body.

        Supply all mutable fields — omitted optional fields are cleared to null.
        For partial updates (supply only changed fields), use `PATCH /employees/{employeeId}`.

        **Idempotency:** Same `Idempotency-Key` within 24 hours returns the
        original response without re-applying the update.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Employee updated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — immutable field change attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Partially update employee
      operationId: patchEmployee
      tags: [Employee]
      description: |
        Partially updates an employee record. Only supplied fields are changed;
        omitted fields retain their existing values.

        Useful for targeted changes such as updating contact details or
        toggling `isActive` without re-submitting the full record.

        **Idempotency:** Same `Idempotency-Key` within 24 hours returns the
        original response without re-applying the patch.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeePatchRequest'
      responses:
        '200':
          description: Employee patched.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Hard-delete employee
      operationId: hardDeleteEmployee
      tags: [Employee]
      description: |
        Permanently and irreversibly deletes the employee record and all
        associated jurisdiction assignments from the database.

        **This operation cannot be undone.** Prefer deactivation
        (`POST /employees/{employeeId}/deactivate`) for soft removal
        that preserves audit history.

        Returns `409` if the employee has active jurisdiction assignments
        that must be removed first.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
      responses:
        '200':
          description: Employee deleted.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Employee has active jurisdiction assignments — remove them first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — LIFECYCLE ACTIONS
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}/deactivate:

    post:
      summary: Deactivate employee
      operationId: deactivateEmployee
      tags: [Employee]
      description: |
        Soft-deactivates an active employee by setting `isActive = false`.
        The record and all associated jurisdiction assignments are retained
        in the database for audit purposes.

        Returns `409` if the employee is already inactive.

        The employee can be restored using `POST /employees/{employeeId}/reactivate`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
      responses:
        '200':
          description: Employee deactivated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Employee is already inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employees/{employeeId}/reactivate:

    post:
      summary: Reactivate employee
      operationId: reactivateEmployee
      tags: [Employee]
      description: |
        Restores a previously deactivated employee by setting `isActive = true`.

        Returns `409` if the employee is already active.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
      responses:
        '200':
          description: Employee reactivated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Employee is already active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # JURISDICTION — COLLECTION
  # ══════════════════════════════════════════════════════════════════════════════

  /jurisdictions:

    post:
      summary: Create jurisdiction
      operationId: createJurisdiction
      tags: [Jurisdiction]
      description: |
        Creates a new jurisdiction assignment, binding an employee to one or
        more boundary relation codes.

        An employee may hold multiple active jurisdiction records concurrently
        (e.g., assigned to both ward-level and block-level boundaries).

        **Idempotency:** Same `Idempotency-Key` within 24 hours returns the
        original record without duplication.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionCreateRequest'
            examples:
              wardAssignment:
                summary: Assign employee to two ward-level boundaries
                value:
                  employeeId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  boundaryRelation:
                    - code: WARD-NBO-001
                      boundaryType: Ward
                      hierarchyType: ADMIN
                    - code: WARD-NBO-002
                      boundaryType: Ward
                      hierarchyType: ADMIN
                  isActive: true
      responses:
        '201':
          description: Jurisdiction created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Referenced employee not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An identical active jurisdiction assignment already exists for this employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Search / list jurisdictions
      operationId: searchJurisdictions
      tags: [Jurisdiction]
      description: |
        Returns a paginated list of jurisdiction assignments for the calling tenant.
        Results are scoped to the `tenantId` resolved from the Bearer token.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: employeeId
          in: query
          required: false
          description: Filter to jurisdictions belonging to a specific employee.
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          required: false
          description: Filter by active status.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Page number (1-indexed).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Number of records per page. Maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Jurisdiction list returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionListResponse'
        '400':
          description: Bad request — invalid query parameter values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # JURISDICTION — SINGLE RESOURCE
  # ══════════════════════════════════════════════════════════════════════════════

  /jurisdictions/{jurisdictionId}:

    get:
      summary: Get jurisdiction by ID
      operationId: getJurisdiction
      tags: [Jurisdiction]
      description: Returns the jurisdiction assignment record for the given UUID.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/JurisdictionIdPath'
      responses:
        '200':
          description: Jurisdiction returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '404':
          description: Jurisdiction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Replace jurisdiction
      operationId: replaceJurisdiction
      tags: [Jurisdiction]
      description: |
        Fully replaces the boundary relation list and active status of an
        existing jurisdiction assignment.

        `id`, `employeeId`, and `tenantId` are immutable and ignored if
        supplied in the request body.

        **Idempotency:** Same `Idempotency-Key` within 24 hours returns the
        original response without re-applying the update.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JurisdictionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionUpdateRequest'
      responses:
        '200':
          description: Jurisdiction replaced.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Jurisdiction not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — immutable field change attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth'

  parameters:
    RequestIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader'
    CorrelationIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader'
    UserAgentHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader'
    TenantIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader'
    ForwardedForHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader'
    ClientId:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId'
    ClientSecret:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret'
    TimeStamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: |
        Unique key to prevent duplicate operations on retries.
        Scoped per operation — the same key on `/employees` POST and
        `/jurisdictions` POST are independent.
        Same key re-submitted within 24 hours returns the original response
        without re-executing the operation.
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      description: System-generated UUID of the employee record.
      schema:
        type: string
        format: uuid
    JurisdictionIdPath:
      name: jurisdictionId
      in: path
      required: true
      description: System-generated UUID of the jurisdiction assignment record.
      schema:
        type: string
        format: uuid

  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'

  schemas:

    # ── Common refs ──────────────────────────────────────────────────────────────

    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'

    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail'

    # ── Employee schemas ─────────────────────────────────────────────────────────

    EmployeeCreateRequest:
      type: object
      description: |
        Payload for registering a new employee within the calling tenant.

        `code` is the human-readable identifier used in downstream references.
        If omitted it is auto-generated by the server and returned in the response.

        `userId` and `individualId` are optional cross-service references — the
        employee record can exist before the linked User or Individual records are
        created, allowing staged onboarding workflows.
      required: [employeeType, department, designation]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Human-readable employee identifier. Unique within the tenant.
            If omitted, the server auto-generates a value.
            Immutable after creation — supply an explicit value only if an
            externally defined code must be preserved.
          example: EMP-NBO-0042
        userId:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Reference to the platform User record that provides the employee's
            authentication identity. Nullable — can be linked after creation.
          example: usr-uuid-001
        individualId:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Reference to the Individual profile record that holds demographic
            data (name, date of birth, contact details) for this employee.
            Nullable — can be linked after creation.
          example: ind-uuid-001
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Classification of the employment arrangement.
            Tenant-configured vocabulary. Common values include PERMANENT,
            CONTRACT, DEPUTATION, DAILY_WAGE, CONSULTANT.
          example: PERMANENT
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Department or organizational unit the employee belongs to.
            Tenant-configured vocabulary. Examples: FINANCE, PUBLIC_HEALTH,
            URBAN_PLANNING, REVENUE.
          example: FINANCE
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Job title or role within the department.
            Tenant-configured vocabulary. Examples: ACCOUNTS_OFFICER,
            FIELD_INSPECTOR, JUNIOR_ENGINEER, REVENUE_INSPECTOR.
          example: ACCOUNTS_OFFICER
        dateOfAppointment:
          type: string
          format: date-time
          description: |
            ISO-8601 date-time of the employee's formal appointment.
            Must not be a future date.
          example: "2022-06-01T00:00:00.000Z"
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Employment status label. Tenant-configured vocabulary.
            Examples: ACTIVE, ON_PROBATION, ON_LEAVE, RETIRED.
            Distinct from `isActive` — `status` is a descriptive label
            while `isActive` controls system-level access.
          example: ACTIVE
        isActive:
          type: boolean
          default: true
          description: |
            Whether the employee record is active in the system.
            Defaults to `true` on creation. Set to `false` to soft-deactivate
            (preferred over hard-delete for audit trail preservation).
      x-businessRules:
        - code is immutable after creation.
        - code must be unique within the tenant.
        - If code is omitted the server generates a unique value and returns it.
        - All employees in a batch must be valid for any to be persisted.

    EmployeeUpdateRequest:
      type: object
      description: |
        Full replacement payload for mutable employee fields.
        `id`, `code`, `tenantId`, and `auditDetail` are immutable and
        must not be supplied — they are ignored if present.

        All mutable fields should be supplied — omitted optional fields
        are cleared to null. For targeted field changes use
        `EmployeePatchRequest` instead.
      properties:
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Classification of the employment arrangement. Tenant-configured vocabulary.
          example: PERMANENT
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: Department or organizational unit.
          example: FINANCE
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: Job title or role within the department.
          example: SENIOR_ACCOUNTS_OFFICER
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Employment status label. Tenant-configured vocabulary.
          example: ACTIVE
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: |
            Contact phone number. No format enforcement at the envelope level —
            format validation is the responsibility of the consuming client.
          example: "+254712345678"
        emailId:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: |
            Contact email address. Validated as RFC 5321 format.
          example: john.kamau@example.com
        isActive:
          type: boolean
          description: |
            Active status of the employee record.
            Prefer the dedicated `/deactivate` and `/reactivate` endpoints
            for lifecycle state changes to ensure correct audit trail recording.
      x-businessRules:
        - code, id, tenantId, and auditDetail are immutable — ignored if supplied.
        - Omitted optional fields are cleared to null (full replace semantics).

    EmployeePatchRequest:
      type: object
      description: |
        Partial update payload for an employee record.
        Only supplied fields are changed; omitted fields retain their existing values.

        All fields are optional. At least one field must be present.
      properties:
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: Classification of the employment arrangement.
          example: CONTRACT
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: Department or organizational unit.
          example: PUBLIC_HEALTH
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: Job title or role within the department.
          example: FIELD_INSPECTOR
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: Employment status label. Tenant-configured vocabulary.
          example: ON_LEAVE
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Contact phone number.
          example: "+254712345678"
        emailId:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Contact email address. Validated as RFC 5321 format.
          example: john.kamau@example.com
        isActive:
          type: boolean
          description: |
            Active status of the employee record.
            Prefer the dedicated `/deactivate` and `/reactivate` endpoints
            for lifecycle state changes to ensure correct audit trail recording.
      x-businessRules:
        - At least one field must be present.
        - code, id, tenantId, and auditDetail are immutable — ignored if supplied.
        - Omitted fields retain existing values (partial update semantics).

    EmployeeResponse:
      type: object
      description: |
        Full employee record as returned by the service.
        Includes server-managed fields (`id`, `tenantId`, `auditDetail`)
        and the associated jurisdiction assignments.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier for the employee record.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        code:
          type: string
          readOnly: true
          description: |
            Human-readable employee identifier. Auto-generated by the server
            if not supplied at creation. Immutable after creation.
          example: EMP-NBO-0042
        userId:
          type: string
          description: Reference to the platform User record. Null if not yet linked.
          example: usr-uuid-001
        individualId:
          type: string
          description: Reference to the Individual profile record. Null if not yet linked.
          example: ind-uuid-001
        employeeType:
          type: string
          description: Classification of the employment arrangement.
          example: PERMANENT
        department:
          type: string
          description: Department or organizational unit.
          example: FINANCE
        designation:
          type: string
          description: Job title or role within the department.
          example: ACCOUNTS_OFFICER
        dateOfAppointment:
          type: string
          format: date-time
          description: ISO-8601 date-time of the employee's formal appointment.
          example: "2022-06-01T00:00:00.000Z"
        status:
          type: string
          description: Employment status label. Tenant-configured vocabulary.
          example: ACTIVE
        phone:
          type: string
          description: Contact phone number.
          example: "+254712345678"
        emailId:
          type: string
          format: email
          description: Contact email address.
          example: john.kamau@example.com
        isActive:
          type: boolean
          description: Whether the employee record is active in the system.
          example: true
        tenantId:
          type: string
          readOnly: true
          description: |
            Tenant the employee belongs to. Resolved from the Bearer token.
            Never supplied by the client.
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
          description: |
            All jurisdiction assignments associated with this employee.
            Included inline for convenience — use `/jurisdictions?employeeId=`
            for paginated access when large numbers of assignments are expected.
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. Incremented on every mutation.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    EmployeeListResponse:
      type: object
      description: Paginated list of employee records.
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Total number of employees matching the applied filters.
          example: 47
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed).
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of records per page as requested.
          example: 20
        hasMore:
          type: boolean
          description: |
            Whether additional pages of results exist beyond the current page.
            Clients should use this flag rather than computing `totalCount / size`
            to drive pagination.
          example: true
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'

    Boundary:
      type: object
      description: |
        A single boundary assignment within a jurisdiction, identifying
        a specific geographical area by its `code` together with the
        `boundaryType` it represents and the `hierarchyType` it belongs to.

        The boundary service validates this triple — the code must exist as
        the named `boundaryType` inside the given `hierarchyType`, otherwise
        the jurisdiction is rejected with 400 `VALIDATION_ERROR`.
      required: [code, boundaryType, hierarchyType]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Tenant-defined boundary identifier from the boundary service.
            Examples: `WARD-NBO-001`, `BLOCK-KSM-005`, `DISTRICT-MSA-003`.
          example: WARD-NBO-001
        boundaryType:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The boundary-type label this code resolves to within the
            chosen `hierarchyType`. Tenant-configured vocabulary — common
            values: Ward, Block, District, City, State.
          example: Ward
        hierarchyType:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The administrative boundary hierarchy this code belongs to.
            Tenant-configured vocabulary — e.g. `ADMIN`, `REVENUE`.
          example: ADMIN

    # ── Jurisdiction schemas ─────────────────────────────────────────────────────

    JurisdictionCreateRequest:
      type: object
      description: |
        Payload for creating a new jurisdiction assignment that binds an employee
        to one or more geographical boundaries.

        Each entry in `boundaryRelation` carries a `code` (the tenant-defined
        identifier from the boundary service), a `boundaryType` (the label
        the code resolves to inside the chosen hierarchy), and a
        `hierarchyType` (the hierarchy the code belongs to). At least one
        boundary is required.

        An employee may hold multiple active jurisdiction records concurrently.
      required: [employeeId, boundaryRelation]
      properties:
        employeeId:
          type: string
          format: uuid
          description: |
            UUID of the employee this jurisdiction is assigned to.
            Must reference an existing, active employee record within the tenant.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        boundaryRelation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Array of boundary assignments defining the geographical scope of
            this jurisdiction. Each entry carries `code`, `boundaryType`, and
            `hierarchyType`.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-002
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          default: true
          description: Whether this jurisdiction assignment is active.
      x-businessRules:
        - employeeId must reference an existing employee within the same tenant.
        - boundaryRelation must contain at least one entry.
        - An employee may hold multiple active jurisdiction records concurrently.

    JurisdictionUpdateRequest:
      type: object
      description: |
        Full replacement payload for an existing jurisdiction assignment.
        `id`, `employeeId`, and `tenantId` are immutable and ignored if supplied.

        Supply all mutable fields — `boundaryRelation` is fully replaced
        (not merged) with the submitted array.
      properties:
        boundaryRelation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Replacement array of boundary assignments. Fully replaces the
            existing `boundaryRelation` — supply all entries that should remain.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-003
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          description: Active status of the jurisdiction assignment.
      x-businessRules:
        - id, employeeId, and tenantId are immutable — ignored if supplied.
        - boundaryRelation replaces the existing array entirely (full replace semantics).
        - boundaryRelation must contain at least one entry if supplied.

    JurisdictionResponse:
      type: object
      description: |
        A jurisdiction assignment record as returned by the service,
        representing an employee's authorization to operate within
        a defined set of geographical boundaries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier for this jurisdiction record.
          example: f1e2d3c4-b5a6-7890-fedc-ba0987654321
        employeeId:
          type: string
          format: uuid
          description: UUID of the employee this jurisdiction is assigned to.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        boundaryRelation:
          type: array
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Array of boundary assignments defining the geographical scope
            of this jurisdiction.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-002
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          description: Whether this jurisdiction assignment is currently active.
          example: true
        tenantId:
          type: string
          readOnly: true
          description: |
            Tenant the jurisdiction belongs to. Resolved from the Bearer token.
            Never supplied by the client.
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. Incremented on every mutation.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    JurisdictionListResponse:
      type: object
      description: Paginated list of jurisdiction assignment records.
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Total number of jurisdiction records matching the applied filters.
          example: 12
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed).
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of records per page as requested.
          example: 20
        hasMore:
          type: boolean
          description: |
            Whether additional pages of results exist beyond the current page.
          example: false
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
