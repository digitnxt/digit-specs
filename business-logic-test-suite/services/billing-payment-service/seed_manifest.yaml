prerequisites:
  - id: SEED-001
    description: An active BusinessService must exist before TaxHead, Demand, Bill, or Payment can be created; all downstream entities hard-fail if the service is absent or inactive.
    service: self
    base_url_arg: --base-url
    check:
      method: GET
      path: /business-services/TESTBS
      expect_status: 200
    create:
      method: POST
      path: /business-services
      body:
        - code: TESTBS
          name: Test Business Service
          allowedPaymentModes:
            - CASH
          billExpiryDays: 30
          partialPaymentAllowed: false
          currency: INR
          isActive: true
          effectiveFrom: 0

  - id: SEED-002
    description: An active TaxHead belonging to TESTBS must exist before a Demand can be created; demand creation rejects unknown or cross-service tax heads.
    service: self
    base_url_arg: --base-url
    check:
      method: GET
      path: /tax-heads/TESTTAX
      expect_status: 200
    create:
      method: POST
      path: /tax-heads
      body:
        - code: TESTTAX
          name: Test Tax Head
          businessServiceCode: TESTBS
          order: 1
          effectiveFrom: 0
          isActive: true

  - id: SEED-003
    description: The IDGen bill-number template must exist in the IDGen service before any bill can be generated; bill generation rolls back if IDGen returns 404.
    service: idgen
    base_url_arg: --idgen-url
    check:
      method: GET
      path: /template
      params:
        templateCode: "${IDGEN_BILL_NUMBER_TEMPLATE_CODE}"
      expect_status: 201
    create:
      method: POST
      path: /template
      body:
        templateCode: "${IDGEN_BILL_NUMBER_TEMPLATE_CODE}"
        config:
          template: "BILL-{DATE:yyyymmdd}-{SEQ}"
          sequence:
            scope: DAILY
            start: 1
            padding:
              length: 5
              char: "0"

  - id: SEED-004
    description: The IDGen receipt-number template must exist in the IDGen service before any payment can be created; payment creation rolls back if IDGen returns 404.
    service: idgen
    base_url_arg: --idgen-url
    check:
      method: GET
      path: /template
      params:
        templateCode: "${IDGEN_RECEIPT_NUMBER_TEMPLATE_CODE}"
      expect_status: 201
    create:
      method: POST
      path: /template
      body:
        templateCode: "${IDGEN_RECEIPT_NUMBER_TEMPLATE_CODE}"
        config:
          template: "RCPT-{DATE:yyyymmdd}-{SEQ}"
          sequence:
            scope: DAILY
            start: 1
            padding:
              length: 5
              char: "0"

  - id: SEED-005
    description: The IDGen transaction-number template must exist in the IDGen service before any CASH payment can be created without a caller-supplied transactionNumber; payment creation rolls back if IDGen returns 404.
    service: idgen
    base_url_arg: --idgen-url
    check:
      method: GET
      path: /template
      params:
        templateCode: "${IDGEN_TRANSACTION_NUMBER_TEMPLATE_CODE}"
      expect_status: 201
    create:
      method: POST
      path: /template
      body:
        templateCode: "${IDGEN_TRANSACTION_NUMBER_TEMPLATE_CODE}"
        config:
          template: "TXN-{DATE:yyyymmdd}-{SEQ}"
          sequence:
            scope: DAILY
            start: 1
            padding:
              length: 5
              char: "0"
