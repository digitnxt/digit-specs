prerequisites:
  - id: SEED-001
    description: An EMAIL NotificationTemplate must exist for the tenant before POST /v3/email/send can succeed; the send endpoint returns 404 if no template is found (BR-CS-003).
    service: self
    base_url_arg: --base-url
    # GET /template always returns 200 (empty array when absent, populated array when present).
    # expect_status: 201 is intentionally impossible for a GET — the check never matches,
    # so the create always runs. seed.py treats 201 (first run) and 409 (already exists)
    # as success, making this idempotent.
    check:
      method: GET
      path: /template
      params:
        templateId: seed-email-welcome
        type: EMAIL
      expect_status: 201
    create:
      method: POST
      path: /template
      body:
        templateId: seed-email-welcome
        type: EMAIL
        subject: "Hello {{.Name}}"
        content: "<p>Hello {{.Name}}, welcome to the platform.</p>"
        isHTML: true

  - id: SEED-002
    description: An SMS NotificationTemplate must exist for the tenant before POST /v3/sms/send can succeed; the send endpoint returns 404 if no template is found (BR-CS-003).
    service: self
    base_url_arg: --base-url
    check:
      method: GET
      path: /template
      params:
        templateId: seed-sms-otp
        type: SMS
      expect_status: 201
    create:
      method: POST
      path: /template
      body:
        templateId: seed-sms-otp
        type: SMS
        content: "Your OTP is {{.OTP}}. Valid for 10 minutes."
        isHTML: false
