    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    File:
      type: object
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the uploaded file
          minLength: 2
          maxLength: 128
        tenantId:
          type: string
          description: Tenant identifier
          minLength: 2
          maxLength: 64
          readOnly: true
    StorageResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    UploadRequest:
      type: object
      required:
      - fileName
      - contentType
      - module
      - tag
      properties:
        fileName:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME type of the file
          minLength: 3
          maxLength: 100
        module:
          type: string
          description: Module name for document category validation
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag to associate with the file
          minLength: 1
          maxLength: 128
    UploadResponse:
      type: object
      required:
      - preSignedUrl
      - fileStoreId
      properties:
        preSignedUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the file
        fileStoreId:
          type: string
          description: Unique identifier for the file
          minLength: 2
          maxLength: 128
    ConfirmUploadRequest:
      type: object
      required:
      - fileStoreId
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the uploaded file
          minLength: 2
          maxLength: 128
    ConfirmUploadResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - VALID
          - INVALID
          description: Upload validation status
          example: VALID
    DownloadUrlsResponse:
      type: object
      properties:
        fileStoreIds:
          type: array
          items:
            $ref: '#/components/schemas/FileStoreResponse'
      additionalProperties:
        type: string
        description: Map of fileStoreId to download URL
    FileStoreResponse:
      type: object
      properties:
        id:
          type: string
          description: File store identifier
          minLength: 2
          maxLength: 128
        url:
          type: string
          format: uri
          description: Signed download URL
    FileMetadata:
      type: object
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the file
          minLength: 2
          maxLength: 128
        fileName:
          type: string
          description: Name of the file
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME type of the file
          minLength: 3
          maxLength: 100
        fileSize:
          type: integer
          format: int64
          description: Size of the file in bytes
          minimum: 0
        module:
          type: string
          description: Module associated with the file
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag associated with the file
          minLength: 1
          maxLength: 128
        tenantId:
          type: string
          description: Tenant identifier
          minLength: 2
          maxLength: 64
          readOnly: true
    FilesByTagResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
    FileInfo:
      type: object
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the file
          minLength: 2
          maxLength: 128
        fileName:
          type: string
          description: Name of the file
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME type of the file
          minLength: 3
          maxLength: 100
        url:
          type: string
          format: uri
          description: Download URL for the file
        tag:
          type: string
          description: Tag associated with the file
          minLength: 1
          maxLength: 128
    DocumentCategory:
      type: object
      required:
      - type
      - code
      - allowedFormats
      - maxSize
      - isSensitive
      properties:
        id:
          type: string
          format: uuid
          description: System generated unique identifier of the category for internal
            referance
          readOnly: true
        type:
          type: string
          description: High-level category like "identity", "addressProof", etc.
          minLength: 2
          maxLength: 64
        code:
          type: string
          description: Unique code for document like "AADHAR", "DrivingLicense"
          minLength: 2
          maxLength: 64
        allowedFormats:
          type: array
          items:
            type: string
          description: Allowed file extensions like ["pdf", "jpg", "png"]
        minSize:
          type: string
          description: Minimum allowed size (e.g., "1MB")
          pattern: ^\d+(\.\d+)?(KB|MB|GB)$
          example: 1MB
        maxSize:
          type: string
          description: Maximum allowed size (e.g., "5MB")
          pattern: ^\d+(\.\d+)?(KB|MB|GB)$
          example: 5MB
        isSensitive:
          type: boolean
          description: Marks if document contains PII or sensitive info
        description:
          type: string
          description: Optional description
          minLength: 0
          maxLength: 500
        isActive:
          type: boolean
          default: true
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
