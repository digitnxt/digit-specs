      required: true
      schema:
        type: string
        format: uuid
components:
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    UserIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
  schemas:
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    File:
      type: object
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the uploaded file
          minLength: 2
          maxLength: 128
        tenantId:
          type: string
          description: Tenant identifier
          minLength: 2
          maxLength: 64
          readOnly: true
        ownerIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users who own this file
    StorageResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    UploadFormRequest:
      type: object
      required:
      - file
      - module
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
          description: One or more files to upload
        module:
          type: string
          description: Module name for document category validation
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag to associate with uploaded files
          minLength: 1
          maxLength: 128
        ownerIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users who own this file
        auditDetail:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuditDetail'
    UploadNewFormRequest:
      type: object
      required:
      - file
      - documentType
      - documentCode
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
          description: One or more files to upload
        documentType:
          type: string
          description: Document category type; with documentCode selects the category the files are validated against
          minLength: 2
          maxLength: 64
        documentCode:
          type: string
          description: Document category code; with documentType selects the category the files are validated against
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag to associate with uploaded files
          minLength: 1
          maxLength: 128
        ownerIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users who own this file
        auditDetail:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuditDetail'
    UploadRequest:
      type: object
      required:
      - fileName
      - contentType
      - module
      - tag
      properties:
        fileName:
          type: string
          description: Name of the file to upload
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME type of the file
          minLength: 3
          maxLength: 100
        module:
          type: string
          description: Module name for document category validation
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag to associate with the file
          minLength: 1
          maxLength: 128
        ownerIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users who own this file
        auditDetail:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/AuditDetail'
    UploadResponse:
      type: object
      required:
      - preSignedUrl
      - fileStoreId
      properties:
        preSignedUrl:
          type: string
          format: uri
          description: Presigned URL for uploading the file
        fileStoreId:
          type: string
          description: Unique identifier for the file
          minLength: 2
          maxLength: 128
    ConfirmUploadRequest:
      type: object
      required:
      - fileStoreId
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the uploaded file
          minLength: 2
          maxLength: 128
    ConfirmUploadResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - VALID
          - INVALID
          description: Upload validation status
          example: VALID
    DownloadUrlsResponse:
      type: object
      properties:
        fileStoreIds:
          type: array
          items:
            $ref: '#/components/schemas/FileStoreResponse'
      additionalProperties:
        type: string
        description: Map of fileStoreId to download URL
    FileStoreResponse:
      type: object
      properties:
        id:
          type: string
          description: File store identifier
          minLength: 2
          maxLength: 128
        url:
          type: string
          format: uri
          description: Signed download URL
    FileSearchResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
    FileInfo:
      type: object
      properties:
        fileStoreId:
          type: string
          description: Unique identifier of the file
          minLength: 2
          maxLength: 128
        fileName:
          type: string
          description: Name of the file
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME type of the file
          maxLength: 100
        url:
          type: string
          format: uri-reference
          description: Download URL for the file
        documentCode:
          type: string
          description: Document category code the file was validated against (set by /files/upload/v1; absent for legacy uploads)
          minLength: 2
          maxLength: 64
        tag:
          type: string
          description: Tag associated with the file
          minLength: 1
          maxLength: 128
        ownerIds:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users who own this file
    DocumentCategory:
      type: object
      required:
      - type
      - code
      - allowedFormats
      - isSensitive
      properties:
        ID:
          type: integer
          format: int64
          description: System generated numeric identifier of the category for internal
            reference (note the upper-case property name)
          readOnly: true
        TenantId:
          type: string
          description: Tenant the category belongs to; taken from X-Tenant-ID, any
            value sent in the body is ignored (note the capitalised property name)
          readOnly: true
        version:
          type: integer
          format: int64
          description: Optimistic-lock version, incremented on every update
          readOnly: true
        type:
          type: string
          description: High-level category like "identity", "addressProof", etc.
          minLength: 2
          maxLength: 64
        code:
          type: string
          description: Unique code for document like "AADHAR", "DrivingLicense"
          minLength: 2
          maxLength: 64
        allowedFormats:
          type: array
          items:
            type: string
          description: Allowed file extensions like ["pdf", "jpg", "png"]
        minSize:
          type: string
          description: Minimum allowed size (e.g., "1MB"). Returned as an empty string when not set.
          pattern: ^([0-9]+(\.[0-9]+)?(KB|MB|GB))?$
          example: 1MB
        maxSize:
          type: string
          description: Maximum allowed size (e.g., "5MB"). Returned as an empty string when not set.
          pattern: ^([0-9]+(\.[0-9]+)?(KB|MB|GB))?$
          example: 5MB
        isSensitive:
          type: boolean
          description: Marks if document contains PII or sensitive info
        description:
          type: string
          description: Optional description. Returned as an empty string when not set.
          minLength: 0
          maxLength: 256
        isActive:
          type: boolean
          default: false
