    parameters: []
  /{fileStoreId}:
    get:
      summary: Download file by fileStoreId (for direct download only)
      operationId: downloadFile
      tags:
      - FileStore
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: fileStoreId
        in: path
        required: true
        description: Unique identifier of the file to download
        schema:
          type: string
      - name: tenantId
        in: query
        required: false
        description: Tenant identifier
        schema:
          type: string
      responses:
        '200':
          description: File download stream
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment header with filename
            Content-Type:
              schema:
                type: string
              description: MIME type of the file
            Content-Transfer-Encoding:
              schema:
                type: string
              description: Transfer encoding (binary)
            Accept-Ranges:
              schema:
                type: string
              description: Indicates server supports range requests
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Performs GET on /{fileStoreId}.
    parameters:
    - name: fileStoreId
      in: path
      required: true
      schema:
        type: string
