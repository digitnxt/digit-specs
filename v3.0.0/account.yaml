openapi: 3.0.3
info:
  title: Account Service API
  version: 3.0.0
  description: "Standardized REST APIs for managing Accounts and Account Configurations\
    \ within the DIGIT platform.\nThis specification aligns with DIGIT 3.0 common\
    \ standards and includes full compliance with \nplatform header and error standards.\n"
servers:
- url: https://api.example.com/account/v3
  description: Production
- url: https://staging-api.example.com/account/v3
  description: Staging
- url: http://localhost:8080/account/v3
  description: Local Development
security:
- BearerAuth: []
tags:
- name: Account
  description: Tenant account lifecycle management
- name: AccountConfig
  description: Account configuration management
paths:
  /accounts:
    post:
      tags:
      - Account
      summary: Create tenant account
      operationId: createTenant
      description: 'Creates a new tenant account directly without OTP verification.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Request body must contain valid tenant data


        **Business Rules:**

        - Tenant ID is auto-generated as UUID

        - Email must be unique across the platform

        - Account is created in active state


        **Post-conditions:**

        - Tenant account is persisted to database

        - Keycloak realm is created for the tenant

        - Response includes created tenant with generated ID

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant account created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Account
      summary: Search tenant accounts
      operationId: listTenants
      description: 'Retrieves a paginated list of tenant accounts with optional filtering.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid


        **Business Rules:**

        - Results are filtered by tenant ID from header

        - Results are sorted by creation time (descending)

        - Pagination defaults to page 1, size 20 if not specified

        - Maximum page size is 100


        **Post-conditions:**

        - Response includes total count of tenants matching filter

        - Response includes current page number and size

        - Response includes hasMore flag for client pagination

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: page
        in: query
        required: false
        description: Page number (1-indexed)
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        description: Number of tenants per page (max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: name
        in: query
        required: false
        description: Filter by tenant name
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: Filter by tenant email
        schema:
          type: string
      responses:
        '200':
          description: Tenant accounts retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Account
      summary: Delete account
      operationId: deleteAccount
      description: 'Deletes a tenant account and all associated data.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid


        **Business Rules:**

        - Deletes tenant realm from Keycloak

        - Deletes all tenant configurations

        - Deletes all tenant data from database

        - Operation is irreversible


        **Post-conditions:**

        - Tenant account is permanently deleted

        - All associated data is removed

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Account deleted successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}:
    put:
      tags:
      - Account
      summary: Update tenant account
      operationId: updateTenant
      description: Updates an existing tenant account
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: id
        in: path
        required: true
        description: Tenant ID (UUID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Tenant account updated successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /signup:
    post:
      tags:
      - Account
      summary: Initiate tenant account signup with OTP verification
      operationId: createSignup
      description: 'Initiates tenant account creation with OTP-based email verification.

        Calls the OTP service to generate and send an OTP to the provided email.


        **Pre-conditions:**

        - Request body must contain valid tenant data

        - Email must be unique across the platform

        - OTP service must be configured for ''signup'' purpose


        **Business Rules:**

        - OTP is generated via OTP service and sent to provided email

        - Account is not created until OTP is verified via /v3/signup/verify

        - OTP expires after configured duration (typically 10 minutes)

        - Multiple signup requests are allowed (previous OTP is invalidated)

        - referenceId is a signed JWT that encodes email, purpose, and expiry


        **Post-conditions:**

        - OTP is sent to email via Notification service

        - Response includes referenceId (JWT) for verification

        - Signup state is stored temporarily in cache

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Tenant name (required)
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 256
                  description: Tenant email address (required)
                phone:
                  type: string
                  minLength: 10
                  maxLength: 20
                  description: Tenant phone number
                address:
                  type: string
                  minLength: 5
                  maxLength: 512
                  description: Tenant address
                city:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: City
                state:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: State
                pincode:
                  type: string
                  minLength: 5
                  maxLength: 10
                  description: Postal code
      responses:
        '200':
          description: Signup initiated successfully, OTP sent to email
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupInitiateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters: []
  /signup/verify:
    post:
      tags:
      - Account
      summary: Verify signup OTP and create account
      operationId: verifySignup
      description: 'Verifies the OTP via OTP service and creates the tenant account.


        **Pre-conditions:**

        - OTP must have been generated via /v3/signup endpoint

        - OTP must not have expired

        - referenceId must be valid and not tampered with

        - Email must match the signup request


        **Business Rules:**

        - OTP is verified against OTP service

        - Account is created only after successful OTP verification

        - Keycloak realm is created for the tenant

        - OTP is invalidated after successful verification (single-use)

        - referenceId JWT is decoded to extract email and purpose


        **Post-conditions:**

        - Tenant account is created and active

        - Keycloak realm is provisioned

        - Response includes created tenant details

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
      responses:
        '201':
          description: Signup verified and account created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or tampered referenceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: OTP expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid OTP or OTP verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Locked - too many failed OTP attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters: []
  /signup/resend:
    post:
      tags:
      - Account
      summary: Resend signup OTP
      operationId: resendSignupOTP
      description: 'Resends OTP to the email address via OTP service for signup verification.

        Invalidates the previous OTP and generates a fresh one.


        **Pre-conditions:**

        - Email must have an active signup request

        - Previous OTP must not have been verified

        - referenceId must be valid and not tampered with

        - Cooldown period must have elapsed since last generate/resend


        **Business Rules:**

        - New OTP is generated via OTP service and sent to email

        - Previous OTP is invalidated

        - Rate limiting applies to prevent abuse (maxResendsPerHour)

        - Cooldown window must elapse before resend is allowed

        - New referenceId JWT is returned (old one is invalidated)


        **Post-conditions:**

        - New OTP is sent to email

        - Previous OTP is no longer valid

        - New referenceId must be used for verification

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
      responses:
        '200':
          description: OTP resent successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResendResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or tampered referenceId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Signup request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: OTP expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Locked - identifier in lockout period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests or cooldown not elapsed
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters: []
  /config:
    post:
      tags:
      - AccountConfig
      summary: Create account configuration
      operationId: createTenantConfig
      description: Creates a new configuration for a tenant account
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigCreateRequest'
      responses:
        '201':
          description: Configuration created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - AccountConfig
      summary: Search account configurations
      operationId: listTenantConfigs
      description: Retrieves a paginated list of configurations for a tenant
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: page
        in: query
        required: false
        description: Page number (1-indexed)
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        description: Number of configurations per page (max 100)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: configKey
        in: query
        required: false
        description: Filter by configuration key
        schema:
          type: string
      responses:
        '200':
          description: Configurations retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters: []
  /config/{id}:
    put:
      tags:
      - AccountConfig
      summary: Update account configuration
      operationId: updateTenantConfig
      description: Updates an existing account configuration
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: id
        in: path
        required: true
        description: Configuration ID (UUID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigUpdateRequest'
      responses:
        '200':
          description: Configuration updated successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
components:
  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth'
  parameters:
    RequestIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader'
    CorrelationIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader'
    UserAgentHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader'
    TenantIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader'
    ForwardedForHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader'
    ClientId:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId'
    ClientSecret:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret'
    TimeStamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp'
  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'
  schemas:
    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'
    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail'
    TenantCreateRequest:
      type: object
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Tenant name (required)
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Tenant email address (required)
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Tenant phone number
        address:
          type: string
          minLength: 5
          maxLength: 512
          description: Tenant address
        city:
          type: string
          minLength: 1
          maxLength: 128
          description: City
        state:
          type: string
          minLength: 1
          maxLength: 128
          description: State
        pincode:
          type: string
          minLength: 5
          maxLength: 10
          description: Postal code
    SignupVerifyRequest:
      type: object
      required:
      - referenceId
      - otp
      - purpose
      properties:
        referenceId:
          type: string
          minLength: 10
          maxLength: 2048
          description: 'The signed JWT returned by /v3/signup endpoint.

            Encodes email, purpose, and expiry. Do not parse or modify.

            '
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        otp:
          type: string
          minLength: 4
          maxLength: 8
          pattern: ^[0-9]{4,8}$
          description: The numeric OTP received via email (typically 6 digits)
          example: '482910'
        purpose:
          type: string
          enum:
          - signup
          description: The purpose for which OTP was generated (must be 'signup')
          example: signup
    ResendOTPRequest:
      type: object
      required:
      - referenceId
      properties:
        referenceId:
          type: string
          minLength: 10
          maxLength: 2048
          description: 'The signed JWT returned by previous /v3/signup or /v3/signup/resend
            call.

            Used to decode email and purpose for resend.

            '
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Tenant name
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Tenant email address
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Tenant phone number
        address:
          type: string
          minLength: 5
          maxLength: 512
          description: Tenant address
        city:
          type: string
          minLength: 1
          maxLength: 128
          description: City
        state:
          type: string
          minLength: 1
          maxLength: 128
          description: State
        pincode:
          type: string
          minLength: 5
          maxLength: 10
          description: Postal code
    TenantResponse:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        name:
          type: string
          description: Tenant name
        email:
          type: string
          format: email
          description: Tenant email address
        phone:
          type: string
          description: Tenant phone number
        address:
          type: string
          description: Tenant address
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        pincode:
          type: string
          description: Postal code
        isActive:
          type: boolean
          description: Active status
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    TenantListResponse:
      type: object
      required:
      - tenants
      - totalCount
      - page
      - size
      - hasMore
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
    SignupInitiateResponse:
      type: object
      required:
      - referenceId
      - expiresIn
      properties:
        referenceId:
          type: string
          description: 'Signed JWT encoding email, purpose, and expiry.

            Submit this on /v3/signup/verify and /v3/signup/resend.

            Do not parse or modify it.

            '
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresIn:
          type: integer
          description: Seconds until this OTP expires
          example: 600
        cooldownSeconds:
          type: integer
          description: Minimum seconds to wait before calling /v3/signup/resend
          example: 60
    SignupResendResponse:
      type: object
      required:
      - referenceId
      - expiresIn
      properties:
        referenceId:
          type: string
          description: "New signed JWT for the freshly issued OTP.\nReplaces the previous\
            \ referenceId \u2014 the old one is now invalid.\nSubmit this new token\
            \ on /v3/signup/verify or /v3/signup/resend.\n"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...(new)
        expiresIn:
          type: integer
          description: Seconds until the new OTP expires
          example: 600
        cooldownSeconds:
          type: integer
          description: Minimum seconds to wait before calling /v3/signup/resend again
          example: 60
    TenantConfigCreateRequest:
      type: object
      required:
      - tenantId
      - configKey
      - configValue
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant ID (required)
        configKey:
          type: string
          minLength: 1
          maxLength: 256
          description: Configuration key (required)
        configValue:
          type: string
          minLength: 1
          maxLength: 2048
          description: Configuration value (required)
        description:
          type: string
          minLength: 1
          maxLength: 512
          description: Configuration description
    TenantConfigUpdateRequest:
      type: object
      properties:
        configKey:
          type: string
          minLength: 1
          maxLength: 256
          description: Configuration key
        configValue:
          type: string
          minLength: 1
          maxLength: 2048
          description: Configuration value
        description:
          type: string
          minLength: 1
          maxLength: 512
          description: Configuration description
    TenantConfigResponse:
      type: object
      required:
      - id
      - tenantId
      - configKey
      - configValue
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        tenantId:
          type: string
          format: uuid
          description: Tenant ID
        configKey:
          type: string
          description: Configuration key
        configValue:
          type: string
          description: Configuration value
        description:
          type: string
          description: Configuration description
        isActive:
          type: boolean
          description: Active status
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    TenantConfigListResponse:
      type: object
      required:
      - configs
      - totalCount
      - page
      - size
      - hasMore
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/TenantConfigResponse'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
