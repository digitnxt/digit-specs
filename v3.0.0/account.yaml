openapi: 3.0.3

info:
  title: Account Service API
  version: 3.0.0
  description: |
    Tenant accounts and per-tenant key/value configuration.

    **Auth.** Tenant create, update and delete are gated by `PLATFORM_AUTH_ENABLED`
    (default `false`), which requires a `master`-realm bearer token carrying the
    `SUPERADMIN` realm role; `false` leaves them open. `SIGNUP_ENABLED=false` turns
    `/tenants/registrations*` off with `403`. Per-endpoint effects are on each
    operation.

    **Envelope dialect:** every path is also served under `/v3/canonical`
    (`CANONICAL_API_PREFIX`) with identical validation, status codes and errors.
    Request context moves into the body — `RequestMetadata.tenantId` → `X-Tenant-Id`,
    `RequestMetadata.userInfo.uuid` → `X-Client-Id`, `RequestMetadata.requestId` →
    `X-Request-Id`, payload under `data` — and responses become
    `{"ResponseMetadata": {…}, "data": <body>}`. Auth rules are matched with the
    prefix stripped, so the envelope is not a bypass.

servers:
  - url: https://test.lts-digit.org/accounts/v3
    description: Production
  - url: http://localhost:8094/accounts/v3
    description: Local Development

# Most endpoints are unauthenticated at this service; the three platform-gated ones
# declare BearerAuth individually.
security: []

tags:
  - name: Account
    description: |
      **Layer 1 — Account lifecycle.** Administrative creation, update (including
      activation / deactivation) and deletion of a tenant account.
  - name: Registration
    description: |
      **Layer 1 — Self-service registration.** OTP-verified sign-up: initiate, verify
      and resend. The tenant is created by `verify`, through the same code path as
      `POST /tenants`.
  - name: AccountConfig
    description: |
      **Layer 2 — Account configuration.** Per-tenant key/value store, scoped by
      `X-Tenant-Id`.

x-tagGroups:
  - name: Layer 1 — Tenant accounts
    tags: [Account, Registration]
  - name: Layer 2 — Account configuration
    tags: [AccountConfig]

paths:

  # ── Layer 1 — Account lifecycle ──────────────────────────────────────────────

  /tenants:

    post:
      summary: Create tenant account (admin)
      operationId: createTenant
      tags: [Account]
      security:
        - BearerAuth: []
      x-accessControl:
        env: PLATFORM_AUTH_ENABLED
      description: |
        Creates a tenant directly, without OTP.

        - `id` is server-generated; `code` is derived from `name` and must be
          non-empty and match `^[A-Z0-9_-]+$`. Duplicate `code` → `409`.
        - Created active (`isActive: true`); a Keycloak realm named after `code` is
          provisioned, with an admin user under `email`.
        - `X-Tenant-Id` is not used and is ignored if sent.

        **`password` decides how the admin user gets their credential.**

        | | `password` supplied | `password` omitted or blank |
        |---|---|---|
        | Admin user's password | the supplied value, set as **permanent** | server-generated, cryptographically random |
        | First login | no forced change | `UPDATE_PASSWORD` required action — **must** be changed |
        | Email | **none** — the caller already knows it | temp-password email to `email` |
        | `passwordGenerated` | `false` | `true` |
        | `temporaryPasswordEmailed` | absent | `true` / `false` |
        | `firstLoginUrls` | absent | the sign-in links that were emailed |

        A whitespace-only `password` counts as absent, so it generates one rather
        than installing eight spaces as a permanent credential. The password is never
        returned in any response.

        The email is **best-effort** and the generated password is stored nowhere: the
        tenant row and realm are already committed when the send is attempted, so a
        failure returns `201` with `temporaryPasswordEmailed: false` rather than
        failing the request. In that case the credential is unrecoverable and the
        admin can only be let in by a Keycloak admin resetting their password in the
        tenant's realm.

        Ordering: DB insert (duplicate `code` fails here, `409`) → Keycloak realm
        (failure rolls the row back, `500`) → OTP bootstrap config, temp-password
        email and create/migration events, all best-effort and unable to fail the
        request.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
            examples:
              full:
                summary: Every field — permanent password, no email
                value:
                  name: Pune City
                  email: admin@punecity.gov.in
                  password: Changeme1
                  phone: "+912026123456"
                  address: PMC Building, Shivajinagar
                  city: Pune
                  state: Maharashtra
                  pincode: "411005"
                  country: IN
                  additionalAttributes:
                    region: west
                    tier: government
                    contractRef: CNT-2025-001
              fullGeneratedPassword:
                summary: Every field except password — temp password generated and emailed
                value:
                  name: Pune City
                  email: admin@punecity.gov.in
                  phone: "+912026123456"
                  address: PMC Building, Shivajinagar
                  city: Pune
                  state: Maharashtra
                  pincode: "411005"
                  country: IN
                  additionalAttributes:
                    region: west
                    tier: government
                    contractRef: CNT-2025-001
              minimal:
                summary: Required fields only — temp password generated and emailed
                value:
                  name: Pune City
                  email: admin@punecity.gov.in
      responses:
        '201':
          description: Created.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
              examples:
                generatedPassword:
                  summary: Password generated — emailed, links recorded
                  value:
                    id: 5feb1562-cf89-4891-a942-b7fc63a388c5
                    code: PUNECITY
                    name: Pune City
                    email: admin@punecity.gov.in
                    isActive: true
                    passwordGenerated: true
                    temporaryPasswordEmailed: true
                    firstLoginUrls:
                      admin: https://test-lts.digit.org/license/admin/PUNECITY
                      employee: https://test-lts.digit.org/license/employee/PUNECITY
                      citizen: https://test-lts.digit.org/license/citizen/PUNECITY
                    additionalAttributes: {}
                    auditDetail:
                      createdBy: platform-admin
                      createdTime: 1789454459918
                      modifiedBy: platform-admin
                      modifiedTime: 1789454459918
                explicitPassword:
                  summary: Password supplied — no email, no links
                  value:
                    id: 2b7b5df7-6599-4b0a-9edd-37a1dadf6889
                    code: PUNECITY
                    name: Pune City
                    email: admin@punecity.gov.in
                    phone: "+912026123456"
                    address: PMC Building, Shivajinagar
                    city: Pune
                    state: Maharashtra
                    pincode: "411005"
                    country: IN
                    isActive: true
                    passwordGenerated: false
                    additionalAttributes:
                      region: west
                      tier: government
                    auditDetail:
                      createdBy: platform-admin
                      createdTime: 1789454415367
                      modifiedBy: platform-admin
                      modifiedTime: 1789454415367
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/PlatformUnauthenticated' }
        '403': { $ref: '#/components/responses/PlatformForbidden' }
        '409': { $ref: '#/components/responses/DuplicateTenantCode' }
        '500': { $ref: '#/components/responses/InternalError' }

    get:
      summary: Search / list tenant accounts
      operationId: listTenants
      tags: [Account]
      description: |
        Paginated list, sorted by creation time, newest first.

        Filter matching, which differs per field:

        | Filter | Matching |
        |---|---|
        | `code` | exact, case-**sensitive** |
        | `name` | partial, case-insensitive (`LIKE`, metacharacters escaped) |
        | `email` | exact, case-insensitive |
        | `isActive` | exact; omit for both active and inactive |

        - Each filter is at most 256 bytes.
        - `isActive` accepts only `true`/`false`; anything else is `400` rather than
          coerced.
        - `X-Tenant-Id` is optional. Absent = unscoped (platform caller). Present =
          folded into the `code` filter; if both are given and disagree → `400`.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: code
          in: query
          required: false
          description: Tenant code — exact, case-sensitive.
          schema: { type: string, maxLength: 256 }
          example: PUNECITY
        - name: name
          in: query
          required: false
          description: Tenant name — partial, case-insensitive.
          schema: { type: string, maxLength: 256 }
          example: Pune
        - name: email
          in: query
          required: false
          description: Tenant email — exact, case-insensitive.
          schema: { type: string, maxLength: 256 }
          example: admin@punecity.gov.in
        - name: isActive
          in: query
          required: false
          description: Activation state. Omit for both. Only `true`/`false`.
          schema: { type: boolean }
          example: true
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
              example:
                totalCount: 105
                page: 1
                size: 2
                hasMore: true
                tenants:
                  - id: 5f5c6c8b-8769-4ed8-acf6-c7335f67aecb
                    code: PUNECITY
                    name: Pune City
                    email: admin@punecity.gov.in
                    phone: "+912026123456"
                    address: PMC Building, Shivajinagar
                    city: Pune
                    state: Maharashtra
                    pincode: "411005"
                    country: IN
                    isActive: true
                    passwordGenerated: true
                    firstLoginUrls:
                      admin: https://test-lts.digit.org/license/admin/PUNECITY
                      employee: https://test-lts.digit.org/license/employee/PUNECITY
                      citizen: https://test-lts.digit.org/license/citizen/PUNECITY
                    additionalAttributes:
                      tier: government
                      region: west
                    version: 1
                    auditDetail:
                      createdBy: admin
                      createdTime: 1788776499810
                      modifiedBy: admin
                      modifiedTime: 1788857121201
                  - id: fbc1506b-db2f-4c46-a6da-2bed25c663a5
                    code: ACMELTD
                    name: Acme Ltd
                    email: admin@acmeltd.com
                    phone: "+919876543210"
                    address: 12 MG Road
                    city: Bengaluru
                    state: Karnataka
                    pincode: "560001"
                    isActive: true
                    passwordGenerated: false
                    additionalAttributes:
                      industry: utilities
                    auditDetail:
                      createdBy: postman-client
                      createdTime: 1788846638927
                      modifiedBy: postman-client
                      modifiedTime: 1788846638927
        '400':
          description: Invalid query parameter, malformed `X-Tenant-Id`, or `code` outside the header scope.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              examples:
                badIsActive:
                  value:
                    - code: Account.ValidationFailed
                      message: 'isActive filter must be true or false (got "ture")'
                sizeTooLarge:
                  value:
                    - code: Account.ValidationFailed
                      message: size must be at most 100 (got 500)
                scopeMismatch:
                  value:
                    - code: Account.ValidationFailed
                      message: 'code "ACMELTD" does not match the X-Tenant-Id scope "PUNECITY"'
        '500': { $ref: '#/components/responses/InternalError' }

  /tenants/{id}:

    put:
      summary: Update tenant account (incl. activation / deactivation)
      operationId: updateTenant
      tags: [Account]
      security:
        - BearerAuth: []
      x-accessControl:
        env: PLATFORM_AUTH_ENABLED
      description: |
        Partial update; every field is **omit-to-retain**.

        | Mutable | Immutable |
        |---|---|
        | `phone`, `address`, `city`, `state`, `pincode`, `country` | `id`, `code`, `name`, `email` |
        | `isActive` | `firstLoginUrls`, `passwordGenerated`, `version`, `auditDetail` |
        | `additionalAttributes` | |

        - `name` and `email` are not updatable; sending them is ignored, not an
          error. `name` is immutable because `code`, the Keycloak realm name and the
          DB schema name derive from it.
        - `isActive: false` deactivates and **disables the tenant's Keycloak realm**;
          `true` reactivates and re-enables it. The realm flip precedes the DB write,
          and is rolled back if the write fails (`500`). This is the reversible
          alternative to `DELETE`.
        - `additionalAttributes` **replaces** the whole map; `{}` clears it, omitting
          retains it.
        - `version` increments on every successful update.
        - `X-Tenant-Id` is optional; when present it must equal the addressed
          tenant's `code`, else `403`.
        - No `password` field — this endpoint cannot change a password.
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
            examples:
              full:
                summary: Every mutable field
                value:
                  phone: "+912026123456"
                  address: PMC Building, Shivajinagar
                  city: Nagpur
                  state: Maharashtra
                  pincode: "411005"
                  country: IND
                  isActive: true
                  additionalAttributes:
                    region: west
                    tier: enterprise
              partial:
                summary: Two contact fields only
                value:
                  city: Nagpur
                  country: IND
              deactivate:
                summary: Deactivate — disables the Keycloak realm
                value:
                  isActive: false
              reactivate:
                summary: Reactivate
                value:
                  isActive: true
              clearAttributes:
                summary: Clear every attribute
                value:
                  additionalAttributes: {}
      responses:
        '200':
          description: Updated.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
              example:
                id: 2b7b5df7-6599-4b0a-9edd-37a1dadf6889
                code: PUNECITY
                name: Pune City
                email: admin@punecity.gov.in
                phone: "+912026123456"
                address: PMC Building, Shivajinagar
                city: Nagpur
                state: Maharashtra
                pincode: "411005"
                country: IND
                isActive: false
                passwordGenerated: false
                additionalAttributes:
                  tier: enterprise
                  region: west
                version: 2
                auditDetail:
                  createdBy: platform-admin
                  createdTime: 1789454415367
                  modifiedBy: platform-admin
                  modifiedTime: 1789454517878
        '400':
          description: Validation error, or malformed `id` / `X-Tenant-Id`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              examples:
                badId:
                  value:
                    - code: Account.ValidationFailed
                      message: 'tenant id must be a valid UUID (got "abc")'
                badCountry:
                  value:
                    - code: Account.ValidationFailed
                      message: country must be at least 2 characters (got 1)
        '401': { $ref: '#/components/responses/PlatformUnauthenticated' }
        '403': { $ref: '#/components/responses/TenantForbidden' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '500':
          description: |
            Internal error — including a failed realm enable/disable, or a DB write
            that failed after the realm was flipped (realm is rolled back first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

    delete:
      summary: Delete tenant account
      operationId: deleteTenant
      tags: [Account]
      security:
        - BearerAuth: []
      x-accessControl:
        env: PLATFORM_AUTH_ENABLED
      description: |
        Permanently deletes the tenant. **Irreversible.** Prefer `PUT` with
        `isActive: false` if recovery may be needed.

        Deleted in order, each step gated on the previous, with no rollback — a
        part-way failure leaves the tenant partially deleted and returns `500`:
        1. every config entry scoped to the tenant's `code`;
        2. the tenant's **Keycloak realm**, and with it every user, client, role and
           session in it;
        3. the tenant row.

        A delete event is published afterwards. `X-Tenant-Id` is optional and must
        match the addressed tenant's `code`, else `403`.
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/ClientIdHeader'
      responses:
        '200':
          description: Deleted.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                deleted: true
        '400':
          description: Malformed `id` or `X-Tenant-Id`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/PlatformUnauthenticated' }
        '403': { $ref: '#/components/responses/TenantForbidden' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '500':
          description: Internal error, including a partially completed delete.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

  # ── Self-service registration ───────────────────────────────────────────────

  /tenants/registrations:

    post:
      summary: Initiate registration (step 1 of 2)
      operationId: initiateRegistration
      tags: [Registration]
      x-accessControl:
        env: SIGNUP_ENABLED
      description: |
        Issues and emails an OTP.

        **No tenant row is written here.** The payload is validated and cached
        against `referenceId`, and created only when `.../verify` succeeds.

        - Full `POST /tenants` validation runs first, so an invalid payload fails
          before an OTP is spent.
        - The `code` derived from `name` is checked for duplicates **before** the OTP
          is issued → `409`, no email sent.
        - `expiresIn` is the OTP's remaining lifetime in seconds (~600).
        - `cooldownSeconds` is the minimum wait before `resend`; **omitted when 0**.
        - `referenceId` is an opaque server-issued token.
        - Repeated calls for the same email start independent sessions, subject to
          the OTP service's rate limits.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInitiateRequest'
            examples:
              full:
                summary: Every field
                value:
                  name: Pune City
                  email: admin@punecity.gov.in
                  password: Changeme1
                  phone: "+912026123456"
                  address: PMC Building, Shivajinagar
                  city: Pune
                  state: Maharashtra
                  pincode: "411005"
                  country: IN
                  additionalAttributes:
                    region: west
                    tier: government
              minimal:
                summary: Required fields only
                value:
                  name: Pune City
                  email: admin@punecity.gov.in
      responses:
        '200':
          description: OTP sent. No tenant exists yet.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupInitiateResponse'
              example:
                referenceId: d306d100-9381-4b93-9d44-1fe7e1682efe
                expiresIn: 596
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/SignupDisabled' }
        '409': { $ref: '#/components/responses/DuplicateTenantCode' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OtpServiceUnavailable' }

  /tenants/registrations/verify:

    post:
      summary: Verify OTP and create the tenant (step 2 of 2)
      operationId: verifyRegistration
      tags: [Registration]
      x-accessControl:
        env: SIGNUP_ENABLED
      description: |
        Verifies the OTP and creates the tenant from the cached payload.

        - The tenant is created exactly as `POST /tenants` would create it: active,
          realm provisioned, same password behaviour, same best-effort OTP
          bootstrap / email / events. `201`.
        - The OTP is single-use; the cache entry is deleted on success.
        - Not covered by `PLATFORM_AUTH_ENABLED` — with signup on, tenant creation is
          reachable without a platform token.
        - `purpose` must be exactly `registration`, else `400`.
        - A `referenceId` with no live cache entry is `422 REQUEST_EXPIRED`, not
          `404`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
            example:
              referenceId: d306d100-9381-4b93-9d44-1fe7e1682efe
              otp: "482910"
              purpose: registration
      responses:
        '201':
          description: Verified — tenant created.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
              example:
                id: 5feb1562-cf89-4891-a942-b7fc63a388c5
                code: PUNECITY
                name: Pune City
                email: admin@punecity.gov.in
                isActive: true
                passwordGenerated: true
                temporaryPasswordEmailed: true
                firstLoginUrls:
                  admin: https://test-lts.digit.org/license/admin/PUNECITY
                  employee: https://test-lts.digit.org/license/employee/PUNECITY
                  citizen: https://test-lts.digit.org/license/citizen/PUNECITY
                additionalAttributes: {}
                auditDetail:
                  createdBy: admin
                  createdTime: 1789454459918
                  modifiedBy: admin
                  modifiedTime: 1789454459918
        '400':
          description: Validation error, or `purpose` other than `registration`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: Account.ValidationFailed
                  message: purpose must be "registration"
        '403': { $ref: '#/components/responses/SignupDisabled' }
        '409': { $ref: '#/components/responses/DuplicateTenantCode' }
        '410':
          description: OTP expired. Restart at `POST /tenants/registrations`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: OTP_EXPIRED
                  message: 'OTP has expired; restart registration'
        '422':
          description: |
            Wrong OTP (`INVALID_OTP`), or no live registration session behind
            `referenceId` (`REQUEST_EXPIRED`).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              examples:
                wrongOtp:
                  value:
                    - code: INVALID_OTP
                      message: 'OTP value is incorrect: OTP service error (422): [{"code":"OTP.Invalid","message":"OTP does not match"}]'
                unknownReference:
                  value:
                    - code: REQUEST_EXPIRED
                      message: 'OTP request expired or not found: request ID not found or expired'
        '423': { $ref: '#/components/responses/OtpLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OtpServiceUnavailable' }

  /tenants/registrations/resend:

    post:
      summary: Resend the registration OTP
      operationId: resendRegistrationOtp
      tags: [Registration]
      x-accessControl:
        env: SIGNUP_ENABLED
      description: |
        Issues a fresh OTP for an in-flight session.

        - **The same `referenceId` is returned**, not a new one — only the OTP behind
          it is replaced. Keep using the one you have.
        - The previous OTP is invalidated by the OTP service.
        - The cooldown since the last generate/resend must have elapsed, else `429`
          with `Retry-After` when the OTP service supplies it.
        - Too many attempts → `423` lockout.
        - No live session for the `referenceId` → `422 REQUEST_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupResendRequest'
            example:
              referenceId: d306d100-9381-4b93-9d44-1fe7e1682efe
      responses:
        '200':
          description: Fresh OTP sent; `referenceId` unchanged.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResendResponse'
              example:
                referenceId: d306d100-9381-4b93-9d44-1fe7e1682efe
                expiresIn: 580
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/SignupDisabled' }
        '422':
          description: No live registration session for this `referenceId`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: REQUEST_NOT_FOUND
                  message: 'Request ID not found or expired: The signup request has expired or does not exist'
        '423': { $ref: '#/components/responses/OtpLocked' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OtpServiceUnavailable' }

  # ── Layer 2 — Account configuration ─────────────────────────────────────────

  /config:

    post:
      summary: Create account configuration
      operationId: createTenantConfig
      tags: [AccountConfig]
      description: |
        Creates a key/value entry for the tenant named by `X-Tenant-Id`.

        - `X-Tenant-Id` is **required** and carries a tenant **code**
          (`^[A-Z0-9_-]+$`, ≤ 128 bytes), not a UUID. Missing or malformed → `400`.
        - **There is no `tenantId` field in the body** — the owning tenant comes from
          the header only.
        - The tenant must exist, else `422 TENANT_NOT_FOUND`.
        - `configKey` must be unique within the tenant → `409`.
        - `configValue` is a raw string, no type coercion.
        - Created active (`isActive: true`).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderRequired'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigCreateRequest'
            examples:
              full:
                summary: Every field
                value:
                  configKey: MAX_USERS_PER_ROLE
                  configValue: "50"
                  description: Maximum number of users that can be assigned to any single role.
              minimal:
                summary: Required fields only
                value:
                  configKey: footerText
                  configValue: © 2026 Pune City
      responses:
        '201':
          description: Created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
              example:
                id: bd06fbd1-82a2-4546-b637-b263201928c8
                tenantId: PUNECITY
                configKey: MAX_USERS_PER_ROLE
                configValue: "50"
                description: Maximum number of users that can be assigned to any single role.
                isActive: true
                auditDetail:
                  createdBy: platform-admin
                  createdTime: 1789454533147
                  modifiedBy: platform-admin
                  modifiedTime: 1789454533147
        '400':
          description: Validation error, or missing / malformed `X-Tenant-Id`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              examples:
                missingHeader:
                  value:
                    - code: Account.ValidationFailed
                      message: X-Tenant-Id header is required to scope the request
                missingFields:
                  value:
                    - code: Account.ValidationFailed
                      message: configKey is required
                    - code: Account.ValidationFailed
                      message: configValue is required
        '409': { $ref: '#/components/responses/DuplicateConfigKey' }
        '422':
          description: '`X-Tenant-Id` does not name an existing tenant.'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: TENANT_NOT_FOUND
                  message: X-Tenant-Id does not match any existing tenant
        '500': { $ref: '#/components/responses/InternalError' }

    get:
      summary: Search / list account configurations
      operationId: listTenantConfigs
      tags: [AccountConfig]
      description: |
        Paginated list for the tenant named by `X-Tenant-Id`, newest first.

        | Filter | Matching |
        |---|---|
        | `configKey` | exact |
        | `isActive` | exact; omit for both active and inactive |

        - `X-Tenant-Id` is **required** — there is no cross-tenant listing.
        - `isActive` accepts only `true`/`false`.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderRequired'
        - name: configKey
          in: query
          required: false
          description: Configuration key — exact match.
          schema: { type: string, maxLength: 256 }
          example: MAX_USERS_PER_ROLE
        - name: isActive
          in: query
          required: false
          description: Activation state. Omit for both. Only `true`/`false`.
          schema: { type: boolean }
          example: true
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: OK.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigListResponse'
              example:
                totalCount: 25
                page: 1
                size: 2
                hasMore: true
                configs:
                  - id: 95f445ae-bd30-4fa2-8792-28b4ca33569a
                    tenantId: PUNECITY
                    configKey: isOnboarded
                    configValue: "true"
                    description: Whether the super admin has confirmed onboarding from the admin console.
                    isActive: true
                    version: 3
                    auditDetail:
                      createdBy: admin
                      createdTime: 1788941476302
                      modifiedBy: admin
                      modifiedTime: 1789023604555
                  - id: 61e5362e-0107-45e6-a976-8c5c7ef5afa2
                    tenantId: PUNECITY
                    configKey: footerText
                    configValue: © 2026 PUNECITY
                    description: Footer copyright text — set by the super admin from Branding & Theme.
                    isActive: true
                    version: 1
                    auditDetail:
                      createdBy: admin
                      createdTime: 1788941476288
                      modifiedBy: admin
                      modifiedTime: 1788942971822
        '400':
          description: Invalid query parameter, or missing / malformed `X-Tenant-Id`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: Account.ValidationFailed
                  message: X-Tenant-Id header is required to scope the request
        '500': { $ref: '#/components/responses/InternalError' }

  /config/{id}:

    put:
      summary: Update account configuration (incl. activation / deactivation)
      operationId: updateTenantConfig
      tags: [AccountConfig]
      description: |
        Partial update; every field is **omit-to-retain**.

        - `X-Tenant-Id` is not used here and is ignored if sent — `id` already
          determines the owning tenant.
        - `id` and `tenantId` are immutable.
        - `configKey` **is** updatable; uniqueness within the tenant is re-validated
          → `409`.
        - `description` is the only nullable column: an explicit `null` **clears** it,
          omitting retains it. For `configKey` / `configValue` (NOT NULL) a `null`
          only ever means absent.
        - `isActive` activates/deactivates the entry. Unlike a tenant's `isActive`
          this has **no Keycloak effect** — it is a flag for consumers to honour.
        - `version` increments on every successful update.
      parameters:
        - $ref: '#/components/parameters/ConfigIdPath'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/ClientIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigUpdateRequest'
            examples:
              full:
                summary: Every mutable field
                value:
                  configKey: MAX_USERS_PER_ROLE
                  configValue: "100"
                  description: Updated maximum users per role.
                  isActive: true
              valueAndDescription:
                summary: Value and description only
                value:
                  configValue: "100"
                  description: Updated maximum users per role.
              deactivate:
                summary: Deactivate the entry
                value:
                  isActive: false
              clearDescription:
                summary: Clear the description
                value:
                  description: null
              rename:
                summary: Rename the key
                value:
                  configKey: MAX_USERS_PER_ROLE_V2
      responses:
        '200':
          description: Updated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
              example:
                id: bd06fbd1-82a2-4546-b637-b263201928c8
                tenantId: PUNECITY
                configKey: MAX_USERS_PER_ROLE
                configValue: "100"
                description: Updated maximum users per role.
                isActive: false
                version: 2
                auditDetail:
                  createdBy: platform-admin
                  createdTime: 1789454533147
                  modifiedBy: admin
                  modifiedTime: 1789454646710
        '400':
          description: Validation error, or malformed `id`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: Account.ValidationFailed
                  message: 'config id must be a valid UUID (got "not-a-uuid")'
        '404':
          description: Configuration entry not found.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
              example:
                - code: NOT_FOUND
                  message: TenantConfig not found
        '409': { $ref: '#/components/responses/DuplicateConfigKey' }
        '500': { $ref: '#/components/responses/InternalError' }

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth'

  # Only the headers the service reads are declared: X-Client-Id, X-Request-Id and
  # X-Tenant-Id. Nothing here consumes Idempotency-Key, X-Client-Secret,
  # X-Timestamp, X-Forwarded-For or User-Agent.
  parameters:

    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id persisted on the affected row. Absent leaves the stored value unchanged.
      schema: { type: string, maxLength: 36 }
      example: 33333333-3333-4333-8333-333333333333

    ClientIdHeader:
      name: X-Client-Id
      in: header
      required: false
      description: Calling client, recorded as `auditDetail.createdBy` / `modifiedBy`. Defaults to `admin`.
      schema: { type: string }
      example: platform-admin

    TenantIdHeaderRequired:
      name: X-Tenant-Id
      in: header
      required: true
      description: The tenant's **code** (`tenant.code`), not its UUID.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Z0-9_-]+$'
      example: PUNECITY

    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Optional tenant **code** scope. Absent = unscoped, for a platform caller
        operating across tenants. Present = confined to that tenant: folded into the
        `code` filter when listing, checked against the addressed tenant's code
        (`403` on mismatch) on the id-addressed endpoints.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Z0-9_-]+$'
      example: PUNECITY

    TenantIdPath:
      name: id
      in: path
      required: true
      description: The tenant's UUID (`tenant.id`), not its code. Canonical 36-character form.
      schema: { type: string, format: uuid }
      example: 2b7b5df7-6599-4b0a-9edd-37a1dadf6889

    ConfigIdPath:
      name: id
      in: path
      required: true
      description: The configuration entry's UUID. Canonical 36-character form.
      schema: { type: string, format: uuid }
      example: bd06fbd1-82a2-4546-b637-b263201928c8

    PageQuery:
      name: page
      in: query
      required: false
      description: Page number — 1-indexed.
      schema: { type: integer, minimum: 1, default: 1 }

    SizeQuery:
      name: size
      in: query
      required: false
      description: Records per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  # The service sets X-Correlation-ID on every response. It emits no
  # X-Response-Time, X-Response-Timestamp, X-Request-ID, X-Tenant-ID or
  # X-Rate-Limit-* header, and has no rate limiter of its own — every 429
  # originates in the OTP service.
  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'

  responses:

    ValidationError:
      description: |
        Validation error — one array entry per failed field, all coded
        `Account.ValidationFailed`. A missing or unparseable body yields a single
        `BAD_REQUEST` entry instead.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          examples:
            fieldErrors:
              summary: Several field failures at once
              value:
                - code: Account.ValidationFailed
                  message: password must be at least 8 characters (got 1)
                - code: Account.ValidationFailed
                  message: name is required
                - code: Account.ValidationFailed
                  message: email is not a valid address
                - code: Account.ValidationFailed
                  message: phone must be in E.164 format (e.g. +254202229000)
                - code: Account.ValidationFailed
                  message: country must be at least 2 characters (got 1)
            emptyBody:
              summary: Missing body
              value:
                - code: BAD_REQUEST
                  message: 'Invalid request body: EOF'

    PlatformUnauthenticated:
      description: |
        No verifiable platform-realm bearer token. Only when `PLATFORM_AUTH_ENABLED=true`.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: '`Bearer realm="<expected issuer>"`'
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: UNAUTHENTICATED
              message: A verified platform-realm bearer token is required for this endpoint.

    PlatformForbidden:
      description: The platform token verified but lacks the role named by `PLATFORM_AUTH_REQUIRED_ROLE` (default `SUPERADMIN`).
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: FORBIDDEN
              message: This endpoint requires the SUPERADMIN role in the platform realm.

    TenantForbidden:
      description: |
        Either the platform token lacks the required role, or the addressed tenant is
        outside the supplied `X-Tenant-Id` scope.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          examples:
            outsideScope:
              value:
                - code: FORBIDDEN
                  message: Tenant 2b7b5df7-6599-4b0a-9edd-37a1dadf6889 is outside the X-Tenant-Id scope ACMELTD
            missingRole:
              value:
                - code: FORBIDDEN
                  message: This endpoint requires the SUPERADMIN role in the platform realm.

    TenantNotFound:
      description: Tenant not found.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: NOT_FOUND
              message: Tenant not found

    DuplicateTenantCode:
      description: A tenant with the `code` derived from this `name` already exists.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: DUPLICATE_RECORD
              message: Tenant with this code already exists

    DuplicateConfigKey:
      description: A configuration with this `configKey` already exists for the tenant.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: DUPLICATE_RECORD
              message: A configuration with this configKey already exists for the tenant

    SignupDisabled:
      description: Self-service registration is off (`SIGNUP_ENABLED=false`).
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: SIGNUP_DISABLED
              message: Self-service registration is disabled on this environment.

    OtpRateLimited:
      description: |
        The OTP service's rate limit or resend cooldown. This service has no rate
        limiter of its own.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait, when the OTP service supplies it.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: TOO_MANY_REQUESTS
              message: Resend too soon or max resend exceeded

    OtpLocked:
      description: Too many failed OTP attempts; the identifier is in lockout.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: ACCOUNT_LOCKED
              message: Too many failed OTP attempts

    OtpServiceUnavailable:
      description: The OTP service was unreachable or errored. The session is unaffected — retry.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }
          example:
            - code: OTP_SERVICE_ERROR
              message: Failed to generate OTP

    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'

    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail'

    AdditionalAttributes:
      type: object
      description: |
        Open key/value tenant metadata, stored and returned as-is. Values must be
        **strings**; keys must match `^[a-zA-Z0-9_.-]+$`. Max 50 entries, key ≤ 128
        bytes, value ≤ 1024 bytes — lengths counted in bytes.
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 1024
      propertyNames:
        pattern: '^[a-zA-Z0-9_.-]+$'
        maxLength: 128
      example:
        region: west
        tier: government

    # ── Tenant ────────────────────────────────────────────────────────────────

    TenantCreateRequest:
      type: object
      description: |
        `POST /tenants` body. `id`, `code`, `isActive`, `passwordGenerated`,
        `firstLoginUrls`, `version` and `auditDetail` are server-managed and not
        accepted.
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Display name. `code` is derived from this, so the name must contain at
            least one letter or digit and derive a code matching `^[A-Z0-9_-]+$`.
            Immutable after creation.
          example: Pune City
        email:
          type: string
          format: email
          maxLength: 254
          description: Contact email and the admin user's username. Immutable after creation.
          example: admin@punecity.gov.in
        password:
          type: string
          minLength: 8
          maxLength: 256
          format: password
          writeOnly: true
          description: |
            Optional. Supplied → set as the admin user's **permanent** password, no
            email, no forced change. Omitted or blank → generated, `UPDATE_PASSWORD`
            forced at first login, emailed to `email`. Whitespace-only counts as
            absent. Never returned.
          example: Changeme1
        phone:
          type: string
          maxLength: 20
          pattern: '^\+[1-9]\d{6,14}$'
          description: E.164, with country code. Optional.
          example: "+912026123456"
        address:
          type: string
          minLength: 5
          maxLength: 512
          description: Free text. Optional.
          example: PMC Building, Shivajinagar
        city:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional.
          example: Pune
        state:
          type: string
          minLength: 1
          maxLength: 128
          description: State, province or county. Optional.
          example: Maharashtra
        pincode:
          type: string
          minLength: 5
          maxLength: 10
          description: Postal / ZIP code. No format validation. Optional.
          example: "411005"
        country:
          type: string
          minLength: 2
          maxLength: 128
          description: |
            Optional. Free text — length is the only constraint, so both `KE` and
            `Kenya` are accepted and stored verbatim. No ISO 3166 validation or
            normalisation.
          example: IN
        additionalAttributes:
          $ref: '#/components/schemas/AdditionalAttributes'

    SignupInitiateRequest:
      type: object
      description: |
        `POST /tenants/registrations` body. Same field set and the same validation
        rules as `TenantCreateRequest`, cached — **no tenant row is written** until
        `.../verify` succeeds.
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Display name. The derived `code` is checked for duplicates before an OTP
            is issued.
          example: Pune City
        email:
          type: string
          format: email
          maxLength: 254
          description: OTP delivery address and the tenant's contact email.
          example: admin@punecity.gov.in
        password:
          type: string
          minLength: 8
          maxLength: 256
          format: password
          writeOnly: true
          description: Optional; applied at step 2 with the same two branches as `TenantCreateRequest.password`.
          example: Changeme1
        phone:
          type: string
          maxLength: 20
          pattern: '^\+[1-9]\d{6,14}$'
          description: E.164. Optional.
          example: "+912026123456"
        address:
          type: string
          minLength: 5
          maxLength: 512
          description: Free text. Optional.
          example: PMC Building, Shivajinagar
        city:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional.
          example: Pune
        state:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional.
          example: Maharashtra
        pincode:
          type: string
          minLength: 5
          maxLength: 10
          description: Optional.
          example: "411005"
        country:
          type: string
          minLength: 2
          maxLength: 128
          description: Optional. Free text; no ISO 3166 validation.
          example: IN
        additionalAttributes:
          $ref: '#/components/schemas/AdditionalAttributes'

    TenantUpdateRequest:
      type: object
      description: |
        `PUT /tenants/{id}` body. Every field is **omit-to-retain**. `id`, `code`,
        `name`, `email`, `firstLoginUrls`, `passwordGenerated`, `version` and
        `auditDetail` are immutable and ignored if sent. No `password` field.
      properties:
        phone:
          type: string
          maxLength: 20
          pattern: '^\+[1-9]\d{6,14}$'
          example: "+912026123456"
        address:
          type: string
          minLength: 5
          maxLength: 512
          example: PMC Building, Shivajinagar
        city:
          type: string
          minLength: 1
          maxLength: 128
          example: Nagpur
        state:
          type: string
          minLength: 1
          maxLength: 128
          example: Maharashtra
        pincode:
          type: string
          minLength: 5
          maxLength: 10
          example: "411005"
        country:
          type: string
          minLength: 2
          maxLength: 128
          description: Free text; no ISO 3166 validation.
          example: IND
        isActive:
          type: boolean
          description: |
            Activation control — there is no separate endpoint. `false` deactivates
            and **disables the tenant's Keycloak realm**, so nobody in that realm can
            authenticate; `true` reactivates and re-enables it; omitted retains the
            current state. The realm flip precedes the DB write and is rolled back if
            the write fails. Reversible alternative to `DELETE`.
          example: false
        additionalAttributes:
          allOf:
            - $ref: '#/components/schemas/AdditionalAttributes'
          description: |
            **Replaces** the whole map when supplied, not merged. `{}` clears every
            attribute; omit to retain.

    TenantResponse:
      type: object
      description: |
        A tenant account. `readOnly` fields are server-managed. The password is never
        included. Optional fields are **omitted, not null**, so absence is
        meaningful — `version` is absent while `0`, and `firstLoginUrls` /
        `temporaryPasswordEmailed` appear only in the generated-password case.
      required: [id, code, name, email, isActive, passwordGenerated]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-generated UUID; the `{id}` path parameter.
          example: 2b7b5df7-6599-4b0a-9edd-37a1dadf6889
        code:
          type: string
          readOnly: true
          description: |
            Derived from `name` at creation as
            `ToUpper(ReplaceAll(TrimSpace(name), " ", ""))`, matching
            `^[A-Z0-9_-]+$`. Unique and immutable. The platform-wide tenant
            identifier: Keycloak realm name, DB schema name, pub/sub event key, and
            `X-Tenant-Id` on subsequent calls.
          example: PUNECITY
        name:
          type: string
          description: Display name. Immutable.
          example: Pune City
        email:
          type: string
          format: email
          description: Contact email. Immutable.
          example: admin@punecity.gov.in
        phone:
          type: string
          description: E.164. Omitted when unset.
          example: "+912026123456"
        address:
          type: string
          description: Omitted when unset.
          example: PMC Building, Shivajinagar
        city:
          type: string
          description: Omitted when unset.
          example: Pune
        state:
          type: string
          description: Omitted when unset.
          example: Maharashtra
        pincode:
          type: string
          description: Omitted when unset.
          example: "411005"
        country:
          type: string
          description: As supplied, verbatim. Omitted when unset.
          example: IN
        isActive:
          type: boolean
          readOnly: true
          description: |
            `true` on creation, by either path. Flipped by `PUT /tenants/{id}`, which
            also enables or disables the tenant's Keycloak realm. `false` means
            nobody in that realm can authenticate.
          example: true
        passwordGenerated:
          type: boolean
          readOnly: true
          description: |
            `true` when the server generated the password, forced a first-login
            change and emailed it. `false` when the caller supplied it, in which case
            it is permanent and was not emailed.
          example: true
        temporaryPasswordEmailed:
          type: boolean
          readOnly: true
          description: |
            Whether the generated password reached the admin's inbox. **Present only
            on a create response, and only when `passwordGenerated` is `true`** — it
            describes one create call, so it is never persisted and never appears on a
            read or list.

            `false` is an operational alert: the tenant and realm exist but the
            password is stored nowhere and cannot be resent — recovery needs a
            Keycloak admin password reset in that realm. `false` also covers
            `NOTIFICATION_ENABLED=false`.
          example: true
        firstLoginUrls:
          type: object
          readOnly: true
          additionalProperties: { type: string, format: uri }
          description: |
            The sign-in links emailed to the admin, as an ordered `label -> url` map;
            the first entry is primary. Built at creation from
            `FIRST_LOGIN_URLS` with `{realm}` / `{tenantCode}`
            replaced by the tenant's `code`, and recorded on the row rather than
            recomputed, so later config changes do not retro-edit existing tenants.
            Server-set, never patchable.

            **Present only when `passwordGenerated` is `true`.** Also omitted when no
            links are configured; an empty object is never returned.
          example:
            admin: https://test-lts.digit.org/license/admin/PUNECITY
            employee: https://test-lts.digit.org/license/employee/PUNECITY
            citizen: https://test-lts.digit.org/license/citizen/PUNECITY
        additionalAttributes:
          type: object
          additionalProperties: { type: string }
          description: As supplied at creation or last update. `{}` when none.
          example:
            region: west
            tier: government
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. **Omitted while `0`.**
          example: 2
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    TenantListResponse:
      type: object
      description: Paginated tenant list, newest first.
      required: [tenants, totalCount, page, size, hasMore]
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Total matches across all pages.
          example: 105
        page:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size applied.
          example: 20
        hasMore:
          type: boolean
          description: '`true` when further pages exist.'
          example: true
        tenants:
          type: array
          description: Empty array when nothing matches — never null.
          items:
            $ref: '#/components/schemas/TenantResponse'

    DeleteResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: Always `true`; a failure returns an error array instead.
          example: true

    # ── Registration ──────────────────────────────────────────────────────────

    SignupVerifyRequest:
      type: object
      description: '`POST /tenants/registrations/verify` body.'
      required: [referenceId, otp, purpose]
      properties:
        referenceId:
          type: string
          minLength: 10
          maxLength: 2048
          description: |
            From `POST /tenants/registrations` or `.../resend`. **Opaque** — a
            server-side key for the pending registration; it encodes nothing readable.
            Submit as received; do not parse it or depend on its format.
          example: d306d100-9381-4b93-9d44-1fe7e1682efe
        otp:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[0-9]+$'
          description: The emailed code, typically 6 digits.
          example: "482910"
        purpose:
          type: string
          enum: [registration]
          description: Must be exactly `registration`.
          example: registration

    SignupResendRequest:
      type: object
      description: |
        `POST /tenants/registrations/resend` body. Email and purpose are resolved
        server-side from the cached session.
      required: [referenceId]
      properties:
        referenceId:
          type: string
          minLength: 10
          maxLength: 2048
          description: |
            From the previous initiate or resend call. Opaque. It survives a resend —
            the same value is returned and only the OTP behind it is replaced.
          example: d306d100-9381-4b93-9d44-1fe7e1682efe

    SignupInitiateResponse:
      type: object
      description: |
        `POST /tenants/registrations` response — the session handle and its timings
        only. **No tenant record, because no tenant exists yet.**
      required: [referenceId, expiresIn]
      properties:
        referenceId:
          type: string
          description: Opaque session token. Do not parse it or depend on its format.
          example: d306d100-9381-4b93-9d44-1fe7e1682efe
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Seconds until the OTP and session expire. Reported by the OTP service, so
            slightly below the nominal TTL by the time the caller sees it.
          example: 596
        cooldownSeconds:
          type: integer
          minimum: 0
          description: |
            Minimum wait before `.../resend` is accepted. **Omitted when 0** — treat
            absence as no cooldown.
          example: 60

    SignupResendResponse:
      type: object
      description: |
        `POST /tenants/registrations/resend` response. `referenceId` is the **same**
        one submitted — only the OTP behind it was replaced.
      required: [referenceId, expiresIn]
      properties:
        referenceId:
          type: string
          description: Unchanged session id. A resend does not rotate it.
          example: d306d100-9381-4b93-9d44-1fe7e1682efe
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the new OTP expires.
          example: 580
        cooldownSeconds:
          type: integer
          minimum: 0
          description: Minimum wait before another resend. Omitted when 0.
          example: 60

    # ── Configuration ─────────────────────────────────────────────────────────

    TenantConfigCreateRequest:
      type: object
      description: |
        `POST /config` body. **The owning tenant is not part of this body** — it
        comes from `X-Tenant-Id`, which carries the tenant's code. There is no
        `tenantId` field.
      required: [configKey, configValue]
      properties:
        configKey:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Unique within the tenant. Convention is SCREAMING_SNAKE_CASE for platform
            keys, though camelCase keys are also in use (`isOnboarded`,
            `footerText`); nothing is enforced.
          example: MAX_USERS_PER_ROLE
        configValue:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            Raw string, no type coercion — a boolean is stored as `"true"`. Callers
            serialise, consumers parse.
          example: "50"
        description:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Operational note, not interpreted by the platform. Optional; stored as an
            empty string when omitted.
          example: Maximum number of users that can be assigned to any single role.

    TenantConfigUpdateRequest:
      type: object
      description: |
        `PUT /config/{id}` body. Every field is **omit-to-retain**. `id` and
        `tenantId` are immutable and ignored if sent.
      properties:
        configKey:
          type: string
          minLength: 1
          maxLength: 256
          description: Uniqueness within the tenant is re-validated → `409` on collision.
          example: MAX_USERS_PER_ROLE_V2
        configValue:
          type: string
          minLength: 1
          maxLength: 2048
          description: Raw string.
          example: "100"
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
          description: |
            The only nullable column here: an explicit `null` **clears** it, omitting
            retains it. For `configKey` / `configValue` (NOT NULL) a `null` only means
            absent.
          example: Updated maximum users per role.
        isActive:
          type: boolean
          description: |
            Activates/deactivates this entry; omitted retains. **No Keycloak effect** —
            a flag for consumers to honour. A deactivated entry is still returned by
            `GET /config` unless filtered with `?isActive=true`.
          example: false

    TenantConfigResponse:
      type: object
      description: |
        A configuration entry. Optional fields are omitted, not null — `version` is
        absent while `0`, `description` absent when empty.
      required: [id, tenantId, configKey, configValue, isActive]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: bd06fbd1-82a2-4546-b637-b263201928c8
        tenantId:
          type: string
          readOnly: true
          description: |
            The owning tenant's **code**, not its UUID — the scope key follows
            `X-Tenant-Id`.
          example: PUNECITY
        configKey:
          type: string
          description: Unique within the tenant.
          example: MAX_USERS_PER_ROLE
        configValue:
          type: string
          description: Raw string.
          example: "100"
        description:
          type: string
          description: Omitted when empty.
          example: Updated maximum users per role.
        isActive:
          type: boolean
          readOnly: true
          description: '`true` on creation; flipped by `PUT /config/{id}`.'
          example: true
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. **Omitted while `0`.**
          example: 2
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    TenantConfigListResponse:
      type: object
      description: Paginated config list for one tenant, newest first.
      required: [configs, totalCount, page, size, hasMore]
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: Total matches across all pages.
          example: 25
        page:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size applied.
          example: 20
        hasMore:
          type: boolean
          description: '`true` when further pages exist.'
          example: true
        configs:
          type: array
          description: Empty array when nothing matches — never null.
          items:
            $ref: '#/components/schemas/TenantConfigResponse'
