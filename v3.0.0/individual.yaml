openapi: 3.0.3
info:
  title: Individual Service API
  version: 3.0.0
  description: 'eGov DIGIT Individual Registry Service for managing citizen records.


    REST APIs for individual CRUD operations, search, and configuration management.


    **Authentication**: Header-based authentication using X-Tenant-ID and X-Client-Id.

    All endpoints require these headers.


    **Features**:

    - Individual CRUD operations (REST-style with standard HTTP methods)

    - Query-parameter based search with pagination

    - Config management (upsert)

    - PII encryption via Vault

    - Event publishing for audit trail

    '
servers:
- url: https://api.example.com/individual/v3
  description: Production server
- url: https://staging-api.example.com/individual/v3
  description: Staging server
- url: http://localhost:8080/individual/v3
  description: Local Development
tags:
- name: Individuals
  description: Individual CRUD operations
- name: Configs
  description: Configuration management
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/securitySchemes/BearerAuth
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/TenantIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/TimeStamp
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique identifier for idempotent requests
      schema:
        type: string
        minLength: 2
        maxLength: 64
    IndividualIdPath:
      name: id
      in: path
      required: true
      description: Unique identifier of the individual
      schema:
        type: string
        minLength: 2
        maxLength: 64
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit-Reset
  schemas:
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/schemas/Error
    AuditDetails:
      type: object
      description: Contains audit details tracking record creation and modification
      properties:
        createdBy:
          type: string
          description: UUID of the user or system that created the record
          minLength: 2
          maxLength: 64
        createdTime:
          type: integer
          format: int64
          description: Timestamp (epoch milliseconds) when the record was created
        modifiedBy:
          type: string
          description: UUID of the user or system that updated the record
          minLength: 2
          maxLength: 64
        modifiedTime:
          type: integer
          format: int64
          description: Timestamp (epoch milliseconds) when the record was last modified
    Address:
      type: object
      description: Represents a physical address with location details
      properties:
        tenantId:
          type: string
          description: Tenant unique identifier
        addressId:
          type: string
          readOnly: true
          description: Unique ID for the address
        streetAddress:
          type: string
          description: Full street address
        area:
          type: string
          description: Locality or zone
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code
        pincode:
          type: string
          description: ZIP or postal code
        landmark:
          type: string
          description: Nearby landmark for reference
        geoLocation:
          type: object
          description: Latitude and longitude of the address
          properties:
            latitude:
              type: number
              format: double
              description: Geographical latitude
            longitude:
              type: number
              format: double
              description: Geographical longitude
    Document:
      type: object
      description: Represents a user-uploaded document associated with an individual
      required:
      - documentType
      - fileStoreId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          minLength: 2
          maxLength: 64
          description: System-generated unique identifier for the document
        documentType:
          type: string
          minLength: 2
          maxLength: 64
          description: Code representing the type of document
        fileStoreId:
          type: string
          minLength: 2
          maxLength: 64
          description: Reference ID of the uploaded file in the file storage system
        documentUid:
          type: string
          minLength: 2
          maxLength: 64
          description: Optional unique identifier of the document
    Individual:
      type: object
      description: Represents a citizen record in the Individual Registry
      required:
      - tenantId
      - name
      - dateOfBirth
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          minLength: 2
          maxLength: 64
          description: System-generated unique identifier for the individual
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
          description: Tenant identifier
        name:
          type: string
          minLength: 2
          maxLength: 256
          description: Full name of the individual
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
          - PREFER_NOT_TO_SAY
          description: Gender of the individual
        mobileNumber:
          type: string
          minLength: 10
          maxLength: 20
          description: Mobile phone number
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Email address
        address:
          $ref: '#/components/schemas/Address'
        documents:
          type: array
          description: Array of documents associated with the individual
          items:
            $ref: '#/components/schemas/Document'
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
        additionalFields:
          type: object
          description: Additional custom fields for extensibility
          additionalProperties: true
    IndividualRequest:
      type: object
      description: Request payload for creating or updating an individual
      required:
      - tenantId
      - name
      - dateOfBirth
      properties:
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
          description: Tenant identifier
        name:
          type: string
          minLength: 2
          maxLength: 256
          description: Full name of the individual
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
          - PREFER_NOT_TO_SAY
          description: Gender of the individual
        mobileNumber:
          type: string
          minLength: 10
          maxLength: 20
          description: Mobile phone number
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Email address
        address:
          $ref: '#/components/schemas/Address'
        documents:
          type: array
          description: Array of documents associated with the individual
          items:
            $ref: '#/components/schemas/Document'
        additionalFields:
          type: object
          description: Additional custom fields for extensibility
          additionalProperties: true
    IndividualResponse:
      type: object
      description: Response wrapper for individual operations
      required:
      - Individual
      properties:
        Individual:
          $ref: '#/components/schemas/Individual'
    DeleteResponse:
      type: object
      description: Response for delete operations
      required:
      - deleted
      properties:
        deleted:
          type: boolean
          description: Indicates whether the resource was successfully deleted
    Config:
      type: object
      description: Configuration object for the Individual Service
      required:
      - key
      - value
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        tenantId:
          type: string
          minLength: 2
          maxLength: 64
          description: Tenant identifier
        key:
          type: string
          minLength: 2
          maxLength: 256
          description: Configuration key
        value:
          type: string
          minLength: 1
          maxLength: 4096
          description: Configuration value
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
    IndividualSearchResponse:
      type: object
      description: Response wrapper for individual search results
      required:
      - Individuals
      - totalCount
      properties:
        Individuals:
          type: array
          items:
            $ref: '#/components/schemas/Individual'
          description: Array of individuals matching search criteria
        totalCount:
          type: integer
          minimum: 0
          description: Total number of individuals matching search criteria
paths:
  /:
    post:
      tags:
      - Individuals
      summary: Create Individual
      operationId: createIndividual
      description: Create a new individual record in the registry
      parameters:
      - &id001
        $ref: '#/components/parameters/RequestIdHeader'
      - &id002
        $ref: '#/components/parameters/CorrelationIdHeader'
      - &id003
        $ref: '#/components/parameters/UserAgentHeader'
      - &id004
        $ref: '#/components/parameters/TenantIdHeader'
      - &id005
        $ref: '#/components/parameters/ForwardedForHeader'
      - &id006
        $ref: '#/components/parameters/ClientId'
      - &id007
        $ref: '#/components/parameters/ClientSecret'
      - &id008
        $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualRequest'
      responses:
        '201':
          description: Individual created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Individuals
      summary: Search Individuals
      operationId: searchIndividuals
      description: Search for individuals using query parameters
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - name: name
        in: query
        required: false
        description: Search by individual name (partial match, case-insensitive)
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: mobileNumber
        in: query
        required: false
        description: Search by mobile number (exact match)
        schema:
          type: string
          minLength: 10
          maxLength: 20
      - name: email
        in: query
        required: false
        description: Search by email address (exact match)
        schema:
          type: string
          format: email
      - name: dateOfBirth
        in: query
        required: false
        description: Search by exact date of birth (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: offset
        in: query
        required: false
        description: Number of results to skip for pagination
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Search results retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualSearchResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters: []
  /{id}:
    get:
      tags:
      - Individuals
      summary: Get Individual by ID
      operationId: getIndividual
      description: Retrieve a specific individual record by ID
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - $ref: '#/components/parameters/IndividualIdPath'
      responses:
        '200':
          description: Individual retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualResponse'
        '401':
          description: Unauthorized
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Individual not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    put:
      tags:
      - Individuals
      summary: Update Individual
      operationId: updateIndividual
      description: Update an existing individual record
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - $ref: '#/components/parameters/IndividualIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualRequest'
      responses:
        '200':
          description: Individual updated successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Individual not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - duplicate email or mobile number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable - business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Individuals
      summary: Delete Individual
      operationId: deleteIndividual
      description: Delete an individual record (soft delete)
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - $ref: '#/components/parameters/IndividualIdPath'
      responses:
        '200':
          description: Individual deleted successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          description: Unauthorized
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Individual not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /configs:
    post:
      tags:
      - Configs
      summary: Upsert Configuration
      operationId: upsertConfig
      description: Create or update a configuration entry
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              - value
              properties:
