openapi: 3.0.3
info:
  title: OTP Service API
  version: 3.0.0
  description: "REST APIs for OTP generation, verification, configuration, invalidation\
    \ and resend.\n\nA tenant configures one or more purposes (e.g., login, transaction,\
    \ forgot-password).\nEach purpose defines OTP length, TTL, rate limits, and lockout\
    \ behaviour.\n"
servers:
- url: https://api.example.com/otp/v3
  description: Production server
- url: https://staging-api.example.com/otp/v3
  description: Staging server
security:
- BearerAuth: []
tags:
- name: Config
  description: Manage per-tenant, per-purpose OTP configuration (OTP length, TTL,
    rate limits, lockout).
- name: OTP
  description: Generate, verify, and invalidate OTPs.
paths:
  /config:
    post:
      summary: Create OTP config for a purpose
      operationId: createOtpConfig
      tags:
      - Config
      description: "Creates a new OTP configuration for a specific purpose under the\
        \ calling tenant.\n\nReturns `409` if a config for this purpose already exists\
        \ \u2014 use PUT to update.\n"
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpConfig'
            example:
              purpose: login
              otpLength: 6
              ttlSeconds: 600
              cooldownSeconds: 60
              maxAttempts: 5
              lockoutSeconds: 900
              maxGeneratesPerHour: 5
              maxResendsPerHour: 3
              isActive: true
      responses:
        '201':
          description: OTP config created.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpConfig'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Config for this purpose already exists. Use PUT to update.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    get:
      summary: Get OTP config for a purpose
      operationId: getOtpConfig
      tags:
      - Config
      description: 'Returns the OTP configuration for the given purpose under the
        calling tenant.

        If purpose is not provided, returns all configs for the tenant.

        `tenantId` is extracted from the bearer token.

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: purpose
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OtpPurpose'
        description: The purpose to retrieve config for. If omitted, returns all configs
          for the tenant. The value is not checked against the enum; an unknown
          purpose simply yields `404 CONFIG_NOT_FOUND`.
      responses:
        '200':
          description: OTP config(s) returned.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OtpConfig'
                - type: array
                  items:
                    $ref: '#/components/schemas/OtpConfig'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: No config found for this tenant and purpose.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    put:
      summary: Update OTP config for a purpose
      operationId: updateOtpConfig
      tags:
      - Config
      description: "Replaces an existing OTP config (full replace, not a merge).\n\
        Send the complete config: every omitted numeric field is reset to its default\
        \ (otpLength 6, ttlSeconds 300, cooldownSeconds 120, maxAttempts 3, lockoutSeconds\
        \ 3600, maxGeneratesPerHour 5, maxResendsPerHour 5), an omitted `isActive` becomes\
        \ `true` and an omitted `contextBindingRequired` becomes `false`.\n`purpose`\
        \ is required in the body and must equal the stored purpose; a different value\
        \ is a `409 IMMUTABLE_FIELD`.\nReturns `404` if no config exists for this id \u2014\
        \ use POST to create.\nOn success, the Redis config cache for this tenant+purpose\
        \ is immediately invalidated.\n"
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the config to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpConfig'
            example:
              purpose: login
              otpLength: 6
              ttlSeconds: 600
              cooldownSeconds: 60
              maxAttempts: 3
              lockoutSeconds: 1800
              maxGeneratesPerHour: 5
              maxResendsPerHour: 3
              isActive: true
      responses:
        '200':
          description: OTP config updated.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpConfig'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: No config found for this purpose. Use POST to create.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: "Conflict \u2014 immutable field change attempted (e.g., purpose)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    delete:
      summary: Delete OTP config for a purpose
      operationId: deleteOtpConfig
      tags:
      - Config
      description: "Deletes the OTP configuration for a specific purpose under the\
        \ calling tenant.\nAfter deletion, any `/generate` call for this purpose returns\
        \ `400 Config.NotFound`.\nNot idempotent \u2014 returns `404 CONFIG_NOT_FOUND`\
        \ when no config exists for the purpose.\nOn success, the Redis config cache\
        \ for this tenant+purpose is immediately invalidated.\n"
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: purpose
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/OtpPurpose'
        description: The purpose to delete config for.
      responses:
        '200':
          description: Config deleted.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '404':
          description: No config found for this tenant and purpose (`CONFIG_NOT_FOUND`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request (`MISSING_PARAMETER` when `purpose` is absent).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /generate:
    post:
      summary: Generate an OTP
      operationId: generateOtp
      tags:
      - OTP
      description: 'Generates a cryptographically secure OTP for the given identifier
        and purpose.

        Returns a UUID referenceId. Sends the OTP via the Notification Service.


        **tenantId** is extracted from the X-Tenant-Id header.


        **Idempotency:** If an active OTP exists for the same (tenantId, destination,
        purpose)

        and the cooldown window has not elapsed, `429 OTP.ResendTooSoon` is returned.

        Use `/resend` to retry after the cooldown elapses.


        **Pre-conditions:**

        - A config must exist and `isActive = true` for this tenant+purpose.

        - Identifier must not be in a lockout period.

        - Generation rate limit must not be exceeded.

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpGenerateRequest'
            examples:
              login:
                summary: Login OTP
                value:
                  identifier: user@example.com
                  purpose: login
                  metadata:
                    sessionId: sess-abc123
                    deviceId: device-001
              transaction:
                summary: Transaction OTP with context binding
                value:
                  identifier: '+919876543210'
                  purpose: transaction
                  metadata:
                    sessionId: sess-xyz789
                    deviceId: dev-001
      responses:
        '200':
          description: OTP generated successfully.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpGenerateResponse'
        '400':
          description: "Bad Request \u2014 missing or malformed fields (`BadRequest`),\
            \ identifier type other than `mobile`/`email`, config not found for this\
            \ purpose (`Config.NotFound`), or purpose is disabled for this tenant (`Config.Disabled`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: "Unauthorized \u2014 missing or invalid bearer token."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: "Too Many Requests \u2014 differentiated by the `code` field:\n\
            - `Rate.LimitExceeded`: `maxGeneratesPerHour` reached for this identifier.\n\
            - `OTP.Locked`: identifier is in a lockout period.\n- `OTP.ResendTooSoon`:\
            \ an active OTP exists and its cooldown has not elapsed; the body carries\
            \ `retryAfter` seconds.\nNo `Retry-After` response header is sent."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OtpError'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '503':
          description: "Service Unavailable \u2014 `Notification.Unavailable` (OTP could\
            \ not be dispatched), `Encryption.Unavailable` (Vault/encryption down) or\
            \ `Service.Unavailable`."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /verify:
    post:
      summary: Verify an OTP
      operationId: verifyOtp
      tags:
      - OTP
      description: 'Verifies the submitted OTP against the stored hash.


        `referenceId` is the UUID returned from `/generate` - used to look up the
        OTP record.

        `tenantId` is extracted from the X-Tenant-Id header.

        `purpose` must be provided in the request body and must match the purpose
        stored in the OTP record.


        **On success:** The OTP status is marked as verified.


        **On failure:** The attempt counter is incremented. When `maxAttempts` is
        reached the OTP

        is locked and no further attempts are possible.


        **Security:** Comparison is always constant-time to prevent timing attacks.

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            examples:
              standard:
                summary: Standard verify
                value:
                  referenceId: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
                  purpose: login
                  otp: '482910'
              with_context_binding:
                summary: Verify with session binding
                value:
                  referenceId: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
                  purpose: transaction
                  otp: '482910'
                  sessionId: sess-abc123
      responses:
        '200':
          description: OTP verified successfully.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          description: "Bad Request \u2014 missing or malformed fields (`BadRequest`,\
            \ including a non-UUID `referenceId`), or `purpose` does not match the OTP\
            \ record (`OTP.PurposeMismatch`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: "Unauthorized \u2014 missing or invalid bearer token."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: "Not Found \u2014 referenceId does not exist (`OTP.NotFound`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: "Conflict \u2014 this OTP was already verified (`OTP.AlreadyVerified`);\
            \ a code cannot be replayed."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '410':
          description: "Gone \u2014 OTP has expired (`OTP.Expired`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: "Unprocessable \u2014 OTP does not match, or the OTP was invalidated\
            \ (`OTP.Invalid`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '423':
          description: "Locked \u2014 OTP locked (maxAttempts reached) or identifier\
            \ in lockout period."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /invalidate:
    post:
      summary: Invalidate an OTP
      operationId: invalidateOtp
      tags:
      - OTP
      description: "Immediately marks an OTP as invalid.\nUsed on logout, account\
        \ lock, or any security event.\n\n`referenceId` is the UUID returned from\
        \ `/generate`.\n`tenantId` is extracted from the X-Tenant-Id header.\n\n**Idempotent**\
        \ \u2014 returns `200` even if no active OTP exists for the given `referenceId`\n\
        (already expired, already verified, or never existed).\n"
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpInvalidateRequest'
            example:
              referenceId: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
      responses:
        '200':
          description: OTP invalidated or was already inactive.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpInvalidateResponse'
        '400':
          description: "Bad Request \u2014 missing or malformed fields, including a\
            \ non-UUID `referenceId` (`BadRequest`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: "Unauthorized \u2014 missing or invalid bearer token."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /resend:
    post:
      summary: Resend an OTP
      operationId: resendOtp
      tags:
      - OTP
      description: 'Resends the OTP for an existing OTP request.

        Depending on configuration, either sends the same OTP or generates a new one.


        `referenceId` is the UUID returned from the previous `/generate` call.

        `tenantId` is extracted from the X-Tenant-Id header.


        **Cooldown enforcement:** If the last OTP was sent within `cooldownSeconds`,

        the request is rejected with `429 OTP.ResendTooSoon`.


        **Rate limiting:** Subject to `maxResendsPerHour` from the resolved purpose
        config.


        **Pre-conditions:**

        - `referenceId` must be a valid UUID for an existing OTP record.

        - Identifier must not be in an active lockout period.

        - Cooldown window must have elapsed since the last send.

        - Resend rate limit must not be exceeded.

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
            examples:
              standard:
                summary: Resend login OTP
                value:
                  referenceId: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
              with_context:
                summary: Resend transaction OTP with new session binding
                value:
                  referenceId: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
                  metadata:
                    sessionId: sess-new-456
                    deviceId: device-001
      responses:
        '200':
          description: New OTP generated and dispatched successfully.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResendResponse'
        '400':
          description: "Bad Request \u2014 missing or malformed fields, a non-UUID\
            \ `referenceId` (`BadRequest`), or the OTP was already verified and cannot\
            \ be resent (`OTP.AlreadyVerified`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: "Unauthorized \u2014 missing or invalid bearer token."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: "Not Found \u2014 referenceId does not exist (`OTP.NotFound`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '410':
          description: "Gone \u2014 OTP has expired (`OTP.Expired`) or was invalidated\
            \ (`OTP.Invalid`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '423':
          description: "Locked \u2014 identifier is in an active lockout period or the\
            \ OTP is locked (`OTP.Locked`)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: "Too Many Requests.\nTwo distinct conditions \u2014 differentiated\
            \ by the `code` field:\n- `OTP.ResendTooSoon`: Cooldown window has not\
            \ elapsed since the last generate or resend; the body carries `retryAfter`\
            \ seconds.\n- `OTP.MaxResendExceeded`: `maxResendsPerHour` limit reached\
            \ for this identifier.\nNo `Retry-After` response header is sent.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OtpError'
              examples:
                cooldown_active:
                  summary: Cooldown window not elapsed
                  value:
                    - code: OTP.ResendTooSoon
                      message: Please wait before requesting another OTP.
                      retryAfter: 45
                rate_limit_exceeded:
                  summary: Hourly resend limit reached
                  value:
                    - code: OTP.MaxResendExceeded
                      message: Resend limit reached for this identifier.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    UserIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Provide a unique value to prevent duplicate operations on retries.

        For `/generate`: if an active OTP exists within cooldown for the same

        (tenantId, identifier, purpose), `429 OTP.ResendTooSoon` is returned.

        '
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
  schemas:
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
    OtpError:
      description: Error element used on 429 responses; extends the common Error with
        the OTP service's own retry fields.
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          retryAfter:
            type: integer
            description: Seconds until the action may be retried. Present on `OTP.ResendTooSoon`.
            example: 45
          remainingAttempts:
            type: integer
            description: Remaining verify attempts, when applicable.
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    OtpPurpose:
      type: string
      enum:
      - login
      - transaction
      - forgot-password
      - phone-verify
      - registration
      description: 'The business reason for the OTP.

        - **login**: User authentication flow.

        - **transaction**: High-value or sensitive transaction confirmation.

        - **forgot-password**: Password reset flow.

        - **phone-verify**: Mobile number ownership verification.

        - **registration**: New user registration verification.

        '
    OtpLength:
      type: integer
      enum:
      - 4
      - 6
      - 8
      description: Number of digits in the generated OTP.
      default: 6
    OtpConfig:
      type: object
      description: "OTP configuration for a specific purpose under a tenant.\nControls\
        \ OTP strength, validity, rate limiting, and lockout behaviour.\nAll fields\
        \ are concrete \u2014 no inheritance or nulls in the stored/returned record.\n"
      required:
      - purpose
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier (UUID) for this config record.
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        otpLength:
          $ref: '#/components/schemas/OtpLength'
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 300
          description: "How long the OTP is valid after generation (seconds).\nMust\
            \ be greater than `cooldownSeconds`.\nThe JWT `exp` claim and Redis TTL\
            \ are both set from this value at generation time \u2014 they are always\
            \ identical.\n"
          example: 600
        cooldownSeconds:
          type: integer
          minimum: 15
          maximum: 600
          default: 120
          description: 'Minimum seconds the caller must wait before a resend is allowed.

            Must be strictly less than `ttlSeconds`.

            '
          example: 60
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: 'Number of failed verify attempts allowed before the OTP is
            locked

            and the identifier enters a lockout period.

            '
          example: 5
        lockoutSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: 'Duration (seconds) for which the identifier is locked after
            `maxAttempts` failed attempts.

            During lockout `/generate` returns `429 OTP.Locked` and `/resend` returns `423 OTP.Locked`.

            '
          example: 900
        maxGeneratesPerHour:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Maximum OTPs that can be generated per identifier per hour
            (sliding window).
          example: 5
        maxResendsPerHour:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: 'Maximum resend requests per identifier per hour (sliding window).

            Must be less than or equal to `maxGeneratesPerHour`.

            '
          example: 3
        isActive:
          type: boolean
          description: 'Whether this purpose is active for this tenant.

            If `false`, `/generate` returns `400 Config.Disabled`.

            '
          example: true
          default: true
        contextBindingRequired:
          type: boolean
          description: 'Stored with the config but currently has no effect: the service
            does not require or check `sessionId` on `/generate` or `/verify`.
            Omitted from responses when `false`.

            '
          example: false
          default: false
        version:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Server-managed version, incremented on every update. Omitted
            from responses while `0`.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
      x-businessRules:
      - cooldownSeconds must be strictly less than ttlSeconds.
      - maxResendsPerHour must be less than or equal to maxGeneratesPerHour.
      - otpLength must be one of 4, 6, or 8.
      - "purpose is immutable after creation \u2014 use DELETE and re-create to change\
        \ it."
    OtpGenerateRequest:
      type: object
      description: Request payload to generate an OTP for an identifier and purpose.
      required:
      - identifier
      - purpose
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 512
          description: "Identifier of the subject requesting the OTP.\n\nTwo accepted\
            \ formats:\n- **Bare value** (auto-detected): pass a plain email address\
            \ or phone number.\n  `user@example.com` \u2192 treated as email type (contains\
            \ `@`).\n  `+919876543210` \u2192 treated as mobile type.\n- **Prefixed**\
            \ `{type}:{value}`: explicit type declaration.\n  Supported types: `mobile`\
            \ and `email` only; any other prefix is a `400 BadRequest`.\n  Examples:\
            \ `mobile:+919876543210`, `email:user@example.com`\n"
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        metadata:
          type: object
          description: 'Optional caller-supplied context for the OTP.

            Max 5 key-value string pairs (a non-string value is a `400`). Passed to
            the audit log and `otp.generated` event. Not interpreted by the service;
            `sessionId` is not bound to the OTP.

            '
          additionalProperties:
            type: string
          maxProperties: 5
          example:
            sessionId: sess-abc123
            deviceId: device-001
    OtpGenerateResponse:
      type: object
      description: Response returned after successful OTP generation.
      properties:
        referenceId:
          type: string
          format: uuid
          description: 'Unique identifier (UUID) for this OTP request.

            Submit this on `/verify`, `/invalidate`, and `/resend`.

            This ID is used to look up the OTP record in the database.

            '
          example: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        expiresIn:
          type: integer
          description: Seconds until this OTP expires.
          example: 600
        cooldownSeconds:
          type: integer
          description: Minimum seconds to wait before calling `/resend`.
          example: 60
    OtpVerifyRequest:
      type: object
      description: Request payload to verify a submitted OTP.
      required:
      - referenceId
      - otp
      - purpose
      properties:
        referenceId:
          type: string
          format: uuid
          description: 'The UUID returned by `/generate`.

            Used to look up the OTP record in the database.

            '
          example: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        otp:
          type: string
          minLength: 4
          maxLength: 8
          pattern: ^[0-9]{4,8}$
          description: 'The numeric OTP entered by the user.

            Length is validated against the `otpLength` from the resolved purpose
            config.

            '
          example: '482910'
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Accepted for forward compatibility but currently ignored:
            the service performs no session binding check.

            '
          example: sess-abc123
    OtpVerifyResponse:
      type: object
      description: Response returned after successful OTP verification.
      properties:
        verified:
          type: boolean
          description: Always `true` on a 200 response.
          example: true
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
    OtpInvalidateRequest:
      type: object
      description: 'Request payload to invalidate an active OTP.

        `referenceId` is the UUID returned from `/generate`.

        `tenantId` is extracted from the X-Tenant-Id header.

        '
      required:
      - referenceId
      properties:
        referenceId:
          type: string
          format: uuid
          description: 'The UUID returned by `/generate`.

            Used to look up the OTP record in the database.

            '
          example: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
    OtpInvalidateResponse:
      type: object
      description: Response returned after an invalidation attempt.
      properties:
        invalidated:
          type: boolean
          description: '`true` if the referenceId was found and its OTP marked invalid
            (whatever its previous status).

            `false` if no OTP record exists for the referenceId.

            '
          example: true
        purpose:
          type: string
          description: Purpose of the invalidated OTP; an empty string when `invalidated`
            is `false`.
          example: login
    OtpResendRequest:
      type: object
      description: 'Request payload to resend an OTP.

        `referenceId` is the UUID returned from the previous `/generate` call.

        `tenantId` is extracted from the X-Tenant-Id header.

        '
      required:
      - referenceId
      properties:
        referenceId:
          type: string
          format: uuid
          description: 'The UUID returned by the previous `/generate` call.

            Used to look up the OTP record in the database.

            '
          example: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        metadata:
          type: object
          description: 'Optional caller-supplied context for the resend.

            Max 5 key-value string pairs. Passed to the audit log and `otp.generated`
            event.

            '
          additionalProperties:
            type: string
          maxProperties: 5
          example:
            sessionId: sess-new-456
            deviceId: device-001
    OtpResendResponse:
      type: object
      description: Response returned after a successful OTP resend.
      properties:
        referenceId:
          type: string
          format: uuid
          description: 'Same UUID as the request - the referenceId does not change
            on resend.

            '
          example: 8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        expiresIn:
          type: integer
          description: Seconds until the OTP expires.
          example: 600
        cooldownSeconds:
          type: integer
          description: Minimum seconds to wait before calling `/resend` again.
          example: 60
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
