openapi: 3.0.3
info:
  title: Boundary Service
  description: Boundary service APIs - to create, search and update boundaries along
    with APIs for establishing relationships between boundaries. This service supports
    n-level hierarchical boundary data.
  contact:
    name: eGov
    email: info@egovernments.org
  version: 3.0.0
servers:
- url: /boundary/v3
  description: Relative path for all environments
security:
- BearerAuth: []
paths:
  /boundaries:
    get:
      tags:
      - Boundary Entities
      summary: API endpoint to search boundary entities.
      operationId: searchBoundaries
      description: 'Provides a list of boundary entities based on the provided search
        criteria.

        '
      parameters:
      - name: codes
        in: query
        description: unique list of boundary codes.
        style: form
        explode: false
        required: true
        schema:
          type: array
          items:
            type: string
            format: varchar
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: Number of results to skip
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Successful Response.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BoundaryResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication token.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Boundary Entities
      summary: API endpoint to create Boundary.
      operationId: createBoundary
      description: 'Provides functionality to create boundary data.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoundaryRequest'
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '201':
          description: Boundary created successfully.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BoundaryResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication token.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
  /boundaries/{id}:
    put:
      tags:
      - Boundary Entities
      summary: API endpoint to update Boundary.
