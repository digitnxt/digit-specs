        '500':
          description: Internal server error.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
  /relationship/{id}:
    put:
      tags:
      - Boundary Relationships
      summary: API endpoint to update relationships between boundaries.
      operationId: updateBoundaryRelationship
      description: 'Provides functionality to update relationships between boundaries.

        '
      parameters:
      - name: id
        in: path
        description: Relationship ID
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoundaryRelation'
      responses:
        '200':
          description: Relationship updated successfully.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BoundaryRelationshipResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication token.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Relationship not found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
  schemas:
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
    Geometry:
      type: object
      properties:
        type:
          type: string
          enum:
          - Polygon
          - Point
          - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
    Boundary:
      required:
      - code
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: read-only db entity uuid.
        code:
          type: string
          description: code of the boundary.
        geometry:
          $ref: '#/components/schemas/Geometry'
        additionalAttributes:
          type: object
          description: Additional attributes for the boundary
        requestId:
          type: string
          description: Request ID for tracking
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    EnrichedBoundary:
      type: object
      properties:
        id:
          type: string
          description: Boundary entity uuid.
        code:
          type: string
          description: code of the boundary.
        boundaryType:
          type: string
          description: type of the boundary.
        children:
          type: array
          items:
            $ref: '#/components/schemas/EnrichedBoundary'
          description: children boundaries of the current boundary
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    BoundaryRelation:
      required:
      - code
      - hierarchyType
      - boundaryType
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: read-only db entity uuid.
        code:
          type: string
          description: Code of the boundary.
        hierarchyType:
          type: string
          description: Code of the hierarchy type for which boundary relationship
            is being created.
        boundaryType:
          type: string
          description: Boundary type from master data.
        parent:
          type: string
          description: Parent boundary code.
        ancestralMaterializedPath:
          type: string
          description: Materialized path representing the ancestral hierarchy
        requestId:
          type: string
          description: Request ID for tracking
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    HierarchyRelation:
      type: object
      properties:
        hierarchyType:
          type: string
          description: Hierarchy type from master data
        boundary:
          type: array
          items:
            $ref: '#/components/schemas/EnrichedBoundary'
          description: Root boundaries in the hierarchy
    BoundaryRelationshipRequest:
      type: object
      properties:
        boundaryRelationship:
          $ref: '#/components/schemas/BoundaryRelation'
    BoundaryRelationshipResponse:
      type: object
      properties:
        relationship:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryRelation'
    BoundarySearchResponse:
      type: object
      properties:
        tenantBoundary:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyRelation'
    BoundaryTypeHierarchy:
      type: object
      properties:
        id:
          type: string
          description: UUID
        boundaryType:
          type: string
          description: boundary type code.
        parentBoundaryType:
          type: string
          nullable: true
          description: unique code for parent boundary. Null for root level.
        active:
          type: boolean
          description: attribute that defines if the given boundary hierarchy is active
            or not
    BoundaryTypeHierarchyResponse:
      type: object
      properties:
        hierarchy:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryHierarchyDefinition'
    BoundaryHierarchyDefinition:
      type: object
      properties:
        id:
          type: string
          description: UUID of the hierarchy definition
        hierarchyType:
          type: string
          description: Hierarchy type from master data
        boundaryHierarchy:
          type: array
          items:
            $ref: '#/components/schemas/BoundaryTypeHierarchy'
        requestId:
          type: string
          description: Request ID for tracking
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    BoundaryHierarchyRequest:
      type: object
      properties:
        boundaryHierarchy:
          $ref: '#/components/schemas/BoundaryHierarchyDefinition'
    BoundaryRequest:
      type: object
      required:
      - boundary
      properties:
        boundary:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
    BoundaryResponse:
      type: object
      properties:
        boundary:
          type: array
          items:
            $ref: '#/components/schemas/Boundary'
    ShapefileBoundaryCreateRequest:
      type: object
      required:
      - fileStoreIds
      properties:
        fileStoreIds:
          type: array
          items:
            type: string
          description: List of file store IDs for the shapefile components (.shp,
            .shx, .dbf, .prj)
        uniqueCodeField:
          type: string
          description: Field name in the shapefile to use as the unique boundary code
    ShapefileBoundaryCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Boundaries created successfully
        count:
          type: integer
          example: 10
