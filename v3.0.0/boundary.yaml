            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BoundaryTypeHierarchyResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication token.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Hierarchy Definition
      summary: API endpoint to search boundary hierarchy.
      operationId: searchBoundaryHierarchy
      description: 'Provides boundary type hierarchy based on the provided search
        criteria.

        '
      parameters:
      - name: hierarchyType
        in: query
        description: Search by hierarchy type.
        required: true
        schema:
          minLength: 1
          maxLength: 256
          type: string
          format: varchar
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Successful Response.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BoundaryTypeHierarchyResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication token.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          headers:
            Retry-After:
              schema:
