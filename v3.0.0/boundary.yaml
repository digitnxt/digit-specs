              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Boundary Relationships
      summary: API endpoint to search linked boundaries.
      operationId: searchBoundaryRelationships
      description: 'Provides functionality to search linked boundaries based on the
        provided search criteria

        '
      parameters:
      - name: hierarchyType
        in: query
        description: Type Of the BoundaryType Like REVENUE, ADMIN
        schema:
          minLength: 1
          maxLength: 128
          type: string
          format: varchar
      - name: boundaryType
        in: query
        description: boundary type within the tenant boundary structure.
        schema:
          minLength: 1
          maxLength: 64
          type: string
          format: varchar
      - name: codes
        in: query
        description: unique List of boundary codes.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: varchar
      - name: parent
        in: query
        description: parent boundary code.
        schema:
          type: string
      - name: includeChildren
        in: query
        description: boolean flag to inform the service if children need to be part
          of search.
        required: false
        schema:
          type: boolean
      - name: includeParents
        in: query
        description: boolean flag to inform the service if parents need to be part
          of search.
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of results to return
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: Number of results to skip
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Successful Response.
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
