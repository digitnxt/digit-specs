      properties:
        employeeStatus:
          type: string
          minLength: 1
          maxLength: 64
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 10
          maxLength: 20
        emailId:
          type: string
          format: email
          minLength: 5
          maxLength: 256
        isActive:
          type: boolean
    EmployeeResponse:
      type: object
      required:
      - id
      - isActive
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        code:
          type: string
          description: Employee code
        userId:
          type: string
          description: User ID reference
        individualId:
          type: string
          description: Individual ID reference
        status:
          type: string
          description: Employee status
        employeeType:
          type: string
          description: Type of employee
        dateOfAppointment:
          type: string
          format: date-time
          description: Date of appointment
        department:
          type: string
          description: Department
        designation:
          type: string
          description: Designation
        isActive:
          type: boolean
          description: Active status
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
          description: Associated jurisdictions
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
