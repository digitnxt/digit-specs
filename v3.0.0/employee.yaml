      type: object
      required:
      - employees
      - totalCount
      - page
      - size
      - hasMore
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
