openapi: 3.0.3

info:
  title: Employee Service API
  version: 3.0.0
  description: |
    REST APIs for managing Employees and their Jurisdiction assignments
    within the DIGIT platform.

    The module is organized into two resource groups:

    **Employees**
    Lifecycle management of staff members — create, read, update, patch,
    deactivate, reactivate, and hard-delete. An employee record links a
    platform user (`userId`) and an individual profile (`individualId`) to a
    department, designation, and employment type within a tenant.

    **Jurisdictions**
    Geographical area assignments that scope an employee's operational authority.
    Each jurisdiction record binds one employee to one or more boundaries,
    each identified by a `code`, `boundaryType` and `hierarchyType` (e.g., ward, block,
    district). An employee may hold multiple active jurisdiction records concurrently.

    **Key structural concepts:**

    | Concept | Description |
    |---|---|
    | `code` | Human-readable employee identifier. Auto-generated if omitted. Immutable after creation. |
    | `userId` | Reference to the platform User record (authentication identity). |
    | `individualId` | Reference to the Individual profile record (demographic data). |
    | `employeeType` | Classification of the employment arrangement (e.g., PERMANENT, CONTRACT, DEPUTATION). |
    | `boundaryRelation` | Array of `{ code, boundaryType, hierarchyType }` objects defining the geographic scope of a jurisdiction. |

    `X-Tenant-ID` and `X-User-ID` are derived from the bearer token and must not be
    sent in request bodies.

    **Envelope dialect**

    Every path is also served under `/v3/canonical` with identical validation,
    status codes and error bodies. Request context moves into the body —
    `RequestMetadata.tenantId` → `X-Tenant-ID`, `RequestMetadata.userInfo.uuid` →
    `X-User-ID` — with the domain payload under `data`, and responses become
    `{"ResponseMetadata": {…}, "data": <body>}`. `Authorization` stays a header.

servers:
  - url: https://test-lts.digit.org/employee/v3
    description: Production
  - url: http://localhost:8080/employee/v3
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Employee
    description: |
      Lifecycle management of staff members within a tenant.
      Covers create, read, search, update, patch, deactivate, reactivate, and hard-delete.
  - name: Jurisdiction
    description: |
      Managing employee assignments to geographical boundary areas.
      Covers create, read, search, and replace.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — COLLECTION
  # ══════════════════════════════════════════════════════════════════════════════

  /employees:

    post:
      summary: Create employees
      operationId: createEmployees
      tags: [Employee]
      description: |
        Registers one or more new employees for the calling tenant.
        If `code` is omitted (or blank) it is auto-generated by the server.

        **Batch semantics:** The request accepts 1–100 employee records and is
        processed **record by record** — there is no all-or-nothing rollback.
        Each record is validated, checked against its dependencies (Keycloak
        user, individual, boundary relations) and then inserted together with
        its own jurisdictions in a short transaction of its own. The call
        answers `200` whatever the per-record outcomes: the body lists every
        record in request order with `status: CREATED` (and the employee) or
        `status: FAILED` (and an `error` with `code`/`message`, e.g.
        `VALIDATION_ERROR`, `INVALID_REQUEST`, `EMPLOYEE_EXISTS`,
        `INTERNAL_ERROR`). A duplicate `code`, or a `userId` / `individualId`
        that already has an employee in the tenant (or appears in an earlier
        record of the same batch), therefore surfaces as a FAILED result with
        `EMPLOYEE_EXISTS` — not as an HTTP `409`.

        When `individualId` is supplied and the individual service knows the
        individual's user, the employee takes that user as `userId`; a
        `userId` that differs from it fails the record (`INVALID_REQUEST`).

        The whole call fails (nothing written) only for a malformed or empty
        body, an empty array or more than 100 records (`400 INVALID_REQUEST`),
        an `individualId` the individual service rejects (`400 INVALID_REQUEST`),
        a dependency fault (`502 DOWNSTREAM_ERROR`), or a missing idgen template
        (`500 IDGEN_TEMPLATE_NOT_FOUND`). Codes are generated only for records
        that passed every check, so rejected records consume no sequence numbers.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/EmployeeCreateRequest'
            examples:
              fullEmployeeWithJurisdictions:
                summary: Permanent employee with every field set, including a jurisdiction
                value:
                  - userId: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                    individualId: 8c8c6532-c282-48fd-9fde-dd003bf01ac7
                    employeeType: PERMANENT
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    dateOfAppointment: "2025-01-01"
                    status: EMPLOYED
                    isActive: true
                    jurisdictions:
                      - boundaryRelation:
                          - code: STATE33d
                            boundaryType: state
                            hierarchyType: state-district-city
                        isActive: true
              singlePermanentEmployee:
                summary: Single permanent employee with full fields
                value:
                  - code: EMP-NBO-0042
                    userId: usr-uuid-001
                    individualId: ind-uuid-001
                    employeeType: PERMANENT
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    dateOfAppointment: "2022-06-01"
                    isActive: true
              contractEmployeeCodeOmitted:
                summary: Contract employee — code auto-generated
                value:
                  - userId: usr-uuid-002
                    individualId: ind-uuid-002
                    employeeType: CONTRACT
                    department: PUBLIC_HEALTH
                    designation: FIELD_INSPECTOR
                    dateOfAppointment: "2024-01-15"
                    isActive: true
      responses:
        '200':
          description: |
            Batch processed. One result per submitted record, in request order;
            `created` + `failed` = number of records. Inspect each result's
            `status` — a `200` does not mean every record was created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreateBatchResponse'
              examples:
                mixedOutcome:
                  summary: Two records — the first created (code auto-generated, with jurisdiction), the second rejected as a duplicate
                  value:
                    created: 1
                    failed: 1
                    results:
                      - index: 0
                        status: CREATED
                        employee:
                          id: 50843605-23cb-4b6d-b246-6da77d172756
                          code: EMP-PGG-00008
                          userId: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                          individualId: 8c8c6532-c282-48fd-9fde-dd003bf01ac7
                          status: EMPLOYED
                          employeeType: PERMANENT
                          dateOfAppointment: "2025-01-01"
                          department: FINANCE
                          designation: ACCOUNTS_OFFICER
                          isActive: true
                          version: 1
                          jurisdictions:
                            - id: 538f4d95-da67-4b6e-a555-f1ba464a98aa
                              employeeId: 50843605-23cb-4b6d-b246-6da77d172756
                              boundaryRelation:
                                - code: STATE33d
                                  boundaryType: state
                                  hierarchyType: state-district-city
                              isActive: true
                              version: 1
                              auditDetail:
                                createdBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                                modifiedBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                                createdTime: 1780478075753
                                modifiedTime: 1780478075753
                          auditDetail:
                            createdBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                            modifiedBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                            createdTime: 1780478075749
                            modifiedTime: 1780478075749
                      - index: 1
                        status: FAILED
                        error:
                          code: EMPLOYEE_EXISTS
                          message: Employee code already exists
        '400':
          description: |
            The whole request was rejected and nothing was written: empty or
            malformed body, an empty array or more than 100 records
            (`INVALID_REQUEST`), a `dateOfAppointment` that is not `YYYY-MM-DD`
            (`INVALID_REQUEST`), an `individualId` the individual service
            rejects (`INVALID_REQUEST`), or a database constraint the data broke
            (`QUERY_EXECUTION_ERROR`). Per-record validation failures are not
            reported here — they are `FAILED` results inside the `200` body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: |
            Internal server error — `IDGEN_TEMPLATE_NOT_FOUND` when the tenant has
            no idgen template for employee codes (retrying cannot succeed until it
            is created), `DATABASE_ERROR` when the database is unreachable or a
            statement fails.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — a service this
            request depends on (boundary, keycloak, individual, or idgen) did not
            respond successfully. Fails the whole batch before anything is
            written. Not the client's fault; retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: Search / list employees
      operationId: searchEmployees
      tags: [Employee]
      description: |
        Returns one page of employees for the calling tenant, wrapped in a
        paging envelope (`totalCount`, `limit`, `offset`, `hasMore`,
        `employees`). Results are scoped to the `tenantId` resolved from the
        X-Tenant-Id header and ordered by creation time, newest first. Each
        employee carries its full jurisdiction collection inline.

        All filters are optional and AND-composed. Multi-value filters use
        IN-match semantics via repeated query parameters —
        e.g. `?statuses=ACTIVE&statuses=ON_LEAVE` matches employees whose
        status is either `ACTIVE` or `ON_LEAVE`.

        Filters on data held by other services (`name`, `email` → individual
        service; `role` → Keycloak) are resolved to ids first and then applied
        in the employee query, so paging is over the fully filtered set. A
        filter nobody matches returns an empty page without querying the
        database. `include` adds data from those services to the returned
        page only.

        `limit` and `offset` are parsed from their raw text: a non-numeric
        value (or one outside the 32-bit integer range) is `400 INVALID_REQUEST`;
        a numeric value outside the documented bounds is `400 VALIDATION_ERROR`.
        A malformed `isActive`, `dateOfAppointmentFrom` / `dateOfAppointmentTo`
        is `400 INVALID_REQUEST`; a non-UUID entry in `ids` is `400 INVALID_UUID`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: ids
          in: query
          required: false
          description: Filter by one or more employee UUIDs (IN match).
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: codes
          in: query
          required: false
          description: Filter by one or more employee codes (IN match).
          schema:
            type: array
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
        - name: userIds
          in: query
          required: false
          description: |
            Filter by one or more platform user ids (IN match) — the `userId` each
            employee record links to.

            Keycloak identifiers are not required to be UUIDs, so only emptiness and
            length are enforced; a blank entry in the list is rejected with `400`.
          schema:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 64
          style: form
          explode: true
          example: [0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f]
        - name: statuses
          in: query
          required: false
          description: Filter by one or more employment status labels (IN match).
          schema:
            type: array
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
        - name: employeeTypes
          in: query
          required: false
          description: Filter by one or more employment types (IN match).
          schema:
            type: array
            items:
              type: string
              maxLength: 128
          style: form
          explode: true
        - name: departments
          in: query
          required: false
          description: Filter by one or more departments (IN match).
          schema:
            type: array
            items:
              type: string
              maxLength: 128
          style: form
          explode: true
        - name: designations
          in: query
          required: false
          description: Filter by one or more designations (IN match).
          schema:
            type: array
            items:
              type: string
              maxLength: 128
          style: form
          explode: true
        - name: role
          in: query
          required: false
          description: |
            Filter by a Keycloak realm role. Employees carry no role column — the
            role is resolved against Keycloak to its member user IDs and matched
            on user_id, composed with the other filters.

            This is the only filter that needs a bearer token: supplying `role`
            without `Authorization` returns `401`. A Keycloak lookup failure is
            `502`.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: name
          in: query
          required: false
          description: |
            Contains-match on the given name of the individual linked to each
            employee (`individualId`). Resolved through the individual service
            to a set of individual ids, then matched on `individual_id`. Blank
            or longer than 128 characters is `400 VALIDATION_ERROR`; a filter
            matching more than 500 individuals is rejected with
            `400 VALIDATION_ERROR` asking to refine it; an individual-service
            failure is `502 DOWNSTREAM_ERROR`.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: email
          in: query
          required: false
          description: |
            Contains-match on the email of the individual linked to each
            employee. Resolved and bounded exactly like `name` (max 254
            characters, at most 500 matched individuals).
          schema:
            type: string
            minLength: 1
            maxLength: 254
        - name: dateOfAppointmentFrom
          in: query
          required: false
          description: |
            Lower bound (inclusive) on dateOfAppointment. Strictly `YYYY-MM-DD` —
            any other form (including a timestamp) is `400 INVALID_REQUEST`.
          schema:
            type: string
            format: date
        - name: dateOfAppointmentTo
          in: query
          required: false
          description: |
            Upper bound (inclusive) on dateOfAppointment. Strictly `YYYY-MM-DD` —
            any other form (including a timestamp) is `400 INVALID_REQUEST`.
          schema:
            type: string
            format: date
        - name: isActive
          in: query
          required: false
          description: Filter by active status.
          schema:
            type: boolean
        - name: include
          in: query
          required: false
          description: |
            Data from other services to add to each returned employee.
            Repeatable (`?include=individual&include=roles`) or comma-separated.
            `individual` fills `individual` (given name, family name, email)
            from the individual service; `roles` fills `roles` with the
            employee's Keycloak realm roles — this one reads the same Keycloak
            data as `role` and follows the same rule: without `Authorization`
            it is `401`. An unknown value is `400 VALIDATION_ERROR`; a lookup
            failure is `502 DOWNSTREAM_ERROR`. An employee whose user or
            individual the other service does not know simply gets no
            `roles` / `individual`.
          schema:
            type: array
            items:
              type: string
              enum: [individual, roles]
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of records to return. Non-numeric is
            `400 INVALID_REQUEST`; outside 1..100 is `400 VALIDATION_ERROR`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          description: |
            Number of records to skip (for pagination). Non-numeric or beyond
            the 32-bit range is `400 INVALID_REQUEST`; negative is
            `400 VALIDATION_ERROR`.
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        '200':
          description: One page of employees with paging metadata.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSearchResponse'
              example:
                totalCount: 1
                limit: 10
                offset: 0
                hasMore: false
                employees:
                  - id: 50843605-23cb-4b6d-b246-6da77d172756
                    code: EMP-PGG-00008
                    userId: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                    roles: [EMPLOYEE]
                    individualId: 8c8c6532-c282-48fd-9fde-dd003bf01ac7
                    individual:
                      givenName: Aisha
                      familyName: Khan
                      email: aisha.khan@corp.example
                    status: EMPLOYED
                    employeeType: PERMANENT
                    dateOfAppointment: "2025-01-01"
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    isActive: true
                    version: 1
                    auditDetail:
                      createdBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                      modifiedBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                      createdTime: 1780478075749
                      modifiedTime: 1780478075749
        '400':
          description: |
            Bad request — invalid query parameter values (`INVALID_REQUEST`,
            `VALIDATION_ERROR`, `INVALID_UUID`), or a `name`/`email` filter that
            matches more than 500 individuals (`VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — the individual
            service (`name`, `email`, `include=individual`) or Keycloak (`role`,
            `include=roles`) did not respond successfully. Not the client's
            fault; retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — ONBOARDING
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/onboard:

    post:
      summary: Onboard an employee (login user + individual + employee)
      operationId: onboardEmployee
      tags: [Employee]
      description: |
        Creates a login user, an individual profile and an employee record in one
        call, linked by the new user's id.

        `userId` and `individualId` are not accepted — the server injects the new
        user's id into both the individual and the employee. The username is
        `user.mobileNumber`; the password is set as supplied and never returned.

        The token is forwarded to Keycloak, so a caller can only assign roles it is
        permitted to grant. Requested roles are checked to exist before anything is
        created:

        | Step | On failure |
        |---|---|
        | 1. Create the Keycloak user | nothing to undo |
        | 2. Assign realm roles | the user is deleted |
        | 3. Create the individual | the user is deleted |
        | 4. Create the employee | the individual is soft-deleted, then the user is deleted |

        Compensation is best-effort; a failure is reported with the status of the
        step that failed.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardRequest'
            examples:
              full:
                summary: Every field — user, individual and employee with a jurisdiction
                value:
                  user:
                    mobileNumber: "9812345678"
                    password: Secret@123
                    email: aisha.khan@corp.example
                    firstName: Aisha
                    lastName: Khan
                    emailVerified: false
                    roles: [EMPLOYEE]
                  individual:
                    givenName: Aisha
                    familyName: Khan
                    gender: FEMALE
                    mobileNumber: "9812345678"
                    email: aisha.khan@corp.example
                    identifiers:
                      - identifierType: PAN
                        identifierId: ABCDE1234F
                  employee:
                    employeeType: PERMANENT
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    dateOfAppointment: "2025-01-01"
                    status: EMPLOYED
                    isActive: true
                    jurisdictions:
                      - boundaryRelation:
                          - code: STATE33d
                            boundaryType: state
                            hierarchyType: state-district-city
                        isActive: true
              minimal:
                summary: Required fields only
                value:
                  user:
                    mobileNumber: "9812345678"
                    password: Secret@123
                  individual:
                    givenName: Aisha
                    gender: FEMALE
                  employee:
                    employeeType: PERMANENT
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    isActive: true
                    jurisdictions: []
      responses:
        '201':
          description: All three records created and linked.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardResponse'
              example:
                user:
                  id: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                  username: "9812345678"
                  roles: [EMPLOYEE]
                individual:
                  id: 8c8c6532-c282-48fd-9fde-dd003bf01ac7
                  individualId: IND-PUNECITY-00107
                  givenName: Aisha
                  familyName: Khan
                  gender: FEMALE
                  mobileNumber: "9812345678"
                  isActive: true
                employee:
                  id: 50843605-23cb-4b6d-b246-6da77d172756
                  code: EMP-PUNECITY-00003
                  userId: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                  individualId: 8c8c6532-c282-48fd-9fde-dd003bf01ac7
                  status: EMPLOYED
                  employeeType: PERMANENT
                  dateOfAppointment: "2025-01-01"
                  department: FINANCE
                  designation: ACCOUNTS_OFFICER
                  isActive: true
                  version: 1
                  auditDetail:
                    createdBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                    modifiedBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                    createdTime: 1780478075749
                    modifiedTime: 1780478075749
        '400':
          description: |
            Validation error — a missing `user`, `individual` or `employee` block, a
            missing `user.mobileNumber` / `user.password`, a role that does not exist
            in the realm (`INVALID_REQUEST`), a user payload Keycloak rejects
            (`INVALID_REQUEST`), an individual payload the individual service rejects
            with 400/422 (`INVALID_REQUEST`), or an employee payload rejected by the
            `POST /employees` validation (`VALIDATION_ERROR`, `INVALID_REQUEST`).
            The employee step runs last, so an employee rejection is reported after
            the individual has been soft-deleted and the user deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: |
            The caller is not permitted to assign one of the requested roles. The
            Keycloak user created in step 1 is deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: |
            `CONFLICT` — a user with this mobile number or email already exists in
            Keycloak, or the individual service reports a conflict; or
            `EMPLOYEE_EXISTS` — the employee step found an employee already linked
            to the new user or individual.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: |
            Internal server error — `IDGEN_TEMPLATE_NOT_FOUND` (no employee-code
            template for the tenant), `DATABASE_ERROR`, `INTERNAL_ERROR`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — keycloak, individual,
            boundary or idgen did not respond successfully. Not the client's fault;
            retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — SINGLE RESOURCE
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}:

    get:
      summary: Get employee by ID
      operationId: getEmployee
      tags: [Employee]
      description: |
        Returns the full employee record for the given system-generated UUID.
        The record includes any associated jurisdiction assignments (active
        and inactive). Fields with no value are omitted from the body — see
        `EmployeeResponse`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - name: include
          in: query
          required: false
          description: |
            Data from other services to add to the employee, as on
            `GET /employees`: `individual` fills `individual` from the
            individual service, `roles` fills `roles` from Keycloak (needs
            `Authorization`, else `401`). Unknown value → `400 VALIDATION_ERROR`;
            lookup failure → `502 DOWNSTREAM_ERROR`.
          schema:
            type: array
            items:
              type: string
              enum: [individual, roles]
          style: form
          explode: true
      responses:
        '200':
          description: Employee returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid path UUID (`INVALID_UUID`) or missing required header.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — only reachable
            with `include`: the individual service or Keycloak did not respond
            successfully. Not the client's fault; retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Update employee (full-state)
      operationId: updateEmployee
      tags: [Employee]
      description: |
        Updates an existing employee with a **strict full-state declaration**.
        The request body must describe the complete post-update state —
        every mutable field (`employeeType`, `department`, `designation`,
        `status`, `isActive`, `jurisdictions`) plus the concurrency `version`
        is required.

        For partial updates (change one or two fields without re-stating
        the rest), use `PATCH /employees/{employeeId}` instead.

        **Order of checks:** the body is validated first (a missing or empty
        required field is `400 VALIDATION_ERROR` even when the employee does
        not exist), then the employee is loaded (`404 NOT_FOUND`), then the
        version is compared, then the jurisdiction array is validated —
        boundary-service lookups included — and only then is anything written.

        **Optimistic concurrency:** `version` (the value last read) is required.
        It is compared for equality with the stored version — any other value
        (including `0` or a negative number) is rejected with 409
        `ROW_VERSION_MISMATCH`; on success the version is bumped by 1. No row
        lock is held.

        **Jurisdictions** are required in the body and **reconciled** against
        the current collection (not replace-on-set): an entry with `id` +
        `version` updates that jurisdiction in place, an id-less entry inserts a
        new one, and any existing active jurisdiction omitted from the array is
        deactivated (its own version bumped). Supply `[]` to deactivate the
        whole collection. See `JurisdictionUpsertRequest`. This path is guarded
        by the **employee** version; each in-place jurisdiction update is
        additionally guarded by that jurisdiction's own version. The employee
        row and every jurisdiction write commit in one transaction.

        **Immutable fields** (`id`, `code`, `userId`, `individualId`,
        `dateOfAppointment`, `tenantId`, `auditDetail`) are silently ignored
        if included in the body — they cannot be changed via this endpoint.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
            examples:
              fullStateUpdate:
                summary: Full-state PUT — update one jurisdiction in place, insert one, drop the rest
                value:
                  version: 3
                  employeeType: PERMANENT
                  department: FINANCE
                  designation: SENIOR_ACCOUNTS_OFFICER
                  status: ACTIVE
                  isActive: true
                  jurisdictions:
                    - id: f1e2d3c4-b5a6-7890-fedc-ba0987654321
                      version: 2
                      boundaryRelation:
                        - code: WARD-NBO-001
                          boundaryType: Ward
                          hierarchyType: ADMIN
                      isActive: true
                    - boundaryRelation:
                        - code: WARD-NBO-002
                          boundaryType: Ward
                          hierarchyType: ADMIN
                      isActive: true
              clearJurisdictions:
                summary: Replace state and deactivate all jurisdictions
                value:
                  version: 4
                  employeeType: CONTRACT
                  department: PUBLIC_HEALTH
                  designation: FIELD_INSPECTOR
                  status: ON_LEAVE
                  isActive: true
                  jurisdictions: []
      responses:
        '200':
          description: Employee updated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: |
            Validation error — empty/malformed body or a wrong-typed field
            (`INVALID_REQUEST`); a missing or empty required field, a
            jurisdiction entry with an `id` but no `version` (or `version: 0`),
            the same jurisdiction `id` listed twice, a duplicate or incomplete
            boundary relation, or a boundary relation the boundary service does
            not know (`VALIDATION_ERROR`); a non-UUID path id (`INVALID_UUID`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: '`NOT_FOUND` — employee not found, or a jurisdiction id in the body is not owned by this employee.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict — the employee (or a jurisdiction being updated in place)
            was modified since it was read: `ROW_VERSION_MISMATCH`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — the boundary
            service, consulted for every jurisdiction entry in the body, did not
            respond successfully. Not the client's fault; retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    patch:
      summary: Partially update employee
      operationId: patchEmployee
      tags: [Employee]
      description: |
        Partially updates an employee record. Every field on the request body
        is optional; only supplied fields are written, omitted fields preserve
        their existing DB value.

        At least one mutable field must be supplied — an empty body `{}` (or
        a body carrying only `version`) returns 400. The concurrency `version`
        is required in addition.

        **Mutable surface**: `status`, `employeeType`, `department`,
        `designation`, `isActive`, `jurisdictions`. Immutable fields
        (`id`, `code`, `userId`, `individualId`, `dateOfAppointment`,
        `tenantId`, `auditDetail`) cannot be changed and are silently
        ignored if supplied. Only maximum lengths are enforced on the string
        fields — an explicit empty string is written as-is.

        **Order of checks:** body first (`400`, even for a missing employee),
        then load (`404`), then version, then the jurisdiction array
        (boundary lookups included), then the write.

        **Optimistic concurrency:** `version` (the value last read) is required
        even on a partial update. It is compared for equality with the stored
        version — any other value (including `0`) returns 409
        `ROW_VERSION_MISMATCH`; on success it is bumped by 1.

        **Jurisdictions** are optional. When supplied, the collection is
        **reconciled** against the array (id+version → update in place, id-less
        → insert, omitted existing → deactivate; `[]` deactivates all). When
        omitted, the existing collection is preserved untouched. See
        `JurisdictionUpsertRequest`.

        For full-state declaration (declarative provisioners), use
        `PUT /employees/{employeeId}` instead.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeePatchRequest'
            examples:
              changeDepartmentOnly:
                summary: Change just the department (most common PATCH use)
                value:
                  version: 5
                  department: PUBLIC_HEALTH
              promoteAndRelabel:
                summary: Change designation + status together
                value:
                  version: 5
                  designation: SENIOR_ACCOUNTS_OFFICER
                  status: ACTIVE
              reconcileJurisdictions:
                summary: Update one jurisdiction in place and add a new one, leave other fields
                value:
                  version: 5
                  jurisdictions:
                    - id: f1e2d3c4-b5a6-7890-fedc-ba0987654321
                      version: 2
                      boundaryRelation:
                        - code: WARD-NBO-003
                          boundaryType: Ward
                          hierarchyType: ADMIN
                      isActive: true
                    - boundaryRelation:
                        - code: WARD-NBO-004
                          boundaryType: Ward
                          hierarchyType: ADMIN
                      isActive: true
              clearJurisdictions:
                summary: Deactivate all jurisdictions, preserve everything else
                value:
                  version: 5
                  jurisdictions: []
      responses:
        '200':
          description: Employee patched.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: |
            Validation error — empty/malformed body or a wrong-typed field
            (`INVALID_REQUEST`); no mutable field supplied, missing `version`,
            a field over its maximum length, a jurisdiction entry with an `id`
            but no `version` (or `version: 0`), the same jurisdiction `id`
            listed twice, a duplicate or incomplete boundary relation, or a
            boundary relation the boundary service does not know
            (`VALIDATION_ERROR`); a non-UUID path id (`INVALID_UUID`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: '`NOT_FOUND` — employee not found, or a jurisdiction id in the body is not owned by this employee.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: |
            Conflict — the employee (or a jurisdiction being updated in place)
            was modified since it was read: `ROW_VERSION_MISMATCH`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — the boundary
            service, consulted when `jurisdictions` is supplied, did not respond
            successfully. Not the client's fault; retry with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Hard-delete employee
      operationId: hardDeleteEmployee
      tags: [Employee]
      description: |
        Permanently and irreversibly deletes the employee record. Associated
        jurisdiction assignments are removed in the same operation via
        `ON DELETE CASCADE`.

        **This operation cannot be undone.** Prefer deactivation
        (`POST /employees/{employeeId}/deactivate`) for soft removal
        that preserves audit history.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '204':
          description: Employee deleted.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
        '400':
          description: Invalid path UUID (`INVALID_UUID`) or missing required header.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # EMPLOYEE — LIFECYCLE ACTIONS
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}/deactivate:

    post:
      summary: Deactivate employee
      operationId: deactivateEmployee
      tags: [Employee]
      description: |
        Soft-deactivates an active employee by setting `isActive = false`.
        The record and all associated jurisdiction assignments are retained
        in the database for audit purposes.

        Returns `409` if the employee is already inactive.

        Takes no request body. The employee's `version` is bumped by 1 on
        success (returned in the response) — no version token is required on the
        request; the already-inactive state guard prevents redundant transitions.

        The employee can be restored using `POST /employees/{employeeId}/reactivate`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Employee deactivated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
              examples:
                deactivated:
                  summary: Employee after deactivation
                  value:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    code: EMP-NBO-0042
                    userId: usr-uuid-001
                    individualId: ind-uuid-001
                    status: ACTIVE
                    employeeType: PERMANENT
                    dateOfAppointment: "2022-06-01"
                    department: FINANCE
                    designation: ACCOUNTS_OFFICER
                    isActive: false
                    version: 2
                    auditDetail:
                      createdBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                      modifiedBy: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
                      createdTime: 1780348693060
                      modifiedTime: 1780349115544
        '400':
          description: Invalid path UUID (`INVALID_UUID`) or missing required header.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found (`NOT_FOUND`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Employee is already inactive (`EMPLOYEE_ALREADY_INACTIVE`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /employees/{employeeId}/reactivate:

    post:
      summary: Reactivate employee
      operationId: reactivateEmployee
      tags: [Employee]
      description: |
        Restores a previously deactivated employee by setting `isActive = true`.

        Returns `409` if the employee is already active.

        Takes no request body. The employee's `version` is bumped by 1 on
        success (returned in the response) — no version token is required on the
        request; the already-active state guard prevents redundant transitions.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Employee reactivated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid path UUID (`INVALID_UUID`) or missing required header.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Employee is already active (`EMPLOYEE_ALREADY_ACTIVE`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # JURISDICTION — COLLECTION
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}/jurisdictions:

    post:
      summary: Create jurisdiction
      operationId: createJurisdiction
      tags: [Jurisdiction]
      description: |
        Creates a new jurisdiction assignment for the employee identified by
        `employeeId` in the path, binding the employee to one or more
        boundary relation codes. Created at `version` 1.

        The `boundaryRelation` array is checked structurally (at least one
        entry, every entry complete, no duplicate triple) and then against the
        boundary service before the insert; the employee's existence is only
        established by the insert itself, so an unknown employee is reported
        after the boundary checks.

        An employee may hold multiple active jurisdiction records concurrently
        (e.g., assigned to both ward-level and block-level boundaries).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionCreateRequest'
            examples:
              wardAssignment:
                summary: Assign employee to two ward-level boundaries
                value:
                  boundaryRelation:
                    - code: WARD-NBO-001
                      boundaryType: Ward
                      hierarchyType: ADMIN
                    - code: WARD-NBO-002
                      boundaryType: Ward
                      hierarchyType: ADMIN
                  isActive: true
      responses:
        '201':
          description: Jurisdiction created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: |
            Validation error — empty/malformed body or a wrong-typed field
            (`INVALID_REQUEST`); missing or empty `boundaryRelation`, an entry
            missing `code`/`boundaryType`/`hierarchyType`, a duplicate triple,
            or a relation the boundary service does not know
            (`VALIDATION_ERROR`); a non-UUID path id (`INVALID_UUID`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Referenced employee not found (`EMPLOYEE_NOT_FOUND`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — the boundary
            service did not respond successfully. Not the client's fault; retry
            with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List jurisdictions for an employee
      operationId: searchJurisdictions
      tags: [Jurisdiction]
      description: |
        Returns a paginated list of jurisdiction assignments belonging to the
        employee identified by `employeeId` in the path, as a bare JSON array
        (no paging envelope, no total). Results are scoped to the `tenantId`
        resolved from the X-Tenant-Id header and ordered by creation time,
        newest first.

        The employee's existence is not checked: an unknown (but well-formed)
        `employeeId` returns `200` with an empty array, not `404`.

        Remaining filters (`ids`, `isActive`) are optional. A non-UUID entry in
        `ids` is `400 INVALID_UUID`; a non-numeric `limit`/`offset` or a
        malformed `isActive` is `400 INVALID_REQUEST`; `limit`/`offset` outside
        their bounds is `400 VALIDATION_ERROR`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - name: ids
          in: query
          required: false
          description: Filter by one or more jurisdiction UUIDs (IN match).
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: isActive
          in: query
          required: false
          description: Filter by active status.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          description: Number of records to skip (for pagination).
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        '200':
          description: Jurisdiction list returned (empty when the employee has none or does not exist).
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: Bad request — invalid query parameter values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # JURISDICTION — SINGLE RESOURCE
  # ══════════════════════════════════════════════════════════════════════════════

  /employees/{employeeId}/jurisdictions/{jurisdictionId}:

    get:
      summary: Get jurisdiction by ID
      operationId: getJurisdiction
      tags: [Jurisdiction]
      description: |
        Returns the jurisdiction assignment record for the given UUID, scoped
        to the owning employee in the path. If a jurisdiction with the given
        UUID exists but belongs to a different employee, this endpoint
        returns 404 `NOT_FOUND` (the resource does not exist at this URL) —
        the same code as for a UUID that does not exist at all.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/JurisdictionIdPath'
      responses:
        '200':
          description: Jurisdiction returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: Invalid path UUID (`INVALID_UUID`) or missing required header.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Jurisdiction not found for this employee.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Update jurisdiction
      operationId: updateJurisdiction
      tags: [Jurisdiction]
      description: |
        Updates an existing jurisdiction assignment, scoped to the owning
        employee in the path.

        `boundaryRelation` is required and fully replaces the existing array
        (not merged). `isActive` is optional — when omitted the existing
        value is preserved, since jurisdictions have no dedicated
        deactivate/reactivate endpoints.

        **Optimistic concurrency:** `version` (the value last read for this
        jurisdiction) is required. It is compared for equality with the stored
        version — any other value (including `0`) returns 409
        `ROW_VERSION_MISMATCH`; on success it is bumped by 1.
        This version is **independent** of the owning employee's version:
        updating a jurisdiction here does not change the employee's version.

        **Order of checks:** the jurisdiction is loaded and its ownership
        checked first (`404 NOT_FOUND`), then `version` (missing → `400`,
        stale → `409`), and only then is `boundaryRelation` validated —
        structurally and against the boundary service — before the write.

        The jurisdiction's owning `employeeId` and `tenantId` are immutable
        and cannot be changed through this endpoint. If a jurisdiction with
        the given UUID exists but belongs to a different employee, this
        endpoint returns 404 — the resource does not exist at this URL.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EmployeeIdPath'
        - $ref: '#/components/parameters/JurisdictionIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionUpdateRequest'
            examples:
              updateBoundaries:
                summary: Replace boundaries on a jurisdiction (version required)
                value:
                  version: 2
                  boundaryRelation:
                    - code: WARD-NBO-001
                      boundaryType: Ward
                      hierarchyType: ADMIN
                    - code: WARD-NBO-003
                      boundaryType: Ward
                      hierarchyType: ADMIN
                  isActive: true
      responses:
        '200':
          description: Jurisdiction updated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: |
            Validation error — empty/malformed body or a wrong-typed field
            (`INVALID_REQUEST`); missing `version`, missing or empty
            `boundaryRelation`, an incomplete or duplicate entry, or a relation
            the boundary service does not know (`VALIDATION_ERROR`); a non-UUID
            path id (`INVALID_UUID`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Jurisdiction not found for this employee (`NOT_FOUND`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict — the jurisdiction was modified since it was read: `ROW_VERSION_MISMATCH`.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`DATABASE_ERROR`, `INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream dependency failure (`DOWNSTREAM_ERROR`) — the boundary
            service did not respond successfully. Not the client's fault; retry
            with backoff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth'

  parameters:
    RequestIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader'
    CorrelationIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader'
    UserAgentHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader'
    TenantIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader'
    UserIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserIdHeader'
    ForwardedForHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader'
    ClientId:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId'
    ClientSecret:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret'
    TimeStamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: |
        Unique key to prevent duplicate operations on retries.
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      description: System-generated UUID of the employee record.
      schema:
        type: string
        format: uuid
    JurisdictionIdPath:
      name: jurisdictionId
      in: path
      required: true
      description: System-generated UUID of the jurisdiction assignment record.
      schema:
        type: string
        format: uuid

  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'

  schemas:

    # ── Common refs ──────────────────────────────────────────────────────────────

    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'

    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail'

    # ── Employee schemas ─────────────────────────────────────────────────────────

    EmployeeCreateRequest:
      type: object
      description: |
        Payload for registering a new employee within the calling tenant.

        `code` is the human-readable identifier used in downstream references.
        If omitted it is auto-generated by the server and returned in the response.

        `userId` and `individualId` are optional cross-service references — the
        employee record can exist before the linked User or Individual records are
        created, allowing staged onboarding workflows.
      required: [employeeType, department, designation]
      properties:
        code:
          type: string
          maxLength: 64
          description: |
            Human-readable employee identifier. Unique within the tenant.
            If omitted or empty, the server auto-generates a value (idgen).
            Immutable after creation — supply an explicit value only if an
            externally defined code must be preserved. A code already taken in
            the tenant fails that record with `EMPLOYEE_EXISTS`.
          example: EMP-NBO-0042
        userId:
          type: string
          maxLength: 64
          description: |
            Reference to the platform User record that provides the employee's
            authentication identity. Nullable — can be linked after creation;
            a blank value is treated as absent. Validated against Keycloak
            when that dependency is enabled (unknown user → the record fails
            with `INVALID_REQUEST`). A user may have only one employee per
            tenant (`EMPLOYEE_EXISTS`). When `individualId` is also supplied
            and the individual is linked to a user, this must be that user
            (`INVALID_REQUEST` otherwise).
          example: usr-uuid-001
        individualId:
          type: string
          maxLength: 64
          description: |
            Reference to the Individual profile record that holds demographic
            data (name, date of birth, contact details) for this employee.
            Nullable — can be linked after creation; a blank value is treated
            as absent. Validated against the individual service when that
            dependency is enabled (unknown individual → the record fails with
            `INVALID_REQUEST`); when the individual is linked to a user and
            `userId` is omitted, the employee takes that user as `userId`.
            An individual may have only one employee per tenant
            (`EMPLOYEE_EXISTS`).
          example: ind-uuid-001
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Classification of the employment arrangement.
            Tenant-configured vocabulary. Common values include PERMANENT,
            CONTRACT, DEPUTATION, DAILY_WAGE, CONSULTANT.
          example: PERMANENT
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Department or organizational unit the employee belongs to.
            Tenant-configured vocabulary. Examples: FINANCE, PUBLIC_HEALTH,
            URBAN_PLANNING, REVENUE.
          example: FINANCE
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Job title or role within the department.
            Tenant-configured vocabulary. Examples: ACCOUNTS_OFFICER,
            FIELD_INSPECTOR, JUNIOR_ENGINEER, REVENUE_INSPECTOR.
          example: ACCOUNTS_OFFICER
        dateOfAppointment:
          type: string
          format: date
          description: |
            Calendar date of the employee's formal appointment, strictly
            `YYYY-MM-DD`. A timestamp (e.g. `2022-06-01T00:00:00Z`), any other
            layout or a number fails the whole request with
            `400 INVALID_REQUEST`. Must not be a future date and must not be
            before `1900-01-01` (`VALIDATION_ERROR` for that record).
          example: "2022-06-01"
        status:
          type: string
          maxLength: 64
          description: |
            Employment status label. Tenant-configured vocabulary.
            Examples: ACTIVE, ON_PROBATION, ON_LEAVE, RETIRED.
            Distinct from `isActive` — `status` is a descriptive label
            while `isActive` controls system-level access. Only the maximum
            length is enforced.
          example: ACTIVE
        isActive:
          type: boolean
          default: true
          description: |
            Whether the employee record is active in the system.
            Defaults to `true` on creation. Set to `false` to soft-deactivate
            (preferred over hard-delete for audit trail preservation).
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionCreateRequest'
          description: |
            Optional jurisdiction assignments to create together with the
            employee. Each is created at version 1 in the same transaction as
            its employee — if any entry is invalid (structurally, or unknown to
            the boundary service) that one record fails and nothing of it is
            written; other records in the batch are unaffected. Omit or supply
            `[]` to create an employee with no jurisdictions.
      x-businessRules:
        - code is immutable after creation.
        - code must be unique within the tenant; a duplicate fails that record with EMPLOYEE_EXISTS (HTTP 200, status FAILED).
        - If code is omitted or blank the server generates a unique value and returns it.
        - Records are created independently; one invalid record does not prevent the others from being persisted.
        - A userId or individualId may be linked to at most one employee per tenant (EMPLOYEE_EXISTS), including within the same batch (the earlier record wins).
        - jurisdictions, if supplied, are created in the same transaction as their employee; an invalid entry fails that record only.
        - dateOfAppointment must be YYYY-MM-DD, not in the future and not before 1900-01-01.

    EmployeeUpdateRequest:
      type: object
      description: |
        PUT body for updating an employee — a **strict full-state declaration**.
        Every mutable field is required; the client must describe the complete
        post-update state of the employee.

        If you only want to change a subset of fields, use
        `PATCH /employees/{employeeId}` instead. PUT exists for callers who
        already hold the full desired state (admin tools, declarative
        provisioners, GET-then-mutate-PUT workflows).

        **Immutable fields** (`id`, `code`, `userId`, `individualId`,
        `dateOfAppointment`, `tenantId`, `createdBy`, `createdTime`,
        `auditDetail`) are intentionally absent from this schema. Including
        them in the body has no effect — they are silently ignored.

        **Optimistic concurrency:** `version` (the value the client last read)
        is required. The write is a compare-and-swap on it — a stale value is
        rejected with 409 `ROW_VERSION_MISMATCH`.
      required: [employeeType, department, designation, status, isActive, jurisdictions, version]
      properties:
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Classification of the employment arrangement. Tenant-configured vocabulary.
          example: PERMANENT
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: Department or organizational unit.
          example: FINANCE
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: Job title or role within the department.
          example: SENIOR_ACCOUNTS_OFFICER
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Employment status label. Tenant-configured vocabulary.
          example: ACTIVE
        isActive:
          type: boolean
          description: |
            Active status of the employee record. Must be explicit (true/false)
            on every PUT — omitting returns 400. Prefer `/deactivate` and
            `/reactivate` for dedicated lifecycle transitions with cleaner
            audit-trail signal.
          example: true
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionUpsertRequest'
          description: |
            Jurisdiction assignments for the employee. Required on PUT, and
            **reconciled** against the current collection (not replace-on-set):
            an entry with `id` + `version` updates that jurisdiction in place,
            an id-less entry inserts a new one, and any existing jurisdiction
            omitted from the array is deactivated. Supply `[]` to deactivate
            the whole collection. See `JurisdictionUpsertRequest`.
        version:
          type: integer
          format: int32
          description: |
            Optimistic-concurrency version the client last read. Required
            (missing → 400 `VALIDATION_ERROR`); any value other than the stored
            version — including `0` or a negative number — returns 409
            `ROW_VERSION_MISMATCH`. Bumped by 1 on success.
          example: 3
      x-businessRules:
        - All mutable fields plus version are required on every PUT; string fields must be non-empty and within their maximum length.
        - jurisdictions are reconciled by id — id+version updates in place, id-less inserts (version 1), omitted existing entries are deactivated (soft-delete). An empty array deactivates the whole collection.
        - An entry with an id but no version (or version 0) returns 400; the same id listed twice returns 400; a foreign id returns 404; a stale version returns 409.
        - version is required and CAS-guarded — a stale employee version returns 409 ROW_VERSION_MISMATCH.
        - id, code, userId, individualId, dateOfAppointment, tenantId, createdBy, createdTime, and auditDetail are immutable — ignored if supplied.
        - For partial updates that only change a subset of fields, use PATCH instead.

    EmployeePatchRequest:
      type: object
      description: |
        PATCH body for partial update of an employee. Every field is optional;
        omitted fields preserve their existing DB value. Useful for targeted
        changes such as updating department or toggling isActive without
        re-stating the rest of the record.

        At least one mutable field must be supplied — an empty body `{}`
        returns 400.

        **Mutable surface**: `status`, `employeeType`, `department`,
        `designation`, `isActive`, `jurisdictions`.

        **Immutable** (cannot be changed via PATCH; ignored if supplied):
        `id`, `code`, `userId`, `individualId`, `dateOfAppointment`,
        `tenantId`, `createdBy`, `createdTime`, `auditDetail`.

        For full-state declaration (e.g., declarative provisioners), use
        `PUT /employees/{employeeId}` instead.

        **Optimistic concurrency:** `version` (the value the client last read)
        is required even on a partial update — the write compare-and-swaps on
        it, rejecting a stale patch with 409 `ROW_VERSION_MISMATCH`.
      required: [version]
      properties:
        employeeType:
          type: string
          maxLength: 128
          description: Classification of the employment arrangement. Only the maximum length is enforced; an empty string is written as-is.
          example: CONTRACT
        department:
          type: string
          maxLength: 128
          description: Department or organizational unit. Only the maximum length is enforced; an empty string is written as-is.
          example: PUBLIC_HEALTH
        designation:
          type: string
          maxLength: 128
          description: Job title or role within the department. Only the maximum length is enforced; an empty string is written as-is.
          example: FIELD_INSPECTOR
        status:
          type: string
          maxLength: 64
          description: Employment status label. Tenant-configured vocabulary. Only the maximum length is enforced; an empty string is written as-is.
          example: ON_LEAVE
        isActive:
          type: boolean
          description: |
            Active status of the employee record.
            Prefer the dedicated `/deactivate` and `/reactivate` endpoints
            for lifecycle state changes — they produce cleaner audit trails
            and reject already-in-state requests with 409.
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionUpsertRequest'
          description: |
            Jurisdiction assignments for the employee. Optional — when omitted,
            the existing collection is preserved untouched. When supplied, the
            collection is **reconciled** against the array (id+version → update
            in place, id-less → insert, omitted existing → deactivate; `[]`
            deactivates all). See `JurisdictionUpsertRequest`.
        version:
          type: integer
          format: int32
          description: |
            Optimistic-concurrency version the client last read. Required even
            on a partial update (missing → 400 `VALIDATION_ERROR`); any value
            other than the stored version — including `0` — returns 409
            `ROW_VERSION_MISMATCH`. Bumped by 1 on success. Does not count as
            a mutable field.
          example: 5
      x-businessRules:
        - At least one mutable field must be present; an empty body, or one carrying only version, returns 400.
        - Only maximum lengths are enforced on string fields; an explicit empty string is written as-is.
        - version is required and CAS-guarded — a stale employee version returns 409 ROW_VERSION_MISMATCH.
        - Omitted fields preserve their existing DB value.
        - jurisdictions, when supplied, are reconciled by id (id+version updates in place, id-less inserts, omitted existing entries are deactivated). Empty array deactivates the whole collection.
        - id, code, userId, individualId, dateOfAppointment, tenantId, createdBy, createdTime, and auditDetail are immutable — ignored if supplied.

    EmployeeResponse:
      type: object
      description: |
        Full employee record as returned by the service.
        Includes server-managed fields (`id`, `auditDetail`) and the
        associated jurisdiction assignments. `tenantId` is intentionally
        omitted — the caller already knows their tenant from the
        X-Tenant-Id header they sent.

        **Omission rules:** `id`, `isActive`, `version` and `auditDetail` are
        always present. Every other field is omitted when it has no value —
        a null `userId`/`individualId`/`status`/`dateOfAppointment`, an empty
        string, and an empty `jurisdictions` array are all left out rather
        than sent as `null`/`""`/`[]`. `roles` and `individual` appear only
        when requested with `include=`.
      required: [id, isActive, version, auditDetail]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier for the employee record.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        code:
          type: string
          readOnly: true
          description: |
            Human-readable employee identifier. Auto-generated by the server
            if not supplied at creation. Immutable after creation.
          example: EMP-NBO-0042
        userId:
          type: string
          description: Reference to the platform User record. Omitted if not linked.
          example: usr-uuid-001
        roles:
          type: array
          readOnly: true
          description: |
            The employee's Keycloak realm roles, resolved from `userId`.
            Present only with `include=roles`, and then omitted for an
            employee without a `userId`, one whose user Keycloak does not know,
            or one holding no roles.
          items:
            type: string
          example: [EMPLOYEE]
        individualId:
          type: string
          description: Reference to the Individual profile record. Omitted if not linked.
          example: ind-uuid-001
        individual:
          allOf:
            - $ref: '#/components/schemas/EmployeeIndividual'
          readOnly: true
          description: |
            The person behind the employee, from the individual service.
            Present only with `include=individual`, and then omitted for an
            employee without an `individualId`, one whose `individualId` is
            not a UUID, or one the individual service does not know.
        employeeType:
          type: string
          description: Classification of the employment arrangement.
          example: PERMANENT
        department:
          type: string
          description: Department or organizational unit.
          example: FINANCE
        designation:
          type: string
          description: Job title or role within the department.
          example: ACCOUNTS_OFFICER
        dateOfAppointment:
          type: string
          format: date
          description: Calendar date (`YYYY-MM-DD`) of the employee's formal appointment. Omitted when not set.
          example: "2022-06-01"
        status:
          type: string
          description: Employment status label. Tenant-configured vocabulary.
          example: ACTIVE
        isActive:
          type: boolean
          description: Whether the employee record is active in the system.
          example: true
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
          description: |
            All jurisdiction assignments associated with this employee, active
            and inactive, newest first. Omitted when the employee has none.
            Included inline for convenience — use
            `GET /employees/{employeeId}/jurisdictions` for paginated access
            when large numbers of assignments are expected.
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. 1 on create, incremented on every mutation (including deactivate/reactivate).
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    EmployeeIndividual:
      type: object
      description: |
        The person behind an employee, as held by the individual service.
        Attached to `EmployeeResponse.individual` on `include=individual`.
        Fields with no value are omitted.
      properties:
        givenName:
          type: string
          example: Aisha
        familyName:
          type: string
          example: Khan
        email:
          type: string
          format: email
          example: aisha.khan@corp.example

    EmployeeCreateBatchResponse:
      type: object
      description: |
        Result of `POST /employees`: one entry per submitted record, in request
        order. Always returned with HTTP `200` — inspect each result's `status`.
      required: [created, failed, results]
      properties:
        created:
          type: integer
          format: int32
          description: 'Number of records with `status: CREATED`.'
          example: 1
        failed:
          type: integer
          format: int32
          description: 'Number of records with `status: FAILED`.'
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCreateResult'

    EmployeeCreateResult:
      type: object
      description: Outcome of one record of a create batch.
      required: [index, status]
      properties:
        index:
          type: integer
          format: int32
          description: Zero-based position of the record in the request array.
          example: 0
        status:
          type: string
          enum: [CREATED, FAILED]
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeResponse'
          description: The created employee. Present only when `status` is `CREATED`.
        error:
          allOf:
            - $ref: '#/components/schemas/EmployeeCreateError'
          description: Why the record was not created. Present only when `status` is `FAILED`.

    EmployeeCreateError:
      type: object
      description: |
        Error of a failed create-batch record, in the same `code`/`message`
        shape as request-level errors. Codes: `VALIDATION_ERROR` (missing or
        over-long field, bad `dateOfAppointment` range, null or invalid
        jurisdiction entry, unknown boundary relation), `INVALID_REQUEST`
        (unknown Keycloak user or individual, `userId` not the individual's
        user), `EMPLOYEE_EXISTS` (duplicate `code`, or the user/individual
        already has an employee), `INTERNAL_ERROR` (the insert failed).
      required: [code, message]
      properties:
        code:
          type: string
          example: EMPLOYEE_EXISTS
        message:
          type: string
          example: Employee code already exists

    EmployeeSearchResponse:
      type: object
      description: One page of an employee search, with the total number of matches across all pages.
      required: [totalCount, limit, offset, hasMore, employees]
      properties:
        totalCount:
          type: integer
          format: int64
          description: Number of employees matching the filters across all pages.
          example: 42
        limit:
          type: integer
          format: int32
          description: The page size applied.
          example: 10
        offset:
          type: integer
          format: int32
          description: The offset applied.
          example: 0
        hasMore:
          type: boolean
          description: Whether more matches exist beyond this page (`offset + employees.length < totalCount`).
          example: true
        employees:
          type: array
          description: The page of employees, newest first. Empty (not omitted) when nothing matches.
          items:
            $ref: '#/components/schemas/EmployeeResponse'

    OnboardRequest:
      type: object
      description: |
        Combined payload for onboarding. All three blocks are required. `userId` and
        `individualId` are server-injected and must not be supplied.
      required: [user, individual, employee]
      properties:
        user:
          $ref: '#/components/schemas/OnboardUser'
        individual:
          type: object
          description: |
            Individual (person) payload, forwarded to the Individual service and
            validated there. `givenName` and `gender` are required; `address`,
            `documents` and `identifiers` are supported. The new user's id is
            injected before forwarding.
          additionalProperties: true
          example:
            givenName: Aisha
            familyName: Khan
            gender: FEMALE
            mobileNumber: "9812345678"
            identifiers:
              - identifierType: PAN
                identifierId: ABCDE1234F
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeCreateRequest'
          description: |
            Employee payload, validated by the same rules as `POST /employees`.
            `userId` and `individualId` are ignored if sent.

    OnboardUser:
      type: object
      description: The login user to provision. `mobileNumber` becomes the username and is immutable.
      required: [mobileNumber, password]
      properties:
        mobileNumber:
          type: string
          description: Becomes the username — the login identifier.
          example: "9812345678"
        password:
          type: string
          format: password
          writeOnly: true
          description: Initial password, set as supplied. Never returned.
          example: Secret@123
        email:
          type: string
          format: email
          example: aisha.khan@corp.example
        firstName:
          type: string
          example: Aisha
        lastName:
          type: string
          example: Khan
        emailVerified:
          type: boolean
          default: false
        roles:
          type: array
          description: |
            Realm roles to assign. Each must already exist in the realm — an unknown
            name is `400` and nothing is created.
          items:
            type: string
          example: [EMPLOYEE]

    OnboardResponse:
      type: object
      description: The three created records.
      required: [user, individual, employee]
      properties:
        user:
          $ref: '#/components/schemas/OnboardUserResponse'
        individual:
          type: object
          description: The created individual, as returned by the Individual service.
          additionalProperties: true
        employee:
          $ref: '#/components/schemas/EmployeeResponse'

    OnboardUserResponse:
      type: object
      description: |
        The server-decided facts about the new login user. Fields the client supplied
        are not echoed, and the password is never returned.
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The new user's id, also set as the employee's `userId`.
          example: 0e7604a3-468f-4cfb-bb62-f2bf1ff74d1f
        username:
          type: string
          readOnly: true
          description: The login identifier, derived from `user.mobileNumber`.
          example: "9812345678"
        roles:
          type: array
          readOnly: true
          description: Roles actually assigned. Omitted when none were requested.
          items:
            type: string
          example: [EMPLOYEE]

    Boundary:
      type: object
      description: |
        A single boundary assignment within a jurisdiction, identifying
        a specific geographical area by its `code` together with the
        `boundaryType` it represents and the `hierarchyType` it belongs to.

        The boundary service validates this triple — the code must exist as
        the named `boundaryType` inside the given `hierarchyType`, otherwise
        the jurisdiction is rejected with 400 `VALIDATION_ERROR`.
      required: [code, boundaryType, hierarchyType]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Tenant-defined boundary identifier from the boundary service.
            Examples: `WARD-NBO-001`, `BLOCK-KSM-005`, `DISTRICT-MSA-003`.
          example: WARD-NBO-001
        boundaryType:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The boundary-type label this code resolves to within the
            chosen `hierarchyType`. Tenant-configured vocabulary — common
            values: Ward, Block, District, City, State.
          example: Ward
        hierarchyType:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The administrative boundary hierarchy this code belongs to.
            Tenant-configured vocabulary — e.g. `ADMIN`, `REVENUE`.
          example: ADMIN

    # ── Jurisdiction schemas ─────────────────────────────────────────────────────

    JurisdictionCreateRequest:
      type: object
      description: |
        Payload for creating a new jurisdiction assignment. The owning
        `employeeId` is supplied via the URL path (this is a nested resource)
        and is therefore absent from the body.

        Each entry in `boundaryRelation` carries a `code` (the tenant-defined
        identifier from the boundary service), a `boundaryType` (the label
        the code resolves to inside the chosen hierarchy), and a
        `hierarchyType` (the hierarchy the code belongs to). At least one
        boundary is required, and each entry must be unique by the
        `{code, boundaryType, hierarchyType}` triple.

        An employee may hold multiple active jurisdiction records concurrently.
      required: [boundaryRelation]
      properties:
        boundaryRelation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Array of boundary assignments defining the geographical scope of
            this jurisdiction. Each entry carries `code`, `boundaryType`, and
            `hierarchyType`.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-002
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          default: true
          description: Whether this jurisdiction assignment is active.
      x-businessRules:
        - The owning employeeId comes from the URL path; including it in the body has no effect.
        - boundaryRelation must contain at least one entry.
        - Each boundaryRelation entry must be unique by (code, boundaryType, hierarchyType).
        - An employee may hold multiple active jurisdiction records concurrently.

    JurisdictionUpsertRequest:
      type: object
      description: |
        A jurisdiction entry inside an employee **PUT/PATCH** body. The array is
        **reconciled** against the employee's current jurisdictions (it is not
        replace-on-set):

        - entry with `id` + `version` → the matching jurisdiction is updated in
          place (ownership + version checked; version bumped, identity/audit
          preserved). `boundaryRelation` fully replaces the stored array and
          `isActive` is written as given (defaulting to `true` when omitted).
        - entry with `id` but no `version` (or `version: 0`) → 400 (version is
          required to update an existing jurisdiction).
        - entry with an `id` not owned by the employee in the path → 404.
        - the same `id` listed twice → 400.
        - entry without `id` → a new jurisdiction is inserted (version 1).
        - any existing active jurisdiction omitted from the array → deactivated
          (`isActive=false`, soft-delete, its version bumped), not hard-deleted.

        An empty array deactivates the whole collection. Every entry's
        `boundaryRelation` is validated against the boundary service before
        anything is written.
      required: [boundaryRelation]
      properties:
        id:
          type: string
          format: uuid
          description: |
            UUID of an existing jurisdiction to update in place. Omit to insert
            a new jurisdiction. Must belong to the employee in the path.
          example: f1e2d3c4-b5a6-7890-fedc-ba0987654321
        version:
          type: integer
          format: int32
          minimum: 1
          description: |
            Optimistic-concurrency version of the existing jurisdiction being
            updated. Required together with `id` — omitted or `0` is treated as
            missing (400); a mismatch returns 409 `ROW_VERSION_MISMATCH`.
            Ignored for id-less (insert) entries.
          example: 2
        boundaryRelation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Array of boundary assignments defining the geographical scope of
            this jurisdiction. Each entry carries `code`, `boundaryType`, and
            `hierarchyType`.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          default: true
          description: Whether this jurisdiction assignment is active.
      x-businessRules:
        - id and version travel together — supplying id without version (or with version 0) returns 400.
        - the same id listed more than once returns 400.
        - id must belong to the employee in the path; a foreign id returns 404.
        - id-less entries are inserted as new jurisdictions at version 1.
        - existing jurisdictions omitted from the array are deactivated (soft-delete), not hard-deleted.
        - a stale version on an update entry returns 409 ROW_VERSION_MISMATCH.

    JurisdictionUpdateRequest:
      type: object
      description: |
        Update payload for an existing jurisdiction assignment.

        `boundaryRelation` is required and fully replaces the existing array
        (not merged). `isActive` is optional — when omitted the existing
        value is preserved.

        **Optimistic concurrency:** `version` (the value the client last read
        for this jurisdiction) is required. The write compare-and-swaps on it —
        a stale value returns 409 `ROW_VERSION_MISMATCH`. This version is
        independent of the owning employee's version.

        `id`, `employeeId`, and `tenantId` are immutable and ignored if supplied.
      required: [boundaryRelation, version]
      properties:
        boundaryRelation:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Replacement array of boundary assignments. Fully replaces the
            existing `boundaryRelation` — supply all entries that should remain.
            Each `{code, boundaryType, hierarchyType}` triple must be unique
            within the array.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-003
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          description: |
            Active status of the jurisdiction assignment. Optional — when
            omitted the existing value is preserved (no implicit deactivation
            on absence).
        version:
          type: integer
          format: int32
          description: |
            Optimistic-concurrency version the client last read for this
            jurisdiction. Required (missing → 400 `VALIDATION_ERROR`); any value
            other than the stored version — including `0` — returns 409
            `ROW_VERSION_MISMATCH`. Independent of the owning employee's
            version. Bumped by 1 on success.
          example: 2
      x-businessRules:
        - id, employeeId, and tenantId are immutable — ignored if supplied.
        - boundaryRelation is required and fully replaces the existing array (not merged).
        - boundaryRelation must contain at least one entry, and each entry must be unique by (code, boundaryType, hierarchyType).
        - isActive is optional; absence preserves the existing value.
        - version is required and CAS-guarded — a stale jurisdiction version returns 409 ROW_VERSION_MISMATCH. It is independent of the employee's version.

    JurisdictionResponse:
      type: object
      description: |
        A jurisdiction assignment record as returned by the service,
        representing an employee's authorization to operate within
        a defined set of geographical boundaries.
        `tenantId` is intentionally omitted — the caller already knows
        their tenant from the X-Tenant-Id header they sent.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier for this jurisdiction record.
          example: f1e2d3c4-b5a6-7890-fedc-ba0987654321
        employeeId:
          type: string
          format: uuid
          description: UUID of the employee this jurisdiction is assigned to.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        boundaryRelation:
          type: array
          items:
            $ref: '#/components/schemas/Boundary'
          description: |
            Array of boundary assignments defining the geographical scope
            of this jurisdiction.
          example:
            - code: WARD-NBO-001
              boundaryType: Ward
              hierarchyType: ADMIN
            - code: WARD-NBO-002
              boundaryType: Ward
              hierarchyType: ADMIN
        isActive:
          type: boolean
          description: Whether this jurisdiction assignment is currently active.
          example: true
        version:
          type: integer
          format: int32
          readOnly: true
          description: Optimistic concurrency version. Incremented on every mutation.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
