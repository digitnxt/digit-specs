              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jurisdictions/{uuid}:
    get:
      tags:
        - Jurisdiction
      summary: Get jurisdiction by UUID
      operationId: getJurisdictionByUUID
      description: Retrieves a specific jurisdiction by UUID
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: uuid
          in: path
          required: true
          description: Jurisdiction UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Jurisdiction retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jurisdiction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Jurisdiction
      summary: Replace jurisdiction
      operationId: replaceJurisdiction
      description: Replaces an existing jurisdiction
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: uuid
          in: path
          required: true
          description: Jurisdiction UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionUpdateRequest'
      responses:
        '200':
          description: Jurisdiction replaced successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Jurisdiction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Unique identifier for tracking each request
      schema:
        type: string
        minLength: 2
        maxLength: 64

    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Used for distributed tracing across multiple services
      schema:
        type: string
        minLength: 2
        maxLength: 64

    UserAgentHeader:
      name: User-Agent
      in: header
      required: false
      description: Identifies the client making the request
      schema:
        type: string
        minLength: 5
        maxLength: 64

    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Identifies the tenant making the request
      schema:
        type: string
        minLength: 2
        maxLength: 64

    ForwardedForHeader:
      name: X-Forwarded-For
      in: header
      required: false
      description: Client IP address for tracing in load-balanced environments
      schema:
        type: string
        minLength: 2
        maxLength: 64

    ClientId:
      name: X-Client-Id
      in: header
      required: false
      description: Unique identifier assigned to the client
      schema:
        type: string
        minLength: 3
        maxLength: 100

    ClientSecret:
      name: X-Client-Secret
      in: header
      required: false
      description: Secret key used to authenticate the client
      schema:
        type: string
        minLength: 8
        maxLength: 256

    TimeStamp:
      name: X-Time-Stamp
      in: header
      required: false
      description: Epoch timestamp in milliseconds when the request was made
      schema:
        type: integer
        minimum: 1000000000000
        maximum: 9999999999999

  headers:
    X-Response-Time:
      description: Total time taken to process the request in milliseconds
      schema:
        type: integer
        minimum: 0

    X-Response-Timestamp:
      description: Server-side timestamp in epoch milliseconds when response was generated
      schema:
        type: integer
        minimum: 1000000000000
        maximum: 9999999999999

    X-Request-ID:
      description: Echoes the X-Request-ID from the request for tracking
      schema:
        type: string

    X-Correlation-ID:
      description: Echoes the X-Correlation-ID to trace request across services
      schema:
        type: string

    X-Tenant-ID:
      description: Echoes the X-Tenant-ID from the request confirming tenant scope
      schema:
        type: string

    X-Rate-Limit:
      description: Maximum number of allowed requests in a given timeframe
      schema:
        type: integer
        minimum: 1

    X-Rate-Limit-Remaining:
      description: Remaining number of requests in the current rate limit window
      schema:
        type: integer
        minimum: 0

    X-Rate-Limit-Reset:
      description: Time in UTC epoch seconds when the rate limit will reset
      schema:
        type: integer
        minimum: 0

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Module-specific error code
          example: Employee.NotFound
        message:
          type: string
          description: Readable error message
          example: Employee not found
        description:
          type: string
          description: Optional long description for debugging
        params:
          type: array
          description: Optional placeholders for dynamic messages
          items:
            type: string

    AuditDetail:
      type: object
      description: Contains audit details tracking record creation and modification
      properties:
        createdBy:
          type: string
          description: UUID of the user or system that created the record
          minLength: 2
          maxLength: 64
        createdTime:
          type: integer
          format: int64
          description: Timestamp (epoch milliseconds) when the record was created
        modifiedBy:
          type: string
          description: UUID of the user or system that updated the record
          minLength: 2
          maxLength: 64
        modifiedTime:
          type: integer
          format: int64
          description: Timestamp (epoch milliseconds) when the record was last modified

    EmployeeCreateRequest:
      type: object
      required:
        - employeeType
        - department
        - designation
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Employee code (auto-generated if not provided)
        userId:
          type: string
          minLength: 1
          maxLength: 256
          description: User ID reference
        individualId:
          type: string
          minLength: 1
          maxLength: 256
          description: Individual ID reference
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: Employee status
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: Type of employee (required)
        dateOfAppointment:
          type: string
          format: date-time
          description: Date of appointment
        department:
          type: string
          minLength: 1
          maxLength: 128
          description: Department name (required)
        designation:
          type: string
          minLength: 1
          maxLength: 128
          description: Job designation (required)
        isActive:
          type: boolean
          default: true
          description: Whether employee is active

    EmployeeUpdateRequest:
      type: object
      properties:
        employeeStatus:
          type: string
          minLength: 1
          maxLength: 64
          description: Employee status
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
          description: Type of employee
        phone:
          type: string
          minLength: 10
          maxLength: 20
          description: Phone number
        emailId:
          type: string
          format: email
          minLength: 5
          maxLength: 256
          description: Email address
        isActive:
          type: boolean
          description: Active status

    EmployeePatchRequest:
      type: object
      description: Partial update request for employee - all fields are optional
      properties:
        employeeStatus:
          type: string
          minLength: 1
          maxLength: 64
        employeeType:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 10
          maxLength: 20
        emailId:
          type: string
          format: email
          minLength: 5
          maxLength: 256
        isActive:
          type: boolean

    EmployeeResponse:
      type: object
      required:
        - id
        - isActive
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        code:
          type: string
          description: Employee code
        userId:
          type: string
          description: User ID reference
        individualId:
          type: string
          description: Individual ID reference
        status:
          type: string
          description: Employee status
        employeeType:
          type: string
          description: Type of employee
        dateOfAppointment:
          type: string
          format: date-time
          description: Date of appointment
        department:
          type: string
          description: Department
        designation:
          type: string
          description: Designation
        isActive:
          type: boolean
          description: Active status
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
          description: Associated jurisdictions
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'

    EmployeeListResponse:
      type: object
      required:
        - employees
        - totalCount
        - page
        - size
        - hasMore
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean

    JurisdictionCreateRequest:
      type: object
      required:
        - employeeId
        - boundaryRelation
      properties:
        employeeId:
          type: string
          format: uuid
          description: Employee ID (required)
        boundaryRelation:
          type: array
          minItems: 1
          items:
            type: string
          description: Array of boundary relations (required)
        isActive:
          type: boolean
          description: Active status

    JurisdictionUpdateRequest:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
          description: Employee ID
        boundaryRelation:
          type: array
          minItems: 1
          items:
            type: string
          description: Array of boundary relations
        isActive:
          type: boolean
          description: Active status

    JurisdictionResponse:
      type: object
      required:
        - id
        - employeeId
        - boundaryRelation
        - isActive
        - tenantId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Jurisdiction ID
        employeeId:
          type: string
          format: uuid
          description: Employee ID
        boundaryRelation:
          type: array
          items:
            type: string
          description: Array of boundary relations
        isActive:
          type: boolean
          description: Active status
        tenantId:
          type: string
          readOnly: true
          description: Tenant ID
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'

    JurisdictionListResponse:
      type: object
      required:
        - jurisdictions
        - totalCount
        - page
        - size
        - hasMore
      properties:
        jurisdictions:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionResponse'
        totalCount:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
