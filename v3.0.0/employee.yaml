openapi: 3.0.3
info:
  title: Employee Service API
  version: 3.0.0
  description: |
    Standardized REST APIs for managing Employees and their Jurisdictions within the DIGIT platform.
    This specification aligns with DIGIT 3.0 common standards and includes full compliance with 
    platform header and error standards.
  contact:
    name: Platform Team
  license:
    name: Apache 2.0

servers:
  - url: https://api.example.com/employee/v3
    description: Production
  - url: https://staging-api.example.com/employee/v3
    description: Staging
  - url: http://localhost:8080/employee/v3
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Employee
    description: Lifecycle management of staff members
  - name: Jurisdiction
    description: Managing employee assignments to geographical areas

paths:

  /:
    post:
      tags:
        - Employee
      summary: Create employees
      operationId: createEmployees
      description: |
        Registers one or more new employees. If code is omitted, it will be auto-generated.
        
        **Pre-conditions:**
        - User must be authenticated with valid bearer token
        - X-Tenant-ID header must be present and valid
        - Request body must contain valid employee data
        
        **Business Rules:**
        - Employee ID is auto-generated as UUID
        - Code is auto-generated if not provided
        - All employees must be valid for entire operation to succeed
        - If any employee fails validation, entire operation is rolled back
        
        **Post-conditions:**
        - All employees are persisted to database
        - Response includes array of created employees with generated IDs
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Employees created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Employee
      summary: Search employees
      operationId: searchEmployees
      description: |
        Retrieves a paginated list of employees for the tenant with optional filtering.
        
        **Pre-conditions:**
        - User must be authenticated with valid bearer token
        - X-Tenant-ID header must be present and valid
        
        **Business Rules:**
        - Results are filtered by tenant ID from header
        - Results are sorted by creation time (descending)
        - Pagination defaults to page 1, size 20 if not specified
        - Maximum page size is 100
        
        **Post-conditions:**
        - Response includes total count of employees matching filter
        - Response includes current page number and size
        - Response includes hasMore flag for client pagination
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: Number of employees per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: code
          in: query
          required: false
          description: Filter by employee code
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter by employee name
          schema:
            type: string
      responses:
        '200':
          description: Employees retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{id}:
