openapi: 3.0.3

info:
  title: Workflow Service API
  version: 3.0.0
  description: |
    REST APIs for the DIGIT Workflow service. All endpoints are scoped to the
    tenant resolved from the `X-Tenant-ID` header.

    The module is organised into three configuration layers and two runtime layers:

    **Layer 1 — Process Definition (composite)**
    Full CRUD for a complete process definition in a single payload — process
    metadata, states, and actions together. Use `/process/definition` for all
    authoring workflows. This is the primary way to create and manage workflow
    processes.

    **Layer 2 — Granular State / Action management**
    Individual CRUD for states and actions when surgical changes are needed
    after the initial definition is created. All paths are addressed by
    human-readable codes — never UUIDs.

    **Layer 3 — EscalationConfig**
    Per-process, per-state escalation rules. Define the SLA thresholds (in
    minutes) at which an auto-escalation action is triggered.

    **Layer 4 — Transition (runtime)**
    Executes a workflow transition for a business entity. A `POST /transition`
    either creates a new process instance (first action) or advances an
    existing one. `GET /transition` searches process instances, with an option
    to return full transition history.

    **Layer 5 — AutoEscalation (runtime)**
    Triggers or searches auto-escalation runs scoped to a `processCode`.

    **Key structural concepts:**

    | Concept | Details |
    |---|---|
    | `Process.code` | Human-readable process slug — the **only** identifier used in all paths and cross-resource references. Never use UUID in paths. |
    | `State.code` | Human-readable state code — used in paths, `nextState` references, and escalation configs |
    | `State.type` | Lifecycle role of the state: `INITIAL`, `INTERMEDIATE`, `DECISION`, `TERMINAL_SUCCESS`, or `TERMINAL_FAILURE`. The composite definition endpoints require exactly one `INITIAL` state; the granular state endpoints do not enforce this. |
    | `Process.version` | A process code may exist in several versions; `(code, version)` is unique per tenant. Where a `version` query is not given, the most recently created version of the code is used. |
    | `Action.code` | Human-readable action code — used in paths and `TransitionRequest.action` |
    | `entityId` | The business entity (e.g. certificate application, grievance) the process instance tracks |
    | `sla` | Service Level Agreement in milliseconds at the process level |
    | `slotPercentage` | Near-SLA threshold percentage at the process version level. For example, `80` means near-SLA starts after 80 percent of the configured SLA has elapsed. |
    | `stateSlaMinutes` / `processSlaMinutes` | SLA thresholds in minutes at the escalation config level |
    | `id` | System-generated UUID present in all response bodies for internal reference — **never used in API paths** |
    | `X-User-ID` | Required on every request — identifies the authenticated user and populates `createdBy` / `modifiedBy` in `auditDetail` |

    The `tenantId` is always resolved from the Bearer token and must not be
    sent in request bodies.

servers:
  - url: https://api.example.com/workflow/v3
    description: Production server
  - url: https://staging-api.example.com/workflow/v3
    description: Staging server

security:
  - BearerAuth: []

tags:
  - name: ProcessDefinition
    description: |
      Composite CRUD for a complete process definition — process metadata,
      states, and actions authored together in a single payload.
      This is the primary authoring interface for workflow processes.
  - name: Process
    description: |
      Standalone CRUD for process metadata only (name, code, version, SLA).
      Use these endpoints when creating or managing a process separately from
      state/action definitions.
  - name: State
    description: |
      Granular management of individual states within a process.
      All paths use processCode and stateCode — never UUIDs.
  - name: Action
    description: |
      Granular management of individual actions on a state.
      All paths use processCode, stateCode, and actionCode — never UUIDs.
  - name: EscalationConfig
    description: |
      Manage per-process, per-state escalation configurations.
      Define the SLA thresholds at which auto-escalation is triggered.
  - name: Transition
    description: |
      Execute and search workflow transitions at runtime.
      A transition advances a business entity through the workflow states.
      Search supports returning full transition history via the `history` flag.
  - name: AutoEscalation
    description: |
      Trigger or search auto-escalation runs for a process.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════════════════════════════
  # LAYER 1 — PROCESS DEFINITION (COMPOSITE)
  # ══════════════════════════════════════════════════════════════════════════════

  /process/definition:

    post:
      summary: Create a complete process definition
      operationId: createProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Creates a complete workflow process definition — process metadata,
        all states, and all actions — in a single request.

        This is the primary way to author a workflow. The whole payload is
        validated up front (structural rules below) before anything is written,
        but persistence is **not atomic**: the process row is committed first
        and the states and actions are then inserted one by one. If a state or
        action insert fails (for example a database length limit), the process
        row and the rows inserted so far remain and the error is returned.

        **Business Rules:**
        - `(code, version)` must be unique within the tenant; a duplicate
          returns `409`. The same `code` may be created again with a different
          `version`. `version` defaults to `v1` when omitted.
        - Metadata validation: `name` and `code` 1–128 characters, `code`
          limited to `A-Z a-z 0-9 _ . : / @ + - space`, `description` up to
          512, `version` up to 32, `slotPercentage` 1–99. Any field failure
          returns `400` with the single message `Invalid input data`.
        - Each state `code` must be unique within the process; each state
          needs `code`, `name` and `type`.
        - Exactly one state must have `type: INITIAL`.
        - Each action needs `code` and `nextState`; action `code` must be
          unique within its state.
        - Every action `nextState` must reference a `code` present in the
          `states` array of this definition.
        - State and action field lengths (state `code` ≤ 64, `name` ≤ 128,
          `description` ≤ 512; action `code` ≤ 64, `label` ≤ 128) are enforced
          by the database and surface as `400` (`ValidationError`).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDefinitionInput'
            examples:
              tradeLicenseApproval:
                summary: Trade license — 5-state linear approval flow
                value:
                  code: trade-license-approval
                  name: Trade License Approval
                  description: End-to-end approval workflow for trade license applications.
                  version: "1.0"
                  sla: 432000000
                  slotPercentage: 80
                  additionalDetails:
                    category: licensing
                    module: trade-license
                  states:
                    - code: PENDING_REVIEW
                      name: Pending Review
                      type: INITIAL
                      description: Application submitted and awaiting officer review.
                      sla: 172800000
                      additionalDetails:
                        queue: trade-license-review
                      actions:
                        - code: APPROVE
                          label: Approve
                          nextState: APPROVED
                          additionalDetails:
                            uiColor: success
                        - code: RETURN
                          label: Return for Correction
                          nextState: RETURNED
                        - code: REJECT
                          label: Reject
                          nextState: REJECTED
                    - code: RETURNED
                      name: Returned
                      type: INTERMEDIATE
                      description: Returned to applicant for corrections.
                      sla: 86400000
                      actions:
                        - code: RESUBMIT
                          label: Resubmit
                          nextState: PENDING_REVIEW
                        - code: WITHDRAW
                          label: Withdraw
                          nextState: WITHDRAWN
                    - code: APPROVED
                      name: Approved
                      type: TERMINAL_SUCCESS
                      actions: []
                    - code: REJECTED
                      name: Rejected
                      type: TERMINAL_FAILURE
                      actions: []
                    - code: WITHDRAWN
                      name: Withdrawn
                      type: TERMINAL_FAILURE
                      actions: []
      responses:
        '201':
          description: Process definition created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '400':
          description: |
            Validation error (`ValidationError`) — metadata, state, or action
            fields failed; a nextState reference does not resolve within the
            states array; or a database constraint (length, foreign key) was
            violated while inserting states/actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: A process with this `code` and `version` already exists for this tenant (`Conflict`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List all process definitions
      operationId: listProcessDefinitions
      tags: [ProcessDefinition]
      description: |
        Returns complete process definitions for the calling tenant — every
        version of every process code, unless filtered. Each entry includes
        process metadata, states, and actions.

        The response is **not paginated**: all matching definitions are
        returned, `page` is always `0` and `size` always equals `totalCount`.
        `page`/`size` query parameters are not read.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: processCode
          in: query
          required: false
          description: Filter to a specific process by code (exact match). Without `version`, all versions of the code are returned.
          schema:
            type: string
            maxLength: 128
        - name: version
          in: query
          required: false
          description: |
            Return only this version of `processCode`. Requires `processCode`
            (`400` otherwise). When the `(processCode, version)` pair does not
            exist the response is `404`.
          schema:
            type: string
            maxLength: 32
        - name: isActive
          in: query
          required: false
          description: Filter by the process `isActive` flag.
          schema:
            type: boolean
      responses:
        '200':
          description: Process definitions returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionListResponse'
        '400':
          description: Bad request — `version` supplied without `processCode`, or `isActive` is not a boolean.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: No process matches the supplied `processCode` and `version` (`NotFound`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /process/definition/{processCode}:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'

    get:
      summary: Get a complete process definition by code
      operationId: getProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Returns the full process definition for the given processCode —
        metadata, states, and actions. Without `version`, the most recently
        created version of the code is returned.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/ProcessVersionQuery'
      responses:
        '200':
          description: Process definition returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Replace a complete process definition
      operationId: updateProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Replaces the entire process definition — metadata, states, and
        actions — for the most recently created version of the given
        processCode. The whole operation runs in one transaction and is rolled
        back on any failure.

        **Reconcile-by-code semantics:** the submitted states array is matched
        against the existing states by `code` (and actions by `code` within
        their state). Matching states/actions are updated in place and keep
        their `id`; new ones are created; states or actions omitted from the
        payload are deleted (deleting a state also deletes its actions).

        **Business Rules:**
        - The body `code` must equal the path `processCode`, otherwise `400`.
        - The same structural validation as POST applies (state/action codes,
          exactly one `INITIAL`, `nextState` resolution). The metadata length
          rules of POST are not applied here; database limits still surface
          as `400`.
        - `version` and `isActive` must be present in the body on PUT: the
          process row is overwritten with the submitted values and both
          columns are non-nullable (omitting them yields a `500`).
        - Removing a state that process instances still reference fails the
          foreign-key constraint and returns `400` (`ValidationError`,
          "Record cannot be modified because it is referenced by other
          resources"), not `409`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDefinitionInput'
      responses:
        '200':
          description: Process definition replaced.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '400':
          description: |
            Validation error — structural rules failed, body `code` differs
            from the path, or a removed state is still referenced by process
            instances (foreign-key violation).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: The submitted `version` collides with another existing version of this process code (`Conflict`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a complete process definition
      operationId: deleteProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Permanently deletes the most recently created version of the process
        identified by processCode. States, actions, escalation configs and
        parallel-execution records cascade with the process row. Returns `409`
        if any process instances (active or historical) reference the process.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Process definition deleted.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Process instances reference this process (`Conflict`, "Record cannot be modified because it is referenced by other resources").
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error (`InternalServerError`, "failed to delete process").
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /process:

    post:
      summary: Create a workflow process
      operationId: createProcess
      tags: [Process]
      description: |
        Creates process metadata only (no states or actions). The same field
        validation as `POST /process/definition` applies: `name`/`code` 1–128
        characters, `code` limited to `A-Z a-z 0-9 _ . : / @ + - space`,
        `description` ≤ 512, `version` ≤ 32, `slotPercentage` 1–99; any
        failure returns `400` with the message `Invalid input data`.
        `version` defaults to `v1` and `isActive` to `true` when omitted.
        `(code, version)` must be unique within the tenant.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                code: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:/@+\- ]+$' }
                description: { type: string, maxLength: 512 }
                version: { type: string, maxLength: 32, default: v1 }
                sla: { type: integer, format: int64 }
                slotPercentage:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Near-SLA threshold percentage for this process version.
                isActive:
                  type: boolean
                  default: true
                  description: Whether this process version accepts new work. Defaults to `true`.
                additionalDetails:
                  type: object
                  additionalProperties: true
                  description: Free-form process metadata for tenant or module-specific configuration.
      responses:
        '201':
          description: Process created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '409':
          description: A process with this `code` and `version` already exists (`Conflict`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

    get:
      summary: Search processes
      operationId: searchProcesses
      tags: [Process]
      description: |
        Lists process metadata for the tenant (all versions). `id`, `name` and
        `code` may be repeated to match any of several values; blank values
        are ignored. Each `id` must be a UUID, otherwise `400`. The response is
        an unpaginated array.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: id
          in: query
          required: false
          description: Process UUID(s). Repeat the parameter for several values.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: name
          in: query
          required: false
          description: Process name(s), exact match. Repeat the parameter for several values.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: code
          in: query
          required: false
          description: Process code(s), exact match. Repeat the parameter for several values.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, maxLength: 128 }
        - name: version
          in: query
          required: false
          description: Filter by process version label (exact match).
          schema: { type: string, maxLength: 32 }
        - name: isActive
          in: query
          required: false
          description: Filter by the `isActive` flag.
          schema: { type: boolean }
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Process'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

  /process/code/{processCode}:
    parameters:
      - name: processCode
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get process by code
      operationId: getProcessById
      tags: [Process]
      description: Returns process metadata for `processCode`. Without `version`, the most recently created version of the code is returned.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/ProcessVersionQuery'
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

    put:
      summary: Update process by code
      operationId: updateProcessById
      tags: [Process]
      description: |
        Partially updates the most recently created version of the process
        identified by `processCode`. Only fields present in the body are
        changed (`name` and `code` additionally must be non-empty to take
        effect); omitted fields keep their stored values.

        `code` is **not** immutable here — supplying a different `code`
        renames the process. No field-level validation is performed; database
        limits surface as `400`. A `(code, version)` collision returns `409`
        (`Conflict`). Setting `isActive: false` on an active process that still
        has latest-state process instances returns `409` with code
        `ACTIVE_PROCESS_INSTANCES_EXIST`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 128 }
                code: { type: string, maxLength: 128 }
                description: { type: string, maxLength: 512 }
                version: { type: string, maxLength: 32 }
                sla: { type: integer, format: int64 }
                slotPercentage:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Near-SLA threshold percentage for this process version.
                isActive:
                  type: boolean
                  description: Set to `false` to deactivate the process version; rejected with `409` while active process instances exist.
                additionalDetails:
                  type: object
                  additionalProperties: true
                  description: Free-form process metadata for tenant or module-specific configuration.
      responses:
        '200':
          description: Updated process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
        '400':
          description: Validation error — malformed body or a database constraint (length, format) was violated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '409':
          description: "Conflict — `(code, version)` already exists, or `isActive: false` was requested while process instances exist (`ACTIVE_PROCESS_INSTANCES_EXIST`)"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

    delete:
      summary: Delete process by code
      operationId: deleteProcessById
      tags: [Process]
      description: |
        Deletes the most recently created version of the process identified by
        `processCode`. States, actions, escalation configs and
        parallel-execution records cascade. Returns `409` if any process
        instances reference the process.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '409':
          description: Process instances reference this process (`Conflict`, "Record cannot be modified because it is referenced by other resources")
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Error' }

  # ══════════════════════════════════════════════════════════════════════════════
  # LAYER 2 — GRANULAR STATE MANAGEMENT
  # ══════════════════════════════════════════════════════════════════════════════

  /process/{processCode}/state:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'

    post:
      summary: Add a state to an existing process
      operationId: createState
      tags: [State]
      description: |
        Adds a new state to the most recently created version of an existing
        process. Use for surgical additions after the initial definition was
        created. For a new process, use `POST /process/definition` instead.

        - Only `code` and `name` are required. `type` is optional and defaults
          to `INTERMEDIATE`; an unknown value returns `400`.
        - Validation: `code` ≤ 64, `name` ≤ 128, `description` ≤ 512
          characters; failures return `400` with the message
          `Invalid input data`.
        - `code` must be unique within the process; a duplicate returns `400`
          (`ValidationError`, "This record already exists"), not `409`.
        - The single-`INITIAL` rule is **not** enforced here: a second
          `INITIAL` state is accepted.
        - `isParallel`, `isJoin` and `branchStates` are accepted and stored
          (they drive parallel/join transitions) but are not echoed in the
          response.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateInput'
            examples:
              addSeniorReview:
                summary: Add an intermediate senior review state
                value:
                  code: SENIOR_REVIEW
                  name: Senior Review
                  type: INTERMEDIATE
                  description: Escalated for senior officer review.
                  sla: 86400000
      responses:
        '201':
          description: State added to the process.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List states in a process
      operationId: listStates
      tags: [State]
      description: Returns the states of the most recently created version of the process identified by `processCode`, ordered by creation time.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: query
          required: false
          description: Restrict to the given state code(s). Repeat the parameter for several values.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              maxLength: 64
      responses:
        '200':
          description: States returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /process/{processCode}/state/{stateCode}:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'
      - $ref: '#/components/parameters/StateCodePath'

    get:
      summary: Get a state by code
      operationId: getState
      tags: [State]
      description: Returns the state identified by `stateCode` within `processCode`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: State returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '404':
          description: Process or state not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Update a state
      operationId: updateState
      tags: [State]
      description: |
        Partially updates the state identified by `stateCode` within
        `processCode`. Only `name`, `description`, `sla`, `additionalDetails`
        and `type` are read from the body; a field is applied only when present
        (and, for `name`, `description` and `type`, non-empty). Omitted fields
        keep their stored values. `code` and `processCode` are immutable
        (a `code` in the body is ignored). The merged state is validated with
        the same rules as POST (`400` on failure). Changing `type` to
        `INITIAL` is not checked against other `INITIAL` states.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateInput'
      responses:
        '200':
          description: State updated.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Process or state not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a state
      operationId: deleteState
      tags: [State]
      description: |
        Permanently deletes the state. Actions on the state (and actions of
        other states that target it) are deleted with it, silently. If any
        process instance row references the state the database rejects the
        delete and the service returns `500` (`InternalServerError`,
        "failed to delete state") — not `409`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: State deleted.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '404':
          description: Process or state not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Delete failed — typically because process instances still reference this state (`InternalServerError`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # LAYER 3 — GRANULAR ACTION MANAGEMENT
  # ══════════════════════════════════════════════════════════════════════════════

  /process/{processCode}/state/{stateCode}/action:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'
      - $ref: '#/components/parameters/StateCodePath'

    post:
      summary: Add an action to a state
      operationId: createAction
      tags: [Action]
      description: |
        Adds a new action to the state identified by `stateCode` within
        `processCode`.

        - `nextState` is required and must reference a `State.code` in the
          same process; a missing or unknown `nextState` returns `400`
          (`ValidationError`), not `404`.
        - `code` is required by the database (`NOT NULL`, ≤ 64 characters);
          omitting it returns `400` with the raw database message. `label` is
          limited to 128 characters.
        - Uniqueness of `code` within the state is **not** enforced: a
          duplicate action code is accepted and stored as a second row.
        - `roles` (array of role codes) and `assigneeCheck` are accepted and
          stored.
        - Any failure while inserting the row is returned as `400`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionInput'
            examples:
              escalateAction:
                summary: Add an escalate action
                value:
                  code: ESCALATE
                  label: Escalate to Senior
                  nextState: SENIOR_REVIEW
      responses:
        '201':
          description: Action added.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Process or state not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List actions for a state
      operationId: listActions
      tags: [Action]
      description: Returns all actions on the state identified by `stateCode` within `processCode`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: query
          required: false
          description: Restrict to the given action code(s). Repeat the parameter for several values.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              maxLength: 64
      responses:
        '200':
          description: Actions returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '404':
          description: Process or state not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /process/{processCode}/state/{stateCode}/action/{actionCode}:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'
      - $ref: '#/components/parameters/StateCodePath'
      - $ref: '#/components/parameters/ActionCodePath'

    get:
      summary: Get an action by code
      operationId: getAction
      tags: [Action]
      description: Returns the action identified by `actionCode` on `stateCode` within `processCode`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
