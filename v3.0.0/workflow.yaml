    post:
      summary: Create an escalation configuration
      operationId: createEscalationConfig
      tags: [EscalationConfig]
      description: |
        Creates a new escalation configuration for a state within
        `processCode` (the path value may be the process code or the process
        UUID; a code resolves to its most recently created version).

        - `stateCode` must be an existing state of the process, otherwise
          `400` (`ValidationError`), not `404`. An unknown process also
          returns `400`.
        - At least one of `stateSlaMinutes` / `processSlaMinutes` must be
          given and each, when given, must be positive, otherwise `400`.
        - `escalationAction` is stored as given; it is **not** checked against
          the actions of the state. It is required by the database
          (`NOT NULL`, ≤ 64 characters); omitting it returns `400` with the
          raw database message.
        - At most one config per `stateCode` per process: a duplicate returns
          `400` (`ValidationError` with the raw unique-constraint message),
          not `409`.
        - The `processCode` in the response echoes the path value as sent.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationConfigInput'
            examples:
