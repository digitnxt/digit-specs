openapi: 3.0.3
info:
  title: Notify API
  version: 1.0.0
  description: |
    Sends notifications and manages the notification configs, provider mappings and
    provider registry they depend on.

    All endpoints are mounted under `/v3` with no servlet context path (a deployment may
    add its own prefix, e.g. `/notify/v3/...`).

    Error bodies are ALWAYS a bare JSON array of Error objects, for every status
    (400, 404, 409, 500): `[{"code": "...", "message": "..."}]`. Codes the service emits:
    `NOT_FOUND` (404, also for an unmapped URL), `CONFLICT` (409), `BAD_REQUEST` (400),
    `INTERNAL_ERROR` (500, database unreachable). Bean-validation failures answer 400 with
    one entry per violation whose code is the constraint path (e.g.
    `NotBlank.notifyRequestDto.templateCode`). A path id that is not a UUID answers 400 with
    code `MethodArgumentTypeMismatchException`; an unparsable JSON body answers 400 with
    code `JsonParseException`, `JsonMappingException` or `MissingJsonException`.

    Channel names and dispatch statuses are emitted in UPPERCASE (`SMS`, `EMAIL`,
    `WHATSAPP`, `PUSH`; `DISPATCHED`, `SKIPPED`, `FAILED`).

servers:
  - url: /v3
    description: Relative base path; every endpoint below is served under /v3

security:
  - BearerAuth: []

tags:
  - name: Notify
  - name: NotificationConfigs
  - name: ProviderMappings
  - name: Providers

paths:

  /notifications:
    post:
      tags: [Notify]
      summary: Send a notification
      description: |
        Triggers a notification for a given recipient based on the active
        notification-config identified by templateCode (scoped to X-Tenant-ID).
        The service renders each enabled channel's templates with the supplied
        payload, resolves providers via provider-mappings and tries them in order.

        Dispatch runs for all four channels in parallel and the request returns 202
        once every channel has an outcome; the response always carries one
        ChannelDispatchStatus per channel (SMS, EMAIL, WHATSAPP, PUSH).
        A channel that is disabled or absent in the config, or whose address is
        missing from `recipient`, is SKIPPED. A template-rendering failure
        (missing variable, bad JSONPath, no `default` locale), a missing provider
        mapping, deactivated/unloaded providers or an exhausted fallback chain are
        reported as FAILED inside the 202 — never as 422.
      operationId: sendNotification
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyRequest'
      responses:
        '202':
          description: Accepted — per-channel outcome in `channels[]`
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyResponse'
        '400':
          description: |
            Validation error — templateCode blank, recipient missing, payload missing,
            or an unparsable JSON body.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: |
            No active notification config for the given templateCode in this tenant
            (code NOT_FOUND, message "NotificationConfig not found with id: {templateCode}").
            A config switched off with isActive=false answers the same.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /notification-configs:
    post:
      tags: [NotificationConfigs]
      summary: Create notification config
      description: |
        Creates the config for a templateCode in this tenant. The config is always
        created active — `isActive` in the body is ignored on create. `tag` is an
        optional grouping label. A duplicate templateCode in the same tenant answers 409.
      operationId: createNotificationConfig
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfig'
      responses:
        '201':
          description: Created
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'
        '400':
          description: |
            Validation error — templateCode blank, channels missing, or
            channels.email.format not "text"/"html".
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: A config with this templateCode already exists for the tenant (code CONFLICT)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      tags: [NotificationConfigs]
      summary: List notification configs
      description: |
        Lists the tenant's configs. Filters are exact matches, combinable, and a
        filter left out is not applied.
      operationId: listNotificationConfigs
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: templateCode
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: Exact match on the config's grouping tag.
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of configs
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationConfig'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /notification-configs/{config_id}:
    get:
      tags: [NotificationConfigs]
      summary: Get notification config
      operationId: getNotificationConfig
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: config_id
          in: path
          required: true
          description: Config UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Config
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'
        '400':
          description: config_id is not a UUID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found, or the config belongs to another tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      tags: [NotificationConfigs]
      summary: Update notification config
      description: |
        Full replace of `channels` and `tag` (tag is cleared when omitted).
        `templateCode` must equal the stored one — a different value answers 400.
        `isActive` is optional here: false switches the template off, true switches
        it back on, absent leaves it as stored.
      operationId: updateNotificationConfig
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: config_id
          in: path
          required: true
          description: Config UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfig'
      responses:
        '200':
          description: Updated
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'
        '400':
          description: |
            Validation error — templateCode blank or different from the stored one,
            channels missing, channels.email.format invalid, or config_id not a UUID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found, or the config belongs to another tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      tags: [NotificationConfigs]
      summary: Delete notification config
      description: Removes the config permanently (use isActive=false on PUT to keep it).
      operationId: deleteNotificationConfig
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: config_id
          in: path
          required: true
          description: Config UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Path id is not a UUID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found, or the resource belongs to another tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /provider-mappings:
    get:
      tags: [ProviderMappings]
      summary: List provider mappings
      description: Lists the tenant's mappings, optionally for one channel.
      operationId: listProviderMappings
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: channel
          in: query
          description: Accepted in any case; trimmed and upper-cased before matching.
          schema:
            type: string
            enum: [SMS, EMAIL, WHATSAPP, PUSH]
      responses:
        '200':
          description: List of provider mappings
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderMapping'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    post:
      tags: [ProviderMappings]
      summary: Create provider mapping
      description: |
        `channel` is accepted in any case and stored UPPERCASE; `country` is trimmed
        and upper-cased, and omitted for the tenant-wide (global) mapping. Every
        provider name must be loaded (see GET /providers) and support the channel.
      operationId: createProviderMapping
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderMapping'
      responses:
        '201':
          description: Created
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMapping'
        '400':
          description: |
            Validation error — channel blank or not one of [SMS, EMAIL, WHATSAPP, PUSH],
            country blank, providers empty, a provider not found in the registry, or a
            provider that does not support the channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Mapping already exists for this tenant + channel + country scope (code CONFLICT)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /provider-mappings/{mapping_id}:
    put:
      tags: [ProviderMappings]
      summary: Update provider mapping
      description: |
        Replaces `providers` only. `channel` and `country` must match the stored
        mapping (compared case-insensitively) — a different value answers 400; delete
        and re-create to move a mapping.
      operationId: updateProviderMapping
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: mapping_id
          in: path
          required: true
          description: Mapping UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderMapping'
      responses:
        '200':
          description: Updated
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMapping'
        '400':
          description: |
            Validation error — same rules as create, plus channel/country differing
            from the stored mapping, or mapping_id not a UUID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found, or the mapping belongs to another tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      tags: [ProviderMappings]
      summary: Delete provider mapping
      operationId: deleteProviderMapping
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: mapping_id
          in: path
          required: true
          description: Mapping UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Path id is not a UUID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found, or the resource belongs to another tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /providers:
    get:
      tags: [Providers]
      summary: List providers
      description: |
        The provider registry: one entry per provider jar loaded by this deployment.
        It is shared by all tenants, not tenant data.
      operationId: listProviders
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: channel
          in: query
          schema:
            type: string
            enum: [SMS, EMAIL, WHATSAPP, PUSH]
          description: |
            Filter providers by supported channel. Matched case-sensitively against
            the stored UPPERCASE values — `channel=sms` matches nothing; use `SMS`.
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active/inactive status.
      responses:
        '200':
          description: List of providers
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /providers/{provider_id}/status:
    patch:
      tags: [Providers]
      summary: Enable or disable a provider
      description: |
        Switches the provider on or off for every tenant from the next send.
        Sends that resolve only deactivated providers for a channel report that
        channel as FAILED.
      operationId: updateProviderStatus
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: provider_id
          in: path
          required: true
          description: Provider UUID. A value that is not a UUID answers 400.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderStatusUpdate'
      responses:
        '200':
          description: Updated
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          description: provider_id is not a UUID, or the body is not valid JSON
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

components:

  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth'

  parameters:
    RequestIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader'
    CorrelationIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader'
    UserAgentHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader'
    TenantIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader'
    ForwardedForHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader'
    ClientId:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId'
    ClientSecret:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret'
    TimeStamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp'

  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'

  schemas:

    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'

    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail'

    NotificationConfig:
      type: object
      required:
        - templateCode
        - channels
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
          description: Taken from X-Tenant-ID; never read from the body.
        templateCode:
          type: string
          description: Unique per tenant. Immutable after create.
        isActive:
          type: boolean
          description: |
            Ignored on create (a new config is always active). On update: false
            switches the template off (sends answer 404), true switches it back on,
            absent leaves the stored value. Always present in responses.
        tag:
          type: string
          nullable: true
          description: Optional free-form grouping label, filterable on the list endpoint.
        channels:
          $ref: '#/components/schemas/Channels'

    Channels:
      type: object
      properties:
        sms:
          $ref: '#/components/schemas/SmsChannelConfig'
        email:
          $ref: '#/components/schemas/EmailChannelConfig'
        whatsapp:
          $ref: '#/components/schemas/WhatsappChannelConfig'
        push:
          $ref: '#/components/schemas/PushChannelConfig'

    LocalizedString:
      type: object
      description: |
        Key-value map for localized content.
        Keys represent locale codes (e.g., default, hi, ta).
        "default" is mandatory fallback when locale-specific value is not found.
      additionalProperties:
        type: string

    BaseChannelConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Absent is read as false — the channel is SKIPPED on every send.
        priority:
          type: string
          description: Stored as given; not validated and not used by dispatch.
        body:
          $ref: '#/components/schemas/LocalizedString'
        payloadBindings:
          $ref: '#/components/schemas/VariableMap'

    SmsChannelConfig:
      allOf:
        - $ref: '#/components/schemas/BaseChannelConfig'
        - type: object
          properties:
            body:
              allOf:
                - $ref: '#/components/schemas/LocalizedString'
              example:
                default: "{{otp}} is your OTP. Valid for {{expiry_minutes}} mins. Do not share."
                hi: "{{otp}} आपका OTP है। {{expiry_minutes}} मिनट में समाप्त। किसी को न बताएं।"
                ta: "{{otp}} உங்கள் OTP. {{expiry_minutes}} நிமிடங்களில் காலாவதியாகும்."

    EmailChannelConfig:
      allOf:
        - $ref: '#/components/schemas/BaseChannelConfig'
        - type: object
          properties:
            subject:
              allOf:
                - $ref: '#/components/schemas/LocalizedString'
              example:
                default: "Your OTP for login"
                hi: "लॉगिन के लिए आपका OTP"
                ta: "உங்கள் உள்நுழைவு OTP"
            format:
              type: string
              enum: [text, html]
              default: text
              description: |
                Compared case-insensitively. "html" sends the body as HTML with
                variable values escaped. Any other value answers 400.

    WhatsappChannelConfig:
      allOf:
        - $ref: '#/components/schemas/BaseChannelConfig'
        - type: object
          properties:
            body:
              allOf:
                - $ref: '#/components/schemas/LocalizedString'
              example:
                default: "Hi {{name}}, your OTP is {{otp}}. Valid for {{expiry_minutes}} mins."
                hi: "नमस्ते {{name}}, आपका OTP {{otp}} है। {{expiry_minutes}} मिनट के लिए वैध।"
                ta: "வணக்கம் {{name}}, உங்கள் OTP {{otp}}. {{expiry_minutes}} நிமிடங்கள்."

    PushChannelConfig:
      allOf:
        - $ref: '#/components/schemas/BaseChannelConfig'
        - type: object
          properties:
            title:
              allOf:
                - $ref: '#/components/schemas/LocalizedString'
              example:
                default: "Login OTP"
                hi: "लॉगिन OTP"
                ta: "உள்நுழைவு OTP"

    VariableMap:
      type: object
      description: |
        Mapping of template variables to JSONPath expressions.
        Evaluated against the event payload at runtime to extract values for template rendering.
      additionalProperties:
        type: string
        description: JSONPath expression
      example:
        otp: "$.data.otp_code"
        expiry_minutes: "$.data.expiry.minutes"

    ProviderMapping:
      type: object
      required:
        - channel
        - providers
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          readOnly: true
          description: Taken from X-Tenant-ID; never read from the body.
        channel:
          type: string
          enum: [SMS, EMAIL, WHATSAPP, PUSH]
          description: Accepted in any case on input; stored and returned UPPERCASE.
        country:
          type: string
          nullable: true
          maxLength: 10
          description: |
            Optional ISO country code. Trimmed and upper-cased on save; a blank value
            answers 400. Omit it (null in responses) for the tenant-wide default
            mapping.
        providers:
          type: array
          description: |
            Ordered list of provider names. First entry is the primary provider,
            subsequent entries are fallbacks in order. Every name must be loaded in
            the provider registry and support the channel, else 400.
          items:
            type: string
          minItems: 1
          example: ["twilio", "kaleyra", "exotel"]

    NotifyRequest:
      type: object
      required:
        - templateCode
        - recipient
        - payload
      properties:
        templateCode:
          type: string
          description: |
            Identifies which notification config to use. The service looks up
            the active config for this templateCode scoped to the tenant
            (X-Tenant-ID) and dispatches to all channels enabled in that config.
          example: OTP_LOGIN
        recipient:
          $ref: '#/components/schemas/Recipient'
        payload:
          type: object
          description: |
            Event payload (required; may be an empty object). Each channel config's
            payloadBindings JSONPath expressions are evaluated against this object at
            runtime to extract template variable values.
          additionalProperties: true
          example:
            data:
              otp_code: "482910"
              expiry:
                minutes: 10
        locale:
          type: string
          description: |
            BCP-47 locale code (e.g. "hi", "ta"). Falls back to "default"
            if no locale-specific template body is found.
          example: hi
        metadata:
          type: object
          description: Dispatch-level context forwarded to providers (e.g. campaign tags, correlation ids). Values may be any JSON type.
          additionalProperties: true

    Recipient:
      type: object
      description: |
        Delivery addresses for each channel. None is required: an enabled channel
        whose address is absent or blank is reported as SKIPPED
        ("No phone number on recipient", etc.). Formats are not validated.
      properties:
        phone:
          type: string
          description: Used by the SMS and WHATSAPP channels. Not validated.
          example: "+919876543210"
        email:
          type: string
          description: Used by the EMAIL channel. Not validated.
          example: user@example.com
        deviceTokens:
          type: array
          description: FCM / APNs device tokens, used by the PUSH channel. Absent is treated as empty.
          items:
            type: string
        countryCode:
          type: string
          description: |
            ISO 3166-1 alpha-2. Used by provider-mapping resolution to select
            country-specific providers. Falls back to global mapping if absent.
          example: IN
        metadata:
          type: object
          description: |
            Recipient-scoped context (e.g. userId, name). Distinct from top-level
            request metadata which carries dispatch/campaign-level context.
            Values may be any JSON type.
          additionalProperties: true
          example:
            userId: "usr_12345"
            name: "Ravi Kumar"

    NotifyResponse:
      type: object
      properties:
        notificationId:
          type: string
          description: Unique ID for this dispatch event ("ntf_" followed by a ULID).
          example: "ntf_01J2K9X8ZQPMBVFW3DTYS4R6NE"
        templateCode:
          type: string
        channels:
          type: array
          description: Always four entries, one per channel (SMS, EMAIL, WHATSAPP, PUSH), in no fixed order.
          items:
            $ref: '#/components/schemas/ChannelDispatchStatus'

    ChannelDispatchStatus:
      type: object
      properties:
        channel:
          type: string
          enum: [SMS, EMAIL, WHATSAPP, PUSH]
        status:
          type: string
          enum: [DISPATCHED, SKIPPED, FAILED]
          description: |
            DISPATCHED — a provider accepted the message.
            SKIPPED — channel disabled or absent in the config, or no address for it on the recipient.
            FAILED — template rendering failed, no provider mapping, all mapped providers
            deactivated or not loaded, or every provider in the chain failed; see reason.
        provider:
          type: string
          description: |
            Name of the provider that accepted the message (or, on FAILED, the last one
            tried). The literal "none" when SKIPPED or when the failure happened before
            any provider was tried.
        reason:
          type: string
          nullable: true
          description: null when DISPATCHED; the skip or failure reason otherwise.

    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        providerName:
          type: string
        channels:
          type: array
          description: Channels this provider supports (UPPERCASE).
          items:
            type: string
            enum: [SMS, EMAIL, WHATSAPP, PUSH]
        isActive:
          type: boolean

    ProviderStatusUpdate:
      type: object
      properties:
        isActive:
          type: boolean
          default: false
          description: Not validated — an absent field is read as false and deactivates the provider.
