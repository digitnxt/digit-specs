openapi: 3.0.3
info:
  title: Localization Service API
  description: >
    Service for managing and retrieving localization messages for applications.
    Messages support active, inactive, disabled, and draft statuses. Searches
    default to active when status is omitted.

    Service-raised errors are returned as a bare JSON array of `{code, message}`
    objects. Codes: Localization.MissingTenantId (400), Localization.InvalidRequest
    (400: missing/malformed body, failed field validation, unsupported status),
    Localization.InvalidInput (400: malformed UUID), Localization.MissingUUID (400),
    Localization.Conflict (409), Localization.NotFound (404).
  version: 3.0.0
servers:
- url: https://api.example.com/localization/v3
  description: Production server
- url: https://staging-api.example.com/localization/v3
  description: Staging server
components:
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    UserId:
      name: X-User-ID
      in: header
      required: false
      description: The ID of the user making the request.
      schema:
        type: string
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
  schemas:
    MessageStatus:
      type: string
      enum: [active, inactive, disabled, draft]
      description: Lifecycle status of a localization message. Values are case-sensitive.
      example: draft
    Message:
      type: object
      required:
      - code
      - module
      - locale
      - message
      properties:
        uuid:
          type: string
          format: uuid
          description: >
            Unique identifier of the record. Always present in responses. On create
            it is ignored (the service generates a new UUID). On upsert it is used
            for a newly inserted row; an existing row keeps its stored UUID.
        module:
          type: string
          description: Tag associated with the message (used for grouping)
          minLength: 1
        locale:
          description: The language code for which the message is added
          type: string
          minLength: 1
        code:
          description: The code of the message
          type: string
          minLength: 1
        message:
          type: string
          description: The text to display. Required and must be non-empty on create and upsert.
          minLength: 1
        status:
          allOf:
          - $ref: '#/components/schemas/MessageStatus'
          description: >
            Defaults to active when creating a message, including a new upserted
            message. Omit on upsert to preserve an existing message's status.
          example: draft
    UpdateMessage:
      type: object
      required:
      - uuid
      - message
      properties:
        uuid:
          type: string
          format: uuid
          description: Unique identifier of the record
          minLength: 1
        code:
          description: Accepted but ignored; the stored code of a message is never changed by an update.
          type: string
        message:
          type: string
          description: >
            New text. Effectively required: the stored text is replaced (not preserved)
            on every update, and the column is NOT NULL, so omitting it fails with 500.
        status:
          allOf:
          - $ref: '#/components/schemas/MessageStatus'
          description: New status. Omit to preserve the current status. Set active to publish a draft.
          example: active
    CreateMessagesRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
    UpsertMessagesRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
    UpdateMessagesRequest:
      type: object
      required:
      - messages
      properties:
        uuid:
          type: string
          description: Accepted but ignored; only the per-item `uuid` is used.
        locale:
          description: Accepted but ignored; the locale of a message is never changed by an update.
          type: string
        module:
          type: string
          description: Accepted but ignored; the module of a message is never changed by an update.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateMessage'
    FindMissingMessagesRequest:
      type: object
      properties:
        locales:
          type: array
          description: The language code for which the message is added
          items:
            type: string
    CreateMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    UpsertMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    UpdateMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    DeleteMessagesResponse:
      type: object
      properties:
        success:
          type: boolean
    SearchMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    FindMissingMessagesResponse:
      type: object
      description: >
        A map of module name to a map of locale to list of missing message codes.
        Each top-level key is a module; under it, each key is a locale whose
        value is the array of codes present in other locales but absent here.
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      example:
        common:
          en_IN:
          - WELCOME_MESSAGE
          - LOGOUT_BUTTON
          hi_IN:
          - WELCOME_MESSAGE
    CacheBustResponse:
      type: object
      properties:
        message:
          type: string
          example: Cache bust operation completed successfully
        success:
          type: boolean
          example: true
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
tags:
- name: Messages
  description: Core endpoints for managing localization messages.
- name: Cache
  description: Endpoints for cache management.
paths:
  /messages:
    get:
      tags:
      - Messages
      summary: Search for localization messages
      description: >
        Searches for localization messages using URL query parameters. If status
        is omitted, only active messages are returned. Use status=draft to find
        drafts, or explicitly select active, inactive, or disabled. Unsupported
        status values return HTTP 400 (Localization.InvalidRequest).

        When `codes` is supplied the search is by code (optionally narrowed by
        `locale`); `module`, `limit` and `offset` are ignored, the result is not
        ordered, and the cache is bypassed. Otherwise the search is by optional
        `module`/`locale`, ordered by code ascending; status is applied in SQL
        before pagination when a positive `limit` is given, and non-paginated
        results are served from the cache when available.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: status
        in: query
        required: false
        description: Filter by status. Omitted status defaults to active.
        schema:
          allOf:
          - $ref: '#/components/schemas/MessageStatus'
          default: active
        examples:
          active:
            summary: Search active messages (also the default)
            value: active
          draft:
            summary: Search draft messages
            value: draft
      - name: module
        in: query
        required: false
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
      - name: codes
        in: query
        required: false
        description: >
          Comma-separated message codes (a repeated `codes` parameter is also
          accepted). When present, `module`, `limit` and `offset` are ignored.
          Status filtering also applies to code searches.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        required: false
        description: >
          Positive page size enables pagination. Non-numeric or non-positive
          values are treated as 0 (no pagination) rather than rejected.
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: >
          Pagination offset; read only when `limit` is also provided. Non-numeric
          values are treated as 0 rather than rejected.
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: A list of found messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: searchMessages
    post:
      tags:
      - Messages
      summary: Create new localization messages
      description: >
        Creates one or more new localization messages. Status defaults to active
        when omitted. Each item must carry non-empty code, message, module and
        locale; a missing or empty body, malformed JSON, or an empty `messages`
        array returns 400 (Localization.InvalidRequest). Any `uuid` supplied in an
        item is ignored and a new one is generated. The batch is all-or-nothing:
        a duplicate key within the batch, or one that already exists for the
        tenant, rejects the whole request with 409 (Localization.Conflict).
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        description: Request body to create messages
        required: true
        content:
          application/json:
            examples:
              active:
                summary: Create an active message explicitly
                value:
                  messages:
                  - code: COMMON_SUBMIT
                    message: Submit
                    module: common
                    locale: en_IN
                    status: active
              draft:
                summary: Create a draft message
                value:
                  messages:
                  - code: COMMON_SUBMIT_DRAFT
                    message: Submit draft
                    module: common
                    locale: en_IN
                    status: draft
              defaultActive:
                summary: Omitted status defaults to active
                value:
                  messages:
                  - code: COMMON_CANCEL
                    message: Cancel
                    module: common
                    locale: en_IN
            schema:
              $ref: '#/components/schemas/CreateMessagesRequest'
      responses:
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: >
            Conflict (Localization.Conflict) — a message with the same
            tenant/locale/module/code already exists, or the same key appears
            twice in the request. Nothing from the batch is created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '201':
          description: Messages created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: createMessages
    put:
      tags:
      - Messages
      summary: Update existing localization messages
      description: >
        Updates the text and optionally the status of messages by UUID within the
        tenant. Set status to active to publish a draft. Omit status to preserve
        its current value. Only `uuid`, `message` and `status` of each item are
        used; `code` and the top-level `uuid`/`locale`/`module` are ignored.
        A missing/empty body, malformed JSON, empty `messages` array or an item
        without `uuid` returns 400 (Localization.InvalidRequest); a malformed UUID
        returns 400 (Localization.InvalidInput); if any UUID does not exist for
        the tenant the whole batch is rejected with 404 (Localization.NotFound).
        The response returns the full updated records. Writes invalidate affected
        cached search results after commit.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        description: Request body to update messages
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessagesRequest'
            examples:
              publishDraft:
                summary: Update a draft to active
                value:
                  messages:
                  - uuid: 29a11e6d-5c28-45f6-a473-f7e470d16e75
                    message: Submit
                    status: active
              preserveStatus:
                summary: Change text while preserving status
                value:
                  messages:
                  - uuid: 29a11e6d-5c28-45f6-a473-f7e470d16e75
                    message: Updated submit text
      responses:
        '200':
          description: Messages updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: One or more message UUIDs not found for the tenant (Localization.NotFound); nothing is updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: updateMessages
    delete:
      tags:
      - Messages
      summary: Delete localization messages
      description: >
        Deletes one or more localization messages by UUID within the tenant. At
        least one `uuid` or `uuids` query parameter must be provided; omitting
        both returns 400 (Localization.MissingUUID). A malformed UUID returns 400
        (Localization.InvalidInput). Duplicates are collapsed and UUIDs that do
        not exist are ignored, so the response is `success: true` regardless of
        how many rows were actually deleted. The tenant's cached search results
        are cleared after commit.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: uuid
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: UUID of a single message to delete. At least one of `uuid` or `uuids` is required.
      - name: uuids
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: >
          UUIDs of multiple messages to delete (repeated parameter; a
          comma-separated value is also accepted). At least one of `uuid` or
          `uuids` is required.
      responses:
        '200':
          description: Messages deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: deleteMessages
  /messages/upsert:
    put:
      tags:
      - Messages
      summary: Create or update localization messages
      description: >
        Creates or updates one or more localization messages keyed on
        tenant/locale/module/code. If a message with the same key already exists,
        its text is updated and it keeps its stored UUID; otherwise a new one is
        created (using the item's `uuid` if supplied, else a generated one).
        Explicit status replaces the stored status. Omitted status preserves an
        existing status and defaults new messages to active. Each item must carry
        non-empty code, message, module and locale; otherwise 400
        (Localization.InvalidRequest). Items repeating the same key within one
        request are collapsed to the first occurrence, so the response may contain
        fewer messages than the request.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        description: Request body to upsert messages
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMessagesRequest'
      responses:
        '200':
          description: Messages upserted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
