  /messages/missing:
    post:
      tags:
      - Messages
      summary: Find missing localization codes for a tenant in the given locales
      description: >
        Finds all message codes that are missing for one or more locales within a
        tenant, grouped by module, using an in-memory index of all stored
        messages regardless of status. The response is a map of module → locale →
        [missing codes]. If the request body is empty all locales are checked;
        otherwise only the provided locales are checked. An optional `module` query
        parameter narrows the result to a single module. A tenant with no
        messages, an unknown module, or no missing codes yields 200 with an empty
        object `{}`; this endpoint never returns 404. A malformed JSON body
        returns 400 (Localization.InvalidRequest).
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: module
        in: query
        required: false
        schema:
          type: string
        description: Filter missing-codes analysis to a specific module.
      requestBody:
        description: An optional list of locales to check. If omitted, all locales
          for the tenant are checked.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindMissingMessagesRequest'
      responses:
        '200':
          description: A map of module name to locale to list of missing codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindMissingMessagesResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: findMissingMessages
  /cache:
    delete:
      tags:
      - Cache
      summary: Clear the search cache for the tenant
      description: >
        Invalidates cached search results for the calling tenant only. When both
        `module` and `locale` are given, only that module/locale entry is
        cleared; otherwise (neither, or only one of them) every cached entry of
        the tenant is cleared. Caches of other tenants are never touched.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: module
        in: query
        required: false
        schema:
          type: string
        description: Module to narrow the invalidation to. Only effective together with `locale`.
      - name: locale
        in: query
        required: false
        schema:
          type: string
        description: Locale to narrow the invalidation to. Only effective together with `module`.
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheBustResponse'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: bustCache
