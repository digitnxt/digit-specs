openapi: 3.0.3

info:
  title: Access Control Service API
  version: 3.0.0
  description: |
    Centralized Access Control microservice supporting both Role-Based Access Control (RBAC)
    and Job-Based Access Control (JBAC) for Kong gateway integration.

    Manages per-tenant access control rules with version tracking and internal endpoints
    consumed by the Kong plugin to build a global authorization cache.

    **Two control models:**

    | Model | Key Concept | Enforcement |
    |---|---|---|
    | RBAC | Named roles assigned to users; rules grant or deny access per role | `effect: ALLOW / DENY` |
    | JBAC | Named rules tied to a job scope and jurisdiction hierarchy | `enforcement: REQUIRED / OPTIONAL / DISABLED` |

    **Rule evaluation — RBAC:**
    Rules are evaluated in ascending `priority` order (lower value = evaluated first).
    The first matching rule's `effect` (ALLOW or DENY) wins.
    Rules with the same priority are evaluated in creation-time descending order.

    **Rule evaluation — JBAC:**
    JBAC rules gate access by asserting that the caller holds a job-scoped token
    covering the jurisdiction implied by the request path.
    `enforcement` controls whether the assertion is hard (`REQUIRED`),
    advisory (`OPTIONAL`), or inactive (`DISABLED`).
    `parentImpliesChildren` controls whether a parent jurisdiction token
    also covers child jurisdictions.

    **Tenant scoping:**
    All management endpoints are scoped to the tenant resolved from the `X-Tenant-ID`
    request header. The `tenantId` field is server-populated — never sent by the client.

    **Internal endpoints:**
    `/internal/*` endpoints bypass tenant scoping and return rules across all tenants.
    These are consumed exclusively by the Kong plugin to build its in-memory cache.
    They carry `security: []` (no bearer token required) but must be network-restricted
    to the internal mesh — never exposed publicly.

    **Bulk operations:**
    Bulk create endpoints are atomic — all rules succeed or none are persisted.
    Maximum 500 rules per bulk request.

    **Cache invalidation:**
    `GET /internal/*/rules/version` returns an opaque version token.
    The Kong plugin polls this endpoint and reloads its cache only when the token changes,
    avoiding unnecessary full-ruleset fetches.

servers:
  - url: https://api.example.com/access/v3
    description: Production server
  - url: https://staging-api.example.com/access/v3
    description: Staging server
  - url: http://localhost:8080/access/v3
    description: Local development server

security:
  - BearerAuth: []

tags:
  - name: RBAC Rules
    description: |
      Role-Based Access Control rule management.
      Each rule binds one or more role names to an HTTP method + path pattern
      and declares whether access is allowed or denied.
      Rules are evaluated in priority order; lower priority values are evaluated first.
  - name: JBAC Rules
    description: |
      Job-Based Access Control rule management.
      Each rule defines a path pattern and enforcement level for jurisdiction-based
      access checking. Unlike RBAC, JBAC has no enabled/disabled flag — use
      `enforcement: DISABLED` to deactivate a rule without deleting it.
  - name: Internal
    description: |
      Internal endpoints consumed by the Kong gateway plugin.
      These endpoints are unauthenticated (no bearer token) and must be
      network-restricted to the internal service mesh. They return rules across
      all tenants — not scoped to a single X-Tenant-ID.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════════════════════════════
  # RBAC RULES
  # ══════════════════════════════════════════════════════════════════════════════

  /rbac/rules:

    post:
      summary: Create an RBAC rule
      operationId: createRbacRule
      tags: [RBAC Rules]
      description: |
        Creates a new Role-Based Access Control rule for the calling tenant.

        **Rule evaluation:** Rules are evaluated in ascending `priority` order.
        Lower priority values are checked first. The first rule whose `roleNames`,
        `httpMethod`, and `path` all match the incoming request determines the
        outcome (`ALLOW` or `DENY`).

        **Path patterns:** The `path` field supports static segments
        (`/api/users`), typed path parameter placeholders
        (`{param:UUID}`, `{param:ALNUM}`), and a trailing wildcard (`*`)
        as the final segment only. Examples:
        - `/api/users` — exact static match
        - `/api/users/{param:UUID}` — matches any UUID segment
        - `/api/reports/*` — matches any sub-path under `/api/reports/`

        **Idempotency:** Supplying the same `Idempotency-Key` within 24 hours
        returns the original record without creating a duplicate.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RbacRuleRequest'
            examples:
              allowAdminPost:
                summary: Allow admins and moderators to create users
                value:
                  roleNames: [admin, moderator]
                  httpMethod: POST
                  path: /api/users
                  effect: ALLOW
                  priority: 10
                  description: Allow admins and moderators to create users
                  enabled: true
              denyGuestDelete:
                summary: Deny guest role from deleting any resource
                value:
                  roleNames: [guest]
                  httpMethod: DELETE
                  path: /api/*
                  effect: DENY
                  priority: 1
                  description: Guests cannot delete anything
                  enabled: true
              allowAnalystRead:
                summary: Allow analyst role to read reports (UUID segment)
                value:
                  roleNames: [analyst]
                  httpMethod: GET
                  path: /api/reports/{param:UUID}
                  effect: ALLOW
                  priority: 20
                  description: Allow analysts to read individual report records
                  enabled: true
      responses:
        '201':
          description: RBAC rule created successfully.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error — missing required fields or constraint violations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to manage RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity — business rule violation (e.g. duplicate priority conflict).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List RBAC rules for the tenant
      operationId: listRbacRules
      tags: [RBAC Rules]
      description: |
        Returns a paginated list of RBAC rules for the calling tenant.

        Results are sorted by `priority` ascending, then by `createdTime` descending.
        Disabled rules are included by default; use `enabled=false` to see only
        inactive rules, or `enabled=true` to see only active ones.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: limit
          in: query
          required: false
          description: Maximum number of rules to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of rules to skip before returning results. Use with `limit` for pagination.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: roleName
          in: query
          required: false
          description: Filter rules by role name (exact match). Returns all rules that include this role.
          schema:
            type: string
            maxLength: 64
        - name: httpMethod
          in: query
          required: false
          description: Filter rules by HTTP method.
          schema:
            $ref: '#/components/schemas/HttpMethod'
        - name: effect
          in: query
          required: false
          description: Filter rules by effect.
          schema:
            $ref: '#/components/schemas/RbacEffect'
        - name: enabled
          in: query
          required: false
          description: Filter by enabled status. Omit to return both enabled and disabled rules.
          schema:
            type: boolean
      responses:
        '200':
          description: RBAC rules returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleListResponse'
        '400':
          description: Validation error — invalid query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to list RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /rbac/rules/bulk:

    post:
      summary: Bulk create RBAC rules
      operationId: bulkCreateRbacRules
      tags: [RBAC Rules]
      description: |
        Creates multiple RBAC rules for the calling tenant in a single atomic operation.

        **Atomicity:** All rules in the request must pass validation for any to be
        persisted. If any rule fails validation, the entire operation is rolled back
        and no rules are created.

        **Limit:** Maximum 500 rules per request. Requests exceeding this return `400`.

        Use this endpoint when bootstrapping a tenant's access control policy
        (e.g. on tenant provisioning) to avoid multiple round trips.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRbacRuleRequest'
            example:
              rules:
                - roleNames: [admin]
                  httpMethod: POST
                  path: /api/users
                  effect: ALLOW
                  priority: 10
                  description: Allow admins to create users
                  enabled: true
                - roleNames: [moderator]
                  httpMethod: GET
                  path: /api/users
                  effect: ALLOW
                  priority: 20
                  description: Allow moderators to view users
                  enabled: true
      responses:
        '201':
          description: All rules created successfully (atomic — all or none).
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateRbacRulesResponse'
        '400':
          description: Validation error — one or more rules failed validation; no rules created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to create RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity — business rule violation; no rules created.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /rbac/rules/tenant:

    delete:
      summary: Delete all RBAC rules for the tenant
      operationId: deleteRbacRulesByTenant
      tags: [RBAC Rules]
      description: |
        Permanently removes **all** RBAC rules for the calling tenant.

        **Destructive operation.** This is a hard delete — rules cannot be recovered.
        Intended for tenant offboarding or full policy reset scenarios.

        **Idempotent:** If the tenant has no rules, the operation succeeds with `204`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '204':
          description: All RBAC rules for the tenant deleted — no content returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to delete all RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /rbac/rules/{id}:

    get:
      summary: Get a specific RBAC rule
      operationId: getRbacRule
      tags: [RBAC Rules]
      description: |
        Retrieves a single RBAC rule by its system-generated UUID.

        The rule must belong to the tenant resolved from `X-Tenant-ID`.
        Attempting to fetch a rule belonging to a different tenant returns `404`
        (not `403`) to avoid leaking rule existence across tenant boundaries.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/RuleIdPath'
      responses:
        '200':
          description: RBAC rule returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error — invalid UUID format.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to read RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found or does not belong to the calling tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    patch:
      summary: Partially update an RBAC rule
      operationId: updateRbacRule
      tags: [RBAC Rules]
      description: |
        Partially updates an existing RBAC rule for the calling tenant.

        **Partial update semantics:** Only fields present in the request body are
        modified. Absent fields retain their current values.

        **Clearing nullable fields:** Sending an explicit JSON `null` for
        `constraints` or `description` clears (nullifies) that column.
        Omitting the field entirely leaves the existing value unchanged.

        **Immutable fields:** `id` and `tenantId` cannot be changed — they are
        ignored if supplied in the request body.

        **Priority reordering:** Updating `priority` takes effect immediately on
        the next rule evaluation cycle.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRbacRuleRequest'
            examples:
              disableRule:
                summary: Disable a rule without changing other fields
                value:
                  enabled: false
              reprioritize:
                summary: Raise a rule's priority
                value:
                  priority: 5
              clearDescription:
                summary: Clear the description field
                value:
                  description: null
      responses:
        '200':
          description: RBAC rule updated successfully.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error — invalid field values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to update RBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found or does not belong to the calling tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity — business rule violation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Delete an RBAC rule
      operationId: deleteRbacRule
      tags: [RBAC Rules]
      description: |
        Permanently removes a single RBAC rule for the calling tenant.

        **Hard delete:** The rule is removed from the database and will not appear
        in list or get operations. This action cannot be undone.

        The rule must belong to the tenant resolved from `X-Tenant-ID`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
