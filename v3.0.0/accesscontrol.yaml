            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JbacRuleResponse'
        '400':
          description: Validation error — invalid field values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to update JBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found or does not belong to the calling tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity — business rule violation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a JBAC rule
      operationId: deleteJbacRule
      tags: [JBAC Rules]
      description: |
        Permanently removes a single JBAC rule for the calling tenant.

        **Hard delete:** The rule is removed from the database and will not appear
        in list or get operations. To temporarily deactivate a rule instead of
        deleting it, PATCH `enforcement` to `DISABLED`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/RuleIdPath'
      responses:
        '204':
          description: JBAC rule deleted — no content returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
        '400':
          description: Validation error — invalid UUID format.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to delete JBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found or does not belong to the calling tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ══════════════════════════════════════════════════════════════════════════════
  # INTERNAL — KONG PLUGIN ENDPOINTS
  # ══════════════════════════════════════════════════════════════════════════════

  /internal/rbac/rules:

    get:
      summary: Get all RBAC rules across all tenants (internal)
      operationId: listAllRbacRules
      tags: [Internal]
      description: |
        Returns a paginated list of RBAC rules across **all tenants**.
        No `X-Tenant-ID` filtering is applied.

        **Consumed by:** Kong gateway plugin to build its in-memory authorization cache.

        **Security:** This endpoint carries `security: []` — no bearer token is
        required. It **must** be network-restricted to the internal service mesh
        and never exposed on the public gateway.

        **Semantics vs public list:** The wire format matches `RbacRuleListResponse`
        but the semantic scope is different — each rule in the response includes its
        `tenantId` to allow the Kong plugin to build per-tenant lookup structures.

        **Pagination:** Maximum `limit` is 1000 (vs 100 for the tenant-scoped endpoint).
        The Kong plugin should paginate using `offset` until `total` is exhausted.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: limit
          in: query
          required: false
          description: Maximum number of rules to return per page (max 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of rules to skip before returning results.
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        '200':
          description: All RBAC rules returned (cross-tenant).
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRbacRulesResponse'
        '400':
          description: Validation error — invalid query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller is not an internal service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /internal/rbac/rules/version:

    get:
      summary: Get RBAC ruleset version token (internal)
      operationId: getAllRbacRulesVersion
      tags: [Internal]
      description: |
        Returns an opaque version token representing the current state of the
        entire RBAC ruleset across all tenants.

        **Cache invalidation pattern:** The Kong plugin polls this endpoint at a
        configured interval. When the token changes (compared to the value it last
        loaded), the plugin fetches the full ruleset via `GET /internal/rbac/rules`.
        When the token is unchanged, the plugin skips the full fetch, avoiding
        unnecessary load.

        **Token format:** The token is opaque. Its internal format is
        implementation-defined and may change between service releases.
        Clients must treat it as an equality-comparable string only — never parse,
        decode, or sort by it.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: RBAC ruleset version token returned.
          headers:
