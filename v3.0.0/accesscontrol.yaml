components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Unique identifier for tracking each request
      schema:
        type: string
        minLength: 2
        maxLength: 64
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Used for distributed tracing across multiple services
      schema:
        type: string
        minLength: 2
        maxLength: 64
    UserAgentHeader:
      name: User-Agent
      in: header
      required: false
      description: Identifies the client making the request
      schema:
        type: string
        minLength: 5
        maxLength: 64
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Identifies the tenant making the request
      schema:
        type: string
        minLength: 2
        maxLength: 64
    ForwardedForHeader:
      name: X-Forwarded-For
      in: header
      required: false
      description: Client IP address for tracing in load-balanced environments
      schema:
        type: string
        minLength: 2
        maxLength: 64
    ClientId:
      name: X-Client-Id
      in: header
      required: false
      description: Unique identifier assigned to the client
      schema:
        type: string
        minLength: 3
        maxLength: 100
    ClientSecret:
      name: X-Client-Secret
      in: header
      required: false
      description: Secret key used to authenticate the client
      schema:
        type: string
        minLength: 8
        maxLength: 256
    TimeStamp:
      name: X-Time-Stamp
      in: header
      required: false
      description: Epoch timestamp in milliseconds when the request was made
      schema:
        type: integer
        minimum: 1000000000000
        maximum: 9999999999999
  headers:
    X-Response-Time:
      description: Total time taken to process the request in milliseconds
      schema:
        type: integer
        minimum: 0
    X-Response-Timestamp:
      description: Server-side timestamp in epoch milliseconds when response was generated
      schema:
        type: integer
        minimum: 1000000000000
        maximum: 9999999999999
    X-Request-ID:
      description: Echoes the X-Request-ID from the request for tracking
      schema:
        type: string
    X-Correlation-ID:
      description: Echoes the X-Correlation-ID to trace request across services
      schema:
        type: string
    X-Tenant-ID:
      description: Echoes the X-Tenant-ID from the request confirming tenant scope
      schema:
        type: string
    X-Rate-Limit:
      description: Maximum number of allowed requests in a given timeframe
      schema:
        type: integer
        minimum: 1
    X-Rate-Limit-Remaining:
      description: Remaining number of requests in the current rate limit window
      schema:
        type: integer
        minimum: 0
    X-Rate-Limit-Reset:
      description: Time in UTC epoch seconds when the rate limit will reset
      schema:
        type: integer
        minimum: 0
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Module-specific error code
          example: Rule.NotFound
        message:
          type: string
          description: Readable error message
          example: Rule not found
        description:
          type: string
          description: Optional long description for debugging
        params:
          type: array
          description: Optional placeholders for dynamic messages
          items:
            type: string
    RbacRule:
      type: object
      required:
      - id
      - tenantId
      - roleNames
      - httpMethod
      - path
      - effect
      - priority
      - enabled
      - createdTime
      - modifiedTime
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier
        tenantId:
          type: string
          readOnly: true
          minLength: 2
          maxLength: 64
          description: Tenant ID
        roleNames:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: List of roles this rule applies to
        httpMethod:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - HEAD
          - OPTIONS
          description: HTTP method
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: URL path to match
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
          description: Action to take
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Rule priority
        description:
          type: string
          maxLength: 512
          description: Optional description
        enabled:
          type: boolean
          description: Whether the rule is active
        createdTime:
          type: integer
          format: int64
          readOnly: true
          description: Creation timestamp
        modifiedTime:
          type: integer
          format: int64
          readOnly: true
          description: Modification timestamp
        createdBy:
          type: string
          readOnly: true
          description: User who created
        modifiedBy:
          type: string
          readOnly: true
          description: User who modified
    DeleteResponse:
