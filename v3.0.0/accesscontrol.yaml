  # ══════════════════════════════════════════════════════════════════════════════
  # JBAC RULES
  # ══════════════════════════════════════════════════════════════════════════════

  /jbac/rules:

    post:
      summary: Create a JBAC rule
      operationId: createJbacRule
      tags: [JBAC Rules]
      description: |
        Creates a new Job-Based Access Control rule for the calling tenant.

        **JBAC vs RBAC:** JBAC does not use roles. Instead, it asserts that the
        caller holds a job-scoped token whose jurisdiction covers the resource
        implied by the request path. The `pathPattern` is used to extract the
        jurisdiction identifier from the URL at runtime.

        **Enforcement levels:**
        - `REQUIRED` — the request is rejected if the caller's job token does not
          cover the extracted jurisdiction.
        - `OPTIONAL` — jurisdiction is checked and logged but never blocks the request.
          Useful during rollout / shadow mode.
        - `DISABLED` — the rule is inactive; no jurisdiction check is performed.
          Prefer this over deletion when the rule may be re-enabled later.

        **Parent-child propagation:** When `parentImpliesChildren: true`, a caller
        holding a jurisdiction token for a parent node (e.g. a state) is also
        considered authorized for all child nodes (e.g. districts within that state).

        **Path patterns:** Same syntax as RBAC — static segments,
        `{param:UUID}` / `{param:ALNUM}` typed placeholders, and a trailing `*`.

        **Idempotency:** Supplying the same `Idempotency-Key` within 24 hours
        returns the original record without creating a duplicate.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JbacRuleRequest'
            examples:
              requiredJurisdiction:
                summary: Mandatory jurisdiction check for report creation
                value:
                  name: Manager Report Create Rule
                  pathPattern: /api/reports/{param:UUID}
                  methods: [POST]
                  enforcement: REQUIRED
                  parentImpliesChildren: true
                  description: Managers must hold a job token covering the report's jurisdiction
              optionalShadow:
                summary: Shadow-mode jurisdiction check (does not block)
                value:
                  name: Analyst Report Read Shadow Rule
                  pathPattern: /api/reports/{param:UUID}
                  methods: [GET]
                  enforcement: OPTIONAL
                  parentImpliesChildren: false
                  description: Logs jurisdiction mismatch but does not block read access
              disabledRule:
                summary: Inactive rule (temporarily disabled)
                value:
                  name: Legacy Payments Rule
                  pathPattern: /api/payments/*
                  methods: [POST, PUT]
                  enforcement: DISABLED
                  parentImpliesChildren: false
                  description: Disabled pending payments service migration
      responses:
        '201':
          description: JBAC rule created successfully.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JbacRuleResponse'
        '400':
          description: Validation error — missing required fields or constraint violations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to manage JBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity — business rule violation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: List JBAC rules for the tenant
      operationId: listJbacRules
      tags: [JBAC Rules]
      description: |
        Returns a paginated list of JBAC rules for the calling tenant.

        **No enabled flag:** JBAC rules do not have an `enabled` field.
        To filter inactive rules, use `enforcement=DISABLED`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: limit
          in: query
          required: false
          description: Maximum number of rules to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of rules to skip before returning results. Use with `limit` for pagination.
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: name
          in: query
          required: false
          description: Filter by rule name (partial match, case-insensitive).
          schema:
            type: string
            maxLength: 64
        - name: enforcement
          in: query
          required: false
          description: Filter by enforcement level.
          schema:
            $ref: '#/components/schemas/JbacEnforcement'
      responses:
        '200':
          description: JBAC rules returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JbacRuleListResponse'
        '400':
          description: Validation error — invalid query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks permission to list JBAC rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests — rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /jbac/rules/bulk:

    post:
      summary: Bulk create JBAC rules
      operationId: bulkCreateJbacRules
      tags: [JBAC Rules]
      description: |
        Creates multiple JBAC rules for the calling tenant in a single atomic operation.

        **Atomicity:** All rules must pass validation for any to be persisted.
        If any rule fails validation the entire operation is rolled back.

        **Limit:** Maximum 500 rules per request.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkJbacRuleRequest'
            example:
              rules:
                - name: Manager Report Create Rule
                  pathPattern: /api/reports
                  methods: [POST]
                  enforcement: REQUIRED
                  parentImpliesChildren: true
                  description: Allow managers to create reports
                - name: Analyst Report Read Rule
                  pathPattern: /api/reports
                  methods: [GET]
                  enforcement: OPTIONAL
                  parentImpliesChildren: false
                  description: Allow analysts to view reports (shadow mode)
      responses:
        '201':
          description: All JBAC rules created successfully (atomic — all or none).
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
