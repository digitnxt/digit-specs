    patch:
      summary: Partially update a JBAC rule
      operationId: updateJbacRule
      tags: [JBAC Rules]
      description: |
        Partially updates an existing JBAC rule for the calling tenant.

        **Partial update semantics:** Only fields present in the request body are
        modified. Absent fields retain their current values.

        **Clearing nullable fields:** Sending an explicit JSON `null` for
        `extractJurisdiction` or `description` clears (nullifies) that column.
        Omitting the field leaves the existing value unchanged.

        **Immutable fields:** `id` and `tenantId` cannot be changed.

        **Switching enforcement:** To temporarily deactivate a rule without
        deleting it, PATCH `enforcement` to `DISABLED`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJbacRuleRequest'
            examples:
              disableRule:
                summary: Deactivate a rule without deleting it
                value:
                  enforcement: DISABLED
              enableParentPropagation:
                summary: Enable parent-implies-children propagation
                value:
                  parentImpliesChildren: true
              clearJurisdictionConfig:
                summary: Clear the jurisdiction extraction config
                value:
                  extractJurisdiction: null
      responses:
