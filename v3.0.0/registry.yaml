openapi: 3.0.3
info:
  title: Registry Service
  version: 3.0.0
  description: 'Comprehensive OpenAPI contract for the Registry Service as implemented
    in `src/services/registry`.

    The service manages schema lifecycle and schema-bound registry records for multi-tenant
    clients, including sync and async persistence modes.


    Every successful response is wrapped in `{success:true, data, error:null, message}`
    (see SuccessEnvelope). Every error the service itself produces is a bare JSON array
    of Error objects with the HTTP status of the failure; the codes used are
    `ValidationError`, `NotFound`, `Conflict` and `InternalServerError`, plus
    framework-derived codes for malformed JSON, bean-validation failures and missing
    query parameters (empty `code`).

    '
servers:
- url: https://api.example.com/registry/v3
  description: Production server
- url: https://staging-api.example.com/registry/v3
  description: Staging server
components:
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Idempotency key for safe retries of create, update, and delete
        operations.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DataIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Either the UUID of the version row or the stable registryId.
    RegistryIdQuery:
      name: registryId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Stable registry identifier shared across versions of a record.
    HistoryQuery:
      name: history
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When true, returns every version for a registryId instead of just
        the latest.
    SchemaCodePath:
      name: schemaCode
      in: path
      required: true
      schema:
        type: string
      description: Schema code that uniquely identifies the schema definition.
    RecordIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the active registry data row. Values that are not a UUID
        are rejected with 404 before any lookup; registryId is not accepted here.
    VerifyIdQuery:
      name: id
      in: query
      required: false
      schema:
        type: string
      description: UUID of the version row or the stable registryId. When blank or
        omitted, `registryId` is used instead.
    VerifyRegistryIdQuery:
      name: registryId
      in: query
      required: false
      schema:
        type: string
      description: Fallback identifier used only when `id` is omitted. If both are
        omitted the lookup fails with 404.
    SchemaVersionQuery:
      name: version
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Specific schema version to retrieve. When omitted the latest active
        version is returned; an unknown version yields 404.
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
      description: Fallback page size, used only when the request body omits `limit`
        or sets it to 0/null. A resolved value below 1 or above 1000 is silently
        replaced by 1000 (never rejected).
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Fallback offset, used only when the request body omits `offset`.
        Negative values are treated as 0.
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    UserIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserIdHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    SchemaRequest:
      type: object
      required:
      - schemaCode
      - definition
      properties:
        tenantId:
          type: string
          description: Accepted but ignored; the tenant always comes from the request
            context.
        schemaCode:
          type: string
          minLength: 1
          description: Must be non-blank; a blank or missing value is rejected with 400.
        definition:
          type: object
          additionalProperties: true
          description: JSON Schema Draft 2020-12 definition for the data payload. A
            missing `$schema` is filled in with the 2020-12 URI; any other `$schema`
            value, or a definition that fails the 2020-12 meta-schema, is rejected with
            400 ValidationError. The stored (and returned) definition always carries
            `$schema`.
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
        x-unique:
          type: array
          description: List of unique constraints; each entry is an array of one or
            more dot-notation field paths that must be unique together among active
            records.
          items:
            type: array
            minItems: 1
            items:
              type: string
        x-ref-schema:
          type: array
          items:
            $ref: '#/components/schemas/RefSchema'
        x-indexes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIndex'
    SchemaUpdateRequest:
      type: object
      required:
      - definition
      description: Body of PUT /schema/{schemaCode}. Same shape as SchemaRequest, but
        bean validation is not applied and `schemaCode` in the body is ignored (the
        path value wins). A missing or null `definition` is still rejected with 400
        ValidationError ("definition is required").
      properties:
        tenantId:
          type: string
          description: Accepted but ignored; the tenant always comes from the request
            context.
        schemaCode:
          type: string
          description: Ignored; the path parameter is used.
        definition:
          type: object
          additionalProperties: true
          description: JSON Schema Draft 2020-12 definition; validated exactly as on
            create.
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
        x-unique:
          type: array
          items:
            type: array
            minItems: 1
            items:
              type: string
        x-ref-schema:
          type: array
          items:
            $ref: '#/components/schemas/RefSchema'
        x-indexes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIndex'
    WebhookConfig:
      type: object
      description: Optional outbound callback invoked after every successful data
        CREATE, UPDATE and DELETE on the schema, with body `{action, schemaCode,
        tenantId, data}`. Only fired when `active` is true and `url` is non-blank.
      properties:
        url:
          type: string
        method:
          type: string
          description: HTTP method (upper-cased); POST when omitted.
        apiKey:
          type: string
          description: When set, sent to the callback as the X-API-Key header.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra headers sent with the callback.
        active:
          type: boolean
          default: false
    Schema:
      type: object
      description: Schema as serialised by the service. The extension keys are emitted
        in camelCase (`xUnique`, `xRefSchema`, `xIndexes`) even though requests use
        the hyphenated `x-unique`/`x-ref-schema`/`x-indexes`, and audit fields are
        flattened (ISO-8601 strings) rather than nested under `auditDetails`.
      required:
      - id
      - tenantId
      - schemaCode
      - version
      - definition
      - isLatest
      - isActive
      - createdTime
      - createdBy
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this schema version row; each version has its own id.
        tenantId:
          type: string
        schemaCode:
          type: string
        version:
          type: integer
          minimum: 1
          description: Schema version; starts at 1 and increments on every effective
            update.
        definition:
          type: object
          additionalProperties: true
          description: Normalised JSON Schema definition (always includes `$schema`).
        xUnique:
          type: array
          description: Unique constraints (see `x-unique` in SchemaRequest). Empty
            array when none were supplied.
          items:
            type: array
            items:
              type: string
        xRefSchema:
          type: array
          items:
            $ref: '#/components/schemas/RefSchema'
        xIndexes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaIndex'
        webhook:
          allOf:
          - $ref: '#/components/schemas/WebhookConfig'
          nullable: true
        isLatest:
          type: boolean
        isActive:
          type: boolean
        createdTime:
          type: string
          format: date-time
        modifiedTime:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
        modifiedBy:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
          description: Request identifier captured when this version was written;
            empty string when the request carried none.
    RefSchema:
      type: object
      required:
      - fieldPath
      - schemaCode
      properties:
        fieldPath:
          type: string
          description: Dot-notation path inside the data payload containing the reference.
            A missing or blank value in a record is rejected with 400 ValidationError;
            an unresolvable reference with 404 NotFound.
        schemaCode:
          type: string
          description: Referenced schema whose data must contain the foreign value.
        refField:
          type: string
          description: Optional field path in the referenced schema (defaults to registryId).
        external:
          type: boolean
          default: false
          description: When true, validate the reference via an external registry
            service. Null is normalised to false, so responses always carry a boolean.
        registry:
          type: string
          nullable: true
          description: Discovery key identifying the target registry for external
            validation. Defaults to schemaCode when omitted.
        x-ref-schema:
          type: string
          nullable: true
          description: Marker key emitted by the service on every RefSchema in
            responses; always null. Ignored on input.
    SchemaIndex:
      type: object
      required:
      - fieldPath
      properties:
        name:
          type: string
          nullable: true
          description: Index name; derived from the table, field path and method when
            omitted.
        fieldPath:
          type: string
          description: Dot-notation path inside `data`. Each segment must match
            `[A-Za-z0-9_-]+`; anything else is rejected with 400 ValidationError.
        method:
          type: string
          enum:
          - btree
          - gin
          description: Postgres index method, matched case-insensitively; btree if
            omitted. Any other value is rejected with 400 ValidationError
            ("unsupported index method").
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    DataRequest:
      type: object
      required:
      - data
      properties:
        tenantId:
          type: string
          description: Accepted but ignored; the tenant always comes from the request
            context.
        schemaCode:
          type: string
          description: Accepted but ignored; the path parameter is used.
        version:
          type: integer
          description: 'Ignored on create. Required on update and must equal the
            current record `version`; a missing/non-positive value is rejected with 400
            ValidationError "version is required for update", a different value with
            400 ValidationError "version mismatch: expected N".'
        data:
          type: object
          additionalProperties: true
          description: Arbitrary JSON payload validated by the schema definition. A
            missing or null value is rejected with 400.
    RegistryData:
      type: object
      description: Registry record as serialised by the service. Audit fields are
        flattened (ISO-8601 strings) rather than nested under `auditDetails`.
      required:
      - id
      - registryId
      - tenantId
      - schemaCode
      - schemaVersion
      - version
      - data
      - isActive
      - effectiveFrom
      - createdTime
      - createdBy
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this version row. Every update inserts a new row
            with a new id; use `registryId` to address the record across versions.
        registryId:
          type: string
          description: Stable identifier generated via idgen at create time.
        tenantId:
          type: string
        schemaCode:
          type: string
        schemaVersion:
          type: integer
          description: Schema version the payload was validated against.
        version:
          type: integer
          description: Record version; 1 on create, incremented on every update.
        data:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: Null while the row is the active version; set when it is
            superseded or deleted.
        createdTime:
          type: string
          format: date-time
        modifiedTime:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
        modifiedBy:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
    SearchRequest:
      type: object
      properties:
        tenantId:
          type: string
          description: Accepted but ignored; the tenant always comes from the request
            context.
        schemaCode:
          type: string
          description: Accepted but ignored; the path parameter is used.
        filters:
          type: object
          additionalProperties: {}
          description: Equality filters on dot-notation paths inside `data`, compared
            as text. Each path segment must match `[A-Za-z0-9_-]+` (400 otherwise).
        contains:
          type: object
          additionalProperties: {}
          description: JSON containment predicate applied with data @> value.
        limit:
          type: integer
          description: Page size. Omitted, null or 0 falls back to the `limit` query
            parameter, then to 100. A resolved value below 1 or above 1000 is silently
            replaced by 1000 (never rejected).
        offset:
          type: integer
          description: Omitted or null falls back to the `offset` query parameter,
            then to 0. Negative values are treated as 0.
    ExistsResponse:
      type: object
      required:
      - exists
      properties:
        exists:
          type: boolean
    SuccessEnvelope:
      type: object
      description: Envelope returned by every 2xx response.
      required:
      - success
      - data
      - error
      - message
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          nullable: true
          description: Payload; varies by endpoint. Null for 202 responses and for
            deletes.
        error:
          type: string
          nullable: true
          description: Always null on success.
        message:
          type: string
          nullable: true
          description: Human-readable outcome for mutating operations (for example
            "Schema created successfully", "Data persistence queued successfully");
            null for reads, searches and existence checks.
    MessageResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: object
            nullable: true
            description: Always null.
    VerificationResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - valid
            properties:
              valid:
                type: boolean
    ResponseEnvelope:
      oneOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: array
        items:
          $ref: '#/components/schemas/Error'
    SchemaResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Schema'
    SchemaListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Schema'
    RegistryDataResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/RegistryData'
    RegistryDataListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/RegistryData'
    ExistsEnvelope:
      allOf:
      - $ref: '#/components/schemas/SuccessEnvelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/ExistsResponse'
    IsExistRequest:
      type: object
      properties:
        tenantId:
          type: string
          description: Accepted but ignored; the tenant always comes from the request
            context.
        field:
          type: string
          description: Field to test - `registryId` (default when omitted or blank),
            `id` (version-row UUID) or a dot-notation path inside `data` (each segment
            `[A-Za-z0-9_-]+`, otherwise 400).
        value:
          type: string
          description: Value to compare. Not validated as required - when omitted
            the check simply reports `exists:false` (or fails with 400 when `field`
            is `id`, which needs a UUID).
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
tags:
- name: Schema
  description: Schema management APIs
- name: Data
  description: Registry data APIs
paths:
  /schema:
    post:
      tags:
      - Schema
      summary: Create schema
      description: Creates version 1 of a schema for the tenant and provisions the
        backing data table (including any `x-indexes`). The definition is validated
        against the JSON Schema 2020-12 meta-schema before the duplicate check. The
        response wraps the stored schema in the success envelope with message
        "Schema created successfully".
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
            example:
              schemaCode: trade-license
              definition:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  applicantId:
                    type: string
                  businessName:
                    type: string
                  tradeType:
                    type: string
                  address:
                    type: object
                    properties:
                      city:
                        type: string
                      pincode:
                        type: string
                    required:
                    - city
                required:
                - applicantId
                - businessName
                - tradeType
              x-unique:
              - - businessName
              - - applicantId
                - tradeType
              x-ref-schema:
              - fieldPath: applicantId
                schemaCode: individual
                refField: registryId
                external: true
                registry: individual-registry
              x-indexes:
              - name: idx_trade_type
                fieldPath: tradeType
                method: btree
      responses:
        '201':
          description: Schema created
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Schema already exists for the tenant (error code `Conflict`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '500':
          description: Internal server error (error code `InternalServerError`, e.g.
            audit-log persistence or validation-webhook failure).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
      operationId: createSchema
    get:
      tags:
      - Schema
      summary: List schemas
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Schemas for the tenant
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaListResponse'
        '500':
          description: Failure listing schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '429':
          description: Too many requests
          headers:
            Retry-After:
