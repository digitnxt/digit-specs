          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
      description: Searches active records of the schema by equality `filters` and
        JSON containment `contains`. Paging comes from the body, falling back to the
        `limit`/`offset` query parameters, then to 100/0; the effective limit is
