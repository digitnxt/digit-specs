  /{schemaCode}/data/_verify:
    get:
      tags:
      - Data
      summary: Verify registry data signature
      description: Resolves the active record by `id` (version row UUID or
        registryId) or, when `id` is blank, by `registryId`; then re-computes the
        hash of its latest DATA audit-log entry and asks Vault Transit to verify the
        stored signature. Responds with `{success:true, data:{valid:boolean},
        error:null, message:null}`.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/VerifyIdQuery'
      - $ref: '#/components/parameters/VerifyRegistryIdQuery'
      responses:
        '200':
          description: Verification status (`valid` is false when Vault rejects the
            signature or returns no verdict).
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Schema not found, no active record matches the identifier
            (including when both `id` and `registryId` are omitted), or no audit log
            exists for the record (error code `NotFound`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '501':
          description: Vault is not configured, so signature verification is
            unavailable. Error code `InternalServerError`, message "signature
            verification unavailable".
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
        '500':
          description: Stored payload hash does not match the recomputed digest
            (error code `InternalServerError`, message "payload hash mismatch"), or
            an internal failure.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
      operationId: verifyRegistryData
    parameters:
    - name: schemaCode
      in: path
      required: true
      schema:
        type: string
