    patch:
      summary: Partially update a tax head by code
      description: Updates specific fields of an existing tax head without replacing the entire configuration. Only non-null body fields are applied; `category` and `order` cannot be changed via PATCH. `effectiveFrom`/`effectiveTo` are validated against the stored window (strict inequality).
