            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Demand'
        '400':
          description: Bad Request — constraint violation on a query parameter (`businessServiceCode` pattern, `consumerCode` length, `createdFrom`/`createdTo`/`limit`/`offset` bounds) or an unparseable `status` value; `code` is the exception class name
          content:
            application/json:
              schema:
                type: array
                items: 
