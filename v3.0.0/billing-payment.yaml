      type: object
      description: Payload to fully replace an existing Demand.
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier of the demand to update.
        - $ref: '#/components/schemas/DemandCreate'
      # Cross-field/business rules (non-JSON-Schema constraints)
      x-businessRules:
        - periodFrom <= periodTo (date comparison).
        - All lineItems.taxHeadCode must exist & be active for the Business Service and period.
        - For positive line item amounts, collectionAmount ≤ amount; for negative amounts, collectionAmount must be 0 or amount.
        - Duplicate taxHeadCode in lineItems is not allowed.
        - Demand is editable only in DRAFT/ACTIVE; transitions enforced by service.
                     
    DemandPatch:
      type: object
      description: Partial update schema for modifying an existing editable Demand (before freezing or billing).
      properties:
        consumerCode:
          type: string
          minLength: 2
          maxLength: 64
          description: |
            Identifier of the underlying entity being billed (e.g., propertyId, connectionNo, licenseNo).
        payer:
          type: array
          minItems: 0
          maxItems: 10
          description: |
            Array of **Individual IDs** responsible for paying this demand.
            Each entry should reference an Individual record in the Identity/Individual service.
            Can be empty if payer is inferred elsewhere (e.g., from consumer entity).
          items:
            type: string
            minLength: 2
            maxLength: 64
            description: Individual ID (string/UUID) referencing an Individual registry entry.
          example:
            - "IND-8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3"
            - "IND-51b7d3c1-5e2e-4f1a-92f3-2b3f9b0caa11"
        lineItems:
          type: array
          minItems: 1
          maxItems: 200
          description: |
            Strictly **tax-head referenced** line items (no open items). Each line maps to a configured Tax Head
            and carries the assessed amount for this demand period.
            **Service rule**: duplicate taxHeadCode entries within the same demand are rejected.
          items:
            $ref: '#/components/schemas/LineItemCreate'
        status:
          type: string
          enum: [DRAFT, ACTIVE]
          description: Only transitions within editable states are allowed via PATCH

    CancelDemandRequest:
      type: object
      description: Optional body for cancelling a demand; both fields are copied into the demand's `metadata`.
      properties:
        reasonCode:
          type: string
          description: Stored as `metadata.cancellation_reason_code`
        note:
          type: string
          description: Stored as `metadata.cancellation_note`

    BulkResponse:
      type: object
      description: Used for bulk API operations (207 Multi-Status). Contains separate lists for successful and failed items to support partial processing; either list is omitted when empty.
      properties:
        success:
          type: array
          items: { $ref: '#/components/schemas/Demand' }
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BulkFailure"

    BulkFailure:
      type: object
      properties:
        index:
          type: integer
          description: Zero-based index of the failed item in the request array
        errors:
          type: array
          description: Per-item validation errors; `description` repeats the message
          items:
            $ref: "#/components/schemas/Error"

    # ── Bill ───────────────────────────────────────────────────────────────────

    BillAccountDetail:
      type: object
      description: Defines the granular accounting component of a bill, specifying tax head mapping, payable and adjusted amounts, and metadata for audit traceability.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique ID for internal reference (UUID)
        billDetailId:
          type: string
          format: uuid
          readOnly: true
          description: References Bill Detail
        lineItemId:
          type: string
          format: uuid
          readOnly: true
          description: References Line Item
        taxHeadCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: |
            Code of the configured Tax Head (same Business Service; active within the period).
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT_BASE
        order: 
          type: integer
          minimum: 1
        amount:
          type: string
          format: decimal
          example: 1000
        adjustedAmount:
          type: string
          format: decimal
          example: 0
        metadata:
          type: object
          additionalProperties: true
          description: Optional calculator trace (e.g., `rate`, `basis`, `units`, `area`, `multiplier`, `slabId`) to support audits. Omitted from the response when empty.

    BillDetail:
      type: object
      description: Defines the period-based billing section associated with a demand, containing aggregated amount values and detailed account-level tax entries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique ID for internal reference (UUID)
        billId:
          type: string
          format: uuid
          readOnly: true
          description: References Bill
        demandId:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          example: 10000
        amountPaid:
          type: string
          format: decimal
          example: 0
        periodFrom:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            Start (inclusive) of the assessed period in Timestamp (epoch milliseconds).
            Must be **on or before** `periodTo`. Used for proration and due-date policies.
          example: 1735669800000
        periodTo:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            End (inclusive) of the assessed period in Timestamp (epoch milliseconds).
            Must be **on or after** `periodFrom`.
          x-constraint: "periodTo >= periodFrom"
          example: 1767205799000
        billAccountDetails:
          type: array
          items:
            $ref: '#/components/schemas/BillAccountDetail'
        metadata:
          type: object
          additionalProperties: true
          description: Optional calculator trace (e.g., `rate`, `basis`, `units`, `area`, `multiplier`, `slabId`) to support audits. Omitted from the response when empty.

    Bill:
      type: object
      description: Represents an issued bill derived from a Demand. Tracks payer details, bill items, payable amount, and lifecycle status. Fields with no value (e.g. unset payer fields, `billExpiryAt` when the bill never expires, `fileStoreId` before the PDF exists) are omitted from the response rather than emitted as null.
      required:
        - businessServiceCode
        - consumerCode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier (UUID) for this bill.
        payerId:
          type: string
          minLength: 2
          maxLength: 64
          description: Individual ID (string/UUID) referencing an Individual registry entry.
          example: IND-8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        payerName:
          type: string
          maxLength: 256
          example: John Doe
        payerAddress:
          type: string
          maxLength: 1024
        payerMobileNumber:
          type: string
          pattern: '^\+[1-9]?[0-9]{7,14}$'
          description: Mobile number of the payer in E.164 format (e.g., +919876543210). Must start with a '+' followed by the country code and subscriber number, with a total length of 2 to 15 digits.
          example: +919876543210
        payerEmail:
          type: string
          format: email
          maxLength: 254
          description: Valid email address (e.g., user@example.com)
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        consumerCode:
          type: string
          minLength: 2
          maxLength: 64
          description: |
            Identifier of the underlying entity being billed (e.g., propertyId, connectionNo, licenseNo).
          example: PB-JLD-P-000123
        billNumber:
          type: string
          readOnly: true
          description: IDGen generated bill number
          example: BILL-06151  
        billIssueAt:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          readOnly: true
          description: Bill generation timestamp (epoch milliseconds)
          example: 1735669800000
        billExpiryAt:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Bill expiry timestamp (epoch milliseconds). Derived from the demand's `billExpiryDays`, else the business service's; omitted when the bill never expires (0 days).
          example: 1767205800000
        status:
          $ref: "#/components/schemas/BillStatus"
        totalAmount:
          type: string
          format: decimal
          example: 1000
        totalCollectedAmount:
          type: string
          format: decimal
          example: 1000
        fileStoreId:
          type: string
          readOnly: true
          description: Filestore id of the generated bill PDF. Absent until the PDF has been rendered and uploaded (resilient-mode failures and bulk-generated bills may lack it).
        billDetails:
          type: array
          items: 
            $ref: '#/components/schemas/BillDetail'
          minItems:  1
        metadata:
          type: object
          additionalProperties: true
          description: Freeform context; cancellation merges the request metadata here. Omitted from the response when empty.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'

    GenerateBillCriteria:
      type: object
      description: Criteria for generating a bill from the consumer's eligible ACTIVE, FROZEN or PARTIALLY_PAID demands under a BusinessService.
      required:
        - businessServiceCode
        - consumerCode
      properties:
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        consumerCode:
          type: string
          minLength: 2
          maxLength: 64
          description: |
            Identifier of the underlying entity being billed (e.g., propertyId, connectionNo, licenseNo).
          example: PB-JLD-P-000123
        payerId:
          type: string
          minLength: 2
          maxLength: 64
          description: Individual ID (string/UUID) referencing an Individual registry entry.
          example: IND-8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        payerName:
          type: string
          maxLength: 256
          example: John Doe
        payerAddress:
          type: string
          maxLength: 1024
        payerMobileNumber:
          type: string
          pattern: '^\+[1-9]?[0-9]{7,14}$'
          description: Mobile number of the payer in E.164 format (e.g., +919876543210). Must start with a '+' followed by the country code and subscriber number, with a total length of 2 to 15 digits.
          example: +919876543210
        payerEmail:
          type: string
          format: email
          maxLength: 254
          description: Valid email address (e.g., user@example.com)

    UpdateBillStatus:
      type: object
      description: Request to cancel the consumer's ACTIVE bill for a business service. Only `CANCELLED` is accepted as the target status.
      required:
        - businessServiceCode
        - consumerCode
        - statusToBeUpdated
        - metadata
      properties:
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        consumerCode:
          type: string
          minLength: 2
          maxLength: 64
          description: |
            Identifier of the underlying entity being billed (e.g., propertyId, connectionNo, licenseNo).
          example: PB-JLD-P-000123
        statusToBeUpdated:
          type: string
          enum: [CANCELLED]
          description: Target status. Must be `CANCELLED`; any other `BillStatus` value is rejected with 400 INVALID_STATUS.
        metadata:
          type: object
          additionalProperties: true
          description: Required (may be `{}`); merged into the bill's existing metadata (e.g. cancellation reason).

    BulkBillGenerator:
      type: object
      description: Represents a request for generating bills in bulk from eligible ACTIVE, FROZEN & PARTIALLY_PAID demands under a BusinessService.
      required:
        - businessServiceCode
      properties:
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        metadata:
          type: object
          additionalProperties: true
          description: Additional context such as requestedBy, reason, traceId; forwarded unchanged to every published job

    BulkBillResponse:
      type: object
      description: Acknowledgement of an asynchronous bulk bill generation request.
      properties:
        requestId:
          type: string
          format: uuid
          description: Tracking id shared by all jobs published for this request
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        status:
          $ref: "#/components/schemas/BulkBillStatus"
        totalJobsCreated:
          type: integer
          format: int64
          example: 42
        totalConsumersIdentified:
          type: integer
          format: int64
          example: 20500
        metadata:
          type: object
          additionalProperties: true
          description: Always contains `maxConsumerCode` — the highest consumer code scanned (null when no consumer had eligible demands)

    # ── Payment ────────────────────────────────────────────────────────────────

    PaymentDetailCreate:
      type: object
      description: Defines how a payment amount is distributed across bills
      required: 
        - totalAmountPaid
        - billId
      properties:
        totalAmountPaid:
          type: number
          format: double
          example: 1000
          description: Whole-number amount (fractional amounts are rejected), not negative, not zero for a bill with a positive amount, not below the business service's `minPayableAmount`, equal to the bill total unless partial payment is allowed, and not above the bill total unless overpayment is enabled
        manualReceiptNumber:
          type: string
          maxLength: 64
        manualReceiptDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        billId:
          type: string
          format: uuid
          description: Must reference an ACTIVE bill of the tenant; the same bill may appear only once per payment
        metadata:
          type: object
          additionalProperties: true
          description: Optional calculator trace (e.g., `rate`, `basis`, `units`, `area`, `multiplier`, `slabId`) to support audits.

    PaymentCreate:
      type: object
      required: 
        - totalAmountPaid
        - paymentMode
        - paidBy
        - paymentDetails
      properties:
        totalAmountPaid:
          type: number
          format: double
          example: 1000
          description: Must equal the sum of `paymentDetails[].totalAmountPaid` (INVALID_TOTAL_AMOUNT_PAID otherwise)
        transactionNumber:
          type: string
          maxLength: 128
          description: Mandatory for online modes (INVALID_TXN_NUMBER otherwise); generated via idgen for CASH when omitted
        transactionDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        paymentMode:
          $ref: "#/components/schemas/PaymentMode"
        instrumentNumber:
          type: string
          maxLength: 128
          description: Mandatory for every mode except CASH (INVALID_INST_NUMBER / INVALID_INSTRUMENT_NUMBER otherwise)
        instrumentDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Mandatory for CHEQUE, DD, OFFLINE_NEFT, OFFLINE_RTGS and POSTAL_ORDER (INVALID_INST_DATE otherwise); must not be in the future, and for CHEQUE/DD not after `transactionDate` nor older than the configured maximum age. Defaults to the transaction date for CASH and online modes.
        ifscCode:
          type: string
          maxLength: 64
        paidBy:
          type: string
          maxLength: 128
          example: Rajesh Kumar
        payerId:
          type: string
          minLength: 2
          maxLength: 64
          description: Individual ID (string/UUID) referencing an Individual registry entry.
          example: IND-8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        payerName:
          type: string
          maxLength: 256
          example: John Doe
        payerAddress:
          type: string
          maxLength: 1024
        payerMobileNumber:
          type: string
          pattern: '^\+[1-9]?[0-9]{7,14}$'
          description: Mobile number of the payer in E.164 format (e.g., +919876543210). Must start with a '+' followed by the country code and subscriber number, with a total length of 2 to 15 digits.
          example: +919876543210
        payerEmail:
          type: string
          format: email
          maxLength: 254
          description: Valid email address (e.g., user@example.com)
        fileStoreId:
          type: string
          description: Optional pre-existing receipt document id (e.g. from a payment gateway); when supplied, receipt-PDF generation is skipped
        paymentDetails:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaymentDetailCreate"
        metadata:
          type: object
          additionalProperties: true
          description: Optional calculator trace (e.g., `rate`, `basis`, `units`, `area`, `multiplier`, `slabId`) to support audits.

    PaymentDetail:
      type: object
      description: Defines how a payment amount is distributed across bills
      required:
        - totalAmountPaid
        - businessServiceCode
        - billId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique ID for internal reference (UUID)
        paymentId:
          type: string
          format: uuid
          readOnly: true
          description: Reference Payment
        totalAmountDue:
          type: string
          format: decimal
          example: 1000
        totalAmountPaid:
          type: string
          format: decimal
          example: 1000
        manualReceiptNumber:
          type: string
          maxLength: 64
        manualReceiptDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        receiptNumber:
          type: string
          maxLength: 64
          description: Generated via idgen on create; empty string in POST /payments/validate responses
        receiptDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        receiptType:
          $ref: "#/components/schemas/ReceiptType"
        businessServiceCode:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: |
            Code of the owning Business Service (e.g., PT, TL, WS). Must reference an **active** service.
            Pattern: uppercase letters, digits, underscore; must start with a letter.
          example: PT
        billId:
          type: string
          format: uuid
        bill:
          allOf:
            - $ref: '#/components/schemas/Bill'
          description: The bill as updated by this payment. Present only in POST /payments and POST /payments/validate responses; absent from search and get-by-id responses.
        metadata:
          type: object
          additionalProperties: true
          description: Freeform context supplied in the request. Omitted from the response when empty.

    Payment:
      type: object
      description: Represents a payment transaction recorded in the system. Fields with no value are omitted from the response rather than emitted as null.
      required:
        - totalAmountPaid
        - paymentMode
        - paidBy
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: System-generated unique identifier (UUID) for this payment.
        totalAmountDue:
          type: string
          format: decimal
          example: 1000
        totalAmountPaid:
          type: string
          format: decimal
          example: 1000
        transactionNumber:
          type: string
          maxLength: 128
        transactionDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        paymentMode:
          $ref: "#/components/schemas/PaymentMode"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        instrumentDate:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        instrumentNumber:
          type: string
          maxLength: 128
        instrumentStatus:
          $ref: "#/components/schemas/InstrumentStatus"
        ifscCode:
          type: string
          maxLength: 64
        paidBy:
          type: string
          maxLength: 128
          example: Rajesh Kumar
        payerId:
          type: string
          minLength: 2
          maxLength: 64
          description: Individual ID (string/UUID) referencing an Individual registry entry.
          example: IND-8a2c4a74-11e5-4c3e-9d9f-f7f4c0b1b9a3
        payerName:
          type: string
          maxLength: 256
          example: John Doe
        payerAddress:
          type: string
          maxLength: 1024
        payerMobileNumber:
          type: string
          pattern: '^\+[1-9]?[0-9]{7,14}$'
          description: Mobile number of the payer in E.164 format (e.g., +919876543210). Must start with a '+' followed by the country code and subscriber number, with a total length of 2 to 15 digits.
          example: +919876543210
        payerEmail:
          type: string
          format: email
          maxLength: 254
          description: Valid email address (e.g., user@example.com)
        paymentDetails:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDetail'
        fileStoreId:
          type: string
          description: Filestore id of the receipt PDF — the caller-supplied value, else the id of the PDF rendered on create (absent if rendering failed in resilient mode)
        metadata:
          type: object
          additionalProperties: true
          description: Freeform context supplied in the request. Omitted from the response when empty.
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'