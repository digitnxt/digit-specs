# ─── Demands ──────────────────────────────────────────────────────────────────

  /demands:
    post:
      summary: Create demands (bulk)
      description: |
        Creates one or more demand records representing calculated liabilities for consumers, including line items mapped to tax heads.

        Each item is validated independently (period, line items, business service, tax heads); validation failures are reported per item and do not stop the other items. Write failures (period overlap, arrear tax head missing) abort the whole request — nothing is persisted.
        When arrear roll-forward is enabled, the consumer's latest open demand with an outstanding balance is marked ROLL_FORWARDED, its outstanding amount is prepended as a `<businessServiceCode>_ARREAR` line item, and `arrearDemandIds` is populated (newest first).
      operationId: createDemands
      tags: [Demand]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              description: One or more demands to create
              items:
                $ref: '#/components/schemas/DemandCreate'
      responses:
        '201':
          description: All items created — bare array of the created demands
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Demand'
        '207':
          description: Multi-Status — some items created, some failed per-item validation; `success` holds the created demands, `failures` the per-index errors
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '400':
          description: "Bad Request — every item failed per-item validation and at least one error is non-referential (INVALID_PERIOD, INVALID_LINE_ITEMS, INVALID_AMOUNT, INVALID_COLLECTION, DUPLICATE_TAX_HEAD): flattened array of all item errors, `description` prefixed with `item <index>: `; or bean-validation failure on the body; or INVALID_REQUEST (empty array)"
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Error' 
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: "Conflict — DEMAND_CONFLICT: an item overlaps an existing demand period for the same consumer and business service. The whole request is aborted and nothing is created, even for items that passed validation."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: "Unprocessable — every item failed per-item validation and all errors are referential (UNKNOWN_BUSINESS_SERVICE, UNKNOWN_TAX_HEAD, INVALID_TAX_HEAD): flattened array as for 400; or CREATION_FAILED when arrear roll-forward is enabled and the `<businessServiceCode>_ARREAR` tax head is missing or inactive (aborts the whole request)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Update/replace demands (bulk)
      description: Performs bulk full replacement of existing demands that are in editable states (DRAFT or ACTIVE), requiring the demand ID for each item. Line items are replaced (new line-item ids); the version is incremented and the previous state is audited. Per-item validation failures are reported per item; a missing id, a non-editable status or a period overlap aborts the whole request and nothing is updated.
      operationId: updateDemands
      tags: [Demand]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DemandUpdate'
      responses:
        '200':
          description: All items updated — bare array of the updated demands
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Demand'
        '207':
          description: Multi-Status — some items updated, some failed per-item validation; `success` holds the updated demands, `failures` the per-index errors
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '400':
          description: "Bad Request — every item failed per-item validation and at least one error is non-referential (INVALID_PERIOD, INVALID_LINE_ITEMS, INVALID_AMOUNT, INVALID_COLLECTION, DUPLICATE_TAX_HEAD): flattened array of all item errors, `description` prefixed with `item <index>: `; or bean-validation failure on the body; or INVALID_REQUEST (empty array)"
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: "Not found — NOT_FOUND: an item's `id` does not exist in the tenant (`description` names the item index). The whole request is aborted and nothing is updated."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — UPDATE_FAILED (an item's demand is not in DRAFT/ACTIVE status) or DEMAND_CONFLICT (the new period overlaps another demand of the consumer). Either aborts the whole request; nothing is updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: "Unprocessable — every item failed per-item validation and all errors are referential (UNKNOWN_BUSINESS_SERVICE, UNKNOWN_TAX_HEAD, INVALID_TAX_HEAD): flattened array as for 400"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: Search demands by filters
      description: Retrieves a list of demands filtered by business service, consumer code, status, or creation date range with pagination support.
      operationId: searchDemands
      tags: [Demand]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: businessServiceCode
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Filter by Business Service Code (exact match)
        - in: query
          name: consumerCode
          schema:
            type: string
            minLength: 2
            maxLength: 64
          description: Filter by Consumer Code (exact match)
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/DemandStatus"
          description: Filter by Demand Status
        - in: query
          name: createdFrom
          schema: 
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          description: createdTime >= createdFrom
        - in: query
          name: createdTo
          schema: 
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          description: createdTime <= createdTo
        - in: query
          name: limit
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size (max 100)
        - in: query
          name: offset
          schema: 
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of Demands
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
