openapi: 3.0.3
info:
  title: DIGIT Billing - Business Service API
  version: 3.0.0
  description: |
    REST APIs to manage Business Services in the DIGIT Billing & Collection domain.

    A Business Service represents a billable service (e.g., Property Tax, Trade License, Water/Sewerage) and its collection behavior and defaults.

    Wire conventions implemented by the service:
    - Every error response body is a bare JSON array of `Error` objects (`code`, `message`, `description`, `params`); it is never wrapped in an envelope.
    - Business errors carry the service codes named in each response description (e.g. `NOT_FOUND`, `DEMAND_CONFLICT`).
    - Bean-validation failures on request bodies, and `@Pattern`/`@Min`/`@Max`/`@Size` violations or unparseable enum values on query/path parameters, are rendered as `400` with `code` set to the exception or constraint name (e.g. `ConstraintViolationException`, `MethodArgumentTypeMismatchException`, `HandlerMethodValidationException`, or a field-level code such as `NotBlank.update.name`) rather than a service code; for unhandled exceptions the message is `An unhandled exception occurred on the server`.
    - Malformed JSON bodies are rendered as `400` with code `JsonParseException` or `JsonMappingException`.
    - Decimal amounts are serialised as JSON strings with trailing zeros stripped (e.g. `"100.5"`, `"25"`) and are accepted on input as either a JSON number or a numeric string.
    - List-valued query filters are a single comma-separated string (`?billIds=a,b`), not repeated parameters; blank tokens are ignored and malformed UUID tokens are silently dropped.
    - Fields whose value is null are omitted from response objects (they are not emitted as `null`); empty `metadata`, `payer` and `arrearDemandIds` collections are omitted as well.

servers:
  - url: https://api.example.com/billing/v3
    description: Production server
  - url: https://staging-api.example.com/billing/v3
    description: Staging server

security:
  - BearerAuth: []

tags:
  - name: BusinessService
    description: Manage billable business services (e.g., PT, TL, WS) and collection defaults.
  
  - name: TaxHead
    description: Manage tax heads (e.g., base tax, penalty, exemption, cess).

  - name: Demand
    description: Manages accruals, states, and billing eligibility for consumer liabilities.

  - name: Bill
    description: Manage the full bill lifecycle including creation from ACTIVE/FROZEN demands

  - name: Payment
    description: Manage payment collections, validation & processing

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ─── Business Services ───────────────────────────────────────────────────────
  /business-services:
    post:
      summary: Create one or more business services
      description: Creates one or more business service configurations that define billable services and their collection behavior, defaults, and payment rules.
      operationId: createBusinessServices
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              description: One or more business services to create
              items:
                $ref: '#/components/schemas/BusinessServiceCreate'
      responses:
        '201':
          description: Business service(s) created
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessService'
        '400':
          description: Bad Request — bean-validation failure; INVALID_REQUEST (empty array); DUPLICATE_VALUES (the same code appears more than once in the request, `params` lists the duplicates)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: "Conflict — CONFLICT: one or more codes already exist in the tenant (or were created concurrently). Use PUT to update."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: Search business services by filters
      description: Retrieves a list of business services filtered by code, active status, or effectiveness date with pagination support.
      operationId: searchBusinessServices
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: code
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Filter by business service code (exact match)
        - in: query
          name: isActive
          schema: 
            type: boolean
          description: Filter by active status
        - in: query
          name: effectiveOn
          schema: 
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          description: Return services effective on this timestamp (within effectiveFrom/effectiveTo)
        - in: query
          name: limit
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size (max 100)
        - in: query
          name: offset
          schema: 
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of business services
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessService'
        '400':
          description: Bad Request — constraint violation on a query parameter (`code` pattern, `effectiveOn`/`limit`/`offset` bounds) or an unparseable value; `code` is the exception class name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  /business-services/{code}:
    get:
      summary: Get a business service by code
      description: Retrieves a single business service configuration by its unique code identifier.
      operationId: getBusinessServiceByCode
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: path
          required: true
          description: Unique business service code (e.g., PT, TL, WS)
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      responses:
        '200':
          description: Business service found
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessService'
        '404':
          description: Not found — NOT_FOUND
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '400':
          description: Bad Request — `code` path parameter violates the pattern (`code` is the exception class name)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    put:
      summary: Replace a business service by code
      description: Performs a full replacement of an existing business service configuration identified by its code. The code itself is taken from the path; unknown body fields (including `code`) are ignored. The version is incremented and the previous state is written to the audit table.
      operationId: updateBusinessService
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: path
          required: true
          description: Unique business service code
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessServiceUpdateByCode'
      responses:
        '200':
          description: Updated successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessService'
        '400':
          description: Bad Request — bean-validation failure on the body
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found — NOT_FOUND
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    patch:
      summary: Partially update a business service by code
      description: Updates specific fields of an existing business service without replacing the entire configuration. Only non-null body fields are applied; `effectiveFrom`/`effectiveTo` are validated against the stored window (strict inequality).
      operationId: patchBusinessService
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: path
          required: true
          description: Unique business service code
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessServicePatch'
      responses:
        '200':
          description: Updated successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessService'
        '400':
          description: Bad Request — bean-validation failure; INVALID_EFFECTIVE_RANGE (effectiveTo <= effectiveFrom when both are sent); INVALID_EFFECTIVE_TO (effectiveTo <= stored effectiveFrom); INVALID_EFFECTIVE_FROM (effectiveFrom >= stored effectiveTo)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found — NOT_FOUND
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a business service by code
      description: Permanently deletes the business service row. An audit snapshot (marked inactive) is written first, so history is preserved in the audit table only; the deleted code can no longer be read or searched.
      operationId: deleteBusinessService
      tags: [BusinessService]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: code
          in: path
          required: true
          description: Unique business service code
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      responses:
        '200':
          description: Deleted successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '400':
          description: Bad Request — `code` path parameter violates the pattern (`code` is the exception class name)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Not found — NOT_FOUND
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: "Conflict — DEPENDENCY_EXISTS: dependent records (e.g. tax heads) still reference this business service"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

  # ─── Tax Heads ────────────────────────────────────────────────────────────────

  /tax-heads:
    post:
      summary: Create one or more new tax head
      description: Creates one or more tax head configurations that define charge components like base tax, penalty, rebate, or cess for a business service.
      operationId: createTaxHead
      tags: [TaxHead]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              description: One or more tax heads to create
              items:
                $ref: '#/components/schemas/TaxHeadCreate'
      responses:
        '201':
          description: Tax head(s) created
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxHead'
        '400':
          description: Bad Request — bean-validation failure; INVALID_REQUEST (empty array); DUPLICATE_VALUES (the same code appears more than once in the request)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized — missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — CONFLICT (a code already exists in the tenant, or was created concurrently) or DUPLICATE_ORDER (an `order` is used twice for the same business service within the request, or already used by an existing tax head)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: "Unprocessable — INVALID_BUSINESS_SERVICE: one or more `businessServiceCode` values do not resolve to an active business service (`params` lists them)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'

    get:
      summary: Search tax heads by filters
      description: Retrieves a list of tax heads filtered by code, category, active status, or linked business service with pagination support.
      operationId: searchTaxHeads
      tags: [TaxHead]
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: code
          schema:
            type: string
            minLength: 2
            maxLength: 64
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: Filter by tax head code
        - in: query
          name: category
          schema: 
            $ref: "#/components/schemas/TaxHeadCategory"
          description: Filter by category
        - in: query
          name: isActive
          schema: 
            type: boolean
          description: Filter by active status
        - in: query
          name: businessServiceCode
          schema: 
            type: string
            minLength: 2
            maxLength: 32
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Filter by linked business service
        - in: query
          name: limit
          schema: 
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size (max 100)
        - in: query
          name: offset
          schema: 
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of tax heads
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxHead'
        '400':
