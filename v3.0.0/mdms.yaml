openapi: 3.0.1
info:
  title: Master Data Management Service (MDMS v2)
  description: | 
   APIs for managing master data schemas and data for DIGIT platform.
   Supports schema definition management and master data CRUD operations.
  contact:
    name: eGovernments Foundation
  version: 3.0.0
servers:
- url: https://unified-dev.digit.org/mdms-v2

security:
  - BearerAuth: []

tags:
  - name: "Schema Definition"
    description: "Operations for managing schema definitions"
  - name: "Master Data V2"
    description: "REST-compliant operations for managing master data"
  - name: "MDMS Legacy"
    description: "Legacy MDMS v1 compatibility endpoints"

paths:
  /v1/schema:
    post:
      summary: Create a new schema definition
      tags: 
        - Schema Definition
      operationId: createSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinitionRequest'
      parameters: 
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Schema created successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      
    get:
      summary: Search schema definitions
      tags: 
        - Schema Definition
      operationId: searchSchemas
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: code
          schema:
            type: string
          description: Filter by schema code
      responses:
        '200':
          description: List of schema definitions
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2:
    post:
      summary: Create new master data records
      tags: 
        - Master Data V2
      operationId: createMasterData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsRequest'
      responses:
        '201':
          description: Master data created successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Validation error or bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update existing master data records
      tags: 
        - Master Data V2
      operationId: updateMasterData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsRequest'
      responses:
        '200':
          description: Master data updated successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Validation error or bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Search master data records
      tags: 
        - Master Data V2
      operationId: searchMasterData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: schemaCode
          schema:
            type: string
          description: Filter by schema code
        - in: query
          name: uniqueIdentifiers
          schema:
            type: array
            items:
              type: string
          description: Filter by unique identifiers
          style: form
          explode: true
        - in: query
          name: ids
          schema:
            type: array
            items:
              type: string
          description: Filter by database entity IDs
          style: form
          explode: true
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by active status
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
          description: Offset for pagination
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
          description: Limit for pagination
      responses:
        '200':
          description: List of matching master data
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/mdms:
    get:
      summary: Search master data using GET with query parameters (v1)
      tags:
        - MDMS Legacy
      operationId: searchMasterDataV1
      description: REST-compliant GET endpoint for searching master data by module and master name
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - in: query
          name: uniqueIdentifier
          schema:
            type: string
          description: Unique identifier to filter master data
        - in: query
          name: moduleName
          schema:
            type: array
            items:
              type: string
          description: Module names to search
          style: form
          explode: true
        - in: query
          name: masterName
          schema:
            type: array
            items:
              type: string
          description: Master names to search
          style: form
          explode: true
        - in: query
          name: masterFilter
          schema:
            type: array
            items:
              type: string
          description: JsonPath filters for each master
          style: form
          explode: true
      responses:
        '200':
          description: Master data retrieved successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/_search:
    post:
      tags:
      - MDMS Legacy
      summary: Legacy v1 search endpoint for backward compatibility
      operationId: searchMasterDataLegacyV1
      description: Get list of masters for a particular module and tenantId (v1 compatibility)
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        description: Details of module and master which need to be searched using MDMS
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsCriteriaReq'
        required: true
      responses:
        '200':
          description: Data searched successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /v2/_search:
    post:
      tags:
      - MDMS Legacy
      summary: Legacy v2 search endpoint (POST-based search)
      operationId: searchMasterDataLegacyV2
      description: Search master data using POST request with criteria
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        description: Search criteria for master data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsCriteriaReqV2'
        required: true
      responses:
        '200':
          description: Data searched successfully
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/securitySchemes/BearerAuth'
  
  parameters:
    RequestIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/RequestIdHeader'
    CorrelationIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/CorrelationIdHeader'
    UserAgentHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/UserAgentHeader'
    TenantIdHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/TenantIdHeader'
    ForwardedForHeader:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ForwardedForHeader'
    ClientId:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ClientId'
    ClientSecret:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/ClientSecret'
    TimeStamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/TimeStamp'
    IdempotencyKey:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/parameters/IdempotencyKey'
  
  headers:
    X-Response-Time:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Response-Time'
    X-Response-Timestamp:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Response-Timestamp'
    X-Request-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Request-ID'
    X-Correlation-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Correlation-ID'
    X-Tenant-ID:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Tenant-ID'
    X-Rate-Limit:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit'
    X-Rate-Limit-Remaining:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit-Remaining'
    X-Rate-Limit-Reset:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/headers/X-Rate-Limit-Reset'
  
  schemas:
    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/schemas/Error'
    
    AuditDetail:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/schemas/AuditDetail'
    
    Document:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit3/refs/heads/master/docs/services/common/Common-3.0.0.yaml#/components/schemas/Document'
    
    SchemaDefinition:
      type: object
      description: Schema definition for master data validation
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 2
          description: Unique identifier (auto-generated)
          readOnly: true
        tenantId:
          type: string
          maxLength: 128
          minLength: 2
          description: Tenant identifier (set from X-Tenant-ID header)
        code:
          type: string
          maxLength: 128
          minLength: 2
          description: Unique schema code (e.g., common-masters.PropertyType)
          example: common-masters.PropertyType
        description:
          type: string
          maxLength: 512
          minLength: 2
          description: Description of the schema
        definition:
          type: object
          description: Valid JSON Schema v7 definition
          example:
            $schema: "http://json-schema.org/draft-07/schema#"
            type: object
            properties:
              code:
                type: string
              name:
                type: string
            required: [code, name]
            x-unique: [code]
        isActive:
          type: boolean
          default: true
          description: Whether the schema is active
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
      required: [code, definition]
    
    Mdms:
      type: object
      description: Master data record
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 2
          description: Database entity UUID (auto-generated)
          readOnly: true
        tenantId:
          type: string
          maxLength: 128
          minLength: 2
          description: Tenant identifier (set from X-Tenant-ID header)
        schemaCode:
          type: string
          maxLength: 128
          minLength: 2
          description: Schema code this data belongs to
          example: common-masters.PropertyType
        uniqueIdentifier:
          type: string
          maxLength: 128
          minLength: 1
          description: Unique identifier for this master data record
        data:
          type: object
          description: Master data JSON (validated against schema definition)
          additionalProperties: true
        isActive:
          type: boolean
          default: true
          description: Whether the record is active
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
      required: [schemaCode, data]
    
    Workflow:
      type: object
      properties:
        action:
          type: string
          description: Action of the workflow to be performed on the request
        comment:
          type: string
          description: Comment for the workflow action to be performed
        assignees:
          type: array
          items:
            type: string
          description: UUIDs of the users in the system to assign workflow to specific users
      required: [action]
    
    MdmsCriteria:
      type: object
      description: Legacy v1 search criteria
      properties:
        tenantId:
          type: string
          maxLength: 100
          minLength: 1
          description: Unique id for a tenant
        uniqueIdentifier:
          type: string
          maxLength: 64
          minLength: 1
          description: Unique identifier to filter master data
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Database entity IDs to search master data
        moduleDetails:
          type: array
          items:
            $ref: '#/components/schemas/ModuleDetail'
    
    ModuleDetail:
      type: object
      required:
      - masterDetails
      - moduleName
      properties:
        moduleName:
          type: string
          maxLength: 100
          minLength: 1
          description: Name of the module for which masters are required
        masterDetails:
          type: array
          items:
            $ref: '#/components/schemas/MasterDetail'
    
    MasterDetail:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: Master name
        filter:
          type: string
          maxLength: 500
          minLength: 1
          description: JsonPath predicate to get filtered data for a master
    
    SchemaDefinitionRequest:
      type: object
      description: Request wrapper for schema definition
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/service-contracts/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        SchemaDefinition:
          $ref: '#/components/schemas/SchemaDefinition'
      required: [SchemaDefinition]
    
    SchemaDefinitionResponse:
      type: object
      description: Response wrapper for schema definitions
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/service-contracts/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        SchemaDefinitions:
          type: array
          items: 
             $ref: '#/components/schemas/SchemaDefinition'
    
    SchemaDefCriteria:
      type: object
      properties:
        tenantId:
          type: string
          maxLength: 100
          minLength: 1
          description: Unique id for a tenant
        codes:
          type: array
          description: Search by schema unique identifiers
          items:
            type: string
    
    SchemaDefSearchRequest:
      type: object
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-0-0.yml#/definitions/RequestInfo'
        SchemaDefCriteria:
          $ref: '#/components/schemas/SchemaDefCriteria'
    
    MdmsRequest:
      type: object
      description: Request wrapper for master data operations
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-0-0.yml#/definitions/RequestInfo'
        Mdms:
          type: array
          description: Array of master data records
          items:
            $ref: '#/components/schemas/Mdms'
        Workflow:
          $ref: '#/components/schemas/Workflow'
      required: [Mdms]
    
    MdmsCriteriaV2:
      type: object
      required:
      - tenantId
      properties:
        tenantId:
          type: string
          maxLength: 100
          minLength: 1
          description: Tenant ID against which master data needs to be searched
        schemaCode:
          type: string
          description: Schema code for which master data needs to be searched
        uniqueIdentifiers:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Unique identifiers of the master data to be fetched
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Database entity IDs to search master data
        filters:
          type: object
          additionalProperties:
            type: string
          description: Filter map to filter master data (custom field filters)
        isActive:
          type: boolean
          description: Search master data whether it is enabled or disabled
        offset:
          type: integer
          format: int32
          description: Offset from which data should be fetched
        limit:
          type: integer
          format: int32
          description: Number of records to be fetched in search response
    
    MdmsCriteriaReq:
      type: object
      description: Legacy v1 search request wrapper
      properties:
        RequestInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/service-contracts/Common%20Services/common-contract.yaml#/components/schemas/RequestInfo'
        MdmsCriteria:
          $ref: '#/components/schemas/MdmsCriteria'
    
    MdmsCriteriaReqV2:
      type: object
