      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/service-contracts/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        MdmsRes: 
          type: object
          additionalProperties: true
          description: Map of Map where keys represent moduleName and masterName
          example:
            Property:
              PropertyType: []
              Usage: []
    
    MdmsResponseV2:
      type: object
      description: V2 response wrapper for master data
      properties:
        ResponseInfo:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-Specs/service-contracts/Common%20Services/common-contract.yaml#/components/schemas/ResponseInfo'
        mdms:
          type: array
          items:
            $ref: '#/components/schemas/Mdms'
