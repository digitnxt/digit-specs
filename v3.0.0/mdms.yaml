openapi: 3.0.3
info:
  title: Master Data Management Service (MDMS v2)
  description: 'APIs for managing master data schemas and data for DIGIT platform.

    Supports schema definition management and master data CRUD operations.

    '
  version: 3.0.0
servers:
- url: /mdms/v3
security:
- BearerAuth: []
tags:
- name: Schema Definition
  description: Operations for managing schema definitions
- name: Master Data
  description: REST-compliant operations for managing master data
paths:
  /schema:
    post:
      summary: Create a new schema definition
      description: Creates a new schema definition for validating master data records. The schema must be a valid JSON Schema v7 definition.
      tags:
      - Schema Definition
      operationId: createSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinitionRequest'
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Schema created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Search schema definitions
      description: Retrieves schema definitions based on filter criteria. Returns all schemas if no filters are provided.
      tags:
      - Schema Definition
      operationId: searchSchemas
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - in: query
        name: code
        schema:
          type: string
        description: Filter by schema code
      responses:
        '200':
          description: List of schema definitions
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinitionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    post:
      summary: Create new master data records
      description: Creates new master data records. Data is validated against the corresponding schema definition before creation.
      tags:
      - Master Data
      operationId: createMasterData
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsRequest'
      responses:
        '201':
          description: Master data created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Validation error or bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update existing master data records
      description: Updates existing master data records. Data is validated against the corresponding schema definition before update.
      tags:
      - Master Data
      operationId: updateMasterData
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmsRequest'
      responses:
        '200':
          description: Master data updated successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Validation error or bad request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Search master data records
      description: Searches master data records based on filter criteria. Supports pagination and filtering by schema code, identifiers, and active status.
      tags:
      - Master Data
      operationId: searchMasterData
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - in: query
        name: schemaCode
        schema:
          type: string
        description: Filter by schema code
      - in: query
        name: uniqueIdentifiers
        schema:
          type: array
          items:
            type: string
        description: Filter by unique identifiers
        style: form
        explode: true
      - in: query
        name: ids
        schema:
          type: array
          items:
            type: string
        description: Filter by database entity IDs
        style: form
        explode: true
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Filter by active status
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
        description: Offset for pagination
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
        description: Limit for pagination
      responses:
        '200':
          description: List of matching master data
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmsResponseV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: Unique key to ensure idempotent operations for POST/PUT requests. Prevents duplicate processing of the same request.
      schema:
        type: string
        minLength: 2
        maxLength: 64
        example: idem-12345-abcd
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
  schemas:
    SchemaDefinition:
      type: object
      description: Schema definition for master data validation
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 2
          description: Unique identifier (auto-generated)
          readOnly: true
        tenantId:
          type: string
          maxLength: 128
          minLength: 2
          description: Tenant identifier (set from X-Tenant-ID header)
        code:
          type: string
          maxLength: 128
          minLength: 2
          description: Unique schema code (e.g., common-masters.PropertyType)
          example: common-masters.PropertyType
        description:
          type: string
          maxLength: 512
          minLength: 2
          description: Description of the schema
        definition:
          type: object
          description: Valid JSON Schema v7 definition
          example:
            $schema: http://json-schema.org/draft-07/schema#
            type: object
            properties:
              code:
                type: string
              name:
                type: string
            required:
            - code
            - name
            x-unique:
            - code
        isActive:
          type: boolean
          default: true
          description: Whether the schema is active
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
      required:
      - code
      - definition
    Mdms:
      type: object
      description: Master data record
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 2
          description: Database entity UUID (auto-generated)
          readOnly: true
        tenantId:
          type: string
          maxLength: 128
          minLength: 2
          description: Tenant identifier (set from X-Tenant-ID header)
        schemaCode:
          type: string
          maxLength: 128
          minLength: 2
          description: Schema code this data belongs to
          example: common-masters.PropertyType
        uniqueIdentifier:
          type: string
          maxLength: 128
          minLength: 1
          description: Unique identifier for this master data record
        data:
          type: object
          description: Master data JSON (validated against schema definition)
          additionalProperties: true
        isActive:
          type: boolean
          default: true
          description: Whether the record is active
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
      required:
      - schemaCode
      - data
    Workflow:
      type: object
      properties:
        action:
          type: string
          description: Action of the workflow to be performed on the request
        comment:
          type: string
          description: Comment for the workflow action to be performed
        assignees:
          type: array
          items:
            type: string
          description: UUIDs of the users in the system to assign workflow to specific
            users
      required:
      - action
    SchemaDefinitionRequest:
      type: object
      description: Request wrapper for schema definition
      properties:
        SchemaDefinition:
          $ref: '#/components/schemas/SchemaDefinition'
      required:
      - SchemaDefinition
    SchemaDefinitionResponse:
      type: object
      description: Response wrapper for schema definitions
      properties:
        SchemaDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/SchemaDefinition'
    SchemaDefCriteria:
      type: object
      properties:
        tenantId:
          type: string
          maxLength: 100
          minLength: 1
          description: Unique id for a tenant
        codes:
          type: array
          description: Search by schema unique identifiers
          items:
            type: string
    SchemaDefSearchRequest:
      type: object
      properties:
        SchemaDefCriteria:
          $ref: '#/components/schemas/SchemaDefCriteria'
    MdmsRequest:
      type: object
      description: Request wrapper for master data operations
      properties:
        Mdms:
          type: array
          description: Array of master data records
          items:
            $ref: '#/components/schemas/Mdms'
        Workflow:
          $ref: '#/components/schemas/Workflow'
      required:
      - Mdms
    MdmsCriteriaV2:
      type: object
      required:
      - tenantId
      properties:
        tenantId:
          type: string
          maxLength: 100
          minLength: 1
          description: Tenant ID against which master data needs to be searched
        schemaCode:
          type: string
          description: Schema code for which master data needs to be searched
        uniqueIdentifiers:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Unique identifiers of the master data to be fetched
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Database entity IDs to search master data
        filters:
          type: object
          additionalProperties:
            type: string
          description: Filter map to filter master data (custom field filters)
        isActive:
          type: boolean
          description: Search master data whether it is enabled or disabled
        offset:
          type: integer
          format: int32
          description: Offset from which data should be fetched
        limit:
          type: integer
          format: int32
          description: Number of records to be fetched in search response
    MdmsCriteriaReqV2:
      type: object
      description: V2 search request wrapper
      properties:
        MdmsCriteria:
          $ref: '#/components/schemas/MdmsCriteriaV2'
    MdmsResponseV2:
      type: object
      description: V2 response wrapper for master data
      properties:
        mdms:
          type: array
          items:
            $ref: '#/components/schemas/Mdms'
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    Document:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Document
