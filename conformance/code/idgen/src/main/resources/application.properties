spring.application.name=idgen
server.port=8100
server.servlet.context-path=/idgen

# ── Datasource (was DB_* env vars in Go; defaults match) ─────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/idgen_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Boot-time Flyway is OFF. Two other things own migrations now: the init container
# migrates public at deploy time, and tenant-migration migrates each tenant schema
# through the Flyway Java API (which reads digit.tenant-migration.schema-table below
# and ignores spring.flyway.* entirely). Left on, Boot would migrate public into a
# DEFAULT flyway_schema_history table rather than idgen_schema — a second, divergent
# history alongside the init container's.
# Local dev: export SPRING_FLYWAY_ENABLED=true, or run src/main/resources/db/migrate.sh.
spring.flyway.enabled=false

# ── idgen service properties ─────────────────────────────────────────────────
# Zone for {DATE:*} rendering and sequence scope keys (NOT audit timestamps).
idgen.timezone=UTC
# Template lifecycle events (fire-and-forget; was PUBSUB_ENABLED)
idgen.events.enabled=false
idgen.events.topics.create=idgen-create-template
idgen.events.topics.update=idgen-update-template
idgen.events.topics.delete=idgen-delete-template

# ── Messaging backend (tracer PubSubClient; was PUBSUB_TYPE/KAFKA_BROKERS) ───
# Active backend is redis. Redis health is off by default (the tracer ships
# management.health.redis.enabled=false); set it true to make readiness depend on
# the redis connection. spring.kafka.* is kept only for a quick switch back to
# tracer.pubsub.type=kafka.
# kafka platform-wide: account publishes account-migration to kafka only, and a
# service on a different backend would subscribe to an empty broker and silently
# never provision a tenant schema.
tracer.pubsub.type=kafka
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=localhost:9092

# ── Canonical (header-free) routes ───────────────────────────────────────────
# Path segment of the canonical routes: /v3/{canonical-path}/template,
# /v3/{canonical-path}/generate and /v3/{canonical-path}/generate/bulk. Those routes take
# every X-* header as a requestMetadata field instead; query parameters stay query
# parameters. The 3.0 header routes are unaffected.
idgen.canonical-path=canonical

# ── Per-tenant schemas (com.digit:tenant-migration) ──────────────────────────
# schema-table MUST match the init container's migrate.sh -table (helm
# initContainers.dbMigration.schemaTable). A wrong value silently creates a second
# history table and re-runs every migration.
# consumer-group is pinned rather than defaulted: the default is
# spring.application.name, which is bound to OTEL_SERVICE_NAME — an observability
# rename would otherwise change the Kafka consumer group, and a group the broker
# has never seen replays every retained tenant event.
# NOTE: the request filter this brings in is active even when enabled=false — it
# wraps every request in a transaction and requires X-Tenant-ID. That transaction
# is why GenerationService no longer retries sequence allocation.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:idgen_schema}
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:idgen}

# ── Observability — Boot 4 property spellings ────────────────────────────────
# OTLP span export and OTLP metrics push are both OFF by default. NOTE the span
# switch is management.tracing.EXPORT.enabled — management.tracing.enabled does
# NOT gate Boot's OTLP span exporter, so leaving it as the only switch still ships
# spans (and spams connection-refused when no collector is running). To export,
# flip these to true and point the endpoint at a live collector.
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0
# Prometheus scrape (/idgen/actuator/prometheus) stays available for local metrics.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
