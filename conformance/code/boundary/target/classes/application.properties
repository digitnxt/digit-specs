server.port=${HTTP_PORT:8081}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/boundary}

spring.application.name=${OTEL_SERVICE_NAME:boundary-service}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:conformance}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Boot's Flyway auto-config is not used. The baseline (public schema) migration is run
# out-of-band by the dedicated init container (db/Dockerfile + migrate.sh) at deploy time, not
# by this service at startup. The service only migrates per-tenant schemas on demand via
# tenant-migration.
spring.flyway.enabled=false

# Used by the tracer's KafkaPubSubConfiguration (activated by tracer.pubsub.type=kafka).
# Publishing/consuming degrade gracefully when the broker is down (EventPublisher catches and
# logs; the tenant-migration consumer retries), matching Go's nil-client degradation.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# Official DIGIT tracer (org.digit:tracer) configuration. Binds under the "tracer." prefix
# (TracerProperties). tracer.pubsub.type selects the auto-configured PubSubClient (kafka|redis),
# mirroring the Go service's PUBSUB_TYPE=kafka default (client_factory.go); the broker being down
# degrades gracefully (EventPublisher catches and logs, MigrationConsumer retries). Publishing is
# additionally gated on boundary.pubsub.enabled (PUBSUB_ENABLED), like Go's shouldPublish.
tracer.request-logging-enabled=true
tracer.pubsub.type=${PUBSUB_TYPE:kafka}
tracer.pubsub.message-logging-enabled=false

# Actuator exposes the Micrometer metrics (http_server_requests, db_operations_total, boundaries_*)
# registered by the tracer + boundary BusinessMetrics. OTLP export of traces + metrics mirrors the
# Go tracer (OTEL_ENABLED default true, like config.go) — same wiring as the otp service.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.enabled=${OTEL_ENABLED:true}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.otlp.metrics.export.enabled=${OTEL_METRICS_ENABLED:true}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.tracing.export.enabled=${OTEL_ENABLED:true}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# boundary service configuration (mirrors the Go service config.LoadConfig defaults)
# Path segment the canonical API is mounted under: legacy endpoints keep serving at
# {context-path}/v3/{apiPath} (X-* header metadata, unchanged), canonical endpoints serve at
# {context-path}/v3/{canonical-prefix}/{apiPath} with RequestMetadata carried in the request
# body instead of the custom X-* headers. Both APIs are always active.
boundary.api.canonical-prefix=${CANONICAL_API_PREFIX:canonical}
boundary.otel.service-name=${OTEL_SERVICE_NAME:boundary-service}
boundary.otel.service-version=${OTEL_SERVICE_VERSION:1.0.0}
boundary.otel.otlp-endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4320}
boundary.otel.sampling-ratio=${OTEL_TRACES_SAMPLER_ARG:1.0}
boundary.otel.enabled=${OTEL_ENABLED:false}
boundary.otel.metrics-enabled=${OTEL_METRICS_ENABLED:false}
boundary.otel.prometheus-port=${PROMETHEUS_PORT:9090}
boundary.logging.level=${LOG_LEVEL:info}
boundary.logging.console-logs-enabled=${CONSOLE_LOGS_ENABLED:true}
boundary.cache.type=${CACHE_TYPE:redis}
boundary.cache.redis.address=${CACHE_REDIS_ADDR:localhost:6379}
boundary.cache.redis.password=${CACHE_REDIS_PASSWORD:}
boundary.cache.redis.db=${CACHE_REDIS_DB:0}
boundary.pubsub.enabled=${PUBSUB_ENABLED:true}
boundary.pubsub.type=${PUBSUB_TYPE:kafka}
boundary.pubsub.topics.create-boundary=${PUBSUB_TOPIC_CREATE_BOUNDARY:create-boundary-entity}
boundary.pubsub.topics.update-boundary=${PUBSUB_TOPIC_UPDATE_BOUNDARY:update-boundary-entity}
boundary.pubsub.topics.create-hierarchy=${PUBSUB_TOPIC_CREATE_HIERARCHY:create-boundary-hierarchy}
boundary.pubsub.topics.update-hierarchy=${PUBSUB_TOPIC_UPDATE_HIERARCHY:update-boundary-hierarchy}
boundary.pubsub.topics.create-relationship=${PUBSUB_TOPIC_CREATE_RELATIONSHIP:create-boundary-relationship}
boundary.pubsub.topics.update-relationship=${PUBSUB_TOPIC_UPDATE_RELATIONSHIP:update-boundary-relationship}
boundary.pubsub.kafka.brokers=${KAFKA_BROKERS:localhost:9092}
boundary.pubsub.kafka.auto-create=${KAFKA_AUTO_CREATE_TOPICS:true}
boundary.pubsub.kafka.partitions=${KAFKA_PARTITIONS:1}
boundary.pubsub.kafka.replication=${KAFKA_REPLICATION_FACTOR:1}
boundary.pubsub.kafka.consumer-group=${KAFKA_CONSUMER_GROUP:boundary-service}
boundary.pubsub.redis.address=${PUBSUB_REDIS_ADDR:localhost:6379}
boundary.pubsub.redis.password=${PUBSUB_REDIS_PASSWORD:}
boundary.pubsub.redis.db=${PUBSUB_REDIS_DB:0}
boundary.pubsub.redis.consumer-group=${REDIS_CONSUMER_GROUP:boundary-service}
boundary.pubsub.redis.consumer-id=${REDIS_CONSUMER_ID:boundary-service-1}
boundary.pubsub.redis.retention-days=${REDIS_STREAM_RETENTION_DAYS:7}
boundary.pubsub.redis.max-stream-length=${REDIS_STREAM_MAX_LEN:1000000}
boundary.pubsub.redis.cleanup-interval-seconds=${REDIS_STREAM_CLEANUP_INTERVAL_SECONDS:86400}

# Tenant schema separation — wired entirely by the tenant-migration auto-configuration; this
# service writes no Java for it. Topic, flyway locations and tenant header keep their library
# defaults and stay overridable without a code change via Spring relaxed binding:
# DIGIT_TENANTMIGRATION_TOPIC, DIGIT_TENANTMIGRATION_FLYWAYLOCATIONS, DIGIT_TENANTMIGRATION_TENANTHEADER.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
# Must match the -table the init container's migrate.sh uses for the public schema.
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:boundary_schema}
# Pinned rather than left to default to spring.application.name, which is bound to
# OTEL_SERVICE_NAME: an observability rename would otherwise change the Kafka consumer group,
# and a group the broker has never seen replays every tenant event on the topic.
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:boundary-service}
# The library's TenantTransactionFilter rejects any request without the X-Tenant-ID header
# (MISSING_HEADER) before it reaches a controller. The canonical API carries the tenant in
# the request body (RequestMetadata.tenantId) instead of that header, so its path prefix is
# excluded from the filter here.
digit.tenant-migration.filter.extra-skip-paths[0]=${CANONICAL_API_SKIP_PATH:/v3/canonical}

logging.level.root=info
