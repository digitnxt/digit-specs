spring.application.name=billing
server.port=8080
server.servlet.context-path=/billing

# ── Datasource (was DB_* env vars in Go; defaults match) ─────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Boot-time Flyway is OFF. Two other things own migrations now: the init container
# migrates public at deploy time, and tenant-migration migrates each tenant schema
# through the Flyway Java API (which reads digit.tenant-migration.schema-table below
# and ignores spring.flyway.* entirely). Left on, Boot would migrate public into a
# DEFAULT flyway_schema_history table rather than billing_schema — a second,
# divergent history alongside the init container's.
# Local dev: export SPRING_FLYWAY_ENABLED=true, or run src/main/resources/db/migrate.sh.
spring.flyway.enabled=false

# ── Canonical (header-free) API ───────────────────────────────────────────────
# Path segment of the canonical twins: /v3/{segment}/bills, /v3/{segment}/demands, …
# Moving it moves all 27 canonical routes together (CanonicalController.PATH drives the
# mappings, the interceptor exclusion and the order-0 filter prefix from this one value).
billing.canonical-path=canonical

# ── billing service properties (PORT_PLAN §6 config table) ───────────────────
billing.demand-enable-arrears=true
billing.max-instrument-date-age-days=90
billing.bulk-bill-consumer-batch-size=10
billing.idgen.host=http://localhost:8100
billing.idgen.generate-path=/idgen/v3/generate
billing.idgen.bulk-generate-path=/idgen/v3/generate/bulk
billing.idgen.bill-number-template=BillNumber
billing.idgen.receipt-number-template=ReceiptNumber
billing.idgen.transaction-number-template=TransactionNumber
billing.apportion.host=http://localhost:8280
billing.apportion.bill-path=/apportion/v3/bills
billing.topics.bulk-bill-generation=bulk-bill-generator
billing.topics.bulk-bill-generation-dlq=bulk-bill-generator-dlq

# ── Outbound HTTP (was HTTP_CLIENT_TIMEOUT_SECONDS=5) ────────────────────────
tracer.http.readTimeoutMs=5000

# ── Messaging backend (tracer PubSubClient; was PUBSUB_TYPE/KAFKA_BROKERS) ───
# kafka platform-wide: account publishes account-migration to kafka only, and a
# service on a different backend would subscribe to an empty broker and silently
# never provision a tenant schema.
tracer.pubsub.type=kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Per-tenant schemas (com.digit:tenant-migration) ──────────────────────────
# schema-table MUST match the init container's migrate.sh -table (helm
# initContainers.dbMigration.schemaTable). A wrong value silently creates a second
# history table and re-runs every migration.
# consumer-group is pinned, and is deliberately NOT the "billing-service" group used
# for the bulk-bill topics in PubSubSubscriptions — sharing a group across topics is
# not what you want.
# NOTE: the request filter this brings in is active even when enabled=false — it
# wraps every request in a transaction and requires X-Tenant-ID. That transaction is
# why the bulk demand endpoints no longer collect per-item write failures, and why
# bill generation no longer retries a lost uniq_active_bill race.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:billing_schema}
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:billing}

# ── Observability — Boot 4 property spellings ────────────────────────────────
# OTLP span export and OTLP metrics push are both OFF by default. NOTE the span
# switch is management.tracing.EXPORT.enabled — management.tracing.enabled does
# NOT gate Boot's OTLP span exporter, so leaving it as the only switch still ships
# spans (and spams connection-refused when no collector is running). To export,
# flip these to true and point the endpoint at a live collector.
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0
# Prometheus scrape (/billing/actuator/prometheus) stays available for local metrics.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
