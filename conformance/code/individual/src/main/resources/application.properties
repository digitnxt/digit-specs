# Default 8080 matches individual-go.
server.port=${SERVER_PORT:8080}
# Servlet-level context path: controllers map plain /v3/... and the container prefixes this.
# Everything moves under it, including /individuals/actuator/** and /individuals/internal/migrate.
server.servlet.context-path=${SERVER_CONTEXT_PATH:/individuals}
# Segment that mounts the canonical (envelope-style) API at /v3/<prefix>/... alongside the
# header-based /v3/... API. Also excluded from HeaderInterceptor, which the envelope replaces.
individual.server.canonical-api-prefix=${CANONICAL_API_PREFIX:canonical}
spring.application.name=${OTEL_SERVICE_NAME:individual-service}

# ── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool, mapped from the Go DB_* knobs. Note the unit change on max-lifetime: Go's
# DB_CONN_MAX_LIFETIME is SECONDS, Hikari's maxLifetime is MILLISECONDS, so the value is suffixed
# with "000" to convert (300 -> 300000 ms). Set DB_CONN_MAX_LIFETIME in seconds, as in Go.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_OPEN_CONNS:10}
spring.datasource.hikari.minimum-idle=${DB_MAX_IDLE_CONNS:5}
spring.datasource.hikari.max-lifetime=${DB_CONN_MAX_LIFETIME:300}000

# ── Flyway ───────────────────────────────────────────────────────────────────
# Boot's Flyway auto-config is not used. The baseline (public schema) migration is run out-of-band by
# a dedicated init-container at deploy time, not by this service at startup. The service only migrates
# per-tenant schemas on demand via tenant-migration.
spring.flyway.enabled=false

# ── DIGIT tracer (org.digit:tracer) ──────────────────────────────────────────
# NOTE the prefix is `tracer`, not `digit.tracer`: TracerProperties is
# @ConfigurationProperties("tracer"), so digit.tracer.* silently binds to nothing. There is also no
# tracer.otel.* section at all — OTel is driven by the management.* keys below and the OTEL_* env the
# SDK reads directly, so the four digit.tracer.otel.* keys that used to sit here were dead twice over.
tracer.request-logging-enabled=true

# Pub/sub backend. This is what actually selects Kafka vs Redis; the service's own
# individual.pubsub.type is not read by the tracer. Connection details come from Spring's own keys —
# individual.pubsub.kafka.brokers is likewise not read by anything.
tracer.pubsub.type=${PUBSUB_TYPE:kafka}
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Actuator / observability ─────────────────────────────────────────────────
# Exposes the Micrometer metrics (http_server_requests, db_operations, individuals_created, ...)
# registered by the tracer + individual BusinessMetrics. Boot's own OTLP export is disabled.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Health is actuator's alone — there is no hand-written /health controller. Unlike one, this
# reports DOWN when a dependency (e.g. the database) is unreachable.
#   liveness  -> <context-path>/actuator/health/liveness   (process alive; do not restart)
#   readiness -> <context-path>/actuator/health/readiness  (dependencies OK; safe to route)
# probes.enabled makes those groups available off-Kubernetes too, so local and deployed match.
management.endpoint.health.probes.enabled=true
# Boot's default readiness group is readinessState ONLY — it reports UP with the database
# unreachable, which is the same trap the old hand-written /health had. Add db explicitly so
# readiness means "can actually serve a request".
management.endpoint.health.group.readiness.include=readinessState,db
management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false

# ── individual service ───────────────────────────────────────────────────────
# Mirrors the Go service config.LoadConfig defaults. context-path default is /individuals so the
# resource groups resolve to /individuals/v3/individuals and /individuals/v3/configs.
individual.hmac-secret=${HMAC_SECRET:}

# Internal service convention: hosts END with a slash, paths do NOT begin with one. The client
# concatenates host + path as-is, so both halves must follow this or the resulting URL is wrong.
individual.idgen.host=${IDGEN_HOST:http://localhost:8100/}
individual.idgen.path=${IDGEN_PATH:idgen/v3/generate}
individual.idgen.enabled=${IDGEN_ENABLED:true}
individual.idgen.format=${IDGEN_INDIVIDUAL_ID_FORMAT:individual}

individual.vault.address=${VAULT_HOST:http://localhost:8202}
individual.vault.role-id=${VAULT_ROLE_ID:}
individual.vault.secret-id=${VAULT_SECRET_ID:}
individual.vault.enabled=${VAULT_ENABLED:false}

individual.otel.service-name=${OTEL_SERVICE_NAME:individual-service}
individual.otel.service-version=${OTEL_SERVICE_VERSION:1.0.0}
individual.otel.otlp-endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
individual.otel.sampling-ratio=${OTEL_SAMPLING_RATIO:1.0}
individual.otel.enabled=${OTEL_ENABLED:false}
individual.otel.metrics-enabled=${OTEL_METRICS_ENABLED:false}
individual.otel.prometheus-port=${PROMETHEUS_PORT:}

individual.logging.level=${LOG_LEVEL:info}
individual.logging.console-logs-enabled=${CONSOLE_LOGS_ENABLED:true}

# ── Tenant schema separation ─────────────────────────────────────────────────
# Wired entirely by the tenant-migration auto-configuration; this service writes no Java for it.
# Topic, flyway locations and tenant header keep their library defaults and are still overridable
# without a code change, via Spring relaxed binding: DIGIT_TENANTMIGRATION_TOPIC,
# DIGIT_TENANTMIGRATION_FLYWAYLOCATIONS, DIGIT_TENANTMIGRATION_TENANTHEADER.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:individual_schema}
# Pinned rather than left to default to spring.application.name, which is bound to OTEL_SERVICE_NAME:
# an observability rename would otherwise change the Kafka consumer group, and a group the broker has
# never seen starts at `earliest` and replays every tenant event ever published to the topic.
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:individual-service}

# ── Pub/sub topics and backends ──────────────────────────────────────────────
individual.pubsub.enabled=${PUBSUB_ENABLED:false}
individual.pubsub.topics.create-individual=${PUBSUB_TOPIC_CREATE_INDIVIDUAL:individual-create-individual}
individual.pubsub.topics.update-individual=${PUBSUB_TOPIC_UPDATE_INDIVIDUAL:individual-update-individual}
individual.pubsub.topics.delete-individual=${PUBSUB_TOPIC_DELETE_INDIVIDUAL:individual-delete-individual}
individual.pubsub.topics.upsert-config=${PUBSUB_TOPIC_UPSERT_CONFIG:individual-upsert-config}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=info
