server:
  port: ${HTTP_PORT:8999}

spring:
  application:
    name: ${OTEL_SERVICE_NAME:individual-service}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:individual}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Boot's Flyway auto-config is not used. The baseline (public schema) migration is run
    # out-of-band by a dedicated init-container at deploy time, not by this service at startup.
    # The service only migrates per-tenant schemas on demand via tenant-migration-java.
    enabled: false

# Official DIGIT tracer (org.digit:tracer) configuration. Telemetry, the request-tracing filter and
# Micrometer metrics are owned by the tracer library. NOTE: digit.tracer.pubsub.type is intentionally
# left UNSET so no PubSubClient bean is created — pub/sub becomes a graceful no-op and no Kafka broker
# is required at startup (matches the Go service's graceful degradation).
digit:
  tracer:
    request-logging-enabled: true
    otel:
      enabled: ${OTEL_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      service-name: ${OTEL_SERVICE_NAME:individual-service}
      service-version: ${OTEL_SERVICE_VERSION:1.0.0}

# Actuator exposes the Micrometer metrics (http_server_requests, db_operations, individuals_created, ...)
# registered by the tracer + individual BusinessMetrics. Disable Spring Boot's own OTLP export auto-config.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

# individual service configuration (mirrors the Go service config.LoadConfig defaults).
# context-path default is /individuals so the resource groups (/v3/individuals, /v3/configs)
# resolve to the deployed/postman contract paths /individuals/v3/individuals and /individuals/v3/configs.
individual:
  hmac-secret: ${HMAC_SECRET:}
  server:
    context-path: ${SERVER_CONTEXT_PATH:/individuals}
  idgen:
    host: ${IDGEN_HOST:http://idgen:8080}
    path: ${IDGEN_PATH:/idgen/v3/generate}
    enabled: ${IDGEN_ENABLED:true}
    format: ${IDGEN_INDIVIDUAL_ID_FORMAT:individual.id}
  vault:
    address: ${VAULT_HOST:http://localhost:8202}
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
    enabled: ${VAULT_ENABLED:true}
  otel:
    service-name: ${OTEL_SERVICE_NAME:individual-service}
    service-version: ${OTEL_SERVICE_VERSION:1.0.0}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
    sampling-ratio: ${OTEL_SAMPLING_RATIO:1.0}
    enabled: ${OTEL_ENABLED:true}
    metrics-enabled: ${OTEL_METRICS_ENABLED:true}
    prometheus-port: ${PROMETHEUS_PORT:}
  logging:
    level: ${LOG_LEVEL:info}
    console-logs-enabled: ${CONSOLE_LOGS_ENABLED:true}
  tenant-migration:
    enabled: ${SCHEMA_SEPARATION_MODE:false}
    topic: ${SCHEMA_SEPARATION_TOPIC:account-migration}
    flyway-locations: ${MIGRATION_FLYWAY_LOCATIONS:classpath:db/migration}
    schema-table: ${MIGRATION_SCHEMA_TABLE:individual_schema}
  pubsub:
    enabled: ${PUBSUB_ENABLED:true}
    type: ${PUBSUB_TYPE:kafka}
    topics:
      create-individual: ${PUBSUB_TOPIC_CREATE_INDIVIDUAL:individual-create-individual}
      update-individual: ${PUBSUB_TOPIC_UPDATE_INDIVIDUAL:individual-update-individual}
      delete-individual: ${PUBSUB_TOPIC_DELETE_INDIVIDUAL:individual-delete-individual}
      upsert-config: ${PUBSUB_TOPIC_UPSERT_CONFIG:individual-upsert-config}
    kafka:
      brokers: ${KAFKA_BROKERS:localhost:9092}
      auto-create: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:true}
      partitions: ${KAFKA_PARTITION_COUNT:1}
      replication: ${KAFKA_REPLICATION_FACTOR:1}
      consumer-group: ${KAFKA_CONSUMER_GROUP:individual-service}
    redis:
      address: ${REDIS_ADDRESS:localhost:6379}
      password: ${REDIS_PASSWORD:}
      db: ${REDIS_DB:0}
      consumer-group: ${REDIS_CONSUMER_GROUP:individual-service}
      consumer-id: ${REDIS_CONSUMER_ID:individual-service-1}
      retention-days: ${REDIS_RETENTION_DAYS:7}
      max-stream-length: ${REDIS_MAX_STREAM_LENGTH:1000000}
      cleanup-interval-seconds: ${REDIS_CLEANUP_INTERVAL:3600}

logging:
  level:
    root: info
