# Default 8094 matches account-go.
server.port=${SERVER_PORT:8094}
# Servlet-level context path: controllers map plain /v3/... and the container prefixes this.
# Everything moves under it, including /account/actuator/** and /account/internal/migrate.
server.servlet.context-path=${CONTEXT_PATH:/accounts}
# Segment that mounts the canonical (envelope-style) API at /v3/<prefix>/... alongside the
# header-based /v3/... API.
account.server.canonical-api-prefix=${CANONICAL_API_PREFIX:canonical}
spring.application.name=${OTEL_SERVICE_NAME:account-service}

# ── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── DIGIT tracer (org.digit:tracer) ──────────────────────────────────────────
# NOTE the prefix is `tracer`, not `digit.tracer`: TracerProperties is
# @ConfigurationProperties("tracer"), so digit.tracer.* silently binds to nothing. There is also no
# tracer.otel.* section at all — OTel is driven by the management.* keys below and the OTEL_* env the
# SDK reads directly, so the four digit.tracer.otel.* keys that used to sit here were dead twice over.
tracer.request-logging-enabled=true

# Pub/sub backend. This is what actually selects Kafka vs Redis; the service's own
# account.pubsub.type is not read by the tracer. Connection details come from Spring's own keys —
# account.pubsub.kafka.brokers is likewise not read by anything.
tracer.pubsub.type=${PUBSUB_TYPE:kafka}
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Actuator / observability ─────────────────────────────────────────────────
# Exposes the Micrometer metrics (http_server_requests, db_operations, ...) registered by the tracer.
# Boot's own OTLP export is disabled.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Health is actuator's alone — there is no hand-written /health controller. Unlike one, this
# reports DOWN when a dependency (e.g. the database) is unreachable.
#   liveness  -> <context-path>/actuator/health/liveness   (process alive; do not restart)
#   readiness -> <context-path>/actuator/health/readiness  (dependencies OK; safe to route)
# probes.enabled makes those groups available off-Kubernetes too, so local and deployed match.
management.endpoint.health.probes.enabled=true
# Boot's default readiness group is readinessState ONLY — it reports UP with the database
# unreachable, which is the same trap the old hand-written /health had. Add db explicitly so
# readiness means "can actually serve a request".
management.endpoint.health.group.readiness.include=readinessState,db
management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false

# ── account service ──────────────────────────────────────────────────────────
# Mirrors the Go service config.LoadConfig defaults.
account.server.log-level=${LOG_LEVEL:info}

account.otel.service-name=${OTEL_SERVICE_NAME:account-service}
account.otel.service-version=${OTEL_SERVICE_VERSION:1.0.0}
account.otel.otlp-endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
account.otel.sampling-ratio=${OTEL_SAMPLING_RATIO:1.0}
account.otel.enabled=${OTEL_ENABLED:false}
account.otel.metrics-enabled=${OTEL_METRICS_ENABLED:false}
account.otel.prometheus-port=${PROMETHEUS_PORT:8888}

account.logging.console-logs-enabled=${CONSOLE_LOGS_ENABLED:true}

# ── Keycloak ─────────────────────────────────────────────────────────────────
# Keycloak does NOT follow the internal-service convention below: this base url includes the
# Keycloak context path and does NOT end with a slash, because the client appends vendor-specified
# admin API paths that are written with a leading slash (e.g. "/admin/realms/{realm}/users").
account.keycloak.base-url=${KEYCLOAK_BASE_URL:http://keycloak:8080/keycloak}
# Browser-reachable Keycloak, used only in links emailed to people (the tenant admin's account
# console). MUST be overridden per environment: the in-cluster base-url above is not resolvable
# from a mail client, so leaving this at its default emails a dead link.
account.keycloak.public-base-url=${KEYCLOAK_PUBLIC_BASE_URL:https://test-lts.digit.org/keycloak}
account.keycloak.admin-user=${KEYCLOAK_ADMIN_USER:admin}
account.keycloak.admin-pass=${KEYCLOAK_ADMIN_PASS:admin}
account.keycloak.realm-config-path=${KEYCLOAK_REALM_CONFIG_PATH:}
account.keycloak.citizen-broker-client-id=${CITIZEN_BROKER_CLIENT_ID:citizen-broker}
account.keycloak.citizen-broker-client-secret=${CITIZEN_BROKER_CLIENT_SECRET:zjlrLxJCFpsRIemN9pJpUC9Wy9gjWS7m}
account.keycloak.auth-server-client-secret=${AUTH_SERVER_CLIENT_SECRET:changeme}
# Substituted into realm_config.json as the employee-iam-client secret. That client is
# confidential with service accounts enabled, so an empty value leaves the employee service
# unable to authenticate against a new tenant's realm. Defaults to the same obvious
# placeholder as auth-server; override per environment.
account.keycloak.employee-iam-client-secret=${EMPLOYEE_IAM_CLIENT_SECRET:changeme}

# Token and session lifespans stamped onto each new realm, in seconds. Defaults are the values
# realm_config.json already carried, so leaving these unset provisions the same realm as before.
# Applied to the parsed template rather than substituted into it: these are JSON numbers, and a
# placeholder in a numeric slot would leave realm_config.json invalid on disk.
# New realms only — Keycloak stores them per realm at import, so existing tenants are unaffected.
# Keep sso-session-idle-timeout ABOVE access-token-lifespan. Inverted, a token still validates
# offline (Kong checks only exp against JWKS) after its session has idled out, so the gateway
# accepts a token that /userinfo, refresh and introspection all reject.
# NB: Kong's token-revocation plugin sets revocation_ttl to ssoSessionMaxLifespan +
# accessTokenLifespan — 50400 for the values below. Raising either without raising that TTL lets a
# client that keeps refreshing outlive the revocation key and be accepted after logout.
# SMTP for each new realm. Keycloak sends the forgot-password mail itself from the realm's own SMTP
# settings, not through the notification service, so realm_config's resetPasswordAllowed=true needs
# these or the reset link's mail can never be delivered. Leave host empty to skip the block entirely
# rather than write a partial one Keycloak accepts and then fails on at send time.
# Port 587 is STARTTLS, not implicit SSL — setting ssl=true on 587 makes every send time out.
account.keycloak.smtp.host=${SMTP_HOST:}
account.keycloak.smtp.port=${SMTP_PORT:587}
account.keycloak.smtp.from=${SMTP_FROM_ADDRESS:}
account.keycloak.smtp.from-display-name=${SMTP_FROM_NAME:}
account.keycloak.smtp.reply-to=${SMTP_REPLY_TO:}
account.keycloak.smtp.reply-to-display-name=${SMTP_REPLY_TO_NAME:}
account.keycloak.smtp.envelope-from=${SMTP_ENVELOPE_FROM:}
account.keycloak.smtp.ssl=${SMTP_SSL:false}
account.keycloak.smtp.starttls=${SMTP_STARTTLS:true}
account.keycloak.smtp.auth=${SMTP_AUTH:true}
account.keycloak.smtp.user=${SMTP_USERNAME:}
account.keycloak.smtp.password=${SMTP_PASSWORD:}

account.keycloak.tokens.access-token-lifespan=${ACCESS_TOKEN_LIFESPAN:14400}
account.keycloak.tokens.sso-session-idle-timeout=${SSO_SESSION_IDLE_TIMEOUT:28800}
account.keycloak.tokens.sso-session-max-lifespan=${SSO_SESSION_MAX_LIFESPAN:36000}
account.keycloak.tokens.offline-session-idle-timeout=${OFFLINE_SESSION_IDLE_TIMEOUT:2592000}
account.keycloak.tokens.offline-session-max-lifespan=${OFFLINE_SESSION_MAX_LIFESPAN:5184000}

# ── Downstream services ──────────────────────────────────────────────────────
# Internal service convention: base URLs are host+port only and END with a slash — no context path.
# Endpoint paths carry the context path and do NOT begin with a slash. Both halves are config-driven,
# so an endpoint can be re-routed or version-bumped without a code change. Keycloak is not one of
# these; it builds its own URLs and its base-url stays slash-free.
account.otp.base-url=${OTP_BASE_URL:http://localhost:8107/}
account.otp.generate-path=${OTP_GENERATE_PATH:otp/v3/generate}
account.otp.verify-path=${OTP_VERIFY_PATH:otp/v3/verify}
account.otp.resend-path=${OTP_RESEND_PATH:otp/v3/resend}
account.otp.timeout-seconds=${OTP_TIMEOUT_SECONDS:10}
account.otp.config-path=${OTP_CONFIG_PATH:otp/v3/config}
# Purposes seeded on tenant creation. The OTP service resolves config strictly by
# (tenantId, purpose) with no fallback, so a realm whose login flow asks for a code cannot
# issue one until these rows exist. Only the purpose is sent; every other field falls to the
# OTP service's own column defaults.
account.otp.bootstrap-purposes=${OTP_BOOTSTRAP_PURPOSES:login,registration}
account.otp.platform-tenant=${OTP_PLATFORM_TENANT:default}

# Notification: emails a generated tenant-admin password, through notify. The config is owned by a
# platform tenant for the same reason OTP_PLATFORM_TENANT exists — account is what provisions
# tenants, so at create time there is no tenant-scoped config to render from, and notify resolves
# configs strictly by (tenant_id, template_code) with no server-side fallback. Kept as its own
# property so re-pointing the OTP tenant does not silently move the config too.
account.notification.base-url=${NOTIFY_BASE_URL:http://notify:8080/}
account.notification.notify-send-path=${NOTIFY_SEND_PATH:notify/v3/notifications}
# Matches account.otp.platform-tenant above so both platform-scoped calls use one tenant. Case is
# significant: notify matches tenant_id exactly, so "DEFAULT" is a different, empty tenant.
account.notification.platform-tenant=${NOTIFICATION_PLATFORM_TENANT:default}
account.notification.temp-password-template-code=${NOTIFY_TEMP_PASSWORD_TEMPLATE_CODE:account-tenant-temp-password}
# Sign-in link in the temp-password email. {realm} (or {tenantCode}) is replaced with the tenant's
# code. A whole URL, not a path bolted onto a base: the realm sits mid-path in Keycloak's admin
# console, and the destination need not be Keycloak — point this at a tenant-scoped app UI and the
# email follows, no code change. The default reuses KEYCLOAK_PUBLIC_BASE_URL so the host is declared
# once; overriding FIRST_LOGIN_URL replaces the whole thing.
# Comma-separated label=url entries, in the order they should appear in the email. The label is what
# the email template names ({{ .loginUrls.admin }}), so it must match the template. {realm} and
# {tenantCode} both substitute the tenant's code, in every entry. Blank entries are dropped; an entry
# with no label= prefix is kept under a positional key and warned about, since no labelled template
# can name it. A map rather than a list because the notification renderer does field access only.
account.notification.first-login-urls=${FIRST_LOGIN_URLS:admin=https://test-lts.digit.org/license/admin/{realm},employee=https://test-lts.digit.org/license/employee/{realm},citizen=https://test-lts.digit.org/license/citizen/{realm}}
account.notification.timeout-seconds=${NOTIFICATION_TIMEOUT_SECONDS:10}
account.notification.enabled=${NOTIFICATION_ENABLED:true}

# ── Front-end clients in each tenant realm ───────────────────────────────────
# redirectUris for the employee and citizen clients. {realm} (or {tenantCode}) is replaced with the
# tenant's code, so a realm only accepts redirects under its own path instead of the whole host.
# webOrigins is derived from the same value with the trailing /* removed — an origin is
# scheme://host[:port] and Keycloak will not match one that carries a path glob.
account.client.redirect-url=${CLIENT_REDIRECT_URL:https://test-lts.digit.org/{realm}/*}

# ── Platform-operator auth (tenant lifecycle) ────────────────────────────────
# These endpoints cannot sit behind the gateway's keycloak-rbac like every other service, because
# they run before the tenant realm that would authorize them exists. The platform realm is the
# authority instead. Defaults to ENABLED: disabling it leaves tenant create/update/delete open.
account.auth.enabled=${PLATFORM_AUTH_ENABLED:true}
account.auth.platform-realm=${PLATFORM_AUTH_REALM:master}
account.auth.required-role=${PLATFORM_AUTH_REQUIRED_ROLE:SUPERADMIN}
# Expected iss. Left empty it is derived from account.keycloak.public-base-url — the hostname tokens
# actually carry; deriving it from base-url instead would reject every real token. Set it when the
# platform realm answers on a different host to the one used for emailed links. jwks-uri,
# jwks-cache-seconds and clock-skew-seconds are deliberately absent: their defaults hold, and
# Spring's relaxed binding still accepts ACCOUNT_AUTH_JWKS_URI and friends if one needs overriding.
account.auth.issuer=${PLATFORM_AUTH_ISSUER:}
# METHOD:/path, * matches one segment. Matched with the canonical prefix stripped, so each entry
# covers both /v3/... and /v3/canonical/... . Add an entry to move another endpoint behind the lock.
account.auth.protected-endpoints[0]=POST:/v3/tenants
account.auth.protected-endpoints[1]=PUT:/v3/tenants/*
account.auth.protected-endpoints[2]=DELETE:/v3/tenants/*

# Self-service registration. Note this interacts with the block above: registrations/verify creates a
# tenant through the same code path as POST /v3/tenants, so leaving this enabled means tenant
# creation stays reachable without a platform token.
account.signup.enabled=${SIGNUP_ENABLED:true}

# ── Pub/sub topics and backends ──────────────────────────────────────────────
account.pubsub.enabled=${PUBSUB_ENABLED:true}
account.pubsub.topics.create-tenant=${PUBSUB_TOPIC_CREATE_TENANT:account-create-tenant}
account.pubsub.topics.update-tenant=${PUBSUB_TOPIC_UPDATE_TENANT:account-update-tenant}
account.pubsub.topics.delete-tenant=${PUBSUB_TOPIC_DELETE_TENANT:account-delete-tenant}
account.pubsub.topics.create-tenant-config=${PUBSUB_TOPIC_CREATE_TENANT_CONFIG:account-create-tenant-config}
account.pubsub.topics.update-tenant-config=${PUBSUB_TOPIC_UPDATE_TENANT_CONFIG:account-update-tenant-config}
# Consumed by every service that has schema separation enabled.
account.pubsub.topics.migration-topic=${PUBSUB_TOPIC_MIGRATION:account-migration}

account.pubsub.redis.address=${REDIS_ADDRESS:localhost:6379}
account.pubsub.redis.password=${REDIS_PASSWORD:}
account.pubsub.redis.db=${REDIS_DB:0}

# ── Logging ──────────────────────────────────────────────────────────────────
# Keep Spring's own logging quiet enough; the tracer OTelLogger emits structured console JSON.
logging.level.root=info
