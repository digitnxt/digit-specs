server.port=8080
server.shutdown=graceful

spring.application.name=notify-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notify}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notify}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=notify-hikari

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Migrates the shared schema at startup, which is what docker-compose and a bare `mvn spring-boot:run`
# rely on. Deployments set SPRING_FLYWAY_ENABLED=false and let the notify-db init container do it
# instead, so the pod does not need DDL rights. Either way this only ever touches the shared schema —
# per-tenant schemas are migrated by tenant-migration from the same scripts, under its own history
# table, so the two never write to the same one.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.lifecycle.timeout-per-shutdown-phase=30s

notify.plugins.directory=${NOTIFY_PLUGINS_DIR:/providers}

# Topic consumer. Off by default: the HTTP endpoint is the primary entry point, and a
# deployment with no broker should not log subscription retries.
notify.topics.send.enabled=${NOTIFY_TOPIC_SEND_ENABLED:false}
notify.topics.send.topic=${NOTIFY_TOPIC_SEND:notify-send}
notify.topics.send.consumer-group=${KAFKA_CONSUMER_GROUP:notify-service}

# Kafka or redis, resolved by the tracer's PubSubClient.
tracer.pubsub.type=${PUBSUB_TYPE:kafka}
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# Tenant schema separation — wired by the tenant-migration auto-configuration. The only Java this
# service writes for it is the TenantContext binding in NotifyTopicConsumer, because a consumer
# thread has no request to carry the tenant. Topic, flyway locations and tenant header keep their
# library defaults and stay overridable without a code change via Spring relaxed binding:
# DIGIT_TENANTMIGRATION_TOPIC, DIGIT_TENANTMIGRATION_FLYWAYLOCATIONS, DIGIT_TENANTMIGRATION_TENANTHEADER.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
# Must match initContainers.dbMigration.schemaTable in the helm chart, which is the -table the init
# container's migrate.sh uses for the shared schema. A wrong value silently creates a second history
# table and re-runs every migration.
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:notify_schema}
# Pinned rather than left to default to spring.application.name, which deployments bind to
# OTEL_SERVICE_NAME: an observability rename would otherwise change the Kafka consumer group, and a
# group the broker has never seen replays every tenant event on the topic.
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:notify-service}
# The provider registry is the catalogue of jars this pod loaded, not tenant data — it lives in the
# shared schema (see ProviderEntity) and its endpoints take no X-Tenant-ID, so requiring one here
# would answer 400 to every call.
digit.tenant-migration.filter.extra-skip-paths=/v3/providers

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
