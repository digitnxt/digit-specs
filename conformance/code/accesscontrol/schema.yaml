          description: User ID who last modified the record
        modifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp in epoch milliseconds
    BulkCreateRbacRulesResponse:
      type: object
      properties:
        created:
          type: integer
          minimum: 0
