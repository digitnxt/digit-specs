openapi: 3.0.3
info:
  title: Access Control Service
  version: 3.0.0
  description: "Centralized Access Control microservice supporting both Role-Based\
    \ Access Control \nand Job-Based Access Control  for Kong gateway integration.\n\
    Manages access control rules with tenant-aware operations, version tracking, and\
    \ internal\nendpoints for Kong plugin integration.\n"
servers:
- url: https://api.example.com/access/v3
  description: Production server
- url: https://staging-api.example.com/access/v3
  description: Staging server
- url: http://localhost:8080/access/v3
  description: Local development server
security:
- BearerAuth: []
tags:
- name: RBAC Rules
  description: Role-Based Access Control rule CRUD operations
- name: JBAC Rules
  description: Job-Based Access Control rule CRUD operations
- name: Internal
  description: Internal endpoints for Kong plugin integration
paths:
  /rbac/rules:
    post:
      tags:
      - RBAC Rules
      summary: Create RBAC rule
      operationId: createRbacRule
      description: 'Creates a new Role-Based Access Control rule for the tenant.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Request body must contain valid rule configuration


        **Business Rules:**

        - Rule ID is auto-generated as UUID

        - Priority determines rule evaluation order (lower values evaluated first)

        - Multiple roles can be assigned to a single rule

        - Path supports wildcard patterns (e.g., /api/*/users)

        - HTTP method must be one of: GET, POST, PUT, DELETE, PATCH

        - Effect must be either ALLOW or DENY

        - Enabled flag defaults to true if not specified


        **Post-conditions:**

        - Rule is persisted to database

        - Response includes complete rule object with generated ID

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RbacRuleRequest'
            example:
              roleNames:
              - admin
              - moderator
              httpMethod: POST
              path: /api/users
              effect: ALLOW
              priority: 10
              description: Allow admins and moderators to create users
              enabled: true
      responses:
        '201':
          description: Rule created successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity - business rule violation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    get:
      tags:
      - RBAC Rules
      summary: List RBAC rules with pagination
      operationId: listRbacRules
      description: 'Retrieves a paginated list of Role-Based Access Control rules
        for the tenant.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid


        **Business Rules:**

        - Results are filtered by tenant ID from header

        - Results are sorted by priority (ascending) then by creation time (descending)

        - Disabled rules are included in results but can be filtered

        - Pagination defaults to page 1, size 20 if not specified

        - Maximum page size is 100


        **Post-conditions:**

        - Response includes total count of rules matching filter

        - Response includes current page number and size

        - Response includes hasMore flag for client pagination

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: limit
        in: query
        required: false
        description: Maximum number of rules to return (max 100)
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
      - name: offset
        in: query
        required: false
        description: Number of rules to skip
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: roleName
        in: query
        required: false
        description: Filter by role name
        schema:
          type: string
      - name: httpMethod
        in: query
        required: false
        description: Filter by HTTP method
        schema:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
      - name: effect
        in: query
        required: false
        description: Filter by effect
        schema:
          type: string
          enum:
          - ALLOW
          - DENY
      - name: enabled
        in: query
        required: false
        description: Filter by enabled status
        schema:
          type: boolean
      responses:
        '200':
          description: Rules retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    parameters: []
  /rbac/rules/bulk:
    post:
      tags:
      - RBAC Rules
      summary: Bulk create RBAC rules
      operationId: bulkCreateRbacRules
      description: 'Creates multiple RBAC rules in a single request for the tenant.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Request body must contain array of valid rule configurations


        **Business Rules:**

        - All rules must be valid for the entire operation to succeed

        - If any rule fails validation, the entire operation is rolled back

        - Maximum 100 rules per request


        **Post-conditions:**

        - All rules are persisted to database

        - Response includes array of created rules with generated IDs

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                rules:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/RbacRuleRequest'
            example:
              rules:
              - roleNames:
                - admin
                httpMethod: POST
                path: /api/users
                effect: ALLOW
                priority: 10
                description: Allow admins to create users
                enabled: true
              - roleNames:
                - moderator
                httpMethod: GET
                path: /api/users
                effect: ALLOW
                priority: 20
                description: Allow moderators to view users
                enabled: true
      responses:
        '201':
          description: Rules created (atomic — all or none)
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateRbacRulesResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity - business rule violation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    parameters: []
  /rbac/rules/tenant:
    delete:
      tags:
      - RBAC Rules
      summary: Delete all RBAC rules for a tenant
      operationId: deleteRbacRulesByTenant
      description: 'Deletes all RBAC rules for the tenant specified in X-Tenant-ID
        header.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid


        **Business Rules:**

        - This is a destructive operation that removes all rules for the tenant

        - Operation is idempotent (deleting non-existent rules returns success)


        **Post-conditions:**

        - All rules for the tenant are removed

        - Response is 204 No Content

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '204':
          description: Rules deleted successfully — no content returned
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    parameters: []
  /rbac/rules/{id}:
    get:
      tags:
      - RBAC Rules
      summary: Get a single RBAC rule
      operationId: getRbacRule
      description: 'Retrieves a specific RBAC rule by ID for the tenant.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Rule ID must be a valid UUID


        **Business Rules:**

        - Rule must belong to the tenant specified in X-Tenant-ID header

        - Deleted rules cannot be retrieved


        **Post-conditions:**

        - Response includes complete rule object with all fields

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: id
        in: path
        required: true
        description: Rule ID (UUID)
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rule retrieved successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    patch:
      tags:
      - RBAC Rules
      summary: Partially update an RBAC rule
      operationId: updateRbacRule
      description: 'Partially updates an existing RBAC rule for the tenant. Only fields present in the request body are modified; absent fields are left untouched. For nullable fields (constraints, description) sending an explicit JSON `null` clears the column.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Rule ID must be a valid UUID and exist

        - Rule must belong to the tenant specified in X-Tenant-ID header


        **Business Rules:**

        - Rule ID cannot be changed

        - Tenant ID cannot be changed

        - All fields in request body are updated

        - Priority can be modified to reorder rule evaluation

        - Enabled status can be toggled without affecting other rules


        **Post-conditions:**

        - Rule is persisted with updated values

        - Modification timestamp is updated

        - Response includes updated rule object

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: id
        in: path
        required: true
        description: Rule ID (UUID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRbacRuleRequest'
      responses:
        '200':
          description: Rule updated successfully
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RbacRuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity - business rule violation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    delete:
      tags:
      - RBAC Rules
      summary: Delete an RBAC rule
      operationId: deleteRbacRule
      description: 'Deletes an RBAC rule for the tenant.


        **Pre-conditions:**

        - User must be authenticated with valid bearer token

        - X-Tenant-ID header must be present and valid

        - Rule ID must be a valid UUID and exist

        - Rule must belong to the tenant specified in X-Tenant-ID header


        **Business Rules:**

        - Delete is a hard delete — rule is permanently removed from database

        - Deleted rules do not appear in list or get operations


        **Post-conditions:**

        - Rule is removed from database

        - Response is 204 No Content on success

        '
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      - name: id
        in: path
        required: true
        description: Rule ID (UUID)
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Rule deleted successfully — no content returned
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid bearer token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    parameters:
