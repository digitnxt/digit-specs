      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset'
  schemas:
    Error:
      $ref: 'https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error'
    RbacRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Rule ID
        roleNames:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
          description: List of role names
        httpMethod:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          description: HTTP method (canonical uppercase)
        path:
          type: string
          minLength: 1
          maxLength: 256
          description: API path pattern
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
          description: Effect (canonical uppercase)
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Priority
        enabled:
          type: boolean
          description: Is enabled
        constraints:
          description: Additional constraints (JSON, max 4096 bytes)
        description:
          type: string
          maxLength: 256
          description: Description
        requestId:
          type: string
          description: Request ID for traceability
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    InternalRbacRulesResponse:
      type: object
      description: |
        Response returned by GET /internal/rbac/rules — a paginated list of
        RBAC rules ACROSS ALL TENANTS. This is distinct from
        RbacRuleListResponse, which is returned by the tenant-scoped public
        list endpoint. The wire format happens to be identical, but the
        semantics are different:
          - public endpoint: requires X-Tenant-ID, returns only that tenant's rules
          - internal endpoint (this one): no tenant filter, returns rules for all tenants
            (used by the Kong plugin to build a global authorization cache)
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RbacRule'
        limit:
          type: integer
          minimum: 0
          maximum: 1000
        offset:
          type: integer
          minimum: 0
          maximum: 100000
        total:
          type: integer
          minimum: 0
    InternalJbacRulesResponse:
      type: object
      description: |
        Response returned by GET /internal/jbac/rules — a paginated list of
        JBAC rules ACROSS ALL TENANTS. Same distinction as
        InternalRbacRulesResponse vs JbacRuleListResponse: shape is identical,
        semantics differ (no tenant scoping, used by the Kong plugin).
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/JbacRule'
        limit:
          type: integer
          minimum: 0
          maximum: 1000
        offset:
          type: integer
          minimum: 0
          maximum: 100000
        total:
          type: integer
          minimum: 0
    VersionResponse:
      type: object
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Opaque version token. Format is implementation-defined and may
            change between releases — clients should treat it as a string
            for equality comparison only, not parse it.
    RbacRuleRequest:
      type: object
      required:
      - roleNames
      - httpMethod
      - path
      - effect
      properties:
        roleNames:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
          description: List of role names this rule applies to
        httpMethod:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          description: HTTP method (canonical uppercase, exact match enforced)
        path:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^(/[A-Za-z0-9_\-\*\{\}:]+)+$'
          description: API path pattern (supports wildcards like /api/*/users)
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
          description: Whether to allow or deny access (canonical uppercase)
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 2147483647
          description: Rule evaluation priority (lower values evaluated first). Optional — omitted rules default to the lowest evaluation precedence.
        enabled:
          type: boolean
          default: true
          description: Whether this rule is enabled. Optional — defaults to true.
        constraints:
          description: Optional JSON constraints for advanced rule matching (max 4096 bytes)
        description:
          type: string
          maxLength: 256
          description: Optional description of the rule
    UpdateRbacRuleRequest:
      type: object
      properties:
        roleNames:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
          description: List of role names this rule applies to
        httpMethod:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          description: HTTP method (canonical uppercase, exact match enforced)
        path:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^(/[A-Za-z0-9_\-\*\{\}:]+)+$'
          description: API path pattern (supports wildcards like /api/*/users)
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
          description: Whether to allow or deny access (canonical uppercase)
        priority:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Rule evaluation priority (lower values evaluated first)
        enabled:
          type: boolean
          description: Whether this rule is enabled
        constraints:
          nullable: true
          description: Optional JSON constraints for advanced rule matching (max 4096 bytes). Send `null` to clear.
        description:
          type: string
          maxLength: 256
          nullable: true
          description: Optional description of the rule. Send `null` to clear.
    RbacRuleResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/RbacRule'
    RbacRuleListResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RbacRule'
        limit:
          type: integer
          minimum: 0
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        total:
          type: integer
          minimum: 0
    JbacRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Rule ID
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Rule name
        pathPattern:
          type: string
          minLength: 1
          maxLength: 256
          description: Path pattern
        methods:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
          description: HTTP methods (canonical uppercase)
        enforcement:
          type: string
          enum:
          - REQUIRED
          - OPTIONAL
          - DISABLED
          description: Enforcement type (canonical uppercase)
        parentImpliesChildren:
          type: boolean
          description: Parent implies children
        extractJurisdiction:
          type: object
          description: Extract jurisdiction config (JSON, max 4096 bytes)
        description:
          type: string
          maxLength: 256
          description: Description
        requestId:
          type: string
          description: Request ID for traceability
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    JbacRuleRequest:
      type: object
      required:
      - name
      - pathPattern
      - methods
      - enforcement
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Name of the JBAC rule
        pathPattern:
          type: string
          minLength: 1
          maxLength: 256
          description: Path pattern for jurisdiction extraction
        methods:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
          description: HTTP methods (canonical uppercase, exact match enforced)
        enforcement:
          type: string
          enum:
          - REQUIRED
          - OPTIONAL
          - DISABLED
          description: Enforcement type (canonical uppercase, exact match enforced)
        parentImpliesChildren:
          type: boolean
          default: false
          description: Whether parent jurisdiction implies access to children. Optional — defaults to false (parent-only, do not propagate to children).
        extractJurisdiction:
          type: object
          description: JSON configuration for jurisdiction extraction (max 4096 bytes)
        description:
          type: string
          maxLength: 256
          description: Optional description of the rule
    UpdateJbacRuleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Name of the JBAC rule
        pathPattern:
          type: string
          minLength: 1
          maxLength: 256
