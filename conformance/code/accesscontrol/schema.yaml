        description:
          type: string
          maxLength: 256
          nullable: true
          description: Optional description of the rule. Send `null` to clear.
    JbacRuleResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/JbacRule'
    JbacRuleListResponse:
      type: object
      properties:
        rules:
          type: array
          items:
