# Default 8081 matches employee-go.
server.port=${SERVER_PORT:8081}
# Servlet-level context path: controllers map plain /v3/... and the container prefixes this.
# Everything moves under it, including /employee/actuator/** and /employee/internal/migrate.
server.servlet.context-path=${SERVER_CONTEXT_PATH:/employee-java}
# Segment that mounts the canonical (envelope-style) API at /v3/<prefix>/... alongside the
# header-based /v3/... API. Also excluded from HeaderInterceptor, which the envelope replaces.
employee.server.canonical-api-prefix=${CANONICAL_API_PREFIX:canonical}
spring.application.name=${OTEL_SERVICE_NAME:employee-service}

# ── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway ───────────────────────────────────────────────────────────────────
# The service never migrates at startup. The default (public) schema is migrated by the db init
# container (db/Dockerfile + migrate.sh); tenant schemas, when tenant-migration is enabled, by that
# library through the Flyway Java API. Both read db/migration.
spring.flyway.enabled=false

# ── DIGIT tracer (org.digit:tracer) ──────────────────────────────────────────
# NOTE the prefix is `tracer`, not `digit.tracer`: TracerProperties is
# @ConfigurationProperties("tracer"), so digit.tracer.* silently binds to nothing. There is also no
# tracer.otel.* section at all — OTel is driven by the management.* keys below and the OTEL_* env the
# SDK reads directly, so the four digit.tracer.otel.* keys that used to sit here were dead twice over.
tracer.request-logging-enabled=true

# Pub/sub backend. This is what actually selects Kafka vs Redis; the service's own
# employee.pubsub.type is not read by the tracer. Connection details come from Spring's own keys —
# employee.pubsub.kafka.brokers is likewise not read by anything.
tracer.pubsub.type=${PUBSUB_TYPE:kafka}
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Actuator / observability ─────────────────────────────────────────────────
# Exposes the Micrometer metrics (http_server_requests, db_operations, ...) registered by the tracer +
# employee BusinessMetrics. Boot's own OTLP export is disabled.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Health is actuator's alone — there is no hand-written /health controller. Unlike one, this
# reports DOWN when a dependency (e.g. the database) is unreachable.
#   liveness  -> <context-path>/actuator/health/liveness   (process alive; do not restart)
#   readiness -> <context-path>/actuator/health/readiness  (dependencies OK; safe to route)
# probes.enabled makes those groups available off-Kubernetes too, so local and deployed match.
management.endpoint.health.probes.enabled=true
# Boot's default readiness group is readinessState ONLY — it reports UP with the database
# unreachable, which is the same trap the old hand-written /health had. Add db explicitly so
# readiness means "can actually serve a request".
management.endpoint.health.group.readiness.include=readinessState,db
management.otlp.metrics.export.enabled=false
management.otlp.tracing.export.enabled=false

# ── employee service ─────────────────────────────────────────────────────────
# Mirrors the Go service config.LoadConfig defaults.
employee.otel.service-name=${OTEL_SERVICE_NAME:employee-service}
employee.otel.service-version=${OTEL_SERVICE_VERSION:1.0.0}
employee.otel.otlp-endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4320}
employee.otel.sampling-ratio=${OTEL_TRACES_SAMPLER_ARG:1.0}
employee.otel.enabled=${OTEL_ENABLED:false}
employee.otel.metrics-enabled=${OTEL_METRICS_ENABLED:false}
employee.otel.prometheus-port=${PROMETHEUS_PORT:9090}

employee.logging.level=${LOG_LEVEL:info}
employee.logging.console-logs-enabled=${CONSOLE_LOGS_ENABLED:true}

# ── Downstream services ──────────────────────────────────────────────────────
# Internal service convention: hosts END with a slash, paths do NOT begin with one. The clients
# concatenate host + path as-is, so both halves must follow this or the resulting URL is wrong.
employee.idgen.host=${IDGEN_HOST:http://localhost:8100/}
employee.idgen.path=${IDGEN_PATH:idgen/v3/generate}
employee.idgen.idgen-name=${IDGEN_NAME:EmployeeCode}
employee.idgen.enabled=${IDGEN_ENABLED:true}

employee.boundary.base-url=${BOUNDARY_HOST:http://localhost:8095/}
employee.boundary.path=${BOUNDARY_PATH:boundary/v3/relationship}
employee.boundary.enabled=${BOUNDARY_ENABLED:true}

employee.individual.host=${INDIVIDUAL_HOST:http://localhost:8086/}
employee.individual.path=${INDIVIDUAL_PATH:individuals/v3/individuals}
employee.individual.enabled=${INDIVIDUAL_ENABLED:false}

# ── Keycloak ─────────────────────────────────────────────────────────────────
employee.keycloak.base-url=${KEYCLOAK_BASE_URL:https://digit-lts.digit.org/keycloak}
employee.keycloak.enabled=${KEYCLOAK_ENABLED:false}
# Service account for read-only realm lookups. Supply via secret, not here.
employee.keycloak.client-id=${KEYCLOAK_EMPLOYEE_IAM_CLIENT_ID:}
employee.keycloak.client-secret=${KEYCLOAK_EMPLOYEE_IAM_CLIENT_SECRET:}

# ── Tenant schema separation ─────────────────────────────────────────────────
# Wired entirely by the tenant-migration auto-configuration; this service writes no Java for it.
# Topic, flyway locations and tenant header keep their library defaults and are still overridable
# without a code change, via Spring relaxed binding: DIGIT_TENANTMIGRATION_TOPIC,
# DIGIT_TENANTMIGRATION_FLYWAYLOCATIONS, DIGIT_TENANTMIGRATION_TENANTHEADER.
digit.tenant-migration.enabled=${TENANT_MIGRATION_ENABLED:false}
digit.tenant-migration.schema-table=${TENANT_MIGRATION_SCHEMA_TABLE:employee_schema}
# Pinned rather than left to default to spring.application.name, which is bound to OTEL_SERVICE_NAME:
# an observability rename would otherwise change the Kafka consumer group, and a group the broker has
# never seen starts at `earliest` and replays every tenant event ever published to the topic.
digit.tenant-migration.consumer-group=${TENANT_MIGRATION_CONSUMER_GROUP:employee-service}

# ── Pub/sub topics and backends ──────────────────────────────────────────────
employee.pubsub.enabled=${PUBSUB_ENABLED:false}
employee.pubsub.topics.create-employee=${PUBSUB_TOPIC_CREATE_EMPLOYEE:employee-create-employee}
employee.pubsub.topics.update-employee=${PUBSUB_TOPIC_UPDATE_EMPLOYEE:employee-update-employee}
employee.pubsub.topics.delete-employee=${PUBSUB_TOPIC_DELETE_EMPLOYEE:employee-delete-employee}
employee.pubsub.topics.create-jurisdiction=${PUBSUB_TOPIC_CREATE_JURISDICTION:employee-create-jurisdiction}
employee.pubsub.topics.update-jurisdiction=${PUBSUB_TOPIC_UPDATE_JURISDICTION:employee-update-jurisdiction}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=info
