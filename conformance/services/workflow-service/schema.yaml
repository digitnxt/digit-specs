openapi: 3.0.3

info:
  title: Workflow Service API
  version: 3.0.0
  description: |
    REST APIs for the DIGIT Workflow service. All endpoints are scoped to the
    tenant resolved from the `X-Tenant-ID` header.

    The module is organised into three configuration layers and two runtime layers:

    **Layer 1 — Process Definition (composite)**
    Full CRUD for a complete process definition in a single payload — process
    metadata, states, and actions together. Use `/process/definition` for all
    authoring workflows. This is the primary way to create and manage workflow
    processes.

    **Layer 2 — Granular State / Action management**
    Individual CRUD for states and actions when surgical changes are needed
    after the initial definition is created. All paths are addressed by
    human-readable codes — never UUIDs.

    **Layer 3 — EscalationConfig**
    Per-process, per-state escalation rules. Define the SLA thresholds (in
    minutes) at which an auto-escalation action is triggered.

    **Layer 4 — Transition (runtime)**
    Executes a workflow transition for a business entity. A `POST /transition`
    either creates a new process instance (first action) or advances an
    existing one. `GET /transition` searches process instances, with an option
    to return full transition history.

    **Layer 5 — AutoEscalation (runtime)**
    Triggers or searches auto-escalation runs scoped to a `processCode`.

    **Key structural concepts:**

    | Concept | Details |
    |---|---|
    | `Process.code` | Human-readable process slug — the **only** identifier used in all paths and cross-resource references. Never use UUID in paths. |
    | `State.code` | Human-readable state code — used in paths, `nextState` references, and escalation configs |
    | `State.type` | Lifecycle role of the state: `INITIAL`, `INTERMEDIATE`, `DECISION`, `TERMINAL_SUCCESS`, or `TERMINAL_FAILURE`. Exactly one state per process must be `INITIAL`. |
    | `Action.code` | Human-readable action code — used in paths and `TransitionRequest.action` |
    | `entityId` | The business entity (e.g. certificate application, grievance) the process instance tracks |
    | `sla` | Service Level Agreement in milliseconds at the process level |
    | `stateSlaMinutes` / `processSlaMinutes` | SLA thresholds in minutes at the escalation config level |
    | `id` | System-generated UUID present in all response bodies for internal reference — **never used in API paths** |
    | `X-User-ID` | Required on every request — identifies the authenticated user and populates `createdBy` / `modifiedBy` in `auditDetail` |

    The `tenantId` is always resolved from the Bearer token and must not be
    sent in request bodies.

servers:
  - url: https://api.example.com/workflow/v3
    description: Production server
  - url: https://staging-api.example.com/workflow/v3
    description: Staging server

security:
  - BearerAuth: []

tags:
  - name: ProcessDefinition
    description: |
      Composite CRUD for a complete process definition — process metadata,
      states, and actions authored together in a single payload.
      This is the primary authoring interface for workflow processes.
  - name: Process
    description: |
      Standalone CRUD for process metadata only (name, code, version, SLA).
      Use these endpoints when creating or managing a process separately from
      state/action definitions.
  - name: State
    description: |
      Granular management of individual states within a process.
      All paths use processCode and stateCode — never UUIDs.
  - name: Action
    description: |
      Granular management of individual actions on a state.
      All paths use processCode, stateCode, and actionCode — never UUIDs.
  - name: EscalationConfig
    description: |
      Manage per-process, per-state escalation configurations.
      Define the SLA thresholds at which auto-escalation is triggered.
  - name: Transition
    description: |
      Execute and search workflow transitions at runtime.
      A transition advances a business entity through the workflow states.
      Search supports returning full transition history via the `history` flag.
  - name: AutoEscalation
    description: |
      Trigger or search auto-escalation runs for a process.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ══════════════════════════════════════════════════════════════════════════════
  # LAYER 1 — PROCESS DEFINITION (COMPOSITE)
  # ══════════════════════════════════════════════════════════════════════════════

  /process/definition:

    post:
      summary: Create a complete process definition
      operationId: createProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Creates a complete workflow process definition — process metadata,
        all states, and all actions — atomically in a single request.

        This is the primary way to author a workflow. The entire definition is
        validated and persisted together. If any part fails validation the
        whole operation is rolled back.

        **Business Rules:**
        - `code` must be unique within the tenant and is immutable after creation.
        - Each state `code` must be unique within the process.
        - Exactly one state must have `type: INITIAL`.
        - Each action `code` must be unique within its state.
        - Every action `nextState` must reference a `code` present in the
          `states` array of this definition.
        - The entire payload is validated and persisted atomically.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDefinitionInput'
            examples:
              tradeLicenseApproval:
                summary: Trade license — 5-state linear approval flow
                value:
                  code: trade-license-approval
                  name: Trade License Approval
                  description: End-to-end approval workflow for trade license applications.
                  version: "1.0"
                  sla: 432000000
                  states:
                    - code: PENDING_REVIEW
                      name: Pending Review
                      type: INITIAL
                      description: Application submitted and awaiting officer review.
                      sla: 172800000
                      actions:
                        - code: APPROVE
                          label: Approve
                          nextState: APPROVED
                        - code: RETURN
                          label: Return for Correction
                          nextState: RETURNED
                        - code: REJECT
                          label: Reject
                          nextState: REJECTED
                    - code: RETURNED
                      name: Returned
                      type: INTERMEDIATE
                      description: Returned to applicant for corrections.
                      sla: 86400000
                      actions:
                        - code: RESUBMIT
                          label: Resubmit
                          nextState: PENDING_REVIEW
                        - code: WITHDRAW
                          label: Withdraw
                          nextState: WITHDRAWN
                    - code: APPROVED
                      name: Approved
                      type: TERMINAL_SUCCESS
                      actions: []
                    - code: REJECTED
                      name: Rejected
                      type: TERMINAL_FAILURE
                      actions: []
                    - code: WITHDRAWN
                      name: Withdrawn
                      type: TERMINAL_FAILURE
                      actions: []
      responses:
        '201':
          description: Process definition created.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: |
            Validation error — metadata, state, or action fields failed;
            or a nextState reference does not resolve within the states array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A process with this code already exists for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List all process definitions
      operationId: listProcessDefinitions
      tags: [ProcessDefinition]
      description: |
        Returns all complete process definitions for the calling tenant.
        Each entry includes process metadata, states, and actions.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: processCode
          in: query
          required: false
          description: Filter to a specific process by code (exact match).
          schema:
            type: string
            maxLength: 64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Process definitions returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request — invalid query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /process/definition/{processCode}:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'

    get:
      summary: Get a complete process definition by code
      operationId: getProcessDefinition
      tags: [ProcessDefinition]
      description: Returns the full process definition for the given processCode — metadata, states, and actions.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Process definition returned.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Replace a complete process definition
      operationId: updateProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Atomically replaces the entire process definition — metadata, states,
        and actions — for the given processCode.

        **Full replace semantics:** the submitted states array completely replaces
        the existing states and actions. States or actions omitted from the
        payload are deleted.

        **Business Rules:**
        - `code` is immutable — the path `processCode` is always authoritative.
        - Same structural validation as POST applies.
        - Returns `409` if active process instances reference states or actions
          being removed — deactivate instances first.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDefinitionInput'
      responses:
        '200':
          description: Process definition replaced.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionDetail'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active process instances reference states or actions being removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a complete process definition
      operationId: deleteProcessDefinition
      tags: [ProcessDefinition]
      description: |
        Permanently and atomically deletes the entire process definition —
        metadata, states, actions, and escalation configs — for the given
        processCode. Returns `409` if active process instances exist.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Process definition deleted.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active process instances exist — complete or terminate them first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /process:

    post:
      summary: Create a workflow process
      operationId: createProcess
      tags: [Process]
      description: Performs POST on /workflow/v3/process.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                code: { type: string, minLength: 1, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
                version: { type: string, maxLength: 32 }
                sla: { type: integer, format: int64 }
      responses:
        '201':
          description: Process created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  code: { type: string }
                  description: { type: string }
                  version: { type: string }
                  sla: { type: integer, format: int64 }
                  auditDetail: { $ref: '#/components/schemas/AuditDetail' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Process already exists
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Search processes
      operationId: searchProcesses
      tags: [Process]
      description: Performs GET on /workflow/v3/process.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - name: id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    code: { type: string }
                    description: { type: string }
                    version: { type: string }
                    sla: { type: integer, format: int64 }
                    auditDetail: { $ref: '#/components/schemas/AuditDetail' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'

  /process/code/{processCode}:
    parameters:
      - name: processCode
        in: path
        required: true
        schema:
          type: string

    get:
      summary: Get process by code
      operationId: getProcessById
      tags: [Process]
      description: Performs GET on /workflow/v3/process/code/{processCode}.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  code: { type: string }
                  description: { type: string }
                  version: { type: string }
                  sla: { type: integer, format: int64 }
                  auditDetail: { $ref: '#/components/schemas/AuditDetail' }
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: array
                $ref: '#/components/schemas/ErrorResponse'

    put:
