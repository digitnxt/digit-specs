openapi: 3.0.3
info:
  title: Workflow Service API
  version: 3.0.0
  description: 'OpenAPI contract for the DIGIT Workflow service. All endpoints are
    relative to the

    configured context path (for example, `/workflow`). Each request must include

    the `X-Tenant-ID` header to scope operations to a tenant unless explicitly noted.

    '
servers:
- url: https://api.example.com/workflow/v3
  description: Production server
- url: https://staging-api.example.com/workflow/v3
  description: Staging server
tags:
- name: Process
  description: Manage workflow processes.
- name: State
  description: Manage states within a workflow process.
- name: Action
  description: Manage actions/transitions between states.
- name: EscalationConfig
  description: Manage escalation configurations.
- name: Transition
  description: Execute and search workflow transitions.
- name: AutoEscalation
  description: Trigger or search auto-escalation runs.
components:
  parameters:
    RequestIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/RequestIdHeader
    CorrelationIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/CorrelationIdHeader
    UserAgentHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/UserAgentHeader
    TenantIdHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TenantIdHeader
    ForwardedForHeader:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ForwardedForHeader
    ClientId:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientId
    ClientSecret:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/ClientSecret
    TimeStamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/parameters/TimeStamp
  responses:
    ErrorResponse:
      description: API error response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
    NoContent:
      description: Operation completed successfully with no body.
  schemas:
    AuditDetail:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/AuditDetail
    Document:
      type: object
      properties:
        documentType:
          type: string
        fileStoreId:
          type: string
        documentUid:
          type: string
        additionalDetails:
          type: object
          additionalProperties: {}
    AttributeValidation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        assigneeCheck:
          type: boolean
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    Process:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string
        version:
          type: string
        sla:
          type: integer
          format: int64
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    ProcessCreate:
      allOf:
      - $ref: '#/components/schemas/Process'
      required:
      - name
      - code
      properties:
        id:
          readOnly: true
    ProcessUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        version:
          type: string
        sla:
          type: integer
          format: int64
    State:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        sla:
          type: integer
          format: int64
        isInitial:
          type: boolean
        isParallel:
          type: boolean
        isJoin:
          type: boolean
        branchStates:
          type: array
          items:
            type: string
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    StateCreate:
      allOf:
      - $ref: '#/components/schemas/State'
      required:
      - code
      - name
      properties:
        id:
          readOnly: true
        processId:
          readOnly: true
    StateUpdate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        sla:
          type: integer
          format: int64
        isInitial:
          type: boolean
        isParallel:
          type: boolean
        isJoin:
          type: boolean
        branchStates:
          type: array
          items:
            type: string
    Action:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        label:
          type: string
        currentState:
          type: string
          format: uuid
        nextState:
          type: string
        attributeValidation:
          $ref: '#/components/schemas/AttributeValidation'
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    ActionCreate:
      type: object
      required:
      - name
      - nextState
      properties:
        name:
          type: string
        label:
          type: string
        nextState:
          type: string
          description: State code or UUID for the next state.
        attributeValidation:
          $ref: '#/components/schemas/AttributeValidation'
    ActionUpdate:
      allOf:
      - $ref: '#/components/schemas/ActionCreate'
    EscalationConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processId:
          type: string
          format: uuid
        stateCode:
          type: string
        escalationAction:
          type: string
        stateSlaMinutes:
          type: integer
        processSlaMinutes:
          type: integer
        auditDetail:
          $ref: '#/components/schemas/AuditDetail'
    EscalationConfigCreate:
      allOf:
      - $ref: '#/components/schemas/EscalationConfig'
      required:
      - stateCode
      - escalationAction
      properties:
        id:
          readOnly: true
    ProcessDefinitionDetail:
      type: object
      properties:
        process:
          $ref: '#/components/schemas/Process'
        states:
          type: array
          items:
            type: object
            properties:
              state:
                $ref: '#/components/schemas/State'
              actions:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
    ProcessInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        processId:
          type: string
        entityId:
          type: string
        action:
          type: string
        status:
          type: string
        comment:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        assigner:
          type: string
        assignees:
          type: array
          items:
            type: string
        currentState:
          type: string
        stateSla:
          type: integer
          format: int64
        processSla:
          type: integer
          format: int64
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        nextActions:
          type: array
          items:
            type: string
        parentInstanceId:
          type: string
        branchId:
          type: string
        isParallelBranch:
          type: boolean
        isLatest:
          type: boolean
        escalated:
          type: boolean
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    TransitionRequest:
      type: object
      required:
      - processId
      - entityId
      properties:
        processInstanceId:
          type: string
        processId:
          type: string
        entityId:
          type: string
        init:
          type: boolean
        action:
          type: string
        status:
          type: string
        currentState:
          type: string
        comment:
          type: string
        documents:
          type: array
          items:
            type: string
        assigner:
          type: string
        assignees:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    TransitionResponse:
      type: object
      properties:
        id:
          type: string
        processId:
          type: string
        entityId:
          type: string
        action:
          type: string
        status:
          type: string
        comment:
          type: string
        documents:
          type: array
          items:
            type: string
        assigner:
          type: string
        assignees:
          type: array
          items:
            type: string
        currentState:
          type: string
        stateSla:
          type: integer
          format: int64
        processSla:
          type: integer
          format: int64
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        auditDetails:
          $ref: '#/components/schemas/AuditDetail'
    ProcessInstanceListResponse:
      type: object
      properties:
        processInstances:
          type: array
          items:
            $ref: '#/components/schemas/ProcessInstance'
        totalCount:
          type: integer
          format: int32
    EscalationResult:
      type: object
      properties:
        totalFound:
          type: integer
        totalEscalated:
          type: integer
        escalatedInstances:
          type: array
          items:
            $ref: '#/components/schemas/ProcessInstance'
        errors:
          type: array
          items:
            type: string
    Error:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/schemas/Error
  securitySchemes:
    BearerAuth:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/securitySchemes/BearerAuth
  headers:
    X-Response-Time:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Time
    X-Response-Timestamp:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Response-Timestamp
    X-Request-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Request-ID
    X-Correlation-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Correlation-ID
    X-Tenant-ID:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Tenant-ID
    X-Rate-Limit:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit
    X-Rate-Limit-Remaining:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Remaining
    X-Rate-Limit-Reset:
      $ref: https://raw.githubusercontent.com/digitnxt/digit-specs/refs/heads/main/v3.0.0/common.yaml#/components/headers/X-Rate-Limit-Reset
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
paths:
  /process:
    post:
      tags:
      - Process
      summary: Create a workflow process
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessCreate'
      responses:
        '201':
          description: Process created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          description: Process not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      description: Performs POST on /workflow/v3/process.
      operationId: createProcess
    get:
      tags:
      - Process
      summary: Search processes
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Process'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      description: Performs GET on /workflow/v3/process.
      operationId: searchProcesses
    delete:
      tags:
      - Process
      summary: Delete a process by query parameter
      description: Provides an alternative delete path accepting either `id` or `code`
        as query parameters.
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      operationId: deleteProcesses
  /process/definition:
    get:
      tags:
      - Process
      summary: List process definitions with full state/action detail
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      responses:
        '200':
          description: Full process definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessDefinitionDetail'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '500':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      description: Performs GET on /workflow/v3/process/definition.
      operationId: getProcessDefinition
  /process/{id}:
    parameters:
    - $ref: '#/components/parameters/TenantIdHeader'
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Process
      summary: Get process by ID
      responses:
        '200':
          description: Process details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Process'
          headers:
            X-Response-Time:
              $ref: '#/components/headers/X-Response-Time'
            X-Response-Timestamp:
              $ref: '#/components/headers/X-Response-Timestamp'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Tenant-ID:
              $ref: '#/components/headers/X-Tenant-ID'
            X-Rate-Limit:
              $ref: '#/components/headers/X-Rate-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
          description: Internal server error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      - $ref: '#/components/parameters/UserAgentHeader'
      - $ref: '#/components/parameters/TenantIdHeader'
      - $ref: '#/components/parameters/ForwardedForHeader'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientSecret'
      - $ref: '#/components/parameters/TimeStamp'
      description: Performs GET on /workflow/v3/process/{id}.
      operationId: getProcessById
    put:
      tags:
      - Process
      summary: Update a process
      parameters:
