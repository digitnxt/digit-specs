  # ══════════════════════════════════════════════════════════════════════════════

  /process/{processCode}/state:

    parameters:
      - $ref: '#/components/parameters/ProcessCodePath'

    post:
      summary: Add a state to an existing process
      operationId: createState
      tags: [State]
      description: |
        Adds a new state to an existing process. Use for surgical additions
        after the initial definition was created. For a new process, use
        `POST /process/definition` instead.
        `code` must be unique within the process.
        Exactly one state per process must have `type: INITIAL`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/UserAgentHeader'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ForwardedForHeader'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserIdHeader'
        - $ref: '#/components/parameters/ClientSecret'
        - $ref: '#/components/parameters/TimeStamp'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateInput'
            examples:
              addSeniorReview:
                summary: Add an intermediate senior review state
                value:
                  code: SENIOR_REVIEW
                  name: Senior Review
                  type: INTERMEDIATE
                  description: Escalated for senior officer review.
                  sla: 86400000
      responses:
        '201':
          description: State added to the process.
          headers:
            X-Response-Time: { $ref: '#/components/headers/X-Response-Time' }
            X-Response-Timestamp: { $ref: '#/components/headers/X-Response-Timestamp' }
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-Correlation-ID: { $ref: '#/components/headers/X-Correlation-ID' }
            X-Tenant-ID: { $ref: '#/components/headers/X-Tenant-ID' }
            X-Rate-Limit: { $ref: '#/components/headers/X-Rate-Limit' }
            X-Rate-Limit-Remaining: { $ref: '#/components/headers/X-Rate-Limit-Remaining' }
            X-Rate-Limit-Reset: { $ref: '#/components/headers/X-Rate-Limit-Reset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Process not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            A state with this `code` already exists, or an `INITIAL` state
            already exists and a second one was attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List states in a process
      operationId: listStates
      tags: [State]
      description: Returns all states defined under the process identified by `processCode`.
      parameters:
