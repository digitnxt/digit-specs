    # ── Enums ───────────────────────────────────────────────────────────────────

    CollectionMode:
      type: string
      description: Allowed collection channel(s)
      enum: [ONLINE, OFFLINE, COUNTER, FIELD, BOTH]
      default: BOTH

    PaymentMode:
      type: string
      description: Enabled payment modes for this business service
      enum: [CASH, CHEQUE, DD, POSTAL_ORDER, OFFLINE_NEFT, OFFLINE_RTGS, ONLINE, UPI, CARD, NETBANKING, WALLET, ONLINE_NEFT, ONLINE_RTGS]

    TaxHeadCategory:
      type: string
      description: Category of the tax head
      enum: [TAX, CESS, PENALTY, INTEREST, REBATE, ROUNDING, ARREAR, OTHER]
      default: OTHER

    DemandStatus:
      type: string
      enum: [DRAFT, ACTIVE, FROZEN, PARTIALLY_PAID, PAID, ROLL_FORWARDED, CANCELLED]
      default: ACTIVE
      description: |
        Demand lifecycle:
        - **DRAFT**: Created but not yet validated/finalized. Fully editable and not eligible for billing.
        - **ACTIVE**: Validated and eligible for billing. Minor corrections allowed until frozen (per policy).
        - **FROZEN**: Locked for bill generation; **no edits** allowed (use adjustments or a new demand).
        - **PARTIALLY_PAID**: Received multiple payments but total payable amount is not yet fully settled.
        - **PAID**: Fully settled through payments. Considered Financially closed.
        - **ROLL_FORWARDED**: Financially closed due to arrear carry-forward. Not editable and not eligible for bill generation.
        - **CANCELLED**: Voided. Not billable. Used when assessment is withdrawn or superseded.

    BillStatus:
      type: string
      description: Current status of the bill
      enum: [ACTIVE, CANCELLED, EXPIRED, PAID, PARTIALLY_PAID, PAYMENT_CANCELLED]
      default: ACTIVE

    BulkBillStatus:
      type: string
      description: Bulk bill generation request status 
      enum: [ACCEPTED, IN_PROGRESS, COMPLETED, PARTIALLY_COMPLETED, FAILED]
      default: ACCEPTED

    PaymentStatus:
      type: string
      description: Status of the payment
      enum: [NEW, DEPOSITED, CANCELLED, DISHONOURED, RECONCILED]

    InstrumentStatus:
      type: string
      description: Status of the instrument
      enum: [APPROVED, APPROVAL_PENDING, TO_BE_SUBMITTED, CANCELLED, DISHONOURED, REMITTED, REJECTED]

    ReceiptType:
      type: string
      description: Type of the receipt
      enum: [ADHOC, BILLBASED, CHALLAN]

