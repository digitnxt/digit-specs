openapi: 3.0.1
info:
  title: egov workflow engine.
  description: "api for workflow engine. thi module handle below functionality.\
    \ \n1. start workflow \n2. validate document and action on each step of workflow\n\
    3. calculate state wise sla a well a overall sla of the application\n4. search\
    \ existing workflow application \n"
  contact:
    name: egovernment foundation
    email: contact@egovernment.org
  version: 1.0.0
server:
- url: /egov-wf
path:
  /proces/transition:
    post:
      tag:
      - workflow
      summary: create new workflow entry for a given application number(businessid).
      description: "to create new workflow applicationin the system. api support\
        \ bulk creation with max limit a defined in the trade license request. please\
        \ note that either whole batch succeed or fail, there's no partial batch\
        \ succes. to create one workflow(processinstance) instance, please pas array\
        \ with one workflow(processinstance) object. \n  \n\nfollowing condition\
        \ are applied -\n  1. valid action i send according to workflow configuration\
        \ defined\n  2. supportdocument to perform workflow action will created.\
        \ in case of not attaching the mandatory supported document creation of workflow\
        \ fail.\n  3. application will move to next state if valid action i passe.\n"
      requestbody:
        description: detail for the new workflow(s) + requestinfo meta data.
        content:
          '*/*':
            schema:
              $ref: '#/component/schema/processinstancerequest'
        required: true
      response:
        201:
          description: reponseinfo with workflow(s) created successfully
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/processintanceresponse'
        400:
          description: workflow(s) creation failed
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/errorre'
      x-codegen-request-body-name: processinstancerequest
  /proces/search:
    post:
      tag:
      - workflow
      summary: get the list of workflow application defined in the system.
      description: |-
        1. search and get application(s)  based on defined search criteria.
        2. in case multiple parameter are passed application(s) will be searched a an and combination of all the parameter.
      parameter:
      - name: tenantid
        in: query
        description: unique id for a tenant.
        required: true
        schema:
          type: string
          format: varchar
      - name: id
        in: query
        description: unique identifier of application
        style: form
        explode: false
        schema:
          maxitem: 50
          type: array
          item:
            type: integer
            format: int64
      - name: businessservice
        in: query
        description: name of the workflow confguration.
        schema:
          maxlength: 64
          minlength: 2
          type: string
      - name: modulename
        in: query
        description: module name to which workflow application belong
        schema:
          maxlength: 64
          minlength: 2
          type: string
      - name: businessid
        in: query
        description: the list of businessid
        style: form
        explode: false
        schema:
          maxitem: 50
          type: array
          item:
            type: string
      - name: assignee
        in: query
        description: the unique  old license number for a application.
        schema:
          maxlength: 64
          minlength: 2
          type: string
      - name: history
        in: query
        description: boolean flag to return history of the workflow
        schema:
          type: boolean
      - name: limit
        in: query
        description: number of record to be returned
        schema:
          type: integer
      - name: offset
        in: query
        description: starting offset for returning search response
        schema:
          type: integer
      requestbody:
        description: parameter to carry request metadata in the request body
        content:
          '*/*':
            schema:
              $ref: '#/component/schema/requestinfo'
        required: false
      response:
        200:
          description: application(s) retrived successfully
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/processintanceresponse'
        400:
          description: invalid input.
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/errorres2'
      x-codegen-request-body-name: requestinfo
