component:
  schema:
    document:
      required:
      - documenttype
      - filestoreid
      - tenantid
      type: object
      propertie:
        id:
          maxlength: 64
          minlength: 2
          type: string
          description: state unique identifier uuid
        tenantid:
          maxlength: 128
          minlength: 2
          type: string
          description: unique identifier of ulb
        documenttype:
          maxlength: 64
          minlength: 2
          type: string
          description: 1.unique document type code from common master. 2. thi i
            defined under mdm common master. 3. object defination i defined under
            'https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/DocumentType'
        filestoreid:
          maxlength: 64
          minlength: 2
          type: string
          description: unique file store id of uploaded document.
        documentuid:
          maxlength: 64
          minlength: 2
          type: string
          description: document number(eg.pan number, aadhar number).
        auditdetail:
          $ref: '#/component/schema/auditdetail'
      description: a object hold the basic data for a trade license
    processinstance:
      required:
      - action
      - businessid
      - businessservice
      - tenantid
      type: object
      propertie:
        id:
          maxlength: 64
          minlength: 2
          type: string
          description: unique proces instance id (uuid)
          readonly: true
        tenantid:
          maxlength: 128
          minlength: 2
          type: string
          description: unique identifier of ulb
        businessservice:
          maxlength: 256
          minlength: 2
          type: string
          description: busines service key.
        businessid:
          maxlength: 64
          minlength: 2
          type: string
          description: "busines id i a unique identifier of a task. eg(propertyid,\
            \ \ntlid, servicerequestid) \n"
        action:
          maxlength: 64
          minlength: 2
          type: string
          description: action are define for each busines service.
        state:
          maxlength: 64
          minlength: 2
          type: string
          description: statu will be populate by efengine for each action, if it
            i configured.
          readonly: true
        comment:
          maxlength: 64
          minlength: 2
          type: string
          description: consumer can pas the comment on each action.
        document:
          type: array
          description: document can be attached with each of the action.
          item:
            $ref: '#/component/schema/document'
        assigner:
          $ref: '#/component/schema/user'
        assigne:
          type: array
          item:
            $ref: '#/component/schema/user'
        nextaction:
          type: array
          description: wf will return next possible action based on .
          readonly: true
          item:
            type: string
        sla:
          type: integer
          description: date from when license i valid a epoch.
          format: int64
        currentstatu:
          type: string
          description: statu after action performed
        previousstatu:
          type: string
          description: statu before action performed
        entity:
          type: object
          propertie: {}
        auditdetail:
          $ref: '#/component/schema/auditdetail'
      description: a object hold the basic data for a trade license
    statuscountreq:
      type: object
      propertie:
        requestinfo:
          $ref: '#/component/schema/requestinfo'
        processinstancesearchcriteria:
          $ref: '#/component/schema/processinstancesearchcriteria'
    businessservice:
      required:
      - businessservice
      - tenantid
      type: object
      propertie:
        tenantid:
          maxlength: 128
