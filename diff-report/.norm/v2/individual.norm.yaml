swagger: '2.0'
info:
  version: 1.0.0
  title: individual registry
  description: >
    thi module facilitate maintenance of an individual registry.
  contact:
    name: digit
    email: info@egovernment.org
scheme:
  - http
x-common-path: >-
  https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-0-0.yml
path:
  /individual/v1/create:
    post:
      summary: >-
        create/add a new individual
      description: >-
        create a new individual
      parameter:
        - name: individual
          in: body
          description: capture detail of individual.
          required: true
          schema:
            $ref: '#/definition/individualrequest'
        - $ref: '#/parameter/echoresource'
      tag:
        - individual
      response:
        '202':
          description: accepted
          schema:
            $ref: '#/definition/individualresponse'
        '400':
          description: bad request
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes
        '500':
          description: internal server error
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes

  /individual/v1/bulk/create:
