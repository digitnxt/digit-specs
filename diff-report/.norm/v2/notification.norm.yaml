openapi: 3.0.1
info:
  title: egov user event system.
  description: "api for event information. thi module handle below functionality.\
    \ \n1. create/update new event\n2. search existing event\n3. an event in the system\
    \ include -\n   a. system generated event like change in state of a complaint,\
    \ pt or tl etc.\n   b. public message broadcast\n   c. event that happen within\
    \ an ulb and are published on mseva.\n   d. any other event that are to be notified\
    \ to the user.\n"
  contact:
    name: egovernment foundation
    email: contact@egovernment.org
  version: 1.0.0
server:
- url: /user-event
tag:
- name: event
  description: api required for event handling.
path:
