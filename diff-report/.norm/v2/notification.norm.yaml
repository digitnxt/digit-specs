        - name: postedby
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: recepient
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: referenceid
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: role
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: source
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: statu
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
        - name: tenantid
          in: query
          required: true
          style: form
          schema:
            type: string
        - name: todate
          in: query
          required: false
          style: form
          schema:
            type: integer
            format: int64
        - name: userid
          in: query
          required: false
          style: pipedelimited
          schema:
            type: array
            item:
              type: string
      requestbody:
        content:
          application/json:
            schema:
              $ref: '#/component/schema/requestinfowrapper'
      response:
        '200':
          description: ok
          content:
            '*/*':
              schema:
                type: object
        '201':
          description: created
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not found
  /v1/event/create:
    post:
      tag:
      - event
      summary: create new event
      requestbody:
        description: detail for the new event + requestinfo meta data.
        content:
          '*/*':
            schema:
              $ref: '#/component/schema/eventrequest'
        required: true
      response:
        201:
          description: reponseinfo with event created successfully
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/eventresponse'
        400:
          description: event creation failed
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/errorres2'
      x-codegen-request-body-name: eventrequest
  /v1/event/update:
    post:
      tag:
      - event
      summary: update existing event
      description: thi api i used to update existing event in the system.
      requestbody:
        description: detail for the new event + requestinfo meta data.
        content:
          '*/*':
