          format: int64
      - name: todate
        in: query
        description: transaction date, here search will happen a transaction date
          i lesser or equal to given todate.
        schema:
          type: integer
          format: int64
      - name: statu
        in: query
        description: search based on the statu of the payment.
        style: form
        explode: false
        schema:
          type: array
          item:
            type: string
      - name: instrumentstatu
        in: query
        description: search based on the statu of the instrument.
        style: form
        explode: false
        schema:
          type: array
          item:
