      propertie:
        tenantid:
          maxlength: 50
          minlength: 2
          type: string
          description: the unique identifier for service - thi i equivalent to jurisdictionid
            in open311. a the platform intend to be multi tenanted - thi i alway
            required
        txnamount:
          minlength: 1
          type: string
          description: transaction amount, preferably rounded off to two decimal place
        billid:
          type: string
          description: unique bill id associated with the transaction
        module:
          type: string
          description: module busines code for which the transaction i being initiated,
            ex pt, w, pgr etc
