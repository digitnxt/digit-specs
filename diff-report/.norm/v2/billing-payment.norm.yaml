openapi: 3.0.1
info:
  title: egov billing service api
  description: |-
    egov billing service manage head wise demand and demand bill information for all the revenue module from egov solution. it manage
    * the demand data for a revenue module with category of tax for a defined *period, rebate, penalty, late payment interest, fee* etc and again head wise in each category. thi module have one entity called demand for every revenue entity which hold the list of category and head wise demand for a defined period in demanddetail.
    * the demand bill data with period and head wise due and it payment detail.
    * service api support single tenant only
  contact:
    name: egovernment foundation
  version: 1.1.0
server:
- url: /
