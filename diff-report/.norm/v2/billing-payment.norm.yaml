        gateway:
          type: string
          description: gateway to be used, from the available list, such a paytm,
            phonepe.
        callbackurl:
          type: string
          description: url to which control ha to be redirected to from the gateway
        txnid:
          type: string
          description: transaction id of the payment, generated by the gateway service
          readonly: true
        user:
          $ref: '#/component/schema/user'
        txnstatu:
          type: string
          description: current statu of the transaction
          readonly: true
          enum:
          - succes
          - failure
          - pending
        txnstatusmsg:
          type: string
          description: brief statu message for the transaction
          readonly: true
        gatewaytxnid:
          type: string
          description: transaction id returned by the gateway, for reference
          readonly: true
        gatewaypaymentmode:
          type: string
          description: mode of payment used at the gateway
          readonly: true
        gatewaystatuscode:
          type: string
          description: payment gateway specific raw statu code
          readonly: true
        gatewaystatusmsg:
          type: string
          description: payment gateway specific raw statu message
          readonly: true
        receipt:
          type: string
          description: receipt id generated for thi payment
          readonly: true
        auditdetail:
