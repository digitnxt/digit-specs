component:
  schema:
    auditdetail:
      type: object
      propertie:
        createdby:
          type: string
          description: username (preferred) or userid of the user that created the
            object
        lastmodifiedby:
          type: string
          description: username (preferred) or userid of the user that last modified
            the object
        createdtime:
          type: integer
          description: epoch of the time object i created
          format: int64
        lastmodifiedtime:
          type: integer
          description: epoch of the time object i last modified
          format: int64
      description: collection of audit related field used by most model
    bankaccountservicemappingreq:
      title: bankaccountservicemappingreq
      required:
      - bankaccountservicemapping
      - requestinfo
      type: object
      propertie:
        bankaccountservicemapping:
          type: array
          item:
            $ref: '#/component/schema/bankaccountservicemapping'
        requestinfo:
          $ref: '#/component/schema/requestinfo'
    bankaccountservicemapping:
      title: bankaccountservicemapping
      required:
      - bankaccount
      - businessdetail
      - tenantid
      type: object
      propertie:
        bank:
          type: string
        bankaccount:
          type: string
        bankbranch:
          type: string
        businessdetail:
          type: string
        tenantid:
          type: string      
    bill:
      type: object
      propertie:
        paidby:
          type: string
          description: name of the person who i making payment.
        mobilenumber:
          type: string
          description: the mobilenumber of person who i paying
          format: varchar
        payername:
          type: string
          description: the owner of the bill
          format: varchar
        payeraddres:
          type: string
          description: the addres of the owner of the bill
          format: varchar
        payeremail:
          type: string
          description: the email id of the owner of the bill
          format: varchar
        payerid:
          type: string
          description: the system user id of the owner of the bill
          format: varchar
        statu:
          type: string
          description: statu of the bill.
          enum:
          - active
          - cancelled
          - paid
          - expired
        reasonforcancellation:
          type: string
          description: the reason for cancellation of bill
          format: varchar
        iscancelled:
          type: boolean
          description: boolean indicating if the bill i cancelled
          format: varchar
        additionaldetail:
          type: object
          propertie: {}
          description: additional field can be captured here
        collectionmodesnotallowed:
          type: array
          description: the list of collection mode that are not allowed
          item:
            type: string
        partpaymentallowed:
          type: boolean
          description: boolean flag indicating if partial payment i allowed to be
            collected
        isadvanceallowed:
          type: boolean
          description: flag indicating if advance can be collected
        minimumamounttobepaid:
          type: number
          description: the minumun amount that can be paid against the bill
          format: double
        businessservice:
          type: string
          description: the businessservice of the entity for which the bill i generated
          format: varchar
        totalamount:
          type: number
          description: the total amount to be paid for the bill
          format: double
        consumercode:
          type: string
          description: the consumer code for which bill i generated
          format: varchar
        billnumber:
          type: string
          description: the bill number generated by system
          format: varchar
        billdate:
          type: number
          description: the date on which bill i generated
          format: int64
        billdetail:
          type: array
          item:
            $ref: '#/component/schema/billdetail'
    billdetail:
      type: object
      propertie:
        id:
          type: string
          description: uuid of the billdetail.
        tenantid:
          type: string
          description: tenantid of the billdetail.
        demandid:
          type: string
          description: the id of the corresponding demand .
        billid:
          type: string
          description: the id of the parent bill.
        amount:
          type: number
          description: amount to be paid for the bill detail.
          format: double
        amountpaid:
          type: number
          description: amount paid by the citizen.
          format: double
        fromperiod:
          type: number
          description: start date of the taxperiod
          format: int64
        toperiod:
          type: number
          description: end date of the taxperiod
          format: int64
        receiptdate:
          type: string
          description: receipt date.
          format: date
        receipttype:
          type: object
          description: type of receipt.
        channel:
          type: string
          description: to be used by third party application, to send the channel
            name.
        voucherheader:
          type: object
          description: voucher header  need to refer from finanical.
        boundary:
          type: object
          description: boundary need to refer from core service.
        manualreceiptnumber:
          type: string
          description: manual receipt number for legacy reciept.
        manualreceiptdate:
          type: number
          description: manual receipt date for legacy reciept.
        collectiontype:
          type: string
          description: collectiontype of the payment.
        billdescription:
          type: string
          description: description of the bill.
        expirydate:
          type: number
          description: expiry date in epoch
          format: int64
        displaymessage:
          type: string
        cancellationremark:
          type: string
          description: remark related to cancellation of payment
        billaccountdetail:
          type: array
          item:
            $ref: '#/component/schema/billaccountdetail'
    billaccountdetail:
      type: object
      propertie:
        id:
          type: string
          description: uuid of the billaccountdetail.
        tenantid:
          type: string
          description: tenantid of the billaccountdetail.
        billdetailid:
          type: string
          description: uuid of the parent billdetail.
        demanddetailid:
          type: string
          description: uuid of the demand for which the parent billdetail i created.
        order:
          type: integer
          description: priority of the account detail.
        amount:
          type: number
          description: amount to be paid for the bill account detail
          format: double
        adjustedamount:
          type: number
          description: the amount paid against the bill account detail
          format: double
        taxheadcode:
          type: string
          description: the taxheadcode of the bill account detail
        additionaldetail:
          type: object
          propertie: {}
          description: additional field can be captured in thi object a map
        purpose:
          type: string
          description: purpose of the bill account detail.
          enum:
          - arrear
          - current
          - advance
          - exemption
          - arrearlatepaymentcharge
          - currentlatepaymentcharge
          - chequebouncepenalty
          - rebate
          - other
        auditdetail:
          $ref: '#/component/schema/auditdetail'
    error:
      required:
      - code
      - message
      type: object
      propertie:
        code:
          type: string
          description: error code will be module specific error label/code to identiffy
            the error. all module should also publish the error code with their
            specific localized value in localization service to ensure client can
            print locale specific error message. example for error code would be
            user.notfound to indicate user not found by user/authentication service.
            all service must declare their possible error code with brief description
            in the error response section of their api path.
        message:
          type: string
          description: english locale message of the error code. client should make
            a separate call to get the other locale description if configured with
            the service. client may choose to cache these locale specific message
            to enhance performance with a reasonable ttl (may be defined by the localization
            service based on tenant + module combination).
        description:
          type: string
          description: optional long description of the error to help client take
            remedial action. thi will not be available a part of localization service.
        param:
          type: array
          description: some error message may carry replaceable field (say $1, $2)
            to provide more context to the message. e.g. format related error may
            want to indicate the actual field for which the format i invalid. client's
            should use the value in the param array to replace those field.
          item:
            type: string
      description: error object will be returned a a part of reponse body in conjunction
        with responseinfo a part of errorresponse whenever the request processing
        statu in the responseinfo i failed. http return in thi scenario will usually
        be http 400.      
    errorre:
      required:
      - responseinfo
      type: object
      propertie:
        responseinfo:
          $ref: '#/component/schema/responseinfo'
        error:
          type: array
          description: error response array corresponding to request object array.
            in case of single object submission or search related path thi may
            be an array of one error element
          item:
            $ref: '#/component/schema/error'
      description: all api will return errorre in case of failure which will carry
        responseinfo a metadata and error object a actual representation of error.
        in case of bulk api, some api may chose to return the array of error object
        to indicate individual failure.    
    paymentrequest:
      type: object
      propertie:
        requestinfo:
          $ref: '#/component/schema/requestinfo'
        payment:
          $ref: '#/component/schema/payment'
      description: payment request with request info.
    paymentresponse:
      type: object
      propertie:
        responseinfo:
          $ref: '#/component/schema/responseinfo'
        payment:
          $ref: '#/component/schema/payment'
      description: receipt request with request info.
    paymentworkflowrequest:
      type: object
      propertie:
        requestinfo:
          $ref: '#/component/schema/requestinfo'
        payment:
          $ref: '#/component/schema/paymentworkflow'
      description: payment workflow request with request info.
    payment:
      required:
      - mobilenumber
      - paidby
      - paymentdetail
      - paymentmode
      - tenantid
      - totalamountpaid
      type: object
      propertie:
        tenantid:
          maxlength: 64
          type: string
          description: unique id of tenant.
          format: varchar
        id:
          maxlength: 64
          type: string
          description: unique id of tenant.
          format: varchar
        totaldue:
          type: number
          description: total amount due.
        totalamountpaid:
          type: number
          description: unique id of tenant.
          format: double
        transactionnumber:
          maxlength: 128
          type: string
          description: transaction number of the payment
          format: varchar
        transactiondate:
          type: number
          description: the date of payment in epoch
          format: int64
        paymentmode:
          type: string
          description: mode of payment used.
          format: varchar
          enum:
          - cash
          - cheque
          - dd
          - online
          - card
        instrumentdate:
          type: number
          description: the instrument date
          format: int64
        instrumentnumber:
          maxlength: 128
          type: string
          description: the number of the instrument like dd number,cheque number etc.
          format: varchar
        instrumentstatu:
          type: string
          description: the statu of the instrument
          format: varchar
          enum:
          - approved
          - approvalpending
          - tobesubmitted
          - remitted
          - rejected
          - cancelled
          - dishonoured
        ifsccode:
          maxlength: 64
          type: string
          description: ifsc code of the bank to which payment i made
          format: varchar
        additionaldetail:
          type: object
          propertie: {}
          description: any additional field can be captured here a a map
        paymentdetail:
          type: array
          description: payment detail of each bill
          item:
            $ref: '#/component/schema/paymentdetail'
        paidby:
          maxlength: 128
          type: string
          description: the person who i paying the bill
          format: varchar
        mobilenumber:
          maxlength: 64
          type: string
          description: the mobilenumber of person who i paying
          format: varchar
        payername:
          maxlength: 128
          type: string
          description: the owner of the bill
          format: varchar
        payeraddres:
          maxlength: 1024
          type: string
          description: the addres of the owner of the bill
          format: varchar
        payeremail:
          maxlength: 64
          type: string
          description: the email id of the owner of the bill
          format: varchar
        payerid:
          maxlength: 64
          type: string
          description: the system user id of the owner of the bill
          format: varchar
        paymentstatu:
          type: string
          description: unique id of tenant.
          enum:
          - new
          - deposited
          - cancelled
          - dishonoured
          - reconciled
        auditdetail:
          $ref: '#/component/schema/auditdetail'
    paymentdetail:
      required:
      - billid
      - totalamountpaid
      type: object
      propertie:
        id:
          maxlength: 64
          type: string
          description: id of the payment detail
        tenantid:
          maxlength: 64
          type: string
          description: tenantid of the payment detail
        totaldue:
          type: number
          description: the total amount to be paid for the bill corresponding to the
            payment detail
          format: double
        totalamountpaid:
          type: number
          description: the amount that i being paid
          format: double
        manualreceiptnumber:
          maxlength: 64
          type: string
          description: receipt number entered manually for legacy data.
        receiptnumber:
          maxlength: 64
          type: string
          description: the receipt number generated for the payment against the bill
        receipttype:
          type: string
          description: the receipt type generated for the payment against the bill
        receiptdate:
          type: integer
          description: the epoch receipt date generated for the payment against the
            bill
        businessservice:
          type: string
          description: the code of the businessservice to which the bill belong
        billid:
          maxlength: 64
          type: string
          description: the id of the bill for which the payment i made
        bill:
          $ref: '#/component/schema/bill'
        additionaldetail:
          type: integer
          description: any additional field can be captured here a a map
        auditdetail:
          $ref: '#/component/schema/auditdetail'
      description: the payment detail of each bill
    paymentworkflow:
      required:
      - action
      - paymentid
      - tenantid
      type: object
      propertie:
        paymentid:
          type: string
          description: id of the payment on which to take action .
        action:
          type: string
          description: the action to be taken on the payment
          enum:
          - cancel
          - dishonour
          - remit
        tenantid:
          type: string
          description: tenantid of the payment
        reason:
          type: string
          description: reason for taking the action.
        additionaldetail:
          type: integer
          description: any additional field can be captured here a a map
      description: workflow object for payment
    responseinfo:
      required:
      - apiid
      - statu
      - t
      - ver
      type: object
      propertie:
        apiid:
          maxlength: 128
          type: string
          description: unique api id
        ver:
          maxlength: 32
          type: string
          description: api version
        t:
          type: integer
          description: response time in epoch
          format: int64
        resmsgid:
          maxlength: 256
          type: string
          description: unique response message id (uuid) - will usually be the correlation
            id from the server
        msgid:
          maxlength: 256
          type: string
          description: message id of the request
        statu:
          type: string
          description: statu of request processing - to be enhanced in futuer to
            include inprogres
          enum:
          - successful
          - failed
      description: responseinfo should be used to carry metadata information about
        the response from the server. apiid, ver and msgid in responseinfo should
        alway correspond to the same value in respective request's requestinfo.
    requestinfowrapper:
      title: requestinfowrapper
      type: object
      propertie:
        requestinfo:
          "$ref": "#/component/schema/requestinfo"    
    remittance:
      title: remittance
      required:
      - referencedate
      - referencenumber
      - tenantid
      type: object
      propertie:
        auditdetail:
          "$ref": "#/component/schema/auditdetail"
        bankaccount:
          type: string
        function:
          type: string
        fund:
          type: string
        id:
          type: string
        reasonfordelay:
          type: string
        referencedate:
          type: integer
          format: int64
        referencenumber:
          type: string
        remark:
          type: string
        remittancedetail:
          uniqueitem: true
          type: array
          item:
            "$ref": "#/component/schema/remittancedetail"
        remittanceinstrument:
          uniqueitem: true
          type: array
          item:
            "$ref": "#/component/schema/remittanceinstrument"
        remittancereceipt:
          uniqueitem: true
          type: array
          item:
            "$ref": "#/component/schema/remittancereceipt"
        statu:
