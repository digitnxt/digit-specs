component:
  schema:
    action:
      title: action
      required:
      - action
      - nextstate
      - role
      type: object
      propertie:
        action:
          maxlength: 256
          minlength: 0
          type: string
        auditdetail:
          "$ref": "#/component/schema/auditdetail"
        currentstate:
          maxlength: 256
          minlength: 0
          type: string
        nextstate:
          maxlength: 256
          minlength: 0
          type: string
        role:
          type: array
          item:
            type: string
        tenantid:
          maxlength: 256
          minlength: 0
          type: string
        uuid:
          maxlength: 256
          minlength: 0
          type: string
    amendment:
      title: amendment
      required:
      - amendmentreason
      - businessservice
      - consumercode
      - demanddetail
      - document
      - tenantid
      type: object
      propertie:
        additionaldetail:
          "$ref": "#/component/schema/jsonnode"
        amendeddemandid:
          type: string
        amendmentid:
          type: string
        amendmentreason:
          type: string
          enum:
          - arrearwriteoff
          - courtcasesettlement
          - dcbcorrection
          - onetimesettlement
          - other
          - remissionforpropertytax
        auditdetail:
          "$ref": "#/component/schema/auditdetail"
        businessservice:
          type: string
        consumercode:
          type: string
        demanddetail:
          type: array
          item:
            "$ref": "#/component/schema/demanddetail"
        document:
          type: array
          item:
            "$ref": "#/component/schema/document"
        effectivefrom:
          type: integer
          format: int64
        effectivetill:
          type: integer
          format: int64
        id:
          type: string
        reasondocumentnumber:
          type: string
        statu:
          type: string
          enum:
          - active
          - consumed
          - inactive
          - inworkflow
        tenantid:
          type: string
        workflow:
          "$ref": "#/component/schema/processinstance"
    amendmentrequest:
      title: amendmentrequest
      required:
      - amendment
      - requestinfo
      type: object
      propertie:
        amendment:
          "$ref": "#/component/schema/amendment"
        requestinfo:
          "$ref": "#/component/schema/requestinfo"
    amendmentupdate:
      title: amendmentupdate
      required:
      - amendmentid
      - tenantid
      - workflow
      type: object
      propertie:
        additionaldetail:
          "$ref": "#/component/schema/jsonnode"
        amendeddemandid:
          type: string
        amendmentid:
          type: string
        auditdetail:
          "$ref": "#/component/schema/auditdetail"
        document:
          type: array
          item:
            "$ref": "#/component/schema/document"
        statu:
          type: string
          enum:
          - active
          - consumed
          - inactive
          - inworkflow
        tenantid:
          type: string
        workflow:
          "$ref": "#/component/schema/processinstance"
    amendmentupdaterequest:
      title: amendmentupdaterequest
      required:
      - amendmentupdate
      - requestinfo
      type: object
      propertie:
        amendmentupdate:
          "$ref": "#/component/schema/amendmentupdate"
        requestinfo:
          "$ref": "#/component/schema/requestinfo"
    demand:
      required:
      - businessservice
      - consumercode
      - consumertype
      - demanddetail
      - taxperiodfrom
      - taxperiodto
      - tenantid
      type: object
      propertie:
        id:
          type: string
          description: primary key of a demand.
        tenantid:
          maxlength: 128
          minlength: 4
          type: string
          description: unique identifier of the tenant
        consumercode:
          type: string
          description: unique identification of billing entity.
        consumertype:
          type: string
          description: consumer type of billing entity.
        businessservice:
          maxlength: 256
          minlength: 4
          type: string
          description: billing system e.g., property tax, water charge etc.
        payer:
          $ref: '#/component/schema/user'
        taxperiodfrom:
          type: integer
          description: start date from when the tax i applicable.
          format: int64
        taxperiodto:
          type: integer
          description: end date till when the tax i applicable.
          format: int64
        demanddetail:
          type: array
          item:
            $ref: '#/component/schema/demanddetail'
        billexpirytime:
          type: integer
          description: time in epoch indicating the period in which the bill generated
            for thi particular demand expire or invalidate.
          format: int64
        auditdetail:
          $ref: '#/component/schema/auditdetail'
        additionaldetail:
          type: object
          propertie: {}
          description: field for capturing any additional detail.
        statu:
          type: string
          enum:
          - active
          - cancelled
          - adjusted
      description: a object which hold the basic info about the revenue assessment
        for which the demand i generated like module name, consumercode, owner, etc.
    demanddetail:
      required:
      - collectionamount
      - taxamount
      type: object
      propertie:
        id:
          type: string
          description: primary key of a demanddetail.
        demandid:
          type: string
          description: foriegn key of a demanddetail from demand.
        taxheadmastercode:
          maxlength: 64
          minlength: 2
          type: string
          description: tax head code.
        taxamount:
          type: number
          description: demand amount.
          format: bigdecimal
        collectionamount:
          type: number
          description: collection against taxamount.
        additionaldetail:
          type: object
          propertie: {}
          description: field for capturing any additional detail.
        auditdetail:
          $ref: '#/component/schema/auditdetail'
        tenantid:
          maxlength: 128
          minlength: 4
          type: string
          description: unique identifier of the tenant
      description: a object hold a demand and collection value for a tax head and
        period.
