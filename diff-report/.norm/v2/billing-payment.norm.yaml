openapi: 3.0.1
info:
  title: egov payment gateway service.
  description: |
    thi module act a a liaison between egov app and external payment gateway. it facilitate payment, refund and look up of transaction' statu.
  contact:
    name: egovernment foundation
    email: contact@egovernment.org
  version: 1.0.0
server:
- url: /egov-pg-service
path:
  "/pg-service/gateway/v1/search":
    post:
      tag:
      - transaction-api-controller
      summary: transactionsv1availablegatewayspost
      operationid: transactionsv1availablegatewayspostusingpost
      response:
        '200':
          description: ok
          content:
            "*/*":
              schema:
                uniqueitem: true
                type: array
                item:
                  type: string
        '201':
          description: created
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not found
  "/pg-service/transaction/v1/create":
    post:
      tag:
      - transaction-api-controller
      summary: transactionsv1createpost
      operationid: transactionsv1createpostusingpost
      requestbody:
        content:
          application/json:
            schema:
              "$ref": "#/component/schema/transactioncreateresponse"
      response:
        '200':
          description: ok
          content:
            "*/*":
              schema:
                "$ref": "#/component/schema/transactioncreateresponse"
        '201':
          description: created
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not found
  "/pg-service/transaction/v1/search":
    post:
      tag:
      - transaction-api-controller
      summary: transactionsv1searchpost
      operationid: transactionsv1searchpostusingpost
      parameter:
      - name: billid
        in: query
        required: false
        style: form
        schema:
          type: string
      - name: consumercode
        in: query
        required: false
        style: form
        schema:
          type: string
      - name: createdtime
        in: query
        required: false
        style: form
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        style: form
        schema:
          type: integer
          format: int32
      - name: receipt
        in: query
        required: false
        style: form
        schema:
          type: string
      - name: tenantid
        in: query
        required: false
        style: form
        schema:
          type: string
      - name: txnid
        in: query
        required: false
        style: form
        schema:
          type: string
      - name: txnstatu
        in: query
        required: false
        style: form
        schema:
          type: string
          enum:
          - failure
          - pending
          - succes
      - name: useruuid
        in: query
        required: false
        style: form
        schema:
          type: string
      requestbody:
        content:
          application/json:
            schema:
              "$ref": "#/component/schema/requestinfowrapper"
      response:
        '200':
          description: ok
          content:
            "*/*":
              schema:
                "$ref": "#/component/schema/transactionresponse"
        '201':
          description: created
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not found
  "/pg-service/transaction/v1/update":
    post:
      tag:
      - transaction-api-controller
      summary: transactionsv1updatepost
      operationid: transactionsv1updatepostusingpost
      parameter:
      - name: param
        in: query
        description: param
        required: true
        style: deepobject
        explode: true
        schema:
          type: object
          additionalpropertie:
            type: string
      requestbody:
        content:
          application/json:
            schema:
              "$ref": "#/component/schema/requestinfowrapper"
      response:
        '200':
          description: ok
          content:
            "*/*":
              schema:
                "$ref": "#/component/schema/transactionresponse"
        '201':
          description: created
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '404':
          description: not found
component:
  schema:
    transaction:
      required:
      - billid
