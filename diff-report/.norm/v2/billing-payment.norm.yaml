      parameter:
      - name: tenantid
        in: query
        description: unique id for a tenant.
        required: true
        schema:
          type: string
          format: varchar
      - name: pagesize
        in: query
        description: number of record returned.
        schema:
          multipleof: 10.0
          maximum: 100
          exclusivemaximum: false
          minimum: 0
          exclusiveminimum: true
          type: integer
          default: 20
      - name: pagenumber
        in: query
        description: page number
        schema:
          type: integer
          default: 1
      - name: sort
        in: query
        description: receipt result will be sorted by receiptnumber ascending by
          default.
        style: pipedelimited
        schema:
          maxitem: 3
          minitem: 1
          uniqueitem: true
          type: array
          item:
            pattern: '[-+](receiptnumber|receiptdate)'
            type: string
          default: '["+receiptnumber"]'
      - name: id
        in: query
        description: payment id.
        style: form
        explode: false
        schema:
          type: array
          item:
            type: string
      - name: consumercode
        in: query
        description: consumer code .
        style: form
        explode: false
