openapi: 3.0.1
info:
  title: data management service(dm)
  description: | 
   api available to get the master data for particular tenant and module
   master.
  contact:
    name: egovernment foundation
  version: 3.0.0
server:
- url: https://unified-dev.digit.org/

security:
  - bearerauth: []

tag:
  - name: "schema definition"
    description: "operation related to workflow processe"
  - name: "data"
    description: "operation for managing state within a proces"
  

path:
  /schema:
    post:
      summary: create a new schema
      tag: 
        - schema definition
      operationid: createschema
      requestbody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/component/schema/schemadefinition'
      parameter: 
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
      response:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/component/schema/schemadefinition'
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: 
                  $ref: '#/component/schema/error'
      
    get:
      summary: list all schema
      tag: 
        - schema definition
      operationid: listschema
      response:
        '200':
          description: list of schema metadata
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/schemadefinition'
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'

        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: 
                  $ref: '#/component/schema/error'

      parameter: 
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: query
          name: service
          schema:
            type: string
          description: filter by service name   
  /schema/{schemacode}:
    get:
      summary: get a schema by schemacode
      tag: 
        - schema definition
      operationid: getschema
      parameter:
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
      response:
        '200':
          description: json schema
          content:
            application/json:
              schema:
                $ref: '#/component/schema/schemadefinition'
        '404':
          description: schema not found
    put:
      summary: update an existing schema
      tag: 
        - schema definition
      operationid: updateschema
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
      requestbody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/component/schema/schemadefinition'
      response:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/component/schema/schemadefinition'
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: 
                  $ref: '#/component/schema/error'
        '404':
          description: schema not found
    delete:
      summary: delete a schema
      tag: 
        - schema definition
      operationid: deleteschema
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
      response:
        '204':
          description: schema deleted
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: 
                  $ref: '#/component/schema/error'
        '404':
          description: schema not found

  /data/{schemacode}:
    post:
      summary: create new master data record
      tag: 
        - data
      operationid: createdata
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: array
              item:
                type: object
                description: validate against the schema for schemacode
      response:
        '201':
          description: record created
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '400':
          description: validation error or bad request

    get:
      summary: list master data record
      tag: 
        - data
      operationid: listdata
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
        - in: query
          name: filter
          description: optional json-based filter
          required: false
          schema:
            type: string
            example: '{"statu":"active"}'
      response:
        '200':
          description: list of matching master data
          content:
            application/json:
              schema:
                type: array
                item:
                  type: object
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'

  /data/{schemacode}/{id}:
    get:
      summary: get master data by id
      tag: 
        - data
      operationid: getdatabyid
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      response:
        '200':
          description: single master data record
          content:
            application/json:
              schema:
                type: object
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '404':
          description: record not found

    put:
      summary: update master data by id
      tag: 
        - data
      operationid: updatedatabyid
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: object
      response:
        '200':
          description: record updated
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '400':
          description: validation failed
        '404':
          description: record not found

    delete:
      summary: delete master data by id
      tag: 
        - data
      operationid: deletedatabyid
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: path
          name: schemacode
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      response:
        '204':
          description: record deleted
          header:
            x-response-time:
              $ref: '#/component/header/x-response-time'
            x-response-timestamp:
              $ref: '#/component/header/x-response-timestamp'
            x-request-id:
              $ref: '#/component/header/x-request-id'
            x-correlation-id:
              $ref: '#/component/header/x-correlation-id'
            x-tenant-id:
              $ref: '#/component/header/x-tenant-id'
            x-rate-limit:
              $ref: '#/component/header/x-rate-limit'
            x-rate-limit-remaining:
              $ref: '#/component/header/x-rate-limit-remaining'
            x-rate-limit-reset:
              $ref: '#/component/header/x-rate-limit-reset'
        '404':
          description: record not found
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  /egov-mdm-service/v2/create/{schemacode}:
    post:
      tag:
      - mdm
      summary: create or add data for a schema
      description: request to create the data
      parameter: 
        - in: path
          name: schemacode
          schema:
            type: string
          required: true
          description: unique schema code from schema master

      requestbody:
        description: data create request
        content:
          '*/*':
            schema:
              $ref: '#/component/schema/mdmsrequest'
        required: true
      response:
        200:
          description: data created sucessfully.
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/mdmsresponsev2'
        400:
          description: invalid input.
          content:
            '*/*':
              schema:
                $ref: '#/component/schema/error'
  /egov-mdm-service/v2/update/{schemacode}:
