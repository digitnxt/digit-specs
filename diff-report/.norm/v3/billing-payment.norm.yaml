            **service rule**: duplicate taxheadcode entrie within the same demand are rejected.
          item:
            $ref: '#/component/schema/lineitem'
        statu:
          type: string
          enum: [draft, active]
          description: only transition within editable state are allowed via patch

    bulkresponse:
      type: object
      description: used for bulk api operation. contain separate list for successful and failed item to support partial processing.
      propertie:
        succes:
