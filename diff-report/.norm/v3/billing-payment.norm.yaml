      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          description: unique busines service code (e.g., pt, tl, w)
          schema: { type: string }
      response:
        '200':
          description: busines service found
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
          content:
            application/json:
              schema:
                $ref: '#/component/schema/businessservice'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    put:
      summary: replace a busines service by code
      operationid: updatebusinessservice
      tag: [businessservice]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          description: unique busines service code
          schema: { type: string }
      requestbody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/component/schema/businessserviceupdatebycode'
      response:
        '200':
          description: updated successfully
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
          content:
            application/json:
              schema:
                $ref: '#/component/schema/businessservice'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '409':
          description: conflict (e.g., trying to change immutable field such a code)
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    patch:
      summary: partially update a busines service by code
      operationid: patchbusinessservice
      tag: [businessservice]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          description: unique busines service code
          schema: { type: string }
      requestbody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/component/schema/businessservicepatch'
      response:
        '200':
          description: updated successfully
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
          content:
            application/json:
              schema:
                $ref: '#/component/schema/businessservice'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    delete:
      summary: soft delete (deactivate) a busines service by code
      operationid: deletebusinessservice
      tag: [businessservice]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          description: unique busines service code
          schema: { type: string }
      response:
        '204':
          description: deactivated successfully
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
        '404':
          description: not found
          content:
