    billdetail:
      type: object
      description: define the period-based billing section associated with a demand, containing aggregated amount value and detailed account-level tax entrie.
      propertie:
        id:
          type: string
          format: uuid
          readonly: true
          description: unique id for internal reference (uuid)
        billid:
          type: string
          format: uuid
          readonly: true
          description: reference bill
        demandid:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          example: 10000
        amountpaid:
          type: number
          format: double
          example: 0
        periodfrom:
          type: integer
          format: int64
          description: |
            start (inclusive) of the assessed period in timestamp (epoch millisecond).
            must be **on or before** `periodto`. used for proration and due-date policie.
          example: 1735669800000
        periodto:
          type: integer
          format: int64
          description: |
            end (inclusive) of the assessed period in timestamp (epoch millisecond).
            must be **on or after** `periodfrom`.
          example: 1767205799000
        billaccountdetail:
          type: array
          item:
            $ref: '#/component/schema/billaccountdetail'
        metadata:
          type: object
          additionalpropertie: true
          description: optional calculator trace (e.g., `rate`, `basi`, `unit`, `area`, `multiplier`, `slabid`) to support audit.

