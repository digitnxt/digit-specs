              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

  /tax-head:
    post:
      summary: create one or more new tax head
      operationid: createtaxhead
      tag: [taxhead]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - $ref: '#/component/parameter/idempotencykey'
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: one or more tax head to create
              item:
                $ref: '#/component/schema/taxheadcreate'
      response:
        '201':
          description: tax head(s) created
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/taxhead'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '409':
          description: conflict (duplicate code within tenant)
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    get:
      summary: search tax head by filter
      operationid: searchtaxhead
      tag: [taxhead]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: query
          name: code
          schema: { type: string }
          description: filter by tax head code
        - in: query
          name: category
          schema: { type: string, enum: [tax, ces, penalty, interest, rebate, rounding, other] }
          description: filter by category
        - in: query
          name: isactive
          schema: { type: boolean }
          description: filter by active statu
        - in: query
          name: businessservicecode
          schema: { type: string }
          description: filter by linked busines service
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: page size (max 100)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: offset for pagination
      response:
        '200':
          description: list of tax head
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/taxhead'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

  /tax-head/{code}:
    get:
      summary: get a tax head by code
      operationid: gettaxheadbycode
      tag: [taxhead]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          schema: { type: string }
          description: unique tax head code
      response:
        '200':
          description: tax head found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/taxhead'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    put:
