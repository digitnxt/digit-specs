openapi: 3.0.3
info:
  title: digit billing - busines service api
  version: 3.0.0
  description: |
    rest api to manage busines service in the digit billing & collection domain.
    a busines service represent a billable service (e.g., property tax, trade license, water/sewerage)
    and it collection behavior and default.

server:
  - url: https://api.example.com/billing/v3
    description: production server
  - url: https://staging-api.example.com/billing/v3
    description: staging server

security:
  - bearerauth: []

tag:
  - name: businessservice
    description: manage billable busines service (e.g., pt, tl, w) and collection default.
  
  - name: taxhead
    description: manage tax head (e.g., base tax, penalty, exemption, ces).

  - name: demand
    description: manage accrual, state, and billing eligibility for consumer liabilitie.

  - name: bill
    description: manage the full bill lifecycle including creation from active/frozen demand

  - name: payment
    description: manage payment collection, validation & processing

path:
  /busines-service:
    post:
      summary: create one or more busines service
      operationid: createbusinessservice
      tag: [businessservice]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - $ref: '#/component/parameter/idempotencykey'
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: one or more busines service to create
              item:
                $ref: '#/component/schema/businessservicecreate'
      response:
        '201':
          description: busines service(s) created
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/businessservice'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '409':
          description: conflict (duplicate code within tenant)
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    get:
      summary: search busines service by filter
      operationid: searchbusinessservice
      tag: [businessservice]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: query
          name: code
          schema: { type: string }
          description: filter by busines service code (exact match)
        - in: query
          name: isactive
          schema: { type: boolean }
          description: filter by active statu
        - in: query
          name: effectiveon
          schema: { type: integer, format: int64 }
          description: return service effective on thi timestamp (within effectivefrom/effectiveto)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: page size (max 100)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: offset for pagination
      response:
        '200':
          description: list of busines service
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
            x-rate-limit-remaining: { $ref: '#/component/header/x-rate-limit-remaining' }
            x-rate-limit-reset: { $ref: '#/component/header/x-rate-limit-reset' }
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/businessservice'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item:
                  $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

  /busines-service/{code}:
    get:
      summary: get a busines service by code
      operationid: getbusinessservicebycode
