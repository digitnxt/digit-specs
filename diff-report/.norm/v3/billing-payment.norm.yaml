            application/json:
              schema:
                $ref: '#/component/schema/taxhead'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '409':
          description: conflict (immutable field change attempted)
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    patch:
      summary: partially update a tax head by code
      operationid: patchtaxhead
      tag: [taxhead]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestbody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/component/schema/taxheadpatch'
      response:
        '200':
          description: updated successfully
          content:
            application/json:
              schema:
                $ref: '#/component/schema/taxhead'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'
        '500':
          description: internal server error
          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

    delete:
      summary: soft delete (deactivate) a tax head
      operationid: deletetaxhead
      tag: [taxhead]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: code
          in: path
          required: true
          schema: { type: string }
      response:
        '204':
          description: deactivated successfully
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
            x-rate-limit: { $ref: '#/component/header/x-rate-limit' }
