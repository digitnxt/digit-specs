          content:
            application/json:
              schema:
                $ref: '#/component/schema/error'

  /demand:
    post:
      summary: create demand (bulk)
      operationid: createdemand
      tag: [demand]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - $ref: '#/component/parameter/idempotencykey'
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minitem: 1
              item:
                $ref: '#/component/schema/demandcreate'
      response:
        '201':
          description: demand created
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/demand' }
        '207':
          description: multi-statu — some item succeeded, some failed
          content:
            application/json:
              schema:
                $ref: '#/component/schema/bulkresponse'
        '400':
          description: validation error (unknown head, invalid amount, bad statu transition, etc.)
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/error' }
        '409':
          description: conflict (duplicate create without idempotency-key; overlapping/duplicate demand a per policy)
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }
        '500':
          description: internal server error
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

    put:
      summary: update/replace demand (bulk)
      operationid: updatedemand
      tag: [demand]
      description: |
        bulk full-replace for demand. each object **must include `id`** and be in an editable state (`draft` or `active`).
        consider requiring `if-match` etag per item (future iteration) for optimistic concurrency.
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
      requestbody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minitem: 1
              item:
                $ref: '#/component/schema/demandupdate'
      response:
        '200':
          description: demand updated
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/demand' }
        '207':
          description: multi-statu — some item updated, some failed
          content:
            application/json:
              schema:
                $ref: '#/component/schema/bulkresponse'
        '400':
          description: validation error
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/error' }
        '422':
          description: 'unprocessable (item not editable: frozen/billed/cancelled)'
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }
        '500':
          description: internal server error
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

    get:
      summary: search demand by filter
      operationid: searchdemand
      tag: [demand]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: query
          name: businessservicecode
          schema: { type: string }
          description: filter by busines service code (exact match)
        - in: query
          name: consumercode
          schema: { type: string }
          description: filter by consumer code (exact match)
        - in: query
          name: statu
          schema:
            type: string
            enum: [draft, active, frozen, cancelled]
          description: filter by demand statu
        - in: query
          name: createdfrom
          schema: { type: integer, format: int64 }
          description: createdtime >= createdfrom
        - in: query
          name: createdto
          schema: { type: integer, format: int64 }
          description: createdtime <= createdto
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: page size (max 100)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: offset for pagination
      response:
        '200':
          description: list of demand
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/demand' }
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/error' }
        '500':
          description: internal server error
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

  /demand/{id}:
    get:
      summary: get a demand by id
      operationid: getdemandbyid
      tag: [demand]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: id
          in: path
          required: true
          schema: { type: string }
      response:
        '200':
          description: demand found
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
          content:
            application/json:
              schema: { $ref: '#/component/schema/demand' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }
        '400':
          description: bad request
          content:
            application/json:
              schema:
                type: array
                item: { $ref: '#/component/schema/error' }
        '500':
          description: internal server error
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

    patch:
      summary: partially update a demand by id
      operationid: patchdemandbyid
      tag: [demand]
      description: |
        allowed only if demand i `draft` or `active` and not frozen/billed/cancelled.
        typical use: fix amount, add/remove item, update payer/meta before bill issuance.
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestbody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/component/schema/demandpatch' }
            example:
              patchamount:
                summary: correct one item amount
                value:
                  lineitem:
                    - taxheadcode: ptbase
                      amount: 4400
      response:
        '200':
          description: updated successfully
          header:
            x-response-time: { $ref: '#/component/header/x-response-time' }
            x-response-timestamp: { $ref: '#/component/header/x-response-timestamp' }
            x-request-id: { $ref: '#/component/header/x-request-id' }
            x-correlation-id: { $ref: '#/component/header/x-correlation-id' }
            x-tenant-id: { $ref: '#/component/header/x-tenant-id' }
          content:
            application/json:
              schema: { $ref: '#/component/schema/demand' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }
        '422':
          description: unprocessable (frozen/billed/cancelled; or rule violation)
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }
        '500':
          description: internal server error
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

  /demand/{id}/freeze:
    post:
      summary: freeze a demand by id (prevent further edit)
      operationid: freezedemandbyid
      tag: [demand]
      description: |
        transition `active` → `frozen`. prevent further patch. typically called before bill generation.
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: id
          in: path
          required: true
          schema: { type: string }
      response:
        '200':
          description: demand frozen
          content:
            application/json:
              schema: { $ref: '#/component/schema/demand' }
        '409':
          description: conflict (invalid state transition)
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

  /demand/{id}/cancel:
    post:
      summary: cancel a demand by id
      operationid: canceldemandbyid
      tag: [demand]
      description: |
        cancel a demand (e.g., wrong assessment). if already billed/partially collected, the system may
        require adjustment instead, returning `422` with guidance.
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestbody:
        required: false
        content:
          application/json:
            schema:
              type: object
              propertie:
                reasoncode: { type: string, description: optional reference to reason master }
                note: { type: string }
      response:
        '200':
          description: demand cancelled
          content:
            application/json:
              schema: { $ref: '#/component/schema/demand' }
        '422':
          description: unprocessable (already billed/collected; need adjustment route)
          content:
            application/json:
              schema: { $ref: '#/component/schema/error' }

  /bill:
    get:
      summary: search bill by filter
      operationid: searchbill
      tag: [bill]
      parameter:
        - $ref: '#/component/parameter/requestidheader'
        - $ref: '#/component/parameter/correlationidheader'
        - $ref: '#/component/parameter/useragentheader'
        - $ref: '#/component/parameter/tenantidheader'
        - $ref: '#/component/parameter/forwardedforheader'
        - $ref: '#/component/parameter/clientid'
        - $ref: '#/component/parameter/clientsecret'
        - $ref: '#/component/parameter/timestamp'
        - in: query
          name: businessservicecode
          schema: { type: string }
          description: filter by busines service code (exact match)
        - in: query
          name: consumercode
          schema: { type: array, item: { type: string } }
          description: filter by consumer code
        - in: query
          name: billnumber
          schema: { type: array, item: { type: string } }
          description: filter by bill number
        - in: query
          name: billid
          schema: { type: array, item: { type: string } }
          description: filter by bill id
        - in: query
          name: statu
          description: filter by bill statu
          schema:
            type: string
            enum: [active, cancelled, expired, paid, partiallypaid, paymentcancelled]
        - in: query
          name: mobilenumber
          schema: 
            type: string
            pattern: '^\\+?[0-9]{10,15}$'
            description: mobile number with optional '+' prefix. should be 10 to 15 digit (e.g., +919876543210)
          description: filter by payer mobile number
        - in: query
          name: email
          schema:
            type: string
            format: email
            maxlength: 254
            description: valid email addres (e.g., user@example.com)
          description: filter by payer email
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          description: page size (max 100)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
