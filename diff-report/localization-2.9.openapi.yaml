openapi: 3.0.0
info:
  title: Localization Service API (derived from Postman 2.9)
  version: 2.9.0
paths:
  /api/localization/messages/v1/_search:
    get:
      summary: Search Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: module
        in: query
        required: false
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: string
  /api/localization/messages/v1/_create:
    post:
      summary: Create Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UserHeader'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/localization/messages/v1/_update:
    put:
      summary: Update Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UserHeader'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/localization/messages/v1/_upsert:
    put:
      summary: Upsert Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/UserHeader'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/localization/messages/v1/_delete:
    delete:
      summary: Delete Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: uuids[]
        in: query
        required: false
        schema:
          type: string
      - name: uuids[]
        in: query
        required: false
        schema:
          type: string
  /api/localization/messages/v1/_missing:
    get:
      summary: Find Missing Messages
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: module
        in: query
        required: false
        schema:
          type: string
  /api/localization/cache/v1/_bust:
    delete:
      summary: Bust Cache
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: module
        in: query
        required: false
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
components:
  schemas: {}
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    UserHeader:
      name: X-User-ID
      in: header
      required: false
      schema:
        type: string
